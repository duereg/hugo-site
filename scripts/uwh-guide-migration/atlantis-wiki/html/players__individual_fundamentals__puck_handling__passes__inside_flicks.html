<p>Inside flicks are similar to regular flicks in concept, but have a very different motion. Just as in <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">front flicks</a>, players want to roll the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> along the edge of the <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a>, get it spinning and flick the wrist to release the puck, except for inside flicks this happens on the inside edge of the stick.&nbsp;</p>
<p>To start, the puck should rest on the inside edge of the stick by the tip of the thumb. The arm should be fairly straight and out a bit to the right (to the left for lefties). The player should then quickly pull their arm in towards them while raking their stick sideways to get the puck spinning. In addition to this, the player should flick their wrist inward, pulling the tip of the stick towards the forearm.&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>An inside flick can be used to flick the puck to the left of the player (to the right if lefty). The puck can go straight sideways, or backwards towards the players fins. This is a useful way to quickly pass the puck to a teammate without turning. Being able to flick the puck at unexpected angles is always an effective way to get the puck past an opponent.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>As with any flick, players must be carful to not hit any other players with the puck. &nbsp;Hitting a player can result in a dangerous shot foul (<a href="/game/fouls/unsportsmanlike_conduct" class="is-internal-link is-valid-page">unsportsmanlike conduct</a>).</p>
