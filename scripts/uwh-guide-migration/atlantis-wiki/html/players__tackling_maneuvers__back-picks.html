<p>A back-pick is a steal where the player sets up behind an opponent and takes the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> when the opponent&nbsp;<i> </i><a href="/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page">curls</a><i>. </i>Back-picks are common among forwards who are regularly set up behind (on the offensive side of) the opponents.</p>
<p>What to think about when back-picking an opponent:</p>
<ol>
  <li>Players should set up directly behind the opponent, facing backwards (toward the goal they are defending).</li>
  <li>When the opponent curls with the puck, the player can then steal the puck off their stick and immediately go into a curl to protect the puck from the opponent. The player can steal the puck by hooking the inside of their stick onto the puck and pulling it sideways off the opponents stick as they enter their curl.</li>
  <li>This tackle can be done with curls to either direction, but is often easier in one direction, depending on player preference.</li>
  <li>It is important to start as close to the opponent as possible to grab the puck before they have time to react.</li>
  <li>The player's body should be low to the bottom through this entire sequence. This is essential as they take the puck, they must get their shoulder on the bottom so the opponent can not reach under them and go for the puck.</li>
  <li>The back pick is most effective if it is done quickly so that the opponent does not have time to react.</li>
</ol>
<p>Back-picks are essentially the same kind of steal as tackles from the player's <a href="/players/tackling_maneuvers/tackle_1" class="is-internal-link is-valid-page">free hand side</a> or <a href="/players/tackling_maneuvers/tackle_2" class="is-internal-link is-valid-page">stick hand side</a>, just often start with slightly different body position.</p><p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>Players in the forward position are set up to do back-picks the most often.The best time to set up for a back pick is if the forward sees an opponent with the puck approaching a back. Opponents will often curl when faced with a back, and that is when the forwards should be set up for a back-pick. Back-picks are effective anywhere in the playing area.</p>
<p>When the play is in the defensive end of the court, it is very important for the forwards to help the backs defensively. This means the forwards should actively go into the play, rather than only waiting ahead for passes, and attempt to get the puck. A back-pick is an ideal method for playing defensively as a forward.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Players should not set up to back-pick an opponent if their team has the puck. If this is the case, players should be setting up to receive passes from their teammates.</p>

<div class="quickreference green">
  <p><u>BACK-PICKS</u></p>
  <ul>
    <li>SET UP BEHIND AN OPPONENT AS THEY ARE APPROACHING A BACK</li>
    <li>THE BACK WILL OFTEN GET THE OPPONENT TO CURL</li>
    <li>ONCE THE OPPONENT CURLS, TAKE THE PUCK OFF THEIR STICK AS THEY CURL</li>
    <li>MOVE QUICKLY TO CATCH THEM OFF GUARD</li>
  </ul>
