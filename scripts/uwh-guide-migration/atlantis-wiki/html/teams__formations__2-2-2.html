<p><img src="/2-2-2_setup.jpg" alt=""></p>
<h1 id="formation-overview" class="toc-header"><a class="toc-anchor" href="#formation-overview">¶</a> Formation Overview</h1>
<p>The <strong>2-2-2</strong> is an open-water possession formation designed to encourage play through the center of the pool rather than along the walls.</p>
<p><strong>Formation Name:</strong> Muffin Top (2-2-2)<br>
<strong>Player Layout:</strong> 2 Forwards, 2 Wings, 2 Backs<br>
<strong>Play Style:</strong> Open Water / Possession</p>
<p>The formation is primarily used as a development and training structure which prioritizes:</p>
<ul>
<li>Open-water movement</li>
<li>Layered support</li>
<li>Controlled possession</li>
<li>Confidence in the 3m–6m central area between trays</li>
</ul>

<ul>

</ul>
<h1 id="main-strengths" class="toc-header"><a class="toc-anchor" href="#main-strengths">¶</a> Main Strengths</h1>
<ul>
<li>Encourages open-water play through the middle</li>
<li>Strong layered support structure</li>
<li>Creates safe passing options away from the walls</li>
<li>Develops swimming and tactical awareness</li>
<li>Uses a designated disruptive forward</li>
<li>Encourages controlled possession and recycling</li>
</ul>
<h1 id="main-weaknesses" class="toc-header"><a class="toc-anchor" href="#main-weaknesses">¶</a> Main Weaknesses</h1>
<ul>
<li>Requires strong support awareness</li>
<li>Can collapse inward under pressure</li>
<li>Less natural wall pressure than traditional formations</li>
<li>Requires disciplined possession</li>
<li>Central mistakes can expose space quickly</li>
</ul>
<hr>
<h1 id="core-principles" class="toc-header"><a class="toc-anchor" href="#core-principles">¶</a> Core Principles</h1>
<ul>
<li>Play through the middle of the pool</li>
<li>Maintain layered support around the puck</li>
<li>Stay connected without collapsing inward</li>
<li>Use possession to create open-water opportunities</li>
<li>Recycle possession rather than forcing progression</li>
<li>Support the current engagement</li>
<li>Funnel wall play back into the formation</li>
<li>Keep one back in and one back out</li>
<li>Attack open space after winning possession</li>
<li>Build confidence playing in the 3m–6m central zone</li>
</ul>
<h1 id="position-responsibilities" class="toc-header"><a class="toc-anchor" href="#position-responsibilities">¶</a> Position Responsibilities</h1>
<p><img src="/underwater_hockey_combined_legend.jpg" alt="underwater_hockey_combined_legend.jpg"></p>
<hr>
<h1 id="forwards" class="toc-header"><a class="toc-anchor" href="#forwards">¶</a> Forwards</h1>
<p>The forward line consists of:</p>
<ul>
<li>FC — Controlling Forward</li>
<li>FD — Disrupting Forward</li>
</ul>
<p>Both forwards work together to:</p>
<ul>
<li>Maintain forward pressure</li>
<li>Support open-water progression</li>
<li>Disrupt opponent structure</li>
<li>Recycle possession safely</li>
</ul>
<hr>
<h1 id="controlling-forward-fc" class="toc-header"><a class="toc-anchor" href="#controlling-forward-fc">¶</a> Controlling Forward (FC)</h1>
<p>The Controlling Forward is the primary possession player in the attacking line.</p>
<ul>
<li>Maintain controlled possession</li>
<li>Support progression through the middle</li>
<li>Provide safe forward passing options</li>
<li>Recycle possession under pressure</li>
</ul>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Maintain controlled possession</li>
<li>Provide safe forward passing options</li>
<li>Support offensive structure through the middle</li>
<li>Recycle possession under pressure</li>
<li>Connect support layers through the center</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Stay available ahead of the puck</li>
<li>Stay off the wall</li>
<li>Support through the middle channel</li>
<li>Remain reachable for support passes</li>
<li>Avoid the 1m closest to their own goal</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Pressure opposition possession through the middle</li>
<li>Support contested puck situations</li>
<li>Recover into the central channel</li>
<li>Protect the formation shape</li>
<li>Support defensive recovery</li>
</ul>
</details>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/FCRole" class="is-internal-link is-valid-page">Read Full FC Role</a></p>
<hr>
<h1 id="disrupting-forward-fd" class="toc-header"><a class="toc-anchor" href="#disrupting-forward-fd">¶</a> Disrupting Forward (FD)</h1>
<p>The Disrupting Forward creates pressure, disrupts structure, and creates opportunities through chaos.</p>
<ul>
<li>Pressure opposition transitions</li>
<li>Disrupt possession</li>
<li>Create attacking opportunities</li>
<li>Support contested puck situations</li>
</ul>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Disrupt passing lanes</li>
<li>Pressure transitions</li>
<li>Create defensive chaos</li>
<li>Support offensive pushes when needed</li>
<li>Pressure opponents recovering through the middle</li>
<li>Support contested puck situations</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Play wherever disruption is most effective</li>
<li>Stay connected to the structure</li>
<li>Remain available to pressure opposition possession</li>
<li>Avoid the 1m closest to their own goal</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Pressure opposition exits</li>
<li>Disrupt passing options</li>
<li>Force rushed decisions</li>
<li>Interfere with opposition support structures</li>
<li>Create turnovers through pressure</li>
</ul>
</details>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/FDRole" class="is-internal-link is-valid-page">Read Full FD Role</a></p>
<hr>
<h1 id="wings" class="toc-header"><a class="toc-anchor" href="#wings">¶</a> Wings</h1>
<p>The wings provide outside pressure and structural balance.</p>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Attack open-water lanes</li>
<li>Support open-water progression</li>
<li>Maintain defensive balance during transitions</li>
<li>Redirect wall play back into the formation</li>
<li>Support recovery and possession retention</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<h3 id="strong-wing" class="toc-header"><a class="toc-anchor" href="#strong-wing">¶</a> Strong Wing</h3>
<ul>
<li>Stay behind the puck</li>
<li>Avoid getting trapped on the wall</li>
<li>Redirect play back into the formation</li>
</ul>
<h3 id="weak-wing" class="toc-header"><a class="toc-anchor" href="#weak-wing">¶</a> Weak Wing</h3>
<ul>
<li>Stay available behind the play</li>
<li>Protect weak-side space</li>
<li>Avoid overcommitting ahead of the puck</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<h3 id="strong-wing-1" class="toc-header"><a class="toc-anchor" href="#strong-wing-1">¶</a> Strong Wing</h3>
<ul>
<li>Prevent outside advancement</li>
<li>Funnel play back toward the center</li>
<li>Pressure opposition players in open water</li>
<li>Recover wall play back into the formation</li>
</ul>
<h3 id="weak-wing-1" class="toc-header"><a class="toc-anchor" href="#weak-wing-1">¶</a> Weak Wing</h3>
<ul>
<li>Act as temporary Last Back</li>
<li>Protect recovery lanes</li>
<li>Maintain weak-side structure</li>
<li>Prevent outside breakouts</li>
<li>Provide emergency defensive cover when required</li>
</ul>
</details>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/WingSystems" class="is-internal-link is-valid-page">Read Full Wing Systems</a></p>
<hr>
<h1 id="backs" class="toc-header"><a class="toc-anchor" href="#backs">¶</a> Backs</h1>
<p>The Backs hold the center of the formation and are responsible for supporting the Forwards and Wings while directing offensive progression through the middle.</p>
<p>The Backs have the most freedom within the formation to swim and distribute the puck. Their role is to choose the option with the highest chance of success and set teammates up for success.</p>
<hr>
<h2 id="back-role" class="toc-header"><a class="toc-anchor" href="#back-role">¶</a> Back Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Hold the center of the formation</li>
<li>Support the Forwards and Wings</li>
<li>Direct offensive progression through the middle</li>
<li>Choose high-percentage passing options</li>
<li>Set teammates up for success</li>
<li>Create space through Zig-Zag cycling</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Stay behind the puck</li>
<li>Keep 1 Back in and 1 Back out</li>
<li>Move according to the play while remaining within the limits of the role</li>
<li>Create space for support players through movement</li>
<li>Remain available as a passing option</li>
</ul>
<p>The Back's position is determined by their real-time location rather than a fixed spot in the pool. If a Back moves from one area to another, they retain the same responsibilities and passing options throughout the swim.</p>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Maintain the central structure of the formation</li>
<li>Support the Wings and Forwards</li>
<li>Keep 1 Back in and 1 Back out</li>
<li>Recover possession and restart offensive structure when possible</li>
</ul>
</details>
<hr>
<h2 id="zig-zag-cycling" class="toc-header"><a class="toc-anchor" href="#zig-zag-cycling">¶</a> Zig-Zag Cycling</h2>
<details>
<summary>Expand Zig-Zag Summary</summary>
<p>The Backs should be swimming if they have possession, but they are not the primary attacking players within the formation.</p>
<p>If there is space available:</p>
<ul>
<li>Swim forward</li>
<li>Draw defenders</li>
<li>Create passing opportunities to the Wings and Forwards</li>
</ul>
<p>If there is heavy resistance ahead:</p>
<ul>
<li>Look for a lateral pass to a Wing</li>
<li>Swim sideways to draw defenders toward one side</li>
<li>Pass to the supporting Back behind and toward the centerline</li>
<li>The receiving Back swims at an angle to create new space and passing lanes</li>
</ul>
<p>If progression still isn't available:</p>
<ul>
<li>Continue cycling possession between the Backs</li>
<li>Draw defenders out of position</li>
<li>Wait for passing opportunities to the Wings or Forwards</li>
</ul>
<p>The Zig-Zag helps to:</p>
<ul>
<li>Shift defensive pressure laterally</li>
<li>Create passing lanes</li>
<li>Keep the opposition off balance</li>
<li>Open attacking opportunities</li>
<li>Reset offensive structure</li>
</ul>
</details>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/BackSystems" class="is-internal-link is-valid-page">Read Full Back Systems</a></p>
<hr>
<h1 id="common-structural-failures" class="toc-header"><a class="toc-anchor" href="#common-structural-failures">¶</a> Common Structural Failures</h1>
<p>The structure commonly breaks down when:</p>
<ul>
<li>Players collapse too far inward</li>
<li>Support layers become disconnected</li>
<li>Wings overcommit ahead of the puck</li>
<li>Possession becomes rushed</li>
<li>Players drift into wall play unnecessarily</li>
<li>Both backs become flat or trapped together</li>
</ul>
