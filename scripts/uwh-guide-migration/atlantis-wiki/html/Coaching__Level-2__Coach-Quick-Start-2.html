</div><p><b>Level 2 transitions players from introductory hockey into connected, decision-based play.</b></p><div>

</div><p>Players begin to apply skills under pressure, make simple decisions, support teammates, and participate effectively in game play.</p><div>

</div><p><b>This page is a rapid orientation guide.</b></p><div>

</div><p>Coaches should read the <a href="/en/Coaching/Level-2/Lesson-Plan-2" class="is-internal-link is-valid-page">Lesson Plan</a> before delivering Level 2 sessions.  
The Quick Start is intended for quick reference immediately before coaching.</p><div>

</div><hr><div>

</div><h2 id="what-level-2-produces" class="toc-header"><a class="toc-anchor" href="#what-level-2-produces">¶</a> What Level 2 Produces</h2><div>

</div><p>Players leaving Level 2 should be able to:</p><div>

</div><ul>
<li>Play safely and legally within game flow</li>
<li>Carry and control the puck while swimming</li>
<li>Make simple decisions (pass vs carry)</li>
<li>Apply and handle pressure</li>
<li>Provide and use support</li>
<li>Participate confidently in full scrimmage</li>
</ul><div>

</div><p><b>Level 2 is not structured systems hockey.</b></p>
<p><b>Level 2 produces reliable, connected club players.</b></p><div>

</div><hr><div>

</div><h2 id="coaching-philosophy" class="toc-header"><a class="toc-anchor" href="#coaching-philosophy">¶</a> Coaching Philosophy</h2><div>

</div><ul>
<li>Keep coaching simple and game-focused</li>
<li>Build decisions before complexity</li>
<li>Reinforce habits under light pressure</li>
<li>Use play as the main teaching tool</li>
</ul><div>

</div><p>Do not introduce formal structure or tactics too early.</p><div>

</div><hr><div>

</div><h2 id="standard-session-structure" class="toc-header"><a class="toc-anchor" href="#standard-session-structure">¶</a> Standard Session Structure</h2><div>

</div><ol>
<li>Warm-up and movement preparation</li>
<li>Fundamentals or puck control</li>
<li>Decision or pressure focus</li>
<li>Connection/support work</li>
<li>Mini conditioned game</li>
<li>Full scrimmage</li>
</ol><div>

</div><p><b>All work should connect to game play.</b></p><div>

</div><hr><div>

</div><h2 id="core-coaching-focus" class="toc-header"><a class="toc-anchor" href="#core-coaching-focus">¶</a> Core Coaching Focus</h2><div>

</div><h3 id="body-position" class="toc-header"><a class="toc-anchor" href="#body-position">¶</a> Body Position</h3><div>

</div><ul>
<li>Hips low</li>
<li>Chest up</li>
<li>Eyes forward</li>
<li>Stable base</li>
</ul><div>

</div><p>Good body position underpins all skill execution.</p><div>

</div><h3 id="dive-selection" class="toc-header"><a class="toc-anchor" href="#dive-selection">¶</a> Dive Selection</h3><div>

</div><ul>
<li><b>Kelp dive</b> – stationary puck</li>
<li><b>Duck dive</b> – moving play</li>
<li><b>Surface reset</b> – reposition early</li>
</ul><div>

</div><p>Correct dive choice improves timing and control.</p><div>

</div><h3 id="puck-control" class="toc-header"><a class="toc-anchor" href="#puck-control">¶</a> Puck Control</h3><div>

</div><ul>
<li>Controlled carry</li>
<li>Direction change and curl</li>
<li>Flick and recover</li>
<li>Protect the puck</li>
</ul><div>

</div><p>Control under movement is more important than speed.</p><div>

</div><h3 id="simple-decisions" class="toc-header"><a class="toc-anchor" href="#simple-decisions">¶</a> Simple Decisions</h3><div>

</div><ul>
<li>Look up before acting</li>
<li>Pass when support is ahead</li>
<li>Carry when space is available</li>
<li>Avoid hesitation and automatic play</li>
</ul><div>

</div><h3 id="support-connection" class="toc-header"><a class="toc-anchor" href="#support-connection">¶</a> Support &amp; Connection</h3><div>

</div><ul>
<li>Move after passing</li>
<li>Stay available</li>
<li>Maintain effective distance</li>
<li>Create simple width and depth</li>
</ul><div>

</div><h3 id="pressure" class="toc-header"><a class="toc-anchor" href="#pressure">¶</a> Pressure</h3><div>

</div><ul>
<li><b>Defending:</b> close space quickly, then hold</li>
<li><b>Attacking:</b> create space and follow</li>
<li>No diving or over-committing</li>
<li>Recover quickly when out of position</li>
</ul><div>

</div><hr><div>

</div><h2 id="rules-integration" class="toc-header"><a class="toc-anchor" href="#rules-integration">¶</a> Rules Integration</h2><div>

</div><p>Reinforce rules during play rather than through lecture.</p><div>

</div><ul>
<li>Obstruction</li>
<li>Free arm use</li>
<li>Stick contact</li>
<li>Advantage play</li>
<li>Restarts and substitutions</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-coaches-should-watch" class="toc-header"><a class="toc-anchor" href="#what-coaches-should-watch">¶</a> What Coaches Should Watch</h2><div>

</div><ul>
<li>Players look up before acting</li>
<li>Puck remains under control while moving</li>
<li>Support is present and moving</li>
<li>Pressure is applied without over-committing</li>
<li>Players reset early when out of position</li>
<li>Game flow remains safe and controlled</li>
</ul><div>

</div><p>Assessment is continuous and based on play.</p><div>

</div><hr><div>

</div><h2 id="typical-session-timing-70-minutes" class="toc-header"><a class="toc-anchor" href="#typical-session-timing-70-minutes">¶</a> Typical Session Timing (70 Minutes)</h2><div>

</div><ul>
<li>10 minutes warm-up</li>
<li>15 minutes fundamentals/puck control</li>
<li>15 minutes decisions/pressure</li>
<li>10 minutes support/connection</li>
<li>10 minutes mini game</li>
<li>10 minutes scrimmage</li>
</ul><div>

</div><hr><div>

</div><h2 id="badge-awareness" class="toc-header"><a class="toc-anchor" href="#badge-awareness">¶</a> Badge Awareness</h2><div>

</div><p>Level 2 reinforces core skill badges through play.</p><div>

</div><ul>
<li>Body Position</li>
<li>Puck Control</li>
<li>Passing</li>
<li>Curling</li>
<li>Support Play</li>
</ul><div>

</div><p>Badges are observed naturally during drills and games.</p><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><p>Players must demonstrate during game play:</p><div>

</div><ul>
<li>Controlled puck movement</li>
<li>Correct simple decisions</li>
<li>Effective support and connection</li>
<li>Ability to apply and handle pressure</li>
<li>Safe and consistent participation in play</li>
</ul><div>

</div><p>Assessment is observation-based during scrimmage.</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
