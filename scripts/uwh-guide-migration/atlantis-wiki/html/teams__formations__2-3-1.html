<p><img src="/2-3-1_setup.jpg" alt="2-3-1 Setup"></p>
<h1 id="formation-overview" class="toc-header"><a class="toc-anchor" href="#formation-overview">¶</a> Formation Overview</h1>
<p>The <strong>2-3-1</strong> is a pressure-based formation designed to outnumber the opposition in both attack</p>
<p><strong>Formation Name:</strong> 2-3-1<br>
<strong>Player Layout:</strong> 2 Forwards, 2 Wings, 1 Centre, 1 Goalie<br>
<strong>Play Style:</strong> Pressure / Overlap Support</p>
<p>The formation prioritizes:</p>
<ul>
<li>Creating overlaps across the pool (2v1 pressure)</li>
<li>Using the space behind the opposition</li>
<li>Turning defenders and attacking space</li>
<li>Outnumbering the opposition around the puck</li>
</ul>

</ul>
<h1 id="main-strengths" class="toc-header"><a class="toc-anchor" href="#main-strengths">¶</a> Main Strengths</h1>
<ul>
<li>Create both vertical and horizontal support simultaneously</li>
<li>Strong support around the puck</li>
<li>Overlap creation</li>
<li>Excellent wall and wide-pool pressure</li>
<li>Strong attacking momentum</li>
<li>Creates continuous forward pressure</li>
<li>Can overload both attack and defense</li>
</ul>
<h1 id="main-weaknesses" class="toc-header"><a class="toc-anchor" href="#main-weaknesses">¶</a> Main Weaknesses</h1>
<ul>
<li>Requires very fit players</li>
<li>High swimming workload</li>
<li>Breaks down if support disconnects</li>
<li>Wings and forwards must recover quickly</li>
<li>Poor discipline creates gaps</li>
<li>Overcommitting exposes the middle</li>
</ul>
<h1 id="core-principles" class="toc-header"><a class="toc-anchor" href="#core-principles">¶</a> Core Principles</h1>
<ul>
<li>Turn defenders rather than pass around them</li>
<li>Swim to create attacking angles</li>
<li>Put the puck into space</li>
<li>Support the current engagement</li>
<li>Attack with numbers</li>
<li>Pressure early and aggressively</li>
</ul>
<h1 id="passing-style" class="toc-header"><a class="toc-anchor" href="#passing-style">¶</a> Passing Style</h1>
<p>Passing in the 2-3-1 is built around movement and space creation rather than static passing angles.</p>
<p>Players should:</p>
<ul>
<li>Look for opposition positioning, not teammates</li>
<li>Put the puck behind defenders</li>
<li>Pass into space rather than directly to players</li>
<li>Create angles through swimming</li>
<li>Attack where the puck will be next</li>
</ul>
<p>The formation relies heavily on swimming speed and forward momentum.</p>
<h1 id="position-responsibilities" class="toc-header"><a class="toc-anchor" href="#position-responsibilities">¶</a> Position Responsibilities</h1>
<p><img src="/2-3-1_formation_2.jpg" alt="2-3-1_formation_2.jpg"></p>
<h1 id="forwards" class="toc-header"><a class="toc-anchor" href="#forwards">¶</a> Forwards</h1>
<p>The forwards stay ahead of the puck and work together as a pair.</p>
<ul>
<li>Stay ahead of the puck</li>
<li>Do not swap sides</li>
<li>Stay within arm’s reach of each other</li>
<li>Maintain forward momentum</li>
<li>Turn defenders toward their own goal</li>
</ul>
<h2 id="forward-role" class="toc-header"><a class="toc-anchor" href="#forward-role">¶</a> Forward Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Score goals</li>
<li>Receive forward passes</li>
<li>Create 2v1 pressure</li>
<li>Back pick defenders</li>
<li>Block passing lanes</li>
<li>Disrupt opposition exits</li>
</ul>
</details>
<details>
<summary>Positioning </summary>
<ul>
<li>In 2v1 situations, the supporting forward should stay very close to the defender to remove backward exit options and trap the play under pressure.</li>
<li>They should not swim far ahead waiting for long passes.</li>
<li>When one forward has possession, the other supports beside them rather than swimming into isolated space.</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<h3 id="strong-forward-defensive-role" class="toc-header"><a class="toc-anchor" href="#strong-forward-defensive-role">¶</a> Strong Forward Defensive Role</h3>
<p>The Strong Forward’s main defensive role is to:</p>
<ul>
<li>Back-pick opposition players curling backward</li>
<li>Cut off backward exit options</li>
<li>Pressure recovering defenders</li>
<li>Trap play along the wall or under pressure</li>
</ul>
<h3 id="weak-forward-defensive-role" class="toc-header"><a class="toc-anchor" href="#weak-forward-defensive-role">¶</a> Weak Forward Defensive Role</h3>
<p>The Weak Forward protects open space and supports defensive recovery.</p>
<p>Responsibilities include:</p>
<ul>
<li>Protecting weak-side space</li>
<li>Sealing central recovery lanes</li>
<li>Acting as support behind pressure</li>
<li>Cycling with the Center and when they need recovery time</li>
<li>Supporting defensive corners without overcommitting</li>
</ul>
<p>In defensive corners, the Weak Forward and Center may rotate temporarily to maintain pressure while allowing recovery breathing space.</p>
</details>
<h1 id="wings" class="toc-header"><a class="toc-anchor" href="#wings">¶</a> Wings</h1>
<p>The wings are the outside players in the “3” of the formation.</p>
<p>The wing on the puck side is the <strong>Strong-Side Wing</strong>.<br>
The opposite wing is the <strong>Weak-Side Wing</strong>.</p>
<h2 id="wing-role" class="toc-header"><a class="toc-anchor" href="#wing-role">¶</a> Wing Role</h2>
<details>
<summary>Responsibilities</summary>
<h3 id="strong-side-wing" class="toc-header"><a class="toc-anchor" href="#strong-side-wing">¶</a> Strong-Side Wing</h3>
<ul>
<li>Dive behind the puck</li>
<li>Drive forward space</li>
<li>Connect with forwards past defenders</li>
<li>Force defenders sideways or to curl</li>
<li>Support the Strong Forward</li>
</ul>
<h3 id="weak-side-wing" class="toc-header"><a class="toc-anchor" href="#weak-side-wing">¶</a> Weak-Side Wing</h3>
<ul>
<li>Cover the weak side and open space</li>
<li>Stay available for <a href="/teams/teamwork/swings" class="is-internal-link is-valid-page">swing</a> passes</li>
<li>Protect against opposition swing</li>
<li>Counterattack after turnovers</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<h3 id="strong-side-wing-1" class="toc-header"><a class="toc-anchor" href="#strong-side-wing-1">¶</a> Strong-Side Wing</h3>
<ul>
<li>Stay behind the puck</li>
<li>Stay on your side</li>
<li>Support the Strong Forward</li>
<li>Attack forward space when available</li>
</ul>
<h3 id="weak-side-wing-1" class="toc-header"><a class="toc-anchor" href="#weak-side-wing-1">¶</a> Weak-Side Wing</h3>
<ul>
<li>Stay behind the puck</li>
<li>Cover weak-side space</li>
<li>Remain available for swing passes</li>
<li>Avoid drifting too far from support</li>
<li>Avoid playing too far back and not able to pressure the opposition's swing fast enough</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<h3 id="strong-side-wing-2" class="toc-header"><a class="toc-anchor" href="#strong-side-wing-2">¶</a> Strong-Side Wing</h3>
<ul>
<li>Pressure the puck aggressively</li>
<li>Close space quickly</li>
<li>Prevent free swimming space</li>
<li>Create weak angles and 2v1 opportunities</li>
</ul>
<h3 id="weak-side-wing-2" class="toc-header"><a class="toc-anchor" href="#weak-side-wing-2">¶</a> Weak-Side Wing</h3>
<ul>
<li>Protect against swings</li>
<li>Cover open space</li>
<li>Engage if the opposition swings</li>
<li>Support defensive recovery</li>
</ul>
</details>
<h1 id="center" class="toc-header"><a class="toc-anchor" href="#center">¶</a> Center</h1>
<p>The center controls the middle of the structure and acts as the primary support distributor.</p>
<ul>
<li>Hold the middle</li>
<li>Stay predictable</li>
<li>Stay off the wall</li>
<li>Support all attacking players</li>
<li>Distribute safely under pressure</li>
</ul>
<h2 id="center-role" class="toc-header"><a class="toc-anchor" href="#center-role">¶</a> Center Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Support both Wings</li>
<li>Provide central passing options</li>
<li>Start swings</li>
<li>Connect with the Forwards and Wings</li>
<li>Maintain middle structure</li>
<li>Support pressure situations</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Hold the middle channel</li>
<li>Stay off the wall</li>
<li>Remain available as a passing option</li>
<li>Stay connected to both Wings</li>
<li>Support behind the puck when needed</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Protect the middle channel</li>
<li>Stop direct attacks through the center</li>
<li>Redirect attackers toward supporting teammates</li>
<li>Support defensive pressure without exposing the middle</li>
</ul>
<p>The Center should avoid overcommitting and leaving the middle channel open.</p>
</details>
<h1 id="full-back" class="toc-header"><a class="toc-anchor" href="#full-back">¶</a> Full Back</h1>
<p>The full back, also referred to as the stopper or goalie, supports behind the structure and fills gaps in the midline.</p>
<ul>
<li>Support behind pressure</li>
<li>Fill gaps in the structure</li>
<li>Activate selectively</li>
</ul>
<h2 id="full-back-role" class="toc-header"><a class="toc-anchor" href="#full-back-role">¶</a> Full Back Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Stabilize possession</li>
<li>Support pressured players</li>
<li>Cover exposed spaces</li>
<li>Reset the structure</li>
<li>Start deep swings</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Stay behind the structure</li>
<li>Fill exposed support positions</li>
<li>Support behind pressure</li>
<li>Rotate into Wing positions when needed</li>
<li>Rotate into Center positions when needed</li>
</ul>
<p>The Full Back should position themselves where support is needed most while maintaining structure behind the play.</p>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Cover exposed spaces</li>
<li>Support recovering teammates</li>
<li>Fill gaps created by rotations</li>
<li>Maintain structure behind pressure</li>
</ul>
<p>The Full Back should avoid overcommitting and instead provide stability behind the play.</p>
</details>
<h1 id="possession-principles" class="toc-header"><a class="toc-anchor" href="#possession-principles">¶</a> Possession Principles</h1>
<p>The 2-3-1 prioritizes pressure over possession.</p>
<p>Players should:</p>
<ul>
<li>Create pressure by playing the space behind the opposition</li>
<li>Turn the opposition around and smother them with pressure</li>
<li>Maintain pressure by following up a pass</li>
<li>Avoid flat passes across organized defenders</li>
<li>Maintain close support around the puck carrier</li>
</ul>
<p>The formation relies on support and pressure by driving attacking passes.</p>
<h1 id="common-structural-failures" class="toc-header"><a class="toc-anchor" href="#common-structural-failures">¶</a> Common Structural Failures</h1>
<p>The structure commonly breaks down when:</p>
<ul>
<li>Players don't turn the opposition</li>
<li>Forwards too far to support the backs</li>
<li>The center becomes exposed</li>
<li>Pressure arrives too late</li>
<li>Players don't follow up a pass</li>
</ul>
