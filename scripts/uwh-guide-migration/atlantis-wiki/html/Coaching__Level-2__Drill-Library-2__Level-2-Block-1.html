</div><p><b>Foundation Badges Supported:</b>
<a href="/en/Coaching/Badges/Foundation#body-position-cobra" class="is-internal-link is-valid-page">Body Position (Cobra)</a>,
<a href="/en/Coaching/Badges/Foundation#dive-control" class="is-internal-link is-valid-page">Dive Control</a>
</p><div>

</div><p><b>Coach Note:</b> This block focuses on control and decision-making. Do not rush progression—quality of movement is more important than speed.</p><div>

</div><hr><div>

</div><!-- 1. BODY POSITION --><div>

</div><h3 id="cobra-hold" class="toc-header"><a class="toc-anchor" href="#cobra-hold">¶</a> <b>Cobra Hold</b></h3><div>

</div><p><b>Objective:</b> Build stable bottom position.</p><div>

</div><ul>
  <li>Players descend to the bottom.</li>
  <li>Hold posture for 3–5 seconds.</li>
  <li>Reset and repeat.</li>
</ul><div>

</div><p><b>Coach Eyes:</b></p>
<ul>
  <li>Hips too high</li>
  <li>Head down</li>
</ul><div>

</div><hr><div>


</div><!-- 2. KELP DIVE --><div>

</div><h3 id="kelp-dive" class="toc-header"><a class="toc-anchor" href="#kelp-dive">¶</a> <b>Kelp Dive Repetition</b></h3><div>

</div><p><b>Objective:</b> Execute controlled vertical descent.</p><div>

</div><ul>
  <li>Start from surface.</li>
  <li>Dive vertically to a marker.</li>
  <li>Land directly below entry point.</li>
</ul><div>

</div><p><b>Focus:</b> Control and accuracy.</p><div>

</div><hr><div>

</div><!-- 3. DUCK DIVE --><div>

</div><h3 id="duck-dive" class="toc-header"><a class="toc-anchor" href="#duck-dive">¶</a> <b>Duck Dive Repetition</b></h3><div>

</div><p><b>Objective:</b> Enter play while moving forward.</p><div>

</div><ul>
  <li>Swim forward.</li>
  <li>Perform duck dive.</li>
  <li>Continue movement after entry.</li>
</ul><div>

</div><p><b>Focus:</b> Smooth transition from swim to dive.</p><div>

</div><hr><div>

</div><!-- 4. SURFACE RESET --><div>

</div><h3 id="surface-reset" class="toc-header"><a class="toc-anchor" href="#surface-reset">¶</a> <b>Surface Reset Drill</b></h3><div>

</div><p><b>Objective:</b> Teach correct recovery and repositioning.</p><div>

</div><ul>
  <li>Touch bottom.</li>
  <li>Surface calmly.</li>
  <li>Reposition.</li>
  <li>Re-enter play.</li>
</ul><div>

</div><p><b>Key Rule:</b> Reset before re-entering.</p><div>

</div><hr><div>


</div><!-- 5. APPLICATION --><div>

</div><h3 id="short-game" class="toc-header"><a class="toc-anchor" href="#short-game">¶</a> <b>Short Game Play</b></h3><div>

</div><p><b>Objective:</b> Apply all individual fundamentals in play.</p><div>

</div><ul>
  <li>Small area game.</li>
  <li>Frequent rotations.</li>
</ul><div>

</div><p><b>Focus:</b> Decision making over speed.</p><div>
