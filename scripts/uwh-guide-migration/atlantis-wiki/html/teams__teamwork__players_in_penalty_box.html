y_box.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>When a <a href="/game/protocols/time-penalties" class="is-internal-link is-valid-page">player is put in the penalty box</a>, their team has to play with five. This can disrupt the regular strategies of their formation and teams should come up with plans in advance as to how they will handle this change.&nbsp;</p>
<p>Teams may choose to have a player sub out and get the sub of the player that was kicked out go in to the play. This depends on what position the player that was kicked out played. Some teams will always play with one less forward, meaning if a back is kicked out, a forward will sub out and bring in another back.&nbsp;</p>
<p>If more than one player is kicked out, teams can still plan out who they want playing where, but it is much harder to keep a strategy intact with four or fewer players in. Teams may want to focus on stalling the play until they get more players in the water again (without violating the<a href="/game/fouls/delay_of_game" class="is-internal-link is-valid-page"> delay of game</a> rules).</p>
<p>There are many options for handling a player being kicked out, but it is ultimately up to the team to determine what will work best with their formation and strategy.&nbsp;</p>
