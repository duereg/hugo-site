class="toc-anchor" href="#description">¶</a> Description</h1>
<p>One effective method of growing a club or starting a club is to hold a series of beginner practices. This could be one beginner class followed by including the beginners in the club's regular practice, or a weekly beginner practice help year round. Clubs have to determine how many beginner practices they are able to host.&nbsp;</p>
<p>A beginner practice should include the following:</p>
<ol>
  <li>A description and demonstration of all the gear and what it is for.</li>
  <li>A brief description of how the game runs, including:<ul>
      <li>The puck starts in the center, both teams start at the wall and race to get the puck first.</li>
      <li>A goal is scored when the puck touches the back or bottom of the goal.</li>
    </ul>
  </li>
  <li>A quick overview of a few fouls, the rest can be covered as they come up in the game.<ul>
      <li>The stick can only be held by one hand.</li>
      <li>The puck can only be moved by the stick.</li>
      <li>No grabbing or pushing other players.</li>
      <li>It can be helpful to mention to players that underwater hockey is non-contact, in a similar manner to basket ball. There is a lot of incidental contact, but pushing, grabbing, and blocking people is not allowed.&nbsp;</li>
    </ul>
  </li>
  <li>A lot of time to play!</li>
</ol>
