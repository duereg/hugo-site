<p>Tackling maneuvers are options available to a player when an opponent has possession of the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>. They can be used to take or “steal” the puck from an opponent.&nbsp;</p>
<p>There are situations where just hitting or “bashing” the puck off the stick towards a teammate is appropriate, but in general it is better to steal the puck with a tackling maneuver in order to establish control of the puck and then think about making progress or <a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page">passing</a> to a teammate.&nbsp;</p>
