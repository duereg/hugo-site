</div><p>
This block prepares players for participation in a real game environment by introducing basic game flow, strikes, and simple structure of play.
</p><div>

</div><p>
<b>Linked Individual Fundamental:</b> 
<a href="/players/individual_fundamentals/moving_in_the_water" target="_blank" class="is-internal-link is-valid-page">
Moving in the Water
</a> – Effective movement supports strikes, game flow, and participation in structured play.
</p><div>

</div><hr><div>

</div><h2 id="session-focus" class="toc-header"><a class="toc-anchor" href="#session-focus">¶</a> Session Focus</h2><div>

</div><ul>
  <li>Understand how the game starts, stops, and restarts</li>
  <li>Execute a safe and legal strike</li>
  <li>Participate in structured mini games</li>
  <li>Apply passing, support, and positioning in live play</li>
</ul><div>

</div><p><b>Coach Reminder:</b> This is not about teaching new skills. It is about applying what players already know in a game setting.</p><div>

</div><hr><div>

</div><h2 id="session-run-order" class="toc-header"><a class="toc-anchor" href="#session-run-order">¶</a> Session Run Order</h2><div>

</div><!-- 1. GAME FLOW --><div>

</div><p><b>Game Flow &amp; Rules</b></p>
<ul>
  <li>Explain how play starts (strike)</li>
  <li>Explain stoppages (whistle, fouls, goals)</li>
  <li>Explain restart after a goal</li>
  <li>Reinforce core rules:
    <ul>
      <li>Stick only contact on puck</li>
      <li>No pushing or grabbing</li>
    </ul>
  </li>
</ul><div>

</div><p><b>Linked Drill:</b> 
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-4#restart-practice" class="is-internal-link is-valid-page">Restart Practice</a>
</p><div>

</div><p><b>Coaching Focus:</b></p>
<ul>
  <li>Clarity over detail</li>
  <li>Keep explanations short</li>
  <li>Demonstrate visually where possible</li>
</ul><div>



</div><!-- 2. STRIKE --><div>

</div><p><b>Strike Practice</b></p>
<ul>
  <li>Players line up on both walls</li>
  <li>On signal, swim toward the puck</li>
  <li>Make first contact with the stick</li>
  <li>Attempt to gain control and move forward</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-4#wall-strike" class="is-internal-link is-valid-page">Wall Strike</a>
</p><div>

</div><p><b>Coaching Focus:</b></p>
<ul>
  <li>Correct positioning on the wall</li>
  <li>No early movement</li>
  <li>Controlled first contact</li>
</ul><div>



</div><!-- 3. STRUCTURED GAME --><div>

</div><p><b>Structured Mini Game</b></p>
<ul>
  <li>Divide into two equal teams</li>
  <li>Use clear team identifiers (e.g. black and white)</li>
  <li>Run mini game with strikes and stoppages</li>
  <li>Reset after goals</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-4#full-mini-game" class="is-internal-link is-valid-page">Full Mini Game</a>
</p><div>

</div><p><b>Coaching Focus:</b></p>
<ul>
  <li>Reinforce game flow</li>
  <li>Encourage support and spacing</li>
  <li>Keep play calm and controlled</li>
  <li>Stop and reset when needed</li>
</ul><div>

</div><p>
Full drill descriptions available in the 
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-4" class="is-internal-link is-invalid-page">
Game Flow and Strikes Drill Library
</a>.
</p><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><p>By the end of this block players should demonstrate the following during structured mini game play:</p><div>

</div><ul>
<li>
Executes a legal strike from the wall  
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-4#wall-strike" class="is-internal-link is-valid-page">Wall Strike</a>
</li>

<li>
Understands basic game flow (start, stop, restart)  
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-4#restart-practice" class="is-internal-link is-valid-page">Restart Practice</a>
</li>

<li>
Participates in a full mini game  
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-4#full-mini-game" class="is-internal-link is-valid-page">Full Mini Game</a>
</li>

<li>
Passes and supports teammates during live play  
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-4#full-mini-game" class="is-internal-link is-valid-page">Full Mini Game</a>
</li>

<li>
Maintains involvement without excessive fatigue  
<br><b>Coach Note:</b> Monitor rotations and encourage early surfacing
</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-learning-principles" class="toc-header"><a class="toc-anchor" href="#key-learning-principles">¶</a> Key Learning Principles</h2><div>

</div><h3 id="game-flow" class="toc-header"><a class="toc-anchor" href="#game-flow">¶</a> Game Flow</h3><div>

</div><p>
Players learn how the game starts, stops, and restarts, creating structure and predictability.
</p><div>

</div><ul>
  <li>Understand start signals</li>
  <li>Reset correctly after goals</li>
  <li>Follow direction of play</li>
</ul><div>

</div><p><b>Rule:</b> Start correctly, reset calmly, play in the right direction.</p><div>

</div><h3 id="strikes" class="toc-header"><a class="toc-anchor" href="#strikes">¶</a> Strikes</h3><div>

</div><p>
The strike is the controlled start of play and should be executed safely and correctly.
</p><div>

</div><ul>
  <li>Start from correct wall position</li>
  <li>React to the signal, not before</li>
  <li>Make clean first contact</li>
</ul><div>

</div><h3 id="game-participation" class="toc-header"><a class="toc-anchor" href="#game-participation">¶</a> Game Participation</h3><div>

</div><p>
Players apply all previous skills in a structured game environment.
</p><div>

</div><ul>
  <li>Support teammates</li>
  <li>Maintain spacing</li>
  <li>Stay involved in play</li>
  <li>Surface early and reset</li>
</ul><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Wait for the signal</li>
  <li>Stick to puck only</li>
  <li>Reset quickly</li>
  <li>Support your team</li>
  <li>Stay calm</li>
  <li>Surface early</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-good-performance-looks-like" class="toc-header"><a class="toc-anchor" href="#what-good-performance-looks-like">¶</a> What Good Performance Looks Like</h2><div>

</div><ul>
  <li>Players execute clean, legal strikes</li>
  <li>Play starts and restarts smoothly</li>
  <li>Players understand direction of play</li>
  <li>Teams stay organised during mini games</li>
  <li>Players support each other and remain involved</li>
  <li>Play remains safe and controlled</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><b>False starts on strike</b><br>Cue: Wait for the signal.</li>

  <li><b>Players unsure where to go after restart</b><br>Cue: Reset and face the correct direction.</li>

  <li><b>Chaotic play during mini games</b><br>Cue: Slow down, spread out.</li>

  <li><b>Over-aggressive contact</b><br>Cue: Stick to puck only.</li>

  <li><b>Players staying down too long</b><br>Cue: Surface early.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Keep games small, structured, and controlled</li>
  <li>Stop play frequently to reinforce understanding</li>
  <li>Prioritise safety over flow</li>
  <li>Reinforce calm, repeatable play</li>
</ul><div>
