<p>An underwater hockey player needs to have certain <a href="/game/gear-setup" class="is-internal-link is-valid-page">gear</a> in order to play; such as a <a href="/game/gear-setup/gloves" class="is-internal-link is-valid-page">glove</a>, <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a>, <a href="/game/gear-setup/masks" class="is-internal-link is-valid-page">mask</a> (swim goggles are not allowed), <a href="/game/gear-setup/caps" class="is-internal-link is-valid-page">cap</a>, <a href="/game/gear-setup/ear-guards" class="is-internal-link is-valid-page">ear-guards</a>, <a href="/game/gear-setup/snorkels" class="is-internal-link is-valid-page">snorkel</a>, <a href="/game/gear-setup/mouth-guards" class="is-internal-link is-valid-page">mouth-guard</a>, and <a href="/game/gear-setup/fins" class="is-internal-link is-valid-page">fins</a>. When learning new skills the terms <i>Stick-Hand Side</i> and <i>Free-Hand Side</i> are used often. As can be seen in the player image below the terms are self-explanatory with the side of the body that the player grips the stick being the stick-hand side, and the opposite is the free-hand side.</p>
<figure class="image image_resized" style="width:28.51%;"><img src="/an_uwh_player_2.png">
  <figcaption><span class="text-huge">An Underwater Hockey Player</span></figcaption>
</figure>
<p>A well-rounded player will have mastered the <a href="/players/individual_fundamentals" class="is-internal-link is-valid-page">individual fundamentals</a> that are the building blocks for many of the <a href="/players/evasive_maneuvers" class="is-internal-link is-valid-page">evasive</a> and <a href="/players/tackling_maneuvers" class="is-internal-link is-valid-page">tackling</a> maneuvers used during play. The <a href="/players/individual_drills" class="is-internal-link is-valid-page">individual drills</a> help a player develop the techniques necessary to build confidence in using the various maneuvers.</p>
<p>These maneuvers are used in different situations based upon many different criteria; such as where the play is within the court, whether or not the player is in possession of the puck, how comfortable the player is performing the maneuver, and the player's role and responsibilities within their <a href="/teams" class="is-internal-link is-valid-page">team's</a> formation.&nbsp;</p>
