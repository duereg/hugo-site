a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Underwater hockey is about a lot more than playing the game and practicing skills. A club is also a close-knit community of life long friends. It is important for clubs to remember to organize social events outside of the pool to build up this community as much as possible. A great time to hang out as a team is for meals after practice.&nbsp;</p>
<p>Getting to know teammates out of the water will improve in water teamwork significantly as well!&nbsp;</p>
