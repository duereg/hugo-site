<p>Flicks with no <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> lift are a simplified version of a <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">full flick.</a> This kind of flick consists of a hard&nbsp; and fast extension of the arm, and a forward flick of the wrist. The wrist flick is done by flexing the wrist sideways and extending the stick forward until the stick is pointing straight ahead, in the direction the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck </a>is going. The tip of the stick and the glove should stay in contact with the bottom of the pool though the entire maneuver. It is important to make the arm and wrist extensions fast and hard, as this will propel the puck further. The puck should lift off the bottom of the pool if done correctly.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This kind of flick is useful in situations where a player is uncertain of their full flick or at the end of a long dive and can’t take the extra moment to ensure their flick technique is good. This method is simplified, so it has fewer factors that can go wrong. This flick is also often a bit faster to execute than a full flick.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>As with any kind of flick, it is important for players to be aware of where they are flicking the puck and do not flick it into another player.</p>
<p>It is also common for flicks to be knocked down, so it is important to make sure the flick went where intended and if not, follow it and try again.</p>
