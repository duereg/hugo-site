<p>In pools where temporary <a href="/game/gear-setup/walls" class="is-internal-link is-valid-page">walls</a> are put in place to mark the edge of the <a href="/game/gear-setup/courts" class="is-internal-link is-valid-page">court</a>, players are not allowed to hold on to the wall. It is legal to place a hand against the side of the barrier, but holding onto the top of the barrier or any other part of the wall is illegal. This foul can also be called if a player grabs the <a href="/game/gear-setup/goals" class="is-internal-link is-valid-page">goal</a> to gain an advantage.</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>This should be called if any player is seen holding the walls or goals in any way. The signal to call this is a downward facing “U” made by the hand which is moved back and forth, simulating the grabbing of a wall.</p>
<figure class="image image_resized" style="width:48.29%;"><img src="/grabbing_barrier.png"></figure>
<h1 id="when-not-to-call-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-call-and-what-to-watch-out-for">¶</a> When not to Call and What to Watch Out For</h1>
<p>This foul should not be called if the player is placing their hand against the flat part of the wall, in this case they are not holding the wall, simply bracing themselves on it. If players incidentally grab the wall but are not engaged in the play and do not gain any advantage from doing so should generally not be called. &nbsp;</p>
<p>It is often easy for players to just have their hand by the top of the wall and accidentally bend their fingers around the top. Referees can not distinguish this from actually grabbing the wall, so it is better for the players to always keep their hands away from the wall or keep their hands flat.</p>
<p>&nbsp;</p>

<div class="quickreference orange">
  <p><strong><u>GRABBING THE BARRIER</u></strong></p>
  <ul>
    <li>IS CALLED IF ANYONE GRABS OR HOLDS ON TO THE PLAYING AREA BARRIERS.</li>
    <li>CAN BE CALLED FOR HOLDING ON TO THE GOAL AS WELL.</li>
