<p><img src="/2-1-2-1_setup.jpg" alt=""></p>
<h1 id="formation-overview" class="toc-header"><a class="toc-anchor" href="#formation-overview">¶</a> Formation Overview</h1>
<p>The <strong>2-1-2-1</strong> is a vertically layered wall-pressure formation.</p>
<p><strong>Formation Name:</strong> 2-1-2-1<br>
<strong>Player Layout:</strong> 2 Forwards, 1 Center, 2 Half Backs, 1 Full Back<br>
<strong>Play Style:</strong> Vertical Support / Wall Cycling</p>
<p>The formation prioritizes:</p>
<ul>
<li>Multiple vertical support layers</li>
<li>Maintaining support predominantly behind the puck</li>
<li>Wall progression and controlled cycling</li>
<li>Creating space through short angled movement</li>
<li>Structured defensive recovery</li>
</ul>
<h2 id="tactical-diagrams" class="toc-header"><a class="toc-anchor" href="#tactical-diagrams">¶</a> Tactical Diagrams</h2>
<p>See how the formation is applied in different game situations:</p>

<h1 id="main-strengths" class="toc-header"><a class="toc-anchor" href="#main-strengths">¶</a> Main Strengths</h1>
<ul>
<li>Multiple vertical layers of defense</li>
<li>Strong support behind the puck carrier</li>
<li>Excellent wall progression structure</li>
<li>Safe recycling options under pressure</li>
</ul>
<h1 id="main-weaknesses" class="toc-header"><a class="toc-anchor" href="#main-weaknesses">¶</a> Main Weaknesses</h1>
<ul>
<li>Vulnerable in wide pools against horizontal formations</li>
<li>Can struggle against fast outside switches</li>
<li>Heavily dependent on wall play</li>
<li>Requires disciplined cycling support</li>
</ul>
<h1 id="core-principles" class="toc-header"><a class="toc-anchor" href="#core-principles">¶</a> Core Principles</h1>
<ul>
<li>Cycling possession backward safely</li>
<li>Swimming at 45-degree support angles</li>
<li>Drawing defenders out of position</li>
<li>Attacking newly created open space</li>
<li>Maintaining support behind the puck at all times</li>
<li>(see <a href="./diagrams/2-1-2-1-open-water-play" class="is-asset-link">Open Water Play</a>)</li>
</ul>
<h1 id="passing-style" class="toc-header"><a class="toc-anchor" href="#passing-style">¶</a> Passing Style</h1>
<p>Passing in the 2-1-2-1 is built around support behind the puck and controlled possession rather than aggressive forward progression.</p>
<p>Players should:</p>
<ul>
<li>Look for support behind the puck first</li>
<li>Recycle possession when forward progression closes</li>
<li>Use backward passes to maintain control</li>
<li>Support the current puck carrier from behind</li>
<li>Create attacking angles through swimming</li>
<li>Retain possession rather than forcing attacks</li>
<li>Move the puck to the next layer of support under pressure</li>
</ul>
<p>Forward flicks should only be used when:</p>
<ul>
<li>Open space exists ahead of the play</li>
<li>A forward can realistically recover the puck</li>
<li>The opposition cannot intercept or immediately pressure the puck</li>
</ul>
<p>The formation relies on recycling possession through support layers until space opens rather than forcing low-percentage attacking passes.</p>
<h1 id="position-responsibilities" class="toc-header"><a class="toc-anchor" href="#position-responsibilities">¶</a> Position Responsibilities</h1>
<h1 id="forwards" class="toc-header"><a class="toc-anchor" href="#forwards">¶</a> Forwards</h1>
<p>The forwards work together as the primary attacking pair.</p>
<ul>
<li>Win strikes and Attack open space (see <a href="./diagrams/2-1-2-1-strike" class="is-asset-link">Strike</a>)</li>
<li>Curl to retain possession</li>
<li>Fast swims to gain ground</li>
<li>Create space for support players by angling swims</li>
</ul>
<h2 id="forward-role" class="toc-header"><a class="toc-anchor" href="#forward-role">¶</a> Forward Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Attack open space</li>
<li>Draw defenders out of position</li>
<li>Retain possession under pressure</li>
<li>Lay the puck off to supporting players</li>
<li>Continue movement after releasing possession</li>
<li>Work together as an attacking pair (see <a href="./diagrams/2-1-2-1-advantage-puck-goals" class="is-asset-link">Advantage Puck in Front of Goals</a>)</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Stay ahead of the puck</li>
<li>Maintain close support for back-picking</li>
<li>Swim into open space to receive passes</li>
<li>Stay connected to the attacking structure</li>
<li>Create space for the next attacking player</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<h3 id="strong-forward" class="toc-header"><a class="toc-anchor" href="#strong-forward">¶</a> Strong Forward</h3>
<p>The Strong Forward's main role is to support defenders by removing backward options.</p>
<p>Responsibilities include:</p>
<ul>
<li>Back-picking opposition players</li>
<li>Eliminating backward exits</li>
<li>Supporting defenders under pressure</li>
<li>Trapping play along the wall</li>
<li>(see <a href="./diagrams/2-1-2-1-left-wall-play" class="is-asset-link">Left Wall Play</a>)</li>
</ul>
<h3 id="weak-forward" class="toc-header"><a class="toc-anchor" href="#weak-forward">¶</a> Weak Forward</h3>
<p>The Weak Forward's main role is to stop swings before they begin.</p>
<p>Responsibilities include:</p>
<ul>
<li>Staying tight to swing initiators</li>
<li>Blocking easy lateral switches</li>
<li>Protecting weak-side exits</li>
<li>Supporting defensive recovery</li>
</ul>
<p>(see <a href="./diagrams/2-1-2-1-disadvantage-puck" class="is-asset-link">Disadvantage Puck</a>)</p>
</details>
<h1 id="center" class="toc-header"><a class="toc-anchor" href="#center">¶</a> Center</h1>
<p>The Center acts as the main distributor and structural support player.</p>
<ul>
<li>Fill missing support gaps</li>
<li>Stay available behind the puck</li>
<li>Control middle support space</li>
</ul>
<h2 id="center-role" class="toc-header"><a class="toc-anchor" href="#center-role">¶</a> Center Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Ensure there is always a passing option</li>
<li>Support players when direct support is missing</li>
<li>Distribute possession safely</li>
<li>Swing the puck when open space exists</li>
<li>Support both attack and defense</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Stay off the wall</li>
<li>Keep the puck directed toward the wall</li>
<li>Block central passing lanes defensively</li>
<li>Stay behind the puck during progression</li>
<li>Fill missing support spaces during attacks</li>
</ul>
<p>The Center should consistently provide support from behind the puck carrier.</p>
</details>
<details>
<summary>Defense</summary>
<p>The Center’s primary defensive role is to:</p>
<ul>
<li>Protect the middle channel</li>
<li>Prevent central progression</li>
<li>Redirect play toward the wall</li>
<li>Support recovering defenders</li>
</ul>
</details>
<h1 id="full-back" class="toc-header"><a class="toc-anchor" href="#full-back">¶</a> Full Back</h1>
<p>The Full Back is the primary cover defender behind the structure.</p>
<ul>
<li>Close space behind the Center</li>
<li>Cover defensive breakdowns</li>
<li>Control deep defensive recovery</li>
<li>Manage long swings safely</li>
</ul>
<h2 id="full-back-role" class="toc-header"><a class="toc-anchor" href="#full-back-role">¶</a> Full Back Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Back up the Center defensively</li>
<li>Cover attackers who break through pressure</li>
<li>Support recovery behind the Half Backs</li>
<li>Swing the game safely when required</li>
<li>Stabilize possession under pressure</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Stay a swinging option for the half backs</li>
<li>Avoid commiting on the wall</li>
<li>Hold the middle court behind the center</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<p>The Full Back relies on the Half Backs to initiate pressure first.</p>
<p>The Full Back then reacts to:</p>
<ul>
<li>Direction changes</li>
<li>Breakthrough attempts</li>
<li>Recovery space behind pressure</li>
<li>Attacker decisions after engagement</li>
</ul>
<p>The Full Back should avoid overcommitting early.</p>
</details>
<h1 id="half-backs" class="toc-header"><a class="toc-anchor" href="#half-backs">¶</a> Half Backs</h1>
<p>The Half Backs provide the main wall-driving pressure and defensive layering.</p>
<ul>
<li>Initiate defensive pressure</li>
<li>Maintain wall progression</li>
<li>Protect defensive recovery</li>
<li>Support the cycling structure</li>
</ul>
<h2 id="half-back-role" class="toc-header"><a class="toc-anchor" href="#half-back-role">¶</a> Half Back Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Drive the puck up the wall</li>
<li>Use powerful kicks to gain space</li>
<li>Make short support passes to the Center and Forwards</li>
<li>Maintain attacking momentum</li>
<li>Support forwards when they need backward passing options</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<h3 id="strong-half-back" class="toc-header"><a class="toc-anchor" href="#strong-half-back">¶</a> Strong Half Back</h3>
<ul>
<li>Drive progression up the wall</li>
<li>Stay connected to the attacking structure</li>
<li>Support forwards from behind</li>
</ul>
<h3 id="weak-half-back" class="toc-header"><a class="toc-anchor" href="#weak-half-back">¶</a> Weak Half Back</h3>
<ul>
<li>Cover behind the Full Back</li>
<li>Act as the last defender</li>
<li>Stay deeper than the Strong Half Back</li>
<li>Protect weak-side recovery space</li>
<li>Draw a line between the attacker and the goal</li>
<li>Avoid overcommitting into pressure</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<p>The Half Backs form the first line of defense.</p>
<p>Their role is to:</p>
<ul>
<li>Force the opposition to make a decision</li>
<li>Drive attackers toward the wall and corners</li>
<li>Prevent easy progression through open water</li>
<li>Support the Full Back by controlling attacking options</li>
</ul>
<h3 id="strong-half-back-1" class="toc-header"><a class="toc-anchor" href="#strong-half-back-1">¶</a> Strong Half Back</h3>
<ul>
<li>Initiate defensive pressure</li>
<li>Force play toward support</li>
<li>Push attacks toward the wall</li>
</ul>
<h3 id="weak-half-back-1" class="toc-header"><a class="toc-anchor" href="#weak-half-back-1">¶</a> Weak Half Back</h3>
<ul>
<li>Cover behind the Full Back</li>
<li>Protect defensive recovery space</li>
<li>Act as the last defender if the structure breaks down</li>
</ul>
<h2 id="" class="toc-header"><a class="toc-anchor" href="#">¶</a> </h2></details>
<h1 id="possession-principles" class="toc-header"><a class="toc-anchor" href="#possession-principles">¶</a> Possession Principles</h1>
<p>The 2-1-2-1 prioritizes controlled progression and layered support over direct attacking passes.</p>
<p>Players should:</p>
<ul>
<li>Keep support behind the puck</li>
<li>Use backward recycling when pressured</li>
<li>Attack through angled movement</li>
<li>Maintain wall progression patiently</li>
<li>Avoid isolated forward attacks</li>
</ul>
<p>The structure works best when support remains connected vertically through the pool.</p>
<hr>
<h1 id="common-structural-failures" class="toc-header"><a class="toc-anchor" href="#common-structural-failures">¶</a> Common Structural Failures</h1>
<p>The structure commonly breaks down when:</p>
<ul>
<li>Support moves too far ahead of the puck</li>
<li>Players stop cycling behind possession</li>
<li>The Full Back overcommits early</li>
<li>Weak-side coverage disappears</li>
<li>Players force progression without support</li>
<li>The wall structure disconnects</li>
<li>Wide switches are not pressured quickly enough</li>
</ul>
