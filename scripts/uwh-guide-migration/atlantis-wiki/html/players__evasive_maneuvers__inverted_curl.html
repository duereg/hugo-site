<p>This move is a <a href="/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page">curl</a> towards the free hand side, but with the playing hand shoulder against the bottom of the pool, the puck on the inside hook of the stick, and the hand palm-side up. The arm will be raised so that the <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> is next to or above the head. The <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> will be on the inside of the stick as the player curls and the stick-side hip should remain close to the bottom of the pool. Power in the turn comes from engaging the core and kicking the legs. </p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This move can be used when a player is beat on their free hand side and the puck ends up slightly behind them. As the opponent swims past them, this position allows for a good stick angle to snag the puck as the player swims by. As the player exits the inverted curl, they should rotate their shoulders so that their chest is facing down again, and rotate their stick around the puck to get it on the front of their stick again. Once the player’s chest is facing downwards and the puck is back on the front of the stick, they may enter and standard curl (by continuing to turn in the same direction) or swim forward.</p>
<p>A <a href="/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page"> standard curl</a> is usually a better option because the player can more easily keep their head up and look ahead than when doing an inverted curl. The inverted curl can be used if the player ends up in a position with their body twisted facing upwards, and they need to quickly move the puck and protect it.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>If a player commits to this move and does not get the puck from the opponent it will be very difficult to catch up the opponent again. It is important to only attempt this move when the chance of snagging the puck is high.</p>
