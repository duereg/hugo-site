<p>A knock down is a blockage of the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> when it is off the bottom of the pool. This is most common when an opponent <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">flicks</a><i> </i> the puck past a player who then blocks the flick, knocking it back down to the playing surface.</p>
<p>What to think about when knocking down the puck:</p>
<ol>
  <li>The knock down must happen with the stick, if anything else (glove, wrist, arm, etc) blocks the puck, that is an <a href="/game/fouls/illegal_stopping" class="is-internal-link is-valid-page">illegal blockage</a> of the puck, and a foul will be called.</li>
  <li>When knocking down the puck, players should block the puck in a way that makes the puck go straight down, either by simply blocking the pass and allowing it to fall down, or using the stick to slap the puck into the bottom.</li>
  <li>When setting up for a knock down, players can go into the <a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">cobra position,</a><i> </i> making the position of their arm more favorable for the knock down. In this position it is easier to knock the puck down, instead of sideways or up.</li>
  <li>Knock downs can be done on either side of the body, but are generally much easier on the stick arm side. For knockdowns on the free arm side, the player must twist their torso and reach across their chest to position their stick in the path of the opponent’s flick.</li>
</ol>
<p>Knock downs take a lot of practice, good stick-eye coordination has to be developed to consistently block flicks that are shot past a player. An effective way to improve this skill out of the water is to practice bouncing a tennis ball against a wall or playing pingpong using only a stick.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>The most common time that a knock down can be used is when an opponent is attempting to flick the puck past a player to a teammate behind that player. If the player successfully knocks down the puck, they should be aware that there is likely an opponent behind them to which that pass was intended to go.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>One of few situations where it may not be worth it to knock down the puck is when a player is already turned or turning to chase the pass. If that player can easily swim to where the puck is going to land in a kick or two, they will get to the puck much more consistently than slowing down to try and knock down the flick.</p>
