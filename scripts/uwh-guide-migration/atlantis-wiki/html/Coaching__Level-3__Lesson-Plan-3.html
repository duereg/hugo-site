Level 3 builds on the skills and game understanding developed in Level 2 by applying them within coordinated team systems and competitive game situations.
</p><div>

</div><p>
Players entering Level 3 should already:
</p><div>

</div><ul>
<li>Move efficiently and maintain a strong playing position.</li>
<li>Control, pass, receive, and protect the puck confidently.</li>
<li>Understand basic attacking and defensive principles.</li>
<li>Support teammates and maintain simple team structure.</li>
<li>Participate confidently in structured game play.</li>
</ul><div>

</div><p>
Level 3 focuses on applying individual skills within a team environment. Players learn how to work together, maintain structure, and make effective decisions under increasing game pressure.
</p><div>

</div><hr><div>

</div><h2 id="lesson-plan-structure" class="toc-header"><a class="toc-anchor" href="#lesson-plan-structure">¶</a> Lesson Plan Structure</h2><div>

</div><ul>

  <li>
    <a href="/en/Coaching/Level-3/Lesson-Plan-3/Level-3-Block-1" class="is-internal-link is-valid-page"><b>Block 1 – Defensive Systems</b></a><br>
    Develop defensive positioning, coordinated pressure, and team defence.
  </li>

  <br>

  <li>
    <a href="/en/Coaching/Level-3/Lesson-Plan-3/Level-3-Block-2" class="is-internal-link is-valid-page"><b>Block 2 – Contest &amp; Possession</b></a><br>
    Learn how to win, protect, and maintain possession under pressure.
  </li>

  <br>

  <li>
    <a href="/en/Coaching/Level-3/Lesson-Plan-3/Level-3-Block-3" class="is-internal-link is-valid-page"><b>Block 3 – Transition Play</b></a><br>
    React quickly to turnovers and transition efficiently between attack and defence.
  </li>

  <br>

  <li>
    <a href="/en/Coaching/Level-3/Lesson-Plan-3/Level-3-Block-4" class="is-internal-link is-valid-page"><b>Block 4 – Attacking Systems</b></a><br>
    Create attacking opportunities through support, pressure, and intelligent decision-making.
  </li>

  <br>

  <li>
    <a href="/en/Coaching/Level-3/Lesson-Plan-3/Level-3-Block-5" class="is-internal-link is-valid-page"><b>Block 5 – Formation &amp; Structure</b></a><br>
    Understand team shape, spacing, rotations, and maintaining structure throughout the game.
  </li>

  <br>

  <li>
    <a href="/en/Coaching/Level-3/Lesson-Plan-3/Level-3-Block-6" class="is-internal-link is-valid-page"><b>Block 6 – Wall Play</b></a><br>
    Attack, defend, and maintain possession along the wall while creating effective exits into open play.
  </li>

  <br>

  <li>
    <a href="/en/Coaching/Level-3/Lesson-Plan-3/Level-3-Block-7" class="is-internal-link is-valid-page"><b>Block 7 – Special Situations</b></a><br>
    Apply tactical principles during advantage pucks, special situations, and game-specific scenarios.
  </li>

  <br>

  <li>
    <a href="/en/Coaching/Level-3/Lesson-Plan-3/Level-3-Block-8" class="is-internal-link is-valid-page"><b>Block 8 – Game Management</b></a><br>
    Manage substitutions, momentum, communication, and decision-making during competitive play.
  </li>

</ul><div>

</div><hr>
<h2 id="coaching-philosophy" class="toc-header"><a class="toc-anchor" href="#coaching-philosophy">¶</a> Coaching Philosophy</h2><div>

</div><ul>
<li>Develop team systems before advanced tactics.</li>
<li>Teach players to recognise what the game needs and respond accordingly.</li>
<li>Maintain structure while applying pressure.</li>
<li>Encourage coordinated movement and effective support.</li>
<li>Develop players who make confident decisions under pressure.</li>
</ul><div>

</div><p>
Level 3 develops players who can apply their individual skills within coordinated team systems. Every block should improve the player's ability to read the game, support teammates, maintain structure, and make effective decisions under pressure.
</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
