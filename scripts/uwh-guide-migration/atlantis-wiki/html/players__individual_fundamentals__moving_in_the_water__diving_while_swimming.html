<p>Diving while swimming is the most well known method of getting to the bottom of the pool. This consists of swimming along the surface, kicking with the arms outstretched in front of the player, and then bending at the hips and doing a strong dolphin kick to propel the player downwards at an angle. The player should time their dolphin kick to happen before the player bends at the hip to avoid kicking when their feet are out of the water. Once the player gets down far enough that their feet are underwater they can continue to kick.</p>
<p>It is important to no bend at the hip too much or to try to dive straight down. This will make the player’s feet stick straight up out of the water where they are ineffective for propelling the player. It is best to dive down at an angle which allows for the dolphin kick to push the player forward enough so that their feet come underwater quickly, allowing them to continue kicking in a timely manner.</p>

<h1 id="when-to-use" class="toc-header"><a class="toc-anchor" href="#when-to-use">¶</a> When to Use</h1>
<p>This dive can be used anytime the player wishes to get to the bottom of the pool, although, if the player wishes to get down directly below themselves, a <a href="/players/individual_fundamentals/moving_in_the_water/fins-first_dive" class="is-internal-link is-valid-page">fins-first dive</a> may be more appropriate.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Do not attempt a dive while swimming if the spot the player wants to be on the bottom of the pool is directly beneath them. If this is the case, it is more effective to use a <a href="/players/individual_fundamentals/moving_in_the_water/fins-first_dive" class="is-internal-link is-valid-page">fins-first dive</a><i>. </i>Only use the dive while swimming if there is space to dive to the desired location at an angle.</p>
