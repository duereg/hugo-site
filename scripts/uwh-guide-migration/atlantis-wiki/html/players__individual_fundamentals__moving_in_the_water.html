<p>How a player moves through the water is very important based on what is happening during the game at that point and what interaction with the play the player intends. The start of each point begins with a <a href="/players/individual_fundamentals/moving_in_the_water/strikes" class="is-internal-link is-valid-page">strike</a> and players have specific options available to reach the puck. Throughout the game players will need to <a href="/players/individual_fundamentals/moving_in_the_water/swimming_at_the_surface" class="is-internal-link is-valid-page">swim at the surface</a>, <a href="/players/individual_fundamentals/moving_in_the_water/kicking_mid-water" class="is-internal-link is-valid-page">kick mid-water</a>, and <a href="/players/individual_fundamentals/moving_in_the_water/kicking_at_the_bottom" class="is-internal-link is-valid-page">kick at the bottom</a> in order to reposition themselves properly and (re)enter the play. During this repositioning the player will at some point need to dive down and players can choose to <a href="/players/individual_fundamentals/moving_in_the_water/kicking_with_the_puck" class="is-internal-link is-valid-page">dive while swimming (duck dive)</a> or perform a <a href="/players/individual_fundamentals/moving_in_the_water/fins-first_dive" class="is-internal-link is-valid-page">fins-first dive (kelp dive)</a>.&nbsp;</p>
<p>Once on the bottom a player should assume the <a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">Ready Position (cobra position) </a>to indicate that they are available as a passing option. The ready position is also the base position for many <a href="/players/individual_fundamentals/puck_handling" class="is-internal-link is-valid-page">puck-handling</a> maneuvers. Before or after performing puck maneuvers players will often need to <a href="/players/individual_fundamentals/moving_in_the_water/kicking_with_the_puck" class="is-internal-link is-valid-page">swim with the puck</a> in order to make progress.</p>
