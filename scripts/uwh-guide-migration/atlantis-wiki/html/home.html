</div><p><strong>Underwater Hockey (UWH)</strong> is a fast-paced, team sport played on the bottom of a pool; combining skill, strategy, and teamwork. During play players make repeated short dives to support their teammates while pushing, pulling, and passing the puck using short one-handed sticks in order to score in the goal at each end.</p><div>

</div><p>This wiki is designed for <strong>players, coaches, and club organizers</strong> looking to deepen their understanding of underwater hockey. If you are a <strong>pool manager</strong> looking for information about the sport to see if it is safe for your patrons and facility, please see our <a href="/pool-managers" class="is-internal-link is-valid-page"><strong>facility or aquatics manager</strong> </a> page.</p><div>

</div><p>This resource also serves as the foundation for developing set of <strong>structured coaching programs </strong> and a <strong>player badge system</strong>, designed to guide skill progression, track development, and support consistent coaching across all levels of play.</p><div>

</div><hr><div>

</div><h2 id="what-is-underwater-hockey" class="toc-header"><a class="toc-anchor" href="#what-is-underwater-hockey">¶</a> What is Underwater Hockey?</h2><div>

</div><p>Underwater hockey is played in a pool typically two to three meters (six to nine feet) deep. The <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>, similar in size to an ice hockey puck, weighs about 1.3kg (~2.8 lbs) so it stays on the bottom.</p><div>

</div><p>Players wear a mask, fins, and snorkel, and must dive down to the pool floor to advance the puck. They use short, one-handed <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">sticks</a>, which are the only legal way to move the puck.</p><div>

</div><p>The <a href="/game/gear-setup/goals" class="is-internal-link is-valid-page">goal</a> is a three-meter-long trough positioned on the bottom of the pool at each end of the playing area.</p><div>

</div><p><strong>Watch underwater hockey in action:</strong></p><div>
