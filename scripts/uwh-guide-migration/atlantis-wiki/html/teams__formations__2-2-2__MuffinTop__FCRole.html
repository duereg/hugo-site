ViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="teams/formations/2-2-2/MuffinTop/FCRole.md"><template slot="contents"><div><h1 id="controlling-forward-fc" class="toc-header"><a class="toc-anchor" href="#controlling-forward-fc">¶</a> Controlling Forward (FC)</h1>
<p><a href="../MuffinTop" class="is-asset-link">← Return to Muffin Top</a></p>
<p><img src="/underwater_hockey_fc_pool_diagram.jpg" alt="underwater_hockey_fc_pool_diagram.jpg">The FC is the “Controlling forward” and in general should stay within the grayed-out area in the image</p>
<hr>
<h2 id="primary-purpose" class="toc-header"><a class="toc-anchor" href="#primary-purpose">¶</a> Primary Purpose</h2>
<p>Maintain controlled forward possession and provide a safe passing option for the Backs.</p>
<p>The FC is responsible for:</p>
<ul>
<li>Supporting offensive structure through the center</li>
<li>Maintaining controlled possession under pressure</li>
<li>Recycling possession safely through support players</li>
</ul>
<blockquote>
<p>Wings should generally NOT pass directly to the Forwards except:</p>
<ul>
<li>Within the Crash the Goal Zone</li>
<li>During specific defensive recovery situations</li>
</ul>
</blockquote>
<hr>
<h2 id="main-responsibilities" class="toc-header"><a class="toc-anchor" href="#main-responsibilities">¶</a> Main Responsibilities</h2>
<ul>
<li>Provide a reliable forward passing option for the Backs</li>
<li>Maintain possession under pressure</li>
<li>Support offensive structure through the middle</li>
<li>Keep the puck controlled and recyclable</li>
<li>Stay ahead of the puck during offensive movement</li>
<li>Support transitions through open water</li>
</ul>
<hr>
<h2 id="offensive-role" class="toc-header"><a class="toc-anchor" href="#offensive-role">¶</a> Offensive Role</h2>
<p>The FC acts as the primary controlled forward possession player.</p>
<h3 id="main-objectives" class="toc-header"><a class="toc-anchor" href="#main-objectives">¶</a> Main Objectives</h3>
<ul>
<li>Receive passes primarily from the Backs</li>
<li>Redistribute possession safely</li>
<li>Maintain offensive stability through the center</li>
<li>Create support options for Wings and Backs</li>
</ul>
<h3 id="passing-priorities" class="toc-header"><a class="toc-anchor" href="#passing-priorities">¶</a> Passing Priorities</h3>
<ol>
<li>Wings</li>
<li>Backs</li>
<li>Controlled shot attempts on tray</li>
</ol>
<h3 id="avoid" class="toc-header"><a class="toc-anchor" href="#avoid">¶</a> Avoid</h3>
<ul>
<li>Risky forward turnovers</li>
<li>Forced progression under pressure</li>
<li>Isolated offensive attacks without support</li>
</ul>
<hr>
<h2 id="important" class="toc-header"><a class="toc-anchor" href="#important">¶</a> Important</h2>
<ul>
<li>Wings generally should NOT pass directly to the FC</li>
<li>Exceptions include:
<ul>
<li>Crash the Goal Zone</li>
<li>Specific defensive recovery situations</li>
</ul>
</li>
</ul>
<p>The FC should prioritize:</p>
<ul>
<li>Controlled possession</li>
<li>Support structure</li>
<li>Safe recycling over risky advancement</li>
</ul>
<hr>
<h2 id="positioning-guidelines" class="toc-header"><a class="toc-anchor" href="#positioning-guidelines">¶</a> Positioning Guidelines</h2>
<ul>
<li>Generally remain within the central open-water area</li>
<li>Stay inside the Muffin Zone whenever possible</li>
<li>Avoid drifting toward the walls</li>
<li>Stay ahead of the puck during offensive movement</li>
</ul>
<h3 id="positioning-goals" class="toc-header"><a class="toc-anchor" href="#positioning-goals">¶</a> Positioning Goals</h3>
<ul>
<li>Maintain passing lanes</li>
<li>Support offensive structure</li>
<li>Provide predictable support options</li>
<li>Control open-water progression</li>
</ul>
<hr>
<h2 id="receiving-the-puck" class="toc-header"><a class="toc-anchor" href="#receiving-the-puck">¶</a> Receiving the Puck</h2>
<p>The FC may:</p>
<ul>
<li>Face backward toward their own goal when receiving
<ul>
<li>Helps shield the puck with their body</li>
</ul>
</li>
<li>Turn up-pool after securing possession</li>
<li>Recycle possession quickly if pressure develops</li>
</ul>
<h3 id="preferred-behavior" class="toc-header"><a class="toc-anchor" href="#preferred-behavior">¶</a> Preferred Behavior</h3>
<ul>
<li>Keep the puck moving through support</li>
<li>Maintain awareness of pressure</li>
<li>Avoid becoming isolated</li>
</ul>
<hr>
<h2 id="wall-play-behavior" class="toc-header"><a class="toc-anchor" href="#wall-play-behavior">¶</a> Wall Play Behavior</h2>
<h3 id="if-teammates-are-progressing-successfully-on-the-wall" class="toc-header"><a class="toc-anchor" href="#if-teammates-are-progressing-successfully-on-the-wall">¶</a> If teammates are progressing successfully on the wall:</h3>
<ul>
<li>Stay central</li>
<li>Wait for the puck to return off the wall</li>
<li>Prepare to receive from a Back</li>
</ul>
<h3 id="if-the-play-becomes-stagnant-or-dangerous" class="toc-header"><a class="toc-anchor" href="#if-the-play-becomes-stagnant-or-dangerous">¶</a> If the play becomes stagnant or dangerous:</h3>
<ul>
<li>Stay ahead of the play</li>
<li>Prepare to disrupt:
<ul>
<li>Swings</li>
<li>Side-to-side resets</li>
<li>Opponent transitions</li>
</ul>
</li>
</ul>
<hr>
<h2 id="avoid-1" class="toc-header"><a class="toc-anchor" href="#avoid-1">¶</a> Avoid</h2>
<h3 id="passing-to-the-other-forward" class="toc-header"><a class="toc-anchor" href="#passing-to-the-other-forward">¶</a> Passing to the Other Forward</h3>
<p>Avoid direct Forward-to-Forward passes unless:</p>
<ul>
<li>Both Forwards are near the Full Attack Zone</li>
</ul>
<p>Why:</p>
<ul>
<li>Limited awareness under pressure often exposes the receiving Forward to heavy pressure</li>
</ul>
<hr>
<h3 id="swimming-across-the-centerline-to-reach-the-weak-wing" class="toc-header"><a class="toc-anchor" href="#swimming-across-the-centerline-to-reach-the-weak-wing">¶</a> Swimming Across the Centerline to Reach the Weak Wing</h3>
<p>If uncertain which Wing is the Weak Wing:</p>
<ul>
<li>Recycle possession to a Back instead</li>
</ul>
<p>Especially important:</p>
<ul>
<li>Within ~1m of either side of the Centerline</li>
</ul>
<hr>
<h3 id="getting-caught-behind-the-puck" class="toc-header"><a class="toc-anchor" href="#getting-caught-behind-the-puck">¶</a> Getting Caught Behind the Puck</h3>
<p>The FC should make every effort to:</p>
<ul>
<li>Stay between the puck and the opponent’s goal</li>
<li>Remain ahead of the play offensively</li>
</ul>
<p>Leave direct head-to-head defensive coverage to:</p>
<ul>
<li>Wings</li>
<li>Backs</li>
</ul>
<hr>
<h3 id="engaging-in-prolonged-stick-battles" class="toc-header"><a class="toc-anchor" href="#engaging-in-prolonged-stick-battles">¶</a> Engaging in Prolonged Stick Battles</h3>
<p>Avoid prolonged stick battles unless:</p>
<ul>
<li>Attempting to score within the Full Attack Zone</li>
</ul>
<p>If significant resistance develops:</p>
<ul>
<li>Turn away</li>
<li>Curl</li>
<li>Swim into space</li>
<li>Pass safely to a Wing or Back</li>
</ul>
<hr>
<h2 id="key-skills" class="toc-header"><a class="toc-anchor" href="#key-skills">¶</a> Key Skills</h2>
<ul>
<li>Puck protection</li>
<li>Awareness</li>
<li>Calm possession</li>
<li>Passing accuracy</li>
<li>Open-water positioning</li>
<li>Decision making under pressure</li>
<li>Offensive patience</li>
</ul>
<hr>
