<h2 id="block-goal" class="toc-header"><a class="toc-anchor" href="#block-goal">¶</a> Block Goal</h2>
<p>Teach players when to attack, when to keep possession, and how to defend as a team.</p>
<h3 id="key-outcomes" class="toc-header"><a class="toc-anchor" href="#key-outcomes">¶</a> Key Outcomes</h3>
<p>By the end of this block, players should be able to:</p>
<ul>
<li>Put the opposition under pressure.</li>
<li>Know when to keep possession.</li>
<li>Support teammates in attack.</li>
<li>Defend with good body position.</li>
<li>Win the puck back using good technique.</li>
</ul>

<h1 id="activity-1-attacking-pressure" class="toc-header"><a class="toc-anchor" href="#activity-1-attacking-pressure">¶</a> Activity 1 – Attacking Pressure</h1>
<h2 id="objective" class="toc-header"><a class="toc-anchor" href="#objective">¶</a> Objective</h2>
<p>Learn how to put defenders under pressure.</p>
<h2 id="explain" class="toc-header"><a class="toc-anchor" href="#explain">¶</a> Explain</h2>
<p>Move the puck into open space and chase it before the defender can recover.</p>
<p>Attacking pressure helps your team:</p>
<ul>
<li>Gain territory.</li>
<li>Put the defence under pressure.</li>
<li>Create attacking opportunities.</li>
</ul>
<h2 id="when-to-use" class="toc-header"><a class="toc-anchor" href="#when-to-use">¶</a> When to Use</h2>
<ul>
<li>There is open space ahead.</li>
<li>Support players are behind the puck.</li>
<li>You can win the race to the puck.</li>
</ul>
<h3 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h3>
<ul>
<li>Flick and chase.</li>
<li>Stay low.</li>
<li>Chase your own puck.</li>
<li>Pressure together.</li>
</ul>
<h3 id="common-errors" class="toc-header"><a class="toc-anchor" href="#common-errors">¶</a> Common Errors</h3>
<ul>
<li>Chasing without support.</li>
<li>Flicking too far.</li>
<li>Standing up.</li>
<li>Waiting after the flick.</li>
</ul>
<h3 id="coach-focus" class="toc-header"><a class="toc-anchor" href="#coach-focus">¶</a> Coach Focus</h3>
<p>Players should recognise that attacking pressure is only effective when teammates are in position to support the play.</p>
<h1 id="activity-2-maintaining-possession" class="toc-header"><a class="toc-anchor" href="#activity-2-maintaining-possession">¶</a> Activity 2 – Maintaining Possession</h1>
<h2 id="objective-1" class="toc-header"><a class="toc-anchor" href="#objective-1">¶</a> Objective</h2>
<p>Know when to slow the game down and keep the puck.</p>
<h2 id="explain-1" class="toc-header"><a class="toc-anchor" href="#explain-1">¶</a> Explain</h2>
<p>You don't always have to attack.</p>
<p>Sometimes the best option is to keep the puck until your teammates are ready.</p>
<p>Maintaining possession gives your team time to recover and build the next attack.</p>
<h2 id="when-to-use-1" class="toc-header"><a class="toc-anchor" href="#when-to-use-1">¶</a> When to Use</h2>
<ul>
<li>Your teammates are still recovering.</li>
<li>You are under pressure.</li>
<li>You are in your own half.</li>
<li>There is no safe attacking option.</li>
</ul>
<h3 id="coaching-cues-1" class="toc-header"><a class="toc-anchor" href="#coaching-cues-1">¶</a> Coaching Cues</h3>
<ul>
<li>Be patient.</li>
<li>Protect first.</li>
<li>Support the puck.</li>
<li>Don't force the play.</li>
</ul>
<h3 id="common-errors-1" class="toc-header"><a class="toc-anchor" href="#common-errors-1">¶</a> Common Errors</h3>
<ul>
<li>Forcing difficult passes.</li>
<li>Holding the puck too long.</li>
<li>Attacking without support.</li>
</ul>
<h3 id="coach-focus-1" class="toc-header"><a class="toc-anchor" href="#coach-focus-1">¶</a> Coach Focus</h3>
<p>Help players understand that keeping possession is often the best attacking decision.</p>
<h1 id="activity-3-defensive-principles" class="toc-header"><a class="toc-anchor" href="#activity-3-defensive-principles">¶</a> Activity 3 – Defensive Principles</h1>
<h2 id="objective-2" class="toc-header"><a class="toc-anchor" href="#objective-2">¶</a> Objective</h2>
<p>Learn how to stop the attack without giving away dangerous space.</p>
<h2 id="explain-2" class="toc-header"><a class="toc-anchor" href="#explain-2">¶</a> Explain</h2>
<p>Good defenders don't chase the puck.</p>
<p>They stay between the puck and the goal, slow the attack, and wait for the right opportunity to win possession.</p>
<h2 id="core-defensive-principles" class="toc-header"><a class="toc-anchor" href="#core-defensive-principles">¶</a> Core Defensive Principles</h2>
<ul>
<li>Close the gap.</li>
<li>Stay between the puck and the goal.</li>
<li>Keep a strong body position.</li>
<li>Rotate instead of reaching.</li>
<li>Slow the attack before trying to win the puck.</li>
</ul>
<h2 id="when-to-use-2" class="toc-header"><a class="toc-anchor" href="#when-to-use-2">¶</a> When to Use</h2>
<p>Apply these principles whenever the opposition has possession.</p>
<h3 id="coaching-cues-2" class="toc-header"><a class="toc-anchor" href="#coaching-cues-2">¶</a> Coaching Cues</h3>
<ul>
<li>Stay low.</li>
<li>Stay square.</li>
<li>Rotate, don't reach.</li>
<li>Slow them down.</li>
</ul>
<h3 id="common-errors-2" class="toc-header"><a class="toc-anchor" href="#common-errors-2">¶</a> Common Errors</h3>
<ul>
<li>Chasing the puck.</li>
<li>Reaching with the stick.</li>
<li>Standing up.</li>
<li>Diving in too early.</li>
</ul>
<h3 id="coach-focus-2" class="toc-header"><a class="toc-anchor" href="#coach-focus-2">¶</a> Coach Focus</h3>
<p>Good defenders stay patient and make attackers work for every metre.</p>
<h1 id="activity-4-regaining-possession" class="toc-header"><a class="toc-anchor" href="#activity-4-regaining-possession">¶</a> Activity 4 – Regaining Possession</h1>
<h2 id="objective-3" class="toc-header"><a class="toc-anchor" href="#objective-3">¶</a> Objective</h2>
<p>Learn how to regain possession under control.</p>
<h2 id="explain-3" class="toc-header"><a class="toc-anchor" href="#explain-3">¶</a> Explain</h2>
<p>There are two good opportunities to regain possession.</p>
<h3 id="early-pressure" class="toc-header"><a class="toc-anchor" href="#early-pressure">¶</a> Early Pressure</h3>
<p>Pressure the attacker before they are ready.</p>
<h3 id="controlled-pressure" class="toc-header"><a class="toc-anchor" href="#controlled-pressure">¶</a> Controlled Pressure</h3>
<p>Slow the attacker down first, then regain possession when the opportunity comes.</p>
<h2 id="when-to-use-3" class="toc-header"><a class="toc-anchor" href="#when-to-use-3">¶</a> When to Use</h2>
<ul>
<li>The attacker loses control.</li>
<li>Support is arriving.</li>
<li>The attacker has limited options.</li>
</ul>
<h3 id="coaching-cues-3" class="toc-header"><a class="toc-anchor" href="#coaching-cues-3">¶</a> Coaching Cues</h3>
<ul>
<li>Stay patient.</li>
<li>Stay strong.</li>
<li>Win it clean.</li>
<li>Protect first.</li>
</ul>
<h3 id="common-errors-3" class="toc-header"><a class="toc-anchor" href="#common-errors-3">¶</a> Common Errors</h3>
<ul>
<li>Diving in too early.</li>
<li>Reaching for the puck.</li>
<li>Overcommitting.</li>
<li>Forgetting to protect the goal.</li>
</ul>
<h3 id="coach-focus-3" class="toc-header"><a class="toc-anchor" href="#coach-focus-3">¶</a> Coach Focus</h3>
<p>Players should regain possession without sacrificing good defensive position. Encourage patience, good body position, and clean technique rather than rushing to win the puck.</p>
<h1 id="activity-5-drills" class="toc-header"><a class="toc-anchor" href="#activity-5-drills">¶</a> Activity 5 – Drills</h1>
<h2 id="objective-4" class="toc-header"><a class="toc-anchor" href="#objective-4">¶</a> Objective</h2>
<p>Apply today's attacking and defensive principles through repetition.</p>
<h3 id="drill-1-flick-and-chase" class="toc-header"><a class="toc-anchor" href="#drill-1-flick-and-chase">¶</a> Drill 1 – Flick and Chase</h3>
<p>Players complete two lengths by flicking the puck into open space and immediately chasing it.</p>
<p><strong>Focus</strong></p>
<ul>
<li>Flick accurately.</li>
<li>Chase immediately.</li>
<li>Arrive first.</li>
</ul>
<h3 id="drill-2-braid" class="toc-header"><a class="toc-anchor" href="#drill-2-braid">¶</a> Drill 2 – Braid</h3>
<p>Three players swim diagonally across a channel, curling and passing before surfacing.</p>
<p><strong>Focus</strong></p>
<ul>
<li>Movement.</li>
<li>Timing.</li>
<li>Passing.</li>
<li>Communication.</li>
</ul>
<h3 id="drill-3-3-vs-3-possession" class="toc-header"><a class="toc-anchor" href="#drill-3-3-vs-3-possession">¶</a> Drill 3 – 3 vs 3 Possession</h3>
<p>Teams compete to complete consecutive passes without losing possession.</p>
<p><strong>Focus</strong></p>
<ul>
<li>Support.</li>
<li>Passing.</li>
<li>Protecting possession.</li>
<li>Patience.</li>
</ul>
<h3 id="drill-4-recovery-after-a-flick" class="toc-header"><a class="toc-anchor" href="#drill-4-recovery-after-a-flick">¶</a> Drill 4 – Recovery After a Flick</h3>
<p>One attacker flicks the puck past the defender. The defender rotates, recovers, and re-engages from a strong position.</p>
<p><strong>Focus</strong></p>
<ul>
<li>Rotate.</li>
<li>Recover.</li>
<li>Stay low.</li>
<li>Don't reach.</li>
</ul>
<h3 id="drill-5-1-vs-1-engagement" class="toc-header"><a class="toc-anchor" href="#drill-5-1-vs-1-engagement">¶</a> Drill 5 – 1 vs 1 Engagement</h3>
<p>Attackers attempt to beat the defender and score.</p>
<p>Defenders protect the goal and regain possession.</p>
<p><strong>Focus</strong></p>
<ul>
<li>Protect the puck.</li>
<li>Beat the defender.</li>
<li>Protect the goal.</li>
<li>Win possession.</li>
</ul>
<h3 id="drill-6-reacting-to-direction-changes" class="toc-header"><a class="toc-anchor" href="#drill-6-reacting-to-direction-changes">¶</a> Drill 6 – Reacting to Direction Changes</h3>
<p>Attackers change direction while defenders stay square and move with them.</p>
<p><strong>Focus</strong></p>
<ul>
<li>Stay square.</li>
<li>Rotate.</li>
<li>Stay low.</li>
<li>Don't reach.</li>
</ul>
<h1 id="game" class="toc-header"><a class="toc-anchor" href="#game">¶</a> Game</h1>
<h2 id="objective-5" class="toc-header"><a class="toc-anchor" href="#objective-5">¶</a> Objective</h2>
<p>Apply today's attacking and defensive principles during game play.</p>
<h3 id="coach-focus-4" class="toc-header"><a class="toc-anchor" href="#coach-focus-4">¶</a> Coach Focus</h3>
<p>Encourage players to:</p>
<ul>
<li>Apply attacking pressure with support.</li>
<li>Keep possession when the attack isn't ready.</li>
<li>Stay between the puck and the goal.</li>
<li>Slow the attack before trying to win possession.</li>
<li>Win possession under control.</li>
</ul>
<p>Allow players to make their own decisions and learn through the game.</p>
<h1 id="wrap-up" class="toc-header"><a class="toc-anchor" href="#wrap-up">¶</a> Wrap-up</h1>
<p>Ask players:</p>
<ul>
<li>When did attacking pressure work well?</li>
<li>When was keeping possession the better option?</li>
<li>What helped you defend successfully?</li>
<li>How did good positioning help you win the puck?</li>
</ul>
<p>Finish with:</p>
<blockquote>
<p>Great players know when to attack, when to keep possession, and when to defend patiently.</p>
</blockquote>
<h1 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h1>
<p>Players can:</p>
<ul>
<li>Apply attacking pressure effectively.</li>
<li>Know when to keep possession.</li>
<li>Defend using good body position.</li>
<li>Slow the attack before trying to win possession.</li>
<li>Win the puck back under control.</li>
<li>Apply attacking and defensive principles during game play.</li>
</ul>
