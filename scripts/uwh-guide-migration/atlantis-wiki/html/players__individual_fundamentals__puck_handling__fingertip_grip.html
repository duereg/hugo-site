<p>The Fingertip Grip for holding an UWH <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> is a modified version of the <a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page">standard grip</a> and is used during certain specific maneuvers where more wrist flexibility is desirable. Instead of the handle being pressed tight to the <a href="/players" class="is-internal-link is-valid-page">player's</a> palm, the stick is held away from the palm and gripped only by the fingers and thumb. This allows for the stick to be maneuvered with the help of the fingers in addition to the wrist and can allow for a wider range of motion.&nbsp;</p>
<p>Having a tie looped around the handle and the middle finger near the first knuckle as described in the Standard Grip makes this grip much easier to move in and out of.</p>

<h1 id="when-to-use" class="toc-header"><a class="toc-anchor" href="#when-to-use">¶</a> When to Use</h1>
<p>The Fingertip Grip has far fewer uses than the <a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page">standard grip</a>&nbsp;but it is very helpful in conducting maneuvers such as the <a href="/players/individual_fundamentals/puck_handling/infinity_swerve" class="is-internal-link is-valid-page">infinity swerve</a> that need the additional range of motion.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Aside from portions of the Infinity Swerve, the Fingertip Grip isn't usually appropriate. The overall grip strength is much weaker when trying to perform any <a href="/players/individual_fundamentals/puck_handling" class="is-internal-link is-valid-page">puck handling</a> or <a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page">passing </a>maneuvers. Trying to stick battle for the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> when using the Fingertip Grip is not recommended.&nbsp;</p>
