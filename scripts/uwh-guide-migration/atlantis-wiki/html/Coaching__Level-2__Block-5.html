<h2 id="block-goal" class="toc-header"><a class="toc-anchor" href="#block-goal">¶</a> Block Goal</h2>
<p>Introduce basic team positions, game starts and restarts, and the core rules needed to confidently participate in structured games.</p>
<h3 id="key-outcomes" class="toc-header"><a class="toc-anchor" href="#key-outcomes">¶</a> Key Outcomes</h3>
<p>By the end of this block, players should be able to:</p>
<ul>
<li>Understand the role of each position.</li>
<li>Hold their position during game play.</li>
<li>Understand basic game starts and restarts.</li>
<li>Recognise common fouls.</li>
<li>Apply the skills learned throughout Level 2 in a structured game.</li>
</ul>

<h1 id="activity-1-team-positions" class="toc-header"><a class="toc-anchor" href="#activity-1-team-positions">¶</a> Activity 1 – Team Positions</h1>
<h2 id="objective" class="toc-header"><a class="toc-anchor" href="#objective">¶</a> Objective</h2>
<p>Introduce the basic responsibilities of each position.</p>
<h2 id="explain" class="toc-header"><a class="toc-anchor" href="#explain">¶</a> Explain</h2>
<p>Every player has a role.</p>
<p>Understanding your position helps the team stay organised, support one another, and create attacking and defensive opportunities.</p>
<h3 id="forwards" class="toc-header"><a class="toc-anchor" href="#forwards">¶</a> Forwards</h3>
<ul>
<li>Play ahead of the puck.</li>
<li>Create scoring opportunities.</li>
<li>Apply attacking pressure.</li>
</ul>
<h3 id="midfield-centre-wings" class="toc-header"><a class="toc-anchor" href="#midfield-centre-wings">¶</a> Midfield (Centre &amp; Wings)</h3>
<ul>
<li>Connect attack and defence.</li>
<li>Provide passing options.</li>
<li>Maintain team shape.</li>
<li>Support both forwards and the back.</li>
</ul>
<h3 id="back" class="toc-header"><a class="toc-anchor" href="#back">¶</a> Back</h3>
<ul>
<li>Protect the goal.</li>
<li>Support teammates.</li>
<li>Organise the defence.</li>
</ul>
<h2 id="team-formations" class="toc-header"><a class="toc-anchor" href="#team-formations">¶</a> Team Formations</h2>
<p>Every club may play a different formation.</p>
<p>Teach the formation used by your club so players can transition easily into club games.</p>
<p>For more information, see <strong><a href="/teams/formations" class="is-internal-link is-valid-page">Team Formations</a></strong>.</p>
<h3 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h3>
<ul>
<li>Know your role.</li>
<li>Hold your position.</li>
<li>Stay connected.</li>
<li>Support your teammates.</li>
</ul>
<h3 id="common-errors" class="toc-header"><a class="toc-anchor" href="#common-errors">¶</a> Common Errors</h3>
<ul>
<li>Everyone following the puck.</li>
<li>Leaving your position too early.</li>
<li>Forgetting defensive responsibilities.</li>
</ul>
<h3 id="coach-focus" class="toc-header"><a class="toc-anchor" href="#coach-focus">¶</a> Coach Focus</h3>
<p>Players should understand their role while remaining flexible enough to support the play when needed.</p>
<h1 id="activity-2-game-starts-restarts" class="toc-header"><a class="toc-anchor" href="#activity-2-game-starts-restarts">¶</a> Activity 2 – Game Starts &amp; Restarts</h1>
<h2 id="objective-1" class="toc-header"><a class="toc-anchor" href="#objective-1">¶</a> Objective</h2>
<p>Understand how play begins and restarts.</p>
<h2 id="explain-1" class="toc-header"><a class="toc-anchor" href="#explain-1">¶</a> Explain</h2>
<h3 id="the-strike" class="toc-header"><a class="toc-anchor" href="#the-strike">¶</a> The Strike</h3>
<p>The game begins with players on their respective walls.</p>
<p>On the signal:</p>
<ul>
<li>Forwards sprint for the puck.</li>
<li>Midfield players provide immediate support.</li>
<li>The back prepares to defend and support the next phase of play.</li>
</ul>
<p>A strong first strike often creates the first attacking opportunity.</p>
<h3 id="advantage-puck" class="toc-header"><a class="toc-anchor" href="#advantage-puck">¶</a> Advantage Puck</h3>
<p>When a foul is called:</p>
<ul>
<li>Play stops.</li>
<li>Players surface.</li>
<li>The non-offending team receives the advantage puck.</li>
<li>The defending team retreats 3 metres.</li>
<li>Play resumes when the attacking team touches the puck.</li>
</ul>
<h3 id="defending-an-advantage-puck" class="toc-header"><a class="toc-anchor" href="#defending-an-advantage-puck">¶</a> Defending an Advantage Puck</h3>
<p>When defending:</p>
<ul>
<li>Stay at least 3 metres away until the puck is live.</li>
<li>Apply pressure once play restarts.</li>
<li>Support teammates and recover loose pucks.</li>
<li>Stay connected.</li>
</ul>
<h3 id="coaching-cues-1" class="toc-header"><a class="toc-anchor" href="#coaching-cues-1">¶</a> Coaching Cues</h3>
<ul>
<li>React quickly.</li>
<li>Stay organised.</li>
<li>Know your role.</li>
<li>Support early.</li>
</ul>
<h3 id="common-errors-1" class="toc-header"><a class="toc-anchor" href="#common-errors-1">¶</a> Common Errors</h3>
<ul>
<li>Moving before the puck is live.</li>
<li>Slow reactions.</li>
<li>Poor positioning after the restart.</li>
</ul>
<h3 id="coach-focus-1" class="toc-header"><a class="toc-anchor" href="#coach-focus-1">¶</a> Coach Focus</h3>
<p>Players should understand their role during every restart and react quickly once play resumes.</p>
<h1 id="activity-3-core-rules" class="toc-header"><a class="toc-anchor" href="#activity-3-core-rules">¶</a> Activity 3 – Core Rules</h1>
<h2 id="objective-2" class="toc-header"><a class="toc-anchor" href="#objective-2">¶</a> Objective</h2>
<p>Recognise the most common fouls in Underwater Hockey.</p>
<h2 id="explain-2" class="toc-header"><a class="toc-anchor" href="#explain-2">¶</a> Explain</h2>
<p>Introduce the rules players will encounter most often during games.</p>
<h3 id="illegal-advancement" class="toc-header"><a class="toc-anchor" href="#illegal-advancement">¶</a> Illegal Advancement</h3>
<p>Moving the puck with any part of the body or equipment other than the stick.</p>
<h3 id="obstruction" class="toc-header"><a class="toc-anchor" href="#obstruction">¶</a> Obstruction</h3>
<p>Using the body to block or prevent an opponent from playing the puck.</p>
<h3 id="free-arm" class="toc-header"><a class="toc-anchor" href="#free-arm">¶</a> Free Arm</h3>
<p>Using the free arm to push, pull, hold, or grab an opponent.</p>
<h3 id="stick-infringement" class="toc-header"><a class="toc-anchor" href="#stick-infringement">¶</a> Stick Infringement</h3>
<p>Making illegal contact with an opponent using the stick.</p>
<p>Always tackle from above and avoid sweeping underneath an opponent's stick or hand.</p>
<h3 id="dangerous-play" class="toc-header"><a class="toc-anchor" href="#dangerous-play">¶</a> Dangerous Play</h3>
<p>Unsafe or reckless actions that place another player at risk.</p>
<h3 id="coaching-cues-2" class="toc-header"><a class="toc-anchor" href="#coaching-cues-2">¶</a> Coaching Cues</h3>
<ul>
<li>Stick only.</li>
<li>Keep your free arm clear.</li>
<li>Play the puck.</li>
<li>Play safely.</li>
</ul>
<h3 id="common-errors-2" class="toc-header"><a class="toc-anchor" href="#common-errors-2">¶</a> Common Errors</h3>
<ul>
<li>Gloving the puck.</li>
<li>Blocking opponents.</li>
<li>Using the free arm.</li>
<li>Dangerous stick contact.</li>
</ul>
<h3 id="coach-focus-2" class="toc-header"><a class="toc-anchor" href="#coach-focus-2">¶</a> Coach Focus</h3>
<p>Encourage players to recognise fouls and develop safe playing habits from the beginning.</p>
<h1 id="activity-4-structured-game-play" class="toc-header"><a class="toc-anchor" href="#activity-4-structured-game-play">¶</a> Activity 4 – Structured Game Play</h1>
<h2 id="objective-3" class="toc-header"><a class="toc-anchor" href="#objective-3">¶</a> Objective</h2>
<p>Combine the skills learned throughout Level 2 during structured game play.</p>
<h2 id="explain-3" class="toc-header"><a class="toc-anchor" href="#explain-3">¶</a> Explain</h2>
<p>Players should now begin to combine individual skills, teamwork, and game awareness.</p>
<p>Focus on:</p>
<ul>
<li>Holding your position.</li>
<li>Supporting teammates.</li>
<li>Applying attacking and defensive principles.</li>
<li>Following the rules.</li>
<li>Making good decisions.</li>
</ul>
<h3 id="coaching-cues-3" class="toc-header"><a class="toc-anchor" href="#coaching-cues-3">¶</a> Coaching Cues</h3>
<ul>
<li>Hold your position.</li>
<li>Support the play.</li>
<li>Stay connected.</li>
<li>Play by the rules.</li>
</ul>
<h3 id="common-errors-3" class="toc-header"><a class="toc-anchor" href="#common-errors-3">¶</a> Common Errors</h3>
<ul>
<li>Following the puck.</li>
<li>Leaving your position unnecessarily.</li>
<li>Forgetting to support teammates.</li>
<li>Giving away unnecessary fouls.</li>
</ul>
<h3 id="coach-focus-3" class="toc-header"><a class="toc-anchor" href="#coach-focus-3">¶</a> Coach Focus</h3>
<p>Encourage players to think about their role within the team rather than focusing only on the puck.</p>
<h1 id="game" class="toc-header"><a class="toc-anchor" href="#game">¶</a> Game</h1>
<h2 id="objective-4" class="toc-header"><a class="toc-anchor" href="#objective-4">¶</a> Objective</h2>
<p>Apply all Level 2 skills during structured game play.</p>
<h3 id="coach-focus-4" class="toc-header"><a class="toc-anchor" href="#coach-focus-4">¶</a> Coach Focus</h3>
<p>Encourage players to:</p>
<ul>
<li>Hold their position.</li>
<li>Support teammates.</li>
<li>Apply attacking and defensive principles.</li>
<li>Stay connected.</li>
<li>Play within the rules.</li>
<li>Make good decisions.</li>
</ul>
<p>Allow the game to flow with minimal interruptions, stepping in only to reinforce key learning points or correct unsafe play.</p>
<h1 id="wrap-up" class="toc-header"><a class="toc-anchor" href="#wrap-up">¶</a> Wrap-up</h1>
<p>Ask players:</p>
<ul>
<li>Did you understand your role?</li>
<li>When did holding your position help the team?</li>
<li>Which rule did you find most challenging?</li>
<li>What decision helped your team the most?</li>
</ul>
<p>Finish with:</p>
<blockquote>
<p>Great teams are built on players who understand their role, support one another, and make good decisions.</p>
</blockquote>
<h1 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h1>
<p>Players can:</p>
<ul>
<li>Hold a basic team position.</li>
<li>Understand the formation used by their club.</li>
<li>Apply game starts and restarts correctly.</li>
<li>Recognise common fouls.</li>
<li>Support teammates during structured game play.</li>
<li>Apply Level 2 skills confidently during a game.</li>
</ul>
