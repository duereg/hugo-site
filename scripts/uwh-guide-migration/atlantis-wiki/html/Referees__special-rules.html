<h2 id="when-to-apply-it" class="toc-header"><a class="toc-anchor" href="#when-to-apply-it">¶</a> When to Apply It</h2>
<p>If a referee observes an infringement but stopping play would be <strong>detrimental to the infringed team</strong>, the referee allows play to continue. This is "playing advantage."</p>
<blockquote>
<p>Think of it as: <em>"Would stopping play actually help the team that was fouled, or would it take away an opportunity they already have?"</em></p>
</blockquote>
<p>Advantage is played until the infringed team has reached an <strong>equivalent playing situation</strong> to what they would have had without the infringement.</p>
<hr>
<h2 id="losing-the-advantage" class="toc-header"><a class="toc-anchor" href="#losing-the-advantage">¶</a> Losing the Advantage</h2>
<p>If the advantage is lost before that equivalent situation is reached, the referee may award a <strong>delayed penalty</strong> at the location of the original infringement.</p>
<hr>
<h2 id="major-infringement-advantage" class="toc-header"><a class="toc-anchor" href="#major-infringement-advantage">¶</a> Major Infringement + Advantage</h2>
<p>When a <strong>major infringement</strong> occurs but advantage is being played:</p>
<ul>
<li>The referee may still send the infringing player to the penalty box at the <strong>next stop in play</strong>.</li>
<li>Play restarts according to that stop (not from the location of the delayed penalty).</li>
</ul>
<hr>
<h2 id="signalling-advantage-in-play" class="toc-header"><a class="toc-anchor" href="#signalling-advantage-in-play">¶</a> Signalling Advantage in Play</h2>
<p>When a referee has seen an infringement but is letting play continue under the advantage rule, they signal this to reduce player frustration and prevent retaliation.</p>
<p><strong>Signal (above surface):</strong> Index finger extended from a fist, hand moved in a circular motion parallel to the water surface.</p>
<p>This tells players: <em>"I saw it — advantage is being played."</em></p>
<hr>
<h2 id="over-cautious-behaviour" class="toc-header"><a class="toc-anchor" href="#over-cautious-behaviour">¶</a> Over-Cautious Behaviour</h2>
<p>Do <strong>not</strong> apply the advantage rule mechanically. Assess each situation:</p>
<ul>
<li>Is the infringed team actually in a better position continuing than they would be with a restart?</li>
<li>If not, stop play and restart appropriately.</li>
</ul>
<h1 id="delay-of-game" class="toc-header"><a class="toc-anchor" href="#delay-of-game">¶</a> Delay of Game</h1>
<p>Any play that is <strong>meant to</strong> delay or stall, or <strong>has the effect of</strong> delaying or stalling the game, may be considered foul play.</p>
<hr>
<h2 id="corner-rule" class="toc-header"><a class="toc-anchor" href="#corner-rule">¶</a> Corner Rule</h2>
<h3 id="what-is-the-corner" class="toc-header"><a class="toc-anchor" href="#what-is-the-corner">¶</a> What Is the Corner?</h3>
<p>The corner is the area bounded by the side and end walls, defined by a <strong>1 m radius arc</strong> at each of the four wall intersections. Once the puck touches the arc, <strong>the corner rule applies</strong>.</p>
<h3 id="the-infringement" class="toc-header"><a class="toc-anchor" href="#the-infringement">¶</a> The Infringement</h3>
<p><strong>Two players from the same team hold the puck in a corner in succession</strong>, with <strong>neither player</strong>:</p>
<ul>
<li>Making an obvious attempt to move the puck out of the corner, <strong>or</strong></li>
<li>Losing possession to an opponent.</li>
</ul>
<h3 id="penalties" class="toc-header"><a class="toc-anchor" href="#penalties">¶</a> Penalties</h3>
<div class="table-container"><table>
<thead>
<tr>
<th>Infringement</th>
<th>Penalty</th>
</tr>
</thead>
<tbody>
<tr>
<td>1st offence</td>
<td>Team caution + Advantage puck to non-offending team</td>
</tr>
<tr>
<td>2nd and subsequent</td>
<td>1-minute time penalty on the <strong>second</strong> player to hold the puck + Advantage puck</td>
</tr>
</tbody>
</table></div>
<p><strong>Signal:</strong> One hand placed on the opposite shoulder, arm horizontal, elbow pointing at the infringing player.</p>
<hr>
<h2 id="flicking-the-puck-out-of-bounds" class="toc-header"><a class="toc-anchor" href="#flicking-the-puck-out-of-bounds">¶</a> Flicking the Puck Out of Bounds</h2>
<p>A player who <strong>flicks</strong> the puck out of bounds is penalised for delay of game.</p>
<h3 id="penalties-1" class="toc-header"><a class="toc-anchor" href="#penalties-1">¶</a> Penalties</h3>
<div class="table-container"><table>
<thead>
<tr>
<th>Infringement</th>
<th>Penalty</th>
</tr>
</thead>
<tbody>
<tr>
<td>1st offence</td>
<td>Team caution + Advantage puck</td>
</tr>
<tr>
<td>2nd and subsequent</td>
<td>1-minute time penalty on the offending player</td>
</tr>
</tbody>
</table></div>
<h3 id="exceptions-no-penalty" class="toc-header"><a class="toc-anchor" href="#exceptions-no-penalty">¶</a> Exceptions (no penalty)</h3>
<ul>
<li>If the puck was deflected out by an <strong>opponent's</strong> stick or body after being flicked → no penalty.</li>
<li>If deflected by a <strong>teammate's</strong> stick or body, no penalty — unless the referee judges it was <strong>intentional</strong> to delay the game.</li>
</ul>
<blockquote>
<p>If one or more players from the offending team are already serving penalty time, the referee may reasonably assume an out-of-bounds deflection was intentional.</p>
</blockquote>
<h3 id="intentional-teammate-deflection" class="toc-header"><a class="toc-anchor" href="#intentional-teammate-deflection">¶</a> Intentional Teammate Deflection</h3>
<p>If the team already has a caution and the deflection was intentional:</p>
<ul>
<li>The player who <strong>deflected</strong> the puck gets the 1-minute penalty.</li>
<li>The player who flicked the puck does <strong>not</strong> receive a penalty.</li>
</ul>
<hr>
<h2 id="general-delay-of-game" class="toc-header"><a class="toc-anchor" href="#general-delay-of-game">¶</a> General Delay of Game</h2>
<p>Any other action intended to slow down the game may also be penalised at the referee's discretion, including standing on the pool bottom (Rule 16.3.2) and refusing to restart play promptly.</p>
