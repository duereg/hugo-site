</div><p>
This block teaches players the ability to win, protect, and recover the puck under pressure using legal, controlled contesting techniques.
</p><div>

</div><p>
This block is split into <b>Individual Contest Mechanics</b> and <b>Team Contest Behaviours</b> to clearly separate skill execution from game application.
</p><div>

</div><hr><div>

</div><h2 id="principles-of-defending" class="toc-header"><a class="toc-anchor" href="#principles-of-defending">¶</a> Principles of Defending</h2><div>

</div><ul>
  <li>Strong body position, low to the ground</li>
  <li>Square shoulders to the puck</li>
  <li>Apply pressure without over-committing</li>
  <li>Think: the puck will not go through my body — it can go around, but not through</li>
</ul><div>

</div><hr><div>

</div><h2 id="session-flow" class="toc-header"><a class="toc-anchor" href="#session-flow">¶</a> Session Flow</h2><div>

</div><h3 id="individual-contest-mechanics" class="toc-header"><a class="toc-anchor" href="#individual-contest-mechanics">¶</a> Individual Contest Mechanics</h3><div>

</div><section>
  <h4 id="h-1-absorb-and-stabilise" class="toc-header"><a class="toc-anchor" href="#h-1-absorb-and-stabilise">¶</a> 1. Absorb and Stabilise</h4>
  <ul>
    <li>Absorb forward pressure without losing control</li>
    <li>Redirect momentum instead of colliding</li>
    <li>Maintain balance and stick position</li>
  </ul>

  <p><strong>Linked Drills:</strong>
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-absorb-1v1" class="is-internal-link is-valid-page">1v1 Absorb Challenge</a>,
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-absorb-stationary" class="is-internal-link is-valid-page">Stationary Absorb</a>
  </p>

  <p><strong>Video:</strong>
    <a href="/en/players/tackling_maneuvers/absorbing" class="is-internal-link is-valid-page">Absorb and Stabilise</a>
  </p>
</section><div>

</div><section>
  <h4 id="h-2-tackle-mechanics" class="toc-header"><a class="toc-anchor" href="#h-2-tackle-mechanics">¶</a> 2. Tackle Mechanics</h4>
  <ul>
    <li>Execute stick-hand and free-hand tackles</li>
    <li>Play the puck, not the player</li>
    <li>Stay strong through contact</li>
  </ul>

  <p><strong>Linked Drills:</strong>
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-tackle-stick-hand" class="is-internal-link is-valid-page">Controlled Stick-Hand Tackle</a>,
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-tackle-free-hand" class="is-internal-link is-valid-page">Controlled Free-Hand Tackle</a>,
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-tackle-combo" class="is-internal-link is-valid-page">Combo Tackle Sequence</a>
  </p>

  <p><strong>Video:</strong>
    <a href="/en/players/tackling_maneuvers/tackle_1" class="is-internal-link is-valid-page">Free-Hand Tackle Mechanics</a>
    <a href="/en/players/tackling_maneuvers/tackle_2" class="is-internal-link is-valid-page">Stick-Hand Tackle Mechanics</a>
  </p>
</section><div>

</div><section>
  <h4 id="h-3-back-pick-timing" class="toc-header"><a class="toc-anchor" href="#h-3-back-pick-timing">¶</a> 3. Back-Pick Timing</h4>
  <ul>
    <li>Track closely from behind</li>
    <li>Match speed before attempting</li>
    <li>Time the steal without fouling</li>
  </ul>

  <p><strong>Linked Drill:</strong>
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-back-pick-chase" class="is-internal-link is-valid-page">Back-Pick Chase Drill</a>
  </p>

  <p><strong>Video:</strong>
    <a href="/en/players/tackling_maneuvers/back-picks" class="is-internal-link is-valid-page">Back-Picks</a>
  </p>
</section><div>

</div><section>
  <h4 id="h-4-knock-down-control" class="toc-header"><a class="toc-anchor" href="#h-4-knock-down-control">¶</a> 4. Knock-Down Control</h4>
  <ul>
    <li>Intercept moving pucks cleanly</li>
    <li>Control the landing space</li>
    <li>Secure possession quickly</li>
  </ul>

  <p><strong>Linked Drills:</strong>
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-intercept-static" class="is-internal-link is-valid-page">Static Interception</a>,
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-intercept-landing-zone" class="is-internal-link is-valid-page">Landing Zone Control</a>,
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-intercept-pass" class="is-internal-link is-valid-page">Intercept the Pass</a>
  </p>

  <p><strong>Video:</strong>
    <a href="/en/players/tackling_maneuvers/knock-downs" class="is-internal-link is-valid-page">Knock-Downs</a>
  </p>
</section><div>

</div><hr><div>

</div><h3 id="team-contest-behaviours" class="toc-header"><a class="toc-anchor" href="#team-contest-behaviours">¶</a> Team Contest Behaviours</h3><div>

</div><section>
  <h4 id="h-5-breakaway-containment" class="toc-header"><a class="toc-anchor" href="#h-5-breakaway-containment">¶</a> 5. Breakaway Containment</h4>
  <ul>
    <li>Defender closes space using correct angle</li>
    <li>Contain first, do not dive in early</li>
    <li>Guide attacker into low-risk areas</li>
    <li>Recover into support after engagement</li>
  </ul>

  <p><strong>Linked Drills:</strong>
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-breakaway-rotation" class="is-internal-link is-valid-page">Breakaway Containment Rotation</a>,
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-1#l3-drill-breakaway-redirect" class="is-internal-link is-valid-page">Chase and Redirect</a>
  </p>

  <p><strong>Link:</strong> Applies contest control in high-risk situations.</p>
</section><div>

</div><section>
  <h4 id="h-6-game-integration" class="toc-header"><a class="toc-anchor" href="#h-6-game-integration">¶</a> 6. Game Integration</h4>
  <ul>
    <li>Apply contest skills in live play</li>
    <li>Combine individual technique with team behaviour</li>
    <li>Reinforce recovery into structure</li>
  </ul>
  <p>Short Game Play</p>
</section><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><ul>
  <li>Executes clean individual contest techniques</li>
  <li>Wins possession without fouling</li>
  <li>Maintains control under pressure</li>
  <li>Supports contests as a teammate</li>
  <li>Recovers immediately into team structure</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-principles" class="toc-header"><a class="toc-anchor" href="#key-principles">¶</a> Key Principles</h2><div>

</div><section>
  <h3 id="individual-mechanics" class="toc-header"><a class="toc-anchor" href="#individual-mechanics">¶</a> Individual Mechanics</h3>
  <ul>
    <li>Play the puck, not the player</li>
    <li>Absorb and stay balanced</li>
    <li>Secure possession immediately</li>
  </ul>
</section><div>

</div><section>
  <h3 id="team-behaviour" class="toc-header"><a class="toc-anchor" href="#team-behaviour">¶</a> Team Behaviour</h3>
  <ul>
    <li>Support the contest</li>
    <li>Stay connected</li>
    <li>Recover into structure</li>
  </ul>
</section><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Absorb, don’t collide</li>
  <li>Puck only</li>
  <li>Win it clean</li>
  <li>Support early</li>
  <li>Recover quickly</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><strong>Over-committing in contest</strong> – Control first</li>
  <li><strong>Isolated play after win</strong> – Reconnect to team</li>
  <li><strong>Late support</strong> – Move earlier</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Ensure safe contact at all times</li>
  <li>Reinforce technique before intensity</li>
  <li>Stop play when structure breaks</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h2><div>

</div><ul>
  <li>Add pressure and speed</li>
  <li>Introduce multiple players in contest</li>
  <li>Reduce time and space</li>
</ul><div>

</div><h2 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h2><div>

</div><ul>
  <li>Isolate individual mechanics</li>
  <li>Reduce pressure</li>
  <li>Increase spacing</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
