ass="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>At regular practices at many pools there are no physical <a href="/game/gear-setup/walls" class="is-internal-link is-valid-page">barriers</a> at the edge of a playing area. Because of this the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> will often go <a href="/game/fouls/out_of_bounds" class="is-internal-link is-valid-page">out of bounds</a>. The first thing teams have to determine is what exactly is the edge of their playing area. If there is a tile line or some other sort of visible marker, that is ideal. If no such marker exists, teams could lay down a chain or something similar along the boundary.&nbsp;</p>
<p>If the marker is something the puck can easily cross, an effective way of keeping the play in-bounds without having to stop frequently for out of bounds fouls, is to enforce that if the puck crosses the line, players must pull the puck straight back into the playing area, then may continue play. Players are not allowed to advance the puck forwards or backwards when it is out of bounds, nor engage the opponent. This ensures players do not get any advantage from going out of bounds.&nbsp;</p>
<p>If an out of bounds area is a slope down into a dive well, this rule can be used as long as the puck does not slide all the way down the slope. If this occurs, the play should be stopped and the puck retrieved by one player.&nbsp;</p>
<p>&nbsp;</p>
<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">

  <p><u>OUT OF BOUNDS RULES</u></p>
  <ul>
    <li>IF THE PUCK GOES OUT OF BOUNDS, PLAYERS MAY PULL IT STRAIGHT BACK INTO THE PLAYING AREA</li>
    <li>OTHER PAYERS MAY NOT ENGAGE WITH THE PUCK UNTIL IT HAS BEEN PULLED BACK INTO THE PLAYING AREA</li>
    <li>THIS METHOD REDUCES STOPPAGES FOR OUT OF BOUNDS FOULS</li>

    <div>
</div></ul></div></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
