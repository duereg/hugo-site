<p>Obstruction is when a player interferes with an opponent's accessibility to the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck </a>or actively uses their body to prevent the advancement of a player.</p>
<p>Screening or shepherding is one of three subsets of the obstruction foul. This occurs if two players (one of which has the puck) who are on the same team are swimming beside each other and the player who does not have the puck is blocking the opponents access to the puck. The best way for the player who is not in possession of the puck to avoid this call against them is to move a bit further from their teammate or leave some space underneath themselves so that an opponent going for the puck could swim under them. This is not an ideal position to be in while playing, so players should only do this if they may be screening.&nbsp;</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>Obstruction is signaled by grabbing both wrists and holing the arms above the surface of the water, then moving the hands in and out from the chest.&nbsp;</p>
<p>As with most fouls, this should only be called if it affects the outcome of the play. Although any player blocking access to the puck is a foul, it should only be called if an opponent tries to get to the puck and fails because of that player blocking them. If not opponents attempt to get to the puck, the <a href="/game/fouls/advantage-rule" class="is-internal-link is-valid-page">advantage rule</a> should be followed and the play should continue.&nbsp;</p>
