</div><p>Level 2 assessment is game based.</p><div>

</div><p>The player must demonstrate the following during live scrimmage under normal game conditions.</p><div>

</div><p>Assessment is continuous and observational.</p><div>

</div><hr><div>

</div><h2 id="h-1-rules-understanding" class="toc-header"><a class="toc-anchor" href="#h-1-rules-understanding">¶</a> 1. Rules Understanding</h2><div>

</div><ul>
<li>Stops immediately on signal.</li>
<li>Lines up correctly for restarts.</li>
<li>Recognizes common fouls (obstruction, illegal advancement, shielding, stick infringement).</li>
<li>Understands free puck procedure.</li>
<li>Resets correctly after goals.</li>
<li>Substitutes safely and legally.</li>
</ul><div>

</div><hr><div>

</div><h2 id="h-2-puck-control" class="toc-header"><a class="toc-anchor" href="#h-2-puck-control">¶</a> 2. Puck Control</h2><div>

</div><ul>
<li>Swims forward with puck under control.</li>
<li>Changes direction while maintaining control.</li>
<li>Flicks to space and recovers possession.</li>
<li>Maintains control under light pressure.</li>
</ul><div>

</div><hr><div>

</div><h2 id="h-3-dive-selection-movement" class="toc-header"><a class="toc-anchor" href="#h-3-dive-selection-movement">¶</a> 3. Dive Selection &amp; Movement</h2><div>

</div><ul>
<li>Uses kelp dive for stationary puck.</li>
<li>Uses duck dive when play is moving.</li>
<li>Surfaces early to reset when out of position.</li>
<li>Re-enters play with awareness and timing.</li>
</ul><div>

</div><hr><div>

</div><h2 id="h-4-simple-decisions" class="toc-header"><a class="toc-anchor" href="#h-4-simple-decisions">¶</a> 4. Simple Decisions</h2><div>

</div><ul>
<li>Looks up before acting.</li>
<li>Chooses appropriately between pass and carry.</li>
<li>Adjusts decision based on support position.</li>
<li>Avoids hesitation or automatic play.</li>
</ul><div>

</div><hr><div>

</div><h2 id="h-5-support-connection" class="toc-header"><a class="toc-anchor" href="#h-5-support-connection">¶</a> 5. Support &amp; Connection</h2><div>

</div><ul>
<li>Moves after passing.</li>
<li>Stays available as a support option.</li>
<li>Maintains effective support distance.</li>
<li>Creates width and depth naturally (no structure required).</li>
</ul><div>

</div><hr><div>

</div><h2 id="h-6-pressure-defending-attacking" class="toc-header"><a class="toc-anchor" href="#h-6-pressure-defending-attacking">¶</a> 6. Pressure (Defending &amp; Attacking)</h2><div>

</div><ul>
<li>Closes space quickly as first defender.</li>
<li>Applies controlled pressure without over-committing.</li>
<li>Recovers quickly when out of position.</li>
<li>Uses attacking pressure (flick and follow) to regain or maintain possession.</li>
</ul><div>

</div><hr><div>

</div><h2 id="h-7-1v1-and-2v1-understanding" class="toc-header"><a class="toc-anchor" href="#h-7-1v1-and-2v1-understanding">¶</a> 7. 1v1 and 2v1 Understanding</h2><div>

</div><ul>
<li>Attempts to beat a defender in 1v1 situations.</li>
<li>Recognizes and uses numerical advantage (2v1).</li>
<li>Keeps execution simple under pressure.</li>
<li>Avoids forcing plays.</li>
</ul><div>

</div><hr><div>

</div><h2 id="assessment-method" class="toc-header"><a class="toc-anchor" href="#assessment-method">¶</a> Assessment Method</h2><div>

</div><ul>
<li>Assessment occurs during live scrimmage.</li>
<li>No isolated drill testing.</li>
<li>Player must demonstrate consistent, predictable behaviour.</li>
<li>Coach may observe across multiple sessions.</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
