<p>Once the player is in the <a href="/players/individual_fundamentals/moving_in_the_water/strikes/getting_ready" class="is-internal-link is-valid-page">ready position</a> on the wall and they hear the buzzer sound, they will push off the wall. Having their legs curled behind the player and their feet set on the wall allows for the maximum amount of force the player can create to push themselves forward. It is most effective to push a little bit upwards so that the first part of the forward movement is partially above the water. The player’s arm that was on the wall behind them will do a freestyle stroke motion above the water to either prepare the player to continue their freestyle strokes or do a <a href="/players/individual_fundamentals/moving_in_the_water/diving_while_swimming" class="is-internal-link is-valid-page">dive while swimming</a> and enter a tight streamline.</p>
<h1 id="demonstration-video" class="toc-header"><a class="toc-anchor" href="#demonstration-video">¶</a> Demonstration Video</h1>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/LN3PZw4Oc4c?si=LMOM9m6Fws2vJy3P" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<h1 id="when-to-use" class="toc-header"><a class="toc-anchor" href="#when-to-use">¶</a> When to Use</h1>
<p>This method of leaving the wall should be used at the start of every point when the player is racing for the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>. All players on the team can use this method of pushing off the wall, but it is most important for the player(s) initially going for the puck.</p>
<h1 id="what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#what-to-watch-out-for">¶</a> What to Watch Out For</h1>
<p>When doing the stroke motion with the hand that was on the wall, beware of the teammates on either side. Make sure to not hit them in the head as you bring your arm forward, especially if using the stick hand.</p>
<h1 id="real-life-example-video-clip" class="toc-header"><a class="toc-anchor" href="#real-life-example-video-clip">¶</a> Real-life Example Video Clip</h1>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/oh4yo2anixA?clip=UgkxDT61h6j6w2Yn1iUheXiup8i8UqpfXwXp&amp;clipt=EJaZJBjVuSU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>The player begins in a good starting position, pushes off the wall hard, does one stroke above the water and dives to swim to the puck underwater.</p>
<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
          <p><u>LEAVING THE WALL</u></p>
          <ul>
            <li>PUSH OFF THE WALL WITH AS MUCH FORCE FROM THE LEGS AS POSSIBLE</li>
            <li>EITHER GO INTO AN UNDERWATER STREAMLINE IMMEDIATELY OR TAKE A FEW SURFACE STROKES THEN DIVE</li>
          </ul>
</div>
