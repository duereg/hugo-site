</div><p>
This is where you begin to feel like a hockey player. The focus is not advanced skill, but
building clean, repeatable habits that will support everything you learn later.
</p><div>

</div><p>
<b>Core principle:</b> Control first. Speed later.
</p><div>

</div><hr><div>

</div><h3 id="holding-the-stick-correctly" class="toc-header"><a class="toc-anchor" href="#holding-the-stick-correctly">¶</a> <b>Holding the Stick Correctly</b></h3><div>

</div><p>
A proper grip improves control, strength on the puck, and keeps play clean.
</p><div>

</div><p><b>Grip fundamentals:</b></p>
<ul>
  <li>Hold the handle tight into your palm.</li>
  <li>Press your <b>thumb firmly along the back-side (hook-side)</b> of the handle in a clear “thumbs up” position.</li>
  <li>The hook of the stick should be <b>turned toward your body</b>.</li>
  <li>Keep your wrist strong and neutral, avoid excessive bending.</li>
</ul><div>

</div><p><b>Quick check:</b> If your hook is turned away from you, your grip is wrong.</p><div>

</div><p><b>Common mistakes:</b></p>
<ul>
  <li>Stick pointing away from you. </li>
  <li>Weak grip, losing the stick with contact. </li>
  <li>Weak thumb, excessive extension of the wrist. </li>
</ul><div>

</div><p><b>Think:</b> Firm, strong hands.</p><div>

</div><hr><div>

</div><h3 id="one-handed-play" class="toc-header"><a class="toc-anchor" href="#one-handed-play">¶</a> <b>One-Handed Play</b></h3><div>

</div><p>
Underwater Hockey is played with one hand on the stick at all times.
This keeps the game fair, controlled, and safe.
</p><div>

</div><p><b>What this means:</b></p>
<ul>
  <li>Your stick hand plays the puck.</li>
  <li>Your free arm stabilizes and helps you move.</li>
  <li>You must resist the urge to use both hands when reaching.</li>
</ul><div>

</div><p><b>Why it matters:</b></p>
<ul>
  <li>Encourages better positioning.</li>
  <li>Improves puck skill over time.</li>
  <li>Prevents dangerous contact.</li>
</ul><div>

</div><p><b>Rule:</b> If you cannot reach it with one hand, move your body closer.</p><div>

</div><hr><div>

</div><h3 id="free-arm-usage" class="toc-header"><a class="toc-anchor" href="#free-arm-usage">¶</a> <b>Free Arm Usage</b></h3><div>

</div><p>
Your free arm is a powerful tool for balance, control, and propulsion.
Beginners often forget to use it intentionally.
</p><div>

</div><p><b>Use your free arm to:</b></p>
<ul>
  <li>Guide your descent.</li>
  <li>Stabilize in the cobra position.</li>
  <li>Assist with turns.</li>
  <li>Add small bursts of propulsion.</li>
</ul><div>

</div><p><b>Safety note:</b></p>
<ul>
  <li>Never grab opponents.</li>
  <li>Never pull yourself along the bottom.</li>
  <li>Keep movements controlled around other players.</li>
</ul><div>

</div><p><b>Simple cue:</b> The free arm supports, it never wrestles.</p><div>

</div><hr><div>

</div><h3 id="first-puck-contact" class="toc-header"><a class="toc-anchor" href="#first-puck-contact">¶</a> <b>First Puck Contact</b></h3><div>

</div><p>
Your first objective is simply learning how the puck moves.
Clean contact is more important than powerful contact.
</p><div>

</div><p><b>Starting technique:</b></p>
<ul>
  <li>Approach from behind or slightly to the side.</li>
  <li>Place the stick gently against the puck.</li>
  <li>Push, don’t slap.</li>
  <li>Keep the puck within arm’s reach.</li>
</ul><div>

</div><p><b>Goal:</b> Short, controlled movements.</p><div>

</div><p><b>Avoid:</b></p>
<ul>
  <li>Hitting or slapping the puck.</li>
  <li>Playing the puck with your glove.</li>
</ul><div>

</div><p>
Power becomes useful later. Control wins early.
</p><div>

</div><hr><div>

</div><h3 id="protecting-the-puck" class="toc-header"><a class="toc-anchor" href="#protecting-the-puck">¶</a> <b>Protecting the Puck</b></h3><div>

</div><p>
Once you touch the puck, your next job is to keep it.
Protection is mostly about body positioning, not strength.
</p><div>

</div><p><b>Basic protection strategy:</b></p>
<ul>
  <li>Place your body between the puck and the opponent.</li>
  <li>Keep the puck slightly underneath or beside you.</li>
  <li>Stay low and stable.</li>
</ul><div>

</div><p><b>If pressure arrives:</b></p>
<ul>
  <li>Move the puck into open space.</li>
  <li>Angle away from danger.</li>
  <li>Release early rather than losing control.</li>
</ul><div>

</div><p><b>Common mistake:</b> Trying to fight through multiple opponents.</p><div>

</div><p><b>Better choice:</b> Protect → move → support.</p><div>

</div><hr><div>

</div><h3 id="looking-up-while-handling" class="toc-header"><a class="toc-anchor" href="#looking-up-while-handling">¶</a> <b>Looking Up While Handling</b></h3><div>

</div><p>
Awareness separates beginners from developing players.
You cannot make good decisions if your eyes are locked on the puck.
</p><div>

</div><p><b>Build the habit early:</b></p>
<ul>
  <li>Glance at the puck.</li>
  <li>Lift your eyes to scan.</li>
  <li>Return focus briefly.</li>
</ul><div>

</div><p><b>What to scan for:</b></p>
<ul>
  <li>Teammates.</li>
  <li>Opponents.</li>
  <li>Walls and boundaries.</li>
  <li>Open lanes.</li>
</ul><div>

</div><p><b>Simple cue:</b> Handle → scan → decide.</p><div>

</div><p>
At first this feels difficult. With repetition, it becomes automatic.
</p><div>

</div><hr><div>

</div><h3 id="playing-along-the-bottom" class="toc-header"><a class="toc-anchor" href="#playing-along-the-bottom">¶</a> <b>Playing Along the Bottom</b></h3><div>

</div><p>
The bottom is your playing surface. Stability here allows better control and safer play.
</p><div>

</div><p><b>Strong bottom habits:</b></p>
<ul>
  <li>Arrive balanced.</li>
  <li>Adopt the cobra position when possible.</li>
  <li>Keep your stick low.</li>
  <li>Move with intention rather than scrambling.</li>
</ul><div>

</div><p><b>Avoid:</b></p>
<ul>
  <li>Hips floating up.</li>
  <li>Eyes facing down.</li>
</ul><div>

</div><p>
A stable player is a useful player.
</p><div>

</div><hr><div>

</div><h3 id="basic-player-spacing" class="toc-header"><a class="toc-anchor" href="#basic-player-spacing">¶</a> <b>Basic Player Spacing</b></h3><div>

</div><p>
Good spacing prevents collisions and makes teamwork possible.
</p><div>

</div><p><b>Beginner spacing rules:</b></p>
<ul>
  <li>Avoid clustering around the puck.</li>
  <li>If a teammate is on the puck, create a nearby passing option.</li>
  <li>Keep enough distance to react safely.</li>
  <li>Do not swim directly over another player.</li>
</ul><div>

</div><p><b>The beginner trap:</b> Everyone chasing the puck.</p><div>

</div><p><b>The better habit:</b> Support the play, don’t smother it.</p><div>

</div><p>
Spread players create opportunities.
Crowded players create chaos.
</p><div>

</div><hr><div>

</div><p>
<b>Remember:</b> These are your foundation skills. Precision now leads to confidence later.
Stay patient. Mastery is built through repetition.
</p>
