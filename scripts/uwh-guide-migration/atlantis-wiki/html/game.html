<p>The official rules of Underwater Hockey (UWH) are available on the website of the sport's international governing cody (CMAS) in two parts, <a href="https://www.cmas.org/document?sessionId=&amp;fileId=5288&amp;language=1" class="is-external-link">Volume 1 - Playing Area Requirements</a> and <a href="https://www.cmas.org/document?sessionId=&amp;fileId=5287&amp;language=1" class="is-external-link">Volume 2 - Rules of Play</a>.&nbsp;</p>
<p>UWH is a <a href="/teams" class="is-internal-link is-valid-page">team sport</a>, with each made up of 6 active <a href="/players" class="is-internal-link is-valid-page">players</a> in the field of play, and up to 4 alternates available “on the fly” as substitute players. The teams are identified by the colors (blue/black vs white) of their one handed <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">sticks</a> and head covering (<a href="/game/gear-setup/caps" class="is-internal-link is-valid-page">caps</a>), and sometimes also by their swimsuits at major competitions. The teams work to push the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> into the <a href="/game/gear-setup/goals" class="is-internal-link is-valid-page">goal</a> at each end of the playing area (<a href="/game/gear-setup/courts" class="is-internal-link is-valid-page">court</a>).</p>
<p>While many teams practice and scrimmage in whichever pool is available to them a regulation <a href="/game/gear-setup/court" class="is-internal-link is-invalid-page">court</a> must meet specific length, width, and depth, requirements. Unlike other sports, the total playing area is only part of the equation, UWH has a total playing <u>volume</u> requirement, which is itself a range to allow for differences in pool construction.</p>
<p>A regulation game is two (2) 15 minute halves, with a three (3) minute half-time. Oftentimes smaller tournaments use a shortened version of the time requirements to fit more games in with typically only the finals and medal games being the full regulation time.</p>
<p>The heart of playing UWH is <a href="/players" class="is-internal-link is-valid-page">players</a> are only allowed to interact with the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>, and they are only allowed to do so with their <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a>. Most of the player interaction rules stem from this concept. UWH rules have primary goals to ensure player safety and fair play, violating these rules is called a foul and each has specific penalties to be enforced. <a href="/game/fouls" class="is-internal-link is-valid-page">Understanding fouls</a> and the <a href="/game/protocols" class="is-internal-link is-valid-page">protocols</a> that occur after a rule violation is very important for players, coaches, and especially the referees.</p>
