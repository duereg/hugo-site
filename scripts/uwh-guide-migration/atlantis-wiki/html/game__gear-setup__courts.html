"toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>The playing area is generally fifteen meters wide and twenty five meters long. The <a href="/game/gear-setup/goals" class="is-internal-link is-valid-page">goals</a> are three meters wide and centered on the fifteen meter walls. There are two arcs centered around the goal, one with a three meter radius and one with a six meter radius. These are used for <a href="/game/protocols/penalty_shot" class="is-internal-link is-valid-page">penalty shots</a><i>, </i>and the penally shot starting point is on the three meter arc, straight out from the center of the goal.&nbsp; There is a mark at the exact center of the playing area which indicates the point at which the puck is placed at the start of every point. There is also a rectangle in the playing area that is set five meters from the end walls and two meters from the side walls. This rectangle marks the area in which the puck can be reset when a foul is called.</p>
<p>Outside of the playing area, the score and time table is set along the center of one of the twenty five meter side of the playing area. The chief ref is set by this table. On the opposite side of the court are the team <a href="/game/protocols/substitutions" class="is-internal-link is-valid-page">sub boxes</a>.</p>
<p>The outer dimensions of the the playing area can vary between pools. All of these features (other than the goals) are not always marked, but those that are most often marked are the five meter and two meter rectangle, the center point and the penalty shot point.</p>
