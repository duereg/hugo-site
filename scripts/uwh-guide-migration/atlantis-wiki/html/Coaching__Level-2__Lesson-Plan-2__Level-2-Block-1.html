</div><p>
Build stable body position, correct dive selection, and controlled entry into play before adding team complexity.
</p><div>

</div><hr><div>

</div><h2 id="session-flow" class="toc-header"><a class="toc-anchor" href="#session-flow">¶</a> Session Flow</h2><div>

</div><section>
 <section>
  <h3 id="cobra-position" class="toc-header"><a class="toc-anchor" href="#cobra-position">¶</a> Cobra Position</h3>

  <p>
  Cobra Position is the foundation of underwater hockey. A stable body position allows players to see the game, control the puck, and transition smoothly between movement and play.
  </p>

  <p><strong>Key Focus:</strong></p>
  <ul>
    <li>Hips low</li>
    <li>Chest up</li>
    <li>Eyes forward</li>
    <li>Stick ready to play</li>
  </ul>

  <p>
    <strong>Drill:</strong>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-1#cobra-hold" class="is-internal-link is-valid-page">
      Cobra Hold
    </a>
  </p>

  <p>
    <strong>Learn More:</strong>
    <a href="/en/Players/Individual_Fundamentals/Body_Position/Cobra_Position" class="is-internal-link is-invalid-page">
      Cobra Position Guide →
    </a>
  </p>
</section>

<section>
  <h3 id="h-2-kelp-dive-stationary-entry" class="toc-header"><a class="toc-anchor" href="#h-2-kelp-dive-stationary-entry">¶</a> 2. Kelp Dive (Stationary Entry)</h3>
  <ul>
    <li>Used for stationary puck situations</li>
    <li>Vertical, controlled descent</li>
    <li>Land balanced and ready to play</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-1#kelp-dive" class="is-internal-link is-valid-page">
      Kelp Dive Repetition
    </a>
  </p>
  <p><strong>Link:</strong> Apply body position into controlled entry.</p>
</section>

<section>
  <h3 id="h-3-duck-dive-moving-entry" class="toc-header"><a class="toc-anchor" href="#h-3-duck-dive-moving-entry">¶</a> 3. Duck Dive (Moving Entry)</h3>
  <ul>
    <li>Used when play is moving</li>
    <li>Maintain forward momentum into the dive</li>
    <li>Enter smoothly and aligned with direction of play</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-1#duck-dive" class="is-internal-link is-valid-page">
      Duck Dive Repetition
    </a>
  </p>
  <p><strong>Link:</strong> Transition from stationary control to dynamic entry.</p>
</section>

<section>
  <h3 id="h-4-surface-reset" class="toc-header"><a class="toc-anchor" href="#h-4-surface-reset">¶</a> 4. Surface Reset</h3>
  <ul>
    <li>Recognize loss of position early</li>
    <li>Surface efficiently to recover</li>
    <li>Re-enter with awareness and timing</li>
  </ul>
   <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-1#surface-reset" class="is-internal-link is-valid-page">
      Surface Reset Drill
    </a>
  </p>
  <p><strong>Link:</strong> Ensures sustainability and decision-making between efforts.</p>
</section>

<section>
  <h3 id="h-5-game-integration" class="toc-header"><a class="toc-anchor" href="#h-5-game-integration">¶</a> 5. Game Integration</h3>
  <ul>
    <li>Apply fundamentals in live play</li>
    <li>Prioritize control over speed</li>
    <li>Make correct dive decisions under light pressure</li>
  </ul>
  <p>Short Game Play</p>
  <p><strong>Link:</strong> Combine all individual fundamentals into realistic context.</p>
</section>

<hr>

<h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2>

<ul>
  <li>Maintains stable body position (hips low, chest up, eyes forward)</li>
  <li>Selects correct dive (kelp vs duck) based on situation</li>
  <li>Executes controlled and balanced entry into play</li>
  <li>Surfaces early when out of position</li>
  <li>Re-enters with awareness and timing</li>
</ul>

<hr>

<h2 id="key-principles" class="toc-header"><a class="toc-anchor" href="#key-principles">¶</a> Key Principles</h2>

<section>
  <h3 id="body-position" class="toc-header"><a class="toc-anchor" href="#body-position">¶</a> Body Position</h3>
  <ul>
    <li>Hips low</li>
    <li>Chest up</li>
    <li>Eyes forward</li>
    <li>Stick flat and ready</li>
  </ul>
</section>

<section>
  <h3 id="kelp-dive" class="toc-header"><a class="toc-anchor" href="#kelp-dive">¶</a> Kelp Dive</h3>
  <ul>
    <li>Vertical descent</li>
    <li>Land directly under entry point</li>
    <li>Control before speed</li>
  </ul>
</section>

<section>
  <h3 id="duck-dive" class="toc-header"><a class="toc-anchor" href="#duck-dive">¶</a> Duck Dive</h3>
  <ul>
    <li>Carry forward momentum</li>
    <li>Enter smoothly without disruption</li>
    <li>Maintain awareness of play</li>
  </ul>
</section>

<section>
  <h3 id="surface-reset" class="toc-header"><a class="toc-anchor" href="#surface-reset">¶</a> Surface Reset</h3>
  <ul>
    <li>Surface early</li>
    <li>Reset calmly</li>
    <li>Re-enter with purpose</li>
  </ul>
</section>

<hr>

<h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2>

<ul>
  <li>Hips low</li>
  <li>Eyes forward</li>
  <li>Control before speed</li>
  <li>Enter with purpose</li>
  <li>Reset early</li>
</ul>

<hr>

<h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2>

<ul>
  <li><strong>Hips too high</strong> – Emphasize low, stable base</li>
  <li><strong>Head down</strong> – Reinforce eyes forward</li>
  <li><strong>Rushed dive</strong> – Slow down and control entry</li>
  <li><strong>Staying underwater too long</strong> – Reset earlier</li>
</ul>

<hr>

<h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2>

<ul>
  <li>Keep intensity low to moderate</li>
  <li>Ensure adequate spacing between athletes</li>
  <li>Correct dive selection early and consistently</li>
  <li>Only progress when execution is consistent</li>
</ul>

<hr>

<h2 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h2>

<ul>
  <li>Add light defensive pressure</li>
  <li>Reduce recovery time between reps</li>
  <li>Introduce movement before dives</li>
</ul>

<h2 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h2>

<ul>
  <li>Shorten distances</li>
  <li>Slow overall tempo</li>
  <li>Remove pressure and simplify decisions</li>
</ul></section></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
