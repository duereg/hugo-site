ader"><a class="toc-anchor" href="#block-5-team-formationz">¶</a> Block 5 - Team Formationz</h1><div>

  </div><p>
    This block teaches team formations.
    The teaching format stays the same.
    Only the roles and positions change based on the formation.
  </p><div>

  </div><p>
    Coaches should choose one formation sub block to follow.
    Each sub block links to the formation page for full role definitions.

  </div><h2 id="universal-teaching-rules" class="toc-header"><a class="toc-anchor" href="#universal-teaching-rules">¶</a> Universal teaching rules</h2><div>
  </div><ul>
    <li>Walk through the structure on land first.</li>
    <li>In water, use short cues and quick resets.</li>
    <li>Teach by pool areas, wall, corners, defence, attack, then connect them.</li>
    <li>Freeze and reset when the shape collapses.</li>
  </ul>
