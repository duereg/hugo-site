e2ZpbGVuYW1lfSJ9" filename="Coaching/Badges.html"><template slot="contents"><div><hr><h1 id="underwater-hockey-badge-system" class="toc-header"><a class="toc-anchor" href="#underwater-hockey-badge-system">¶</a> Underwater Hockey Badge System</h1><div>

</div><p>
The Atlantis Underwater Hockey Badge System is used to document player development
across the core areas of the sport.
</p><div>

</div><p>
Badges are awarded through coaching observation during normal training.
They are designed to support coaching, not replace it or turn sessions into formal testing.
</p><div>

</div><hr><div>

</div><h2 id="how-coaches-use-this-system" class="toc-header"><a class="toc-anchor" href="#how-coaches-use-this-system">¶</a> How Coaches Use This System</h2><div>

</div><ol>
  <li>Run the coaching session as normal.</li>
  <li>Observe whether a player demonstrates a skill consistently.</li>
  <li>Sign off the relevant badge level when the performance is clearly repeatable.</li>
  <li>Record progress in the player tracker.</li>
</ol><div>

</div><p>
Badges should document development without interrupting session flow.
If a player is not clearly ready, leave the badge unsigned and reassess later.
</p><div>

</div><hr><div>

</div><h2 id="badge-categories" class="toc-header"><a class="toc-anchor" href="#badge-categories">¶</a> Badge Categories</h2><div>

</div><ul>
  <li><b><a href="/en/Coaching/Badges/Foundation" class="is-internal-link is-valid-page">Foundation</a></b> — Basic competency and safety.</li>
  <li><b><a href="/en/Coaching/Badges/Progressive" class="is-internal-link is-valid-page">Conditioning</a></b> — Breath control and endurance.</li>
  <li><b><a href="/en/Coaching/Badges/Progressive" class="is-internal-link is-valid-page">Precision</a></b> — Puck control and passing accuracy.</li>
  <li><b><a href="/en/Coaching/Badges/Progressive" class="is-internal-link is-valid-page">Power</a></b> — Propulsion and speed.</li>
  <li><b><a href="/en/Coaching/Badges/Skills" class="is-internal-link is-valid-page">Tactical Skills</a></b> — Advanced puck manipulation techniques.</li>
  <li><b><a href="/en/Coaching/Badges/Leadership" class="is-internal-link is-valid-page">Leadership</a></b> — Coaching contribution.</li>
  <li><b><a href="/en/Coaching/Badges/Participation-Milestone" class="is-internal-link is-valid-page">Participation</a></b> — Commitment to the sport.</li>
  <li><b><a href="/en/Coaching/Badges/Achievement" class="is-internal-link is-valid-page">Achievement</a></b> — Competition milestones.</li>
</ul><div>

</div><hr><div>

</div><h2 id="rank-structure" class="toc-header"><a class="toc-anchor" href="#rank-structure">¶</a> Rank Structure</h2><div>

</div><p>
The ranking system follows an ocean depth progression model:
</p><div>

</div><ul>
  <li><b>Coral</b> — Foundation complete</li>
  <li><b>Reef</b> — Early developing player</li>
  <li><b>Ocean Current</b> — Reliable club player</li>
  <li><b>Deep Blue</b> — Competitive player</li>
  <li><b>Pelagic</b> — High performance level</li>
</ul><div>

</div><p>
Before entering the ranking system, players must complete all
<b><a href="/en/Coaching/Badges/Foundation" class="is-internal-link is-valid-page">Foundation badges</a></b>.
This represents the minimum competency required to play underwater hockey safely and effectively.
</p><div>

</div><p>
After Coral rank is achieved, progression is determined through badge points in
<b><a href="/en/Coaching/Badges/Progressive" class="is-internal-link is-valid-page">Conditioning</a></b>,
<b><a href="/en/Coaching/Badges/Progressive" class="is-internal-link is-valid-page">Precision</a></b>, and
<b><a href="/en/Coaching/Badges/Progressive" class="is-internal-link is-valid-page">Power</a></b>.
</p><div>

</div><hr><div>

</div><h2 id="coach-guidance" class="toc-header"><a class="toc-anchor" href="#coach-guidance">¶</a> Coach Guidance</h2><div>

</div><ul>
  <li>Coach the session first.</li>
  <li>Use badges to document what is already being demonstrated.</li>
  <li>Do not stop sessions to run formal badge tests unless specifically required.</li>
  <li>Sign off only when performance is calm, safe, and repeatable.</li>
</ul><div>

</div><p>
Badges document development. They do not replace coaching.
</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
