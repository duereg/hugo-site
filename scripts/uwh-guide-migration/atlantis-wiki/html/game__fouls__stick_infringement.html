<p>Stick infringement is any improper use of the <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a>. This includes any contact with opponent's bodies, <a href="/game/gear-setup/gloves" class="is-internal-link is-valid-page">gloves</a>, or sticks. If a player is attempting to steal the puck from an opponent, but hits their glove before making contact with the puck, they will be called for stick infringement.&nbsp;</p>
<p>This foul often occurs when a player reaches underneath an opponent's had and swipes their stick under the glove. Here the player hit the opponents glove and stick before coming into contact with the puck. To avoid this, players should tackle the puck from above, going straight for the puck.&nbsp;</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>The signal for calling a stick infringement is a vertical chopping motion with one hand on the forearm of the other hand.&nbsp;</p>
<p>Stick infringements are one of the most common fouls to occur in a game. As with most fouls, the<a href="/game/fouls/advantage-rule" class="is-internal-link is-valid-page"> advantage rule</a> should be played out and the foul should only be called if it alters the outcome of the play. Some instances of stick foul can result in injury and should be called regardless of the outcome. This could be something such as a player hitting an opponents forearm painfully hard on the way to the puck, or hitting another players head with their stick while taking a stroke on the surface. It is up the the referee to decide if the fouls was severe enough to call immediately or if they should play out the advantage rule.&nbsp;</p>

<h1 id="real-life-example-video-clip" class="toc-header"><a class="toc-anchor" href="#real-life-example-video-clip">¶</a> Real-life Example Video Clip</h1>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/XYNcHLcGEwU?si=fjjwiXvAcrShJpvy&amp;clip=Ugkxn1adXrFOHJYGsUsQJTM9PUKkDQucbGh8&amp;clipt=EIHiHBi3rh0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>In this example the white player has the puck, and the black player comes from behind the stick of the white player and lifts the white stick off the bottom while going for the puck. This is a stick infringement because the black stick hit the white stick and glove before hitting the puck.</p>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/Y9bzMDe2hJk?si=MUwYQ2JEvjCefMdx&amp;clip=UgkxUxM_t_LNKffyx5xy-pMWvowQ4i-NbDO1&amp;clipt=EPC7gwIY3emDAg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>In this case, white #9 starts with the puck and black #9 tries to reach over the white stick to get the puck. The black team player ends up hooking their stick over the glove and stick of the white player with little contact with the puck, hindering the white player's movement.</p>
<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference orange">
  <p><u>STICK INFRINGEMENT</u></p>
  <ul>
    <li>THIS INCLUDES ANY IMPROPER USE OF THE STICK, WHICH INCLUDES HITTING AN OPPONENT'S GLOVE, STICK OR BODY WITH THE STICK OR USING THE NON-PLAYING SURFACE PART OF THE STICK.</li>
  </ul>
