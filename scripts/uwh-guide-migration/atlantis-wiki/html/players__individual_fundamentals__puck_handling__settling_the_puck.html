<p>Settling the puck refers to interrupting a bouncing/bobbling/skittering <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> to force it to lay flat on the <a href="/game/gear-setup/playing_surfaces" class="is-internal-link is-valid-page">playing surface</a>. Attempting to maneuver a puck that has not settled, or is sitting up on rounded face is often an exercise in futility. The puck is difficult to predict in these situations and any attempts at <a href="/players/individual_fundamentals/puck_handling" class="is-internal-link is-valid-page">puck handling</a> or <a href="/players/evasive_maneuvers" class="is-internal-link is-valid-page">evasive maneuvers</a> are made much more difficult.</p>
<p>Being able to quickly bring an erratic puck to lay down flat and steady is a very useful skill. Using combinations of <a href="/players/individual_fundamentals/puck_handling/tic-tac" class="is-internal-link is-valid-page">tic-tac</a> maneuvers and <a href="/players/tackling_maneuvers/knock-downs" class="is-internal-link is-valid-page">knock-downs</a></p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>Settling the puck can be done in a variety of ways, ranging form bigger movements like a tick-tack move or using the tip of the stick to knock the puck flat, down to small movements like tilting the stick forward to lessen the bevel on the front edge of the stick. Some situations require a big motion to settle the puck while sometimes a small movement is all that is needed, and players simply need to experiment to see what works best for them in particular situations.</p>
<p>Players should always try to settle the puck when they have possession of it since it is extremely difficult to do any maneuvers if the puck is not laying flat.&nbsp;</p>
