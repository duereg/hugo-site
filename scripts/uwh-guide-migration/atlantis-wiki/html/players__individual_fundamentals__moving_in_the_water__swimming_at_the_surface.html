<p>Players spend a lot of time during the game swimming along the surface so that they can keep their position while breathing. The most common way to move on the surface is to kick, with the stick arm or both arms stretched out ahead of the player. Flutter kick is the most energy efficient way to kick on the surface. Players may also use their arms in a front crawl motion to swim faster or to simply use their legs less.&nbsp;</p>

<h1 id="what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#what-to-watch-out-for">¶</a> What to Watch Out For</h1>
<p>If players take arm strokes while swimming on the surface they must make sure there are no other players near the path of their stroke. Hitting another player when taking a stroke (especially with a stick in hand) is painful and dangerous for the player getting hit. Because of this, hitting a player when taking a stroke is an <a href="/game/fouls/unsportsmanlike_conduct" class="is-internal-link is-valid-page">unsportsmanlike conduct foul</a>.&nbsp;</p>

  <p><u>SWIMMING AT THE SURFACE</u></p>
  <ul>
    <li>PLAYERS CAN SWIM AT THE SURFACE BY ONLY KICKING OR BY TAKING FRONT CRAWL STROKES.</li>
