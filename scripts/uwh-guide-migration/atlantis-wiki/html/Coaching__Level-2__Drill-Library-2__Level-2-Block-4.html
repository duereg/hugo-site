ViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="Coaching/Level-2/Drill-Library-2/Level-2-Block-4.html"><template slot="contents"><div><h2 id="h-1v1-and-2v1-situations" class="toc-header"><a class="toc-anchor" href="#h-1v1-and-2v1-situations">¶</a> 1v1 and 2v1 Situations</h2><div>

</div><p><b>Progressive Badges Supported (Observed Where Applicable):</b>
<a href="/en/Coaching/Badges/Progressive#curl-mastery" class="is-internal-link is-valid-page">Curl Mastery</a>,
<a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a>
</p><div>

</div><hr><div>

</div><h3 id="h-1v1-beat-player" class="toc-header"><a class="toc-anchor" href="#h-1v1-beat-player">¶</a> 1v1 Beat Player</h3><div>

</div><ul>
  <li>Start with puck against a single defender.</li>
   <li>Players operate within a defined lane.</li>
  <li>Use change of direction or speed to get past.</li>
  <li>Maintain control while exiting the contest.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#curl-mastery" class="is-internal-link is-valid-page">Curl Mastery</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="h-2v1-basic" class="toc-header"><a class="toc-anchor" href="#h-2v1-basic">¶</a> 2v1 Basic</h3><div>

</div><ul>
  <li>Two attackers vs one defender.</li>
  <li>Use the numerical advantage to create space.</li>
  <li>Keep execution simple—pass or carry based on defender.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="h-2v1-to-goal-area" class="toc-header"><a class="toc-anchor" href="#h-2v1-to-goal-area">¶</a> 2v1 to Goal Area</h3><div>

</div><ul>
  <li>Play 2v1 into a marked goal area (D).</li>
  <li>Continue until a goal is scored or play breaks down.</li>
  <li>If puck enters goal area = scored → restart.</li>
  <li>If puck exits the marked D = defended → restart.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="small-game-numbers-advantage" class="toc-header"><a class="toc-anchor" href="#small-game-numbers-advantage">¶</a> Small Game – Numbers Advantage</h3><div>

</div><ul>
  <li>Small-sided game with overloads (e.g., 2v1, 3v2).</li>
  <li>Recognize and use numerical advantage.</li>
  <li>Keep decisions simple and effective.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> Observed where applicable during play</p><div>
