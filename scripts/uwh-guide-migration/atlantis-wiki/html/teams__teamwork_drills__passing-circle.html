9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="teams/teamwork_drills/passing-circle.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>A passing circle is much as it sounds, players set up in a circle and simply <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">pass</a> the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> around the circle. This is a great way to warm up the wrist before a game. Passing circles can have some variations that work on different skills.</p>
<ol>
  <li>Pass the puck quickly form one person to the other.</li>
  <li>Do a few movements with the puck before passing it.</li>
  <li>Pass the puck to the next person's hip and they will <a href="/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page">curl </a>as they pick it up, then <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">flick</a> it to the next person straight out of their curl.</li>
  <li>Have several pucks traveling around the circle, some in opposite directions.</li>
</ol>
