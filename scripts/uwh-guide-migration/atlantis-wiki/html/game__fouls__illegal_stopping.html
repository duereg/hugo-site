<p>Illegal stopping of the puck is a foul that occurs if a player blocks the advancement of the puck with anything other than the legal playing surface of the stick. This includes gloves, arms, legs and fins. This can also occur if a player steps on the puck, either because the water is shallow and they are standing up, or they are simply pushing off the bottom and blocking the play.</p>
<h1 id="demonstration-video" class="toc-header"><a class="toc-anchor" href="#demonstration-video">¶</a> Demonstration Video</h1>
<p>Demo video coming soon!</p>
<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>The foul should be called any time a player blocks the movement of the puck in a way that affects the play for either team. The signal to call this foul is to wave the hand in a chopping motion.</p>
<figure class="image image_resized" style="width:48.29%;"><img src="/illegal_knockdown.png"></figure>
<h1 id="when-not-to-call-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-call-and-what-to-watch-out-for">¶</a> When not to Call and What to Watch Out For</h1>
<p>This should not be called if the block is minor and does not significantly alter the course of the play.</p>
