</div><p>
This block consolidates rule understanding, substitution discipline, and restart structure so players can participate in a controlled and structured game environment.
</p><div>

</div><p>
Players learn how to respond to calls, manage substitutions safely, and restart play correctly within a 2-3-1 structure.
</p><div>

</div><hr><div>

</div><h2 id="session-run-order" class="toc-header"><a class="toc-anchor" href="#session-run-order">¶</a> Session Run Order</h2><div>
 
</div><p><b>Rule Recognition</b></p>
<ul>
<li>
Introduce common fouls:

<ul>
  <li><a href="/game/fouls/obstruction-barging" class="is-internal-link is-valid-page">Obstruction (Barging)</a></li>
  <li><a href="/game/fouls/obstruction-blocking" class="is-internal-link is-valid-page">Obstruction (Blocking)</a></li>
  <li><a href="/game/fouls/obstruction-screeing-shepherding" class="is-internal-link is-valid-page">Obstruction (Screening/Shepherding)</a></li>
  <li><a href="/game/fouls/illegal_advancement" class="is-internal-link is-valid-page">Illegal Advancement</a></li>
  <li><a href="/game/fouls/stick_infringement" class="is-internal-link is-valid-page">Stick Infringement</a></li>
  <li><a href="/game/fouls/free-arm" class="is-internal-link is-valid-page">Free Arm</a></li>
  <li><a href="/game/fouls/false_start-encroachment" class="is-internal-link is-valid-page">False Start / Encroachment</a></li>
  <li><a href="/game/fouls/illegal_sub" class="is-internal-link is-valid-page">Illegal Substitution</a></li>
</ul>
</li>
<li>Stop play and explain briefly.</li>
<li>Restart correctly after each call.</li>
</ul><div>

</div><p><b>Referee Simulation</b></p>
<ul>
<li>Coach acts as referee during short game.</li>
<li>Players respond immediately to calls.</li>
<li>Enforce correct restart behavior.</li>
</ul><div>

</div><p><b>Substitution Control</b></p>
<ul>
<li>Practice controlled rolling substitutions.</li>
<li>Players must fully exit before replacement enters.</li>
<li>Avoid entering active puck areas.</li>
</ul><div>

</div><p><b>Restart Structure</b></p>
<ul>
<li>Set up 2-3-1 formation at restarts.</li>
<li>Repeat multiple start scenarios.</li>
<li>Ensure spacing and positioning are correct.</li>
</ul><div>

</div><p><b>Full Scrimmage</b></p>
<ul>
<li>Run extended game under full rules.</li>
<li>Apply substitutions, calls, and restarts consistently.</li>
<li>Correct errors immediately.</li>
</ul><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><p>By the end of this block players should demonstrate the following during live scrimmage:</p><div>

</div><ul>
<li>Stops immediately on call signal</li>
<li>Lines up correctly for start and restart</li>
<li>Recognizes and avoids common fouls</li>
<li>Performs safe and controlled substitutions</li>
<li>Maintains structure during restarts</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-game-management-principles" class="toc-header"><a class="toc-anchor" href="#key-game-management-principles">¶</a> Key Game Management Principles</h2><div>

</div><h3 id="rule-awareness" class="toc-header"><a class="toc-anchor" href="#rule-awareness">¶</a> Rule Awareness</h3><div>

</div><ul>
<li>
Recognize common fouls:
<a href="/game/fouls/obstruction-barging" class="is-internal-link is-valid-page">Obstruction</a>,
<a href="/game/fouls/illegal_advancement" class="is-internal-link is-valid-page">Illegal Advancement</a>,
<a href="/game/fouls/stick_infringement" class="is-internal-link is-valid-page">Stick Infringement</a>,
<a href="/game/fouls/free-arm" class="is-internal-link is-valid-page">Free Arm</a>,
<a href="/game/fouls/false_start-encroachment" class="is-internal-link is-valid-page">Encroachment</a>
</li>
<li>Stop immediately on call</li>
<li>Do not continue play after stoppage</li>
</ul><div>

</div><h3 id="restart-discipline" class="toc-header"><a class="toc-anchor" href="#restart-discipline">¶</a> Restart Discipline</h3><div>

</div><ul>
<li>Line up quickly and correctly</li>
<li>Maintain 2-3-1 shape</li>
<li>Be ready for play to restart</li>
</ul><div>

</div><h3 id="substitution-control" class="toc-header"><a class="toc-anchor" href="#substitution-control">¶</a> Substitution Control</h3><div>

</div><ul>
<li>Exit fully before replacement enters</li>
<li>Enter safely and away from play</li>
<li>Avoid overcrowding the bench area</li>
</ul><div>

</div><h3 id="game-flow" class="toc-header"><a class="toc-anchor" href="#game-flow">¶</a> Game Flow</h3><div>

</div><ul>
<li>Reset quickly after stoppages</li>
<li>Maintain structure during transitions</li>
<li>Keep the game controlled and predictable</li>
</ul><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
<li>Stop on call</li>
<li>Line up</li>
<li>Reset quickly</li>
<li>Exit fully</li>
<li>Enter safely</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-good-game-management-looks-like" class="toc-header"><a class="toc-anchor" href="#what-good-game-management-looks-like">¶</a> What Good Game Management Looks Like</h2><div>

</div><ul>
<li>Players stop immediately when a call is made</li>
<li>Restarts are organized and consistent</li>
<li>Substitutions are clean and safe</li>
<li>Players understand and avoid common fouls</li>
<li>Game flow remains structured and controlled</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
<li><b>Players continue after whistle</b><br>Cue: Stop on call.</li>

<li><b>Incorrect restart positioning</b><br>Cue: Hold your line.</li>

<li><b>Early substitution entry</b><br>Cue: Full exit first.</li>

<li><b>Entering active play area</b><br>Cue: Enter safely.</li>

<li>
<b>Repeated fouls</b><br>
Cue: Play the puck (avoid 
<a href="/game/fouls/obstruction-blocking" class="is-internal-link is-valid-page">blocking</a> 
and 
<a href="/game/fouls/free-arm" class="is-internal-link is-valid-page">free-arm use</a>).
</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
<li>Be consistent with rule enforcement</li>
<li>Do not allow informal or incorrect restarts</li>
<li>Stop and reset immediately when structure breaks</li>
<li>Prioritize discipline over game outcome</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h2><div>

</div><ul>
<li>Increase tempo of restarts</li>
<li>Reduce explanation time</li>
<li>Require players to self-correct positioning</li>
<li>Increase scrimmage intensity</li>
</ul><div>

</div><h2 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h2><div>

</div><ul>
<li>Slow down restart setup</li>
<li>Walk through positioning step-by-step</li>
<li>Pause frequently to explain fouls</li>
<li>Reduce scrimmage intensity</li>
</ul><div>

</div><hr><div>

</div><p><b>Finish with full scrimmage under game conditions.</b></p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
