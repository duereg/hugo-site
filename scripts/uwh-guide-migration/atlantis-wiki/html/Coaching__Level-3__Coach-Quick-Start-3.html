</div><p>Level 3 develops players who can compete reliably within structured team play under pressure.</p><div>

</div><p>Level 3 builds players who:</p><div>

</div><ul>
<li>Compete under real pressure.</li>
<li>Maintain structure at speed.</li>
<li>Execute coordinated defensive systems.</li>
<li>Apply attacking variation within structure.</li>
<li>Demonstrate disciplined competitive behaviour.</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-level-3-is" class="toc-header"><a class="toc-anchor" href="#what-level-3-is">¶</a> What Level 3 Is</h2><div>

</div><p>Level 3 is competitive structured hockey.</p><div>

</div><ul>
<li>Players win possession cleanly.</li>
<li>Players maintain 2-3-1 under pressure.</li>
<li>Players execute coordinated defensive pressure.</li>
<li>Players apply correct transition responses.</li>
<li>Players compete without destabilizing team shape.</li>
</ul><div>

</div><p>Level 3 is not tactical manipulation or structural autonomy. That belongs to Level 4.</p><div>

</div><hr><div>

</div><h2 id="coach-checklist" class="toc-header"><a class="toc-anchor" href="#coach-checklist">¶</a> Coach Checklist</h2><div>

</div><ul>
<li>Are tackles clean and legal?</li>
<li>Is middle space protected?</li>
<li>Is pressure supported?</li>
<li>Is transition immediate and correct?</li>
<li>Is 2-3-1 maintained at speed?</li>
<li>Are players recycling instead of forcing?</li>
<li>Are substitutions disciplined?</li>
<li>Are fouls minimal and controlled?</li>
</ul><div>

</div><hr><div>

</div><h2 id="session-structure-template" class="toc-header"><a class="toc-anchor" href="#session-structure-template">¶</a> Session Structure Template</h2><div>

</div><ul>
<li>10–15 minutes – Technical reinforcement (contest or structure focus).</li>
<li>20–30 minutes – Block theme progression drills.</li>
<li>20–30 minutes – Conditioned small-sided play.</li>
<li>15–20 minutes – Competitive structured scrimmage.</li>
</ul><div>

</div><p>Every session must finish with competitive play.</p><div>

</div><hr><div>

</div><h2 id="block-focus-guide" class="toc-header"><a class="toc-anchor" href="#block-focus-guide">¶</a> Block Focus Guide</h2><div>

</div><h3 id="block-1-contest-mechanics" class="toc-header"><a class="toc-anchor" href="#block-1-contest-mechanics">¶</a> Block 1 – Contest Mechanics</h3>
<ul>
<li>Correct body position before contact.</li>
<li>No reckless diving.</li>
<li>Immediate recovery after tackle attempt.</li>
</ul><div>

</div><h3 id="block-2-coordinated-defensive-pressure" class="toc-header"><a class="toc-anchor" href="#block-2-coordinated-defensive-pressure">¶</a> Block 2 – Coordinated Defensive Pressure</h3>
<ul>
<li>One pressures, one supports.</li>
<li>Protect middle first.</li>
<li>Restore defensive depth quickly.</li>
</ul><div>

</div><h3 id="block-3-transition-response" class="toc-header"><a class="toc-anchor" href="#block-3-transition-response">¶</a> Block 3 – Transition Response</h3>
<ul>
<li>Immediate pressure after loss.</li>
<li>Protect middle during recovery.</li>
<li>No player remains behind play.</li>
</ul><div>

</div><h3 id="block-4-attacking-under-pressure" class="toc-header"><a class="toc-anchor" href="#block-4-attacking-under-pressure">¶</a> Block 4 – Attacking Under Pressure</h3>
<ul>
<li>Commit defender before pass.</li>
<li>Maintain spacing.</li>
<li>Recycle when forward option closes.</li>
<li>No isolation of puck carrier.</li>
</ul><div>

</div><h3 id="block-5-formation-under-pressure" class="toc-header"><a class="toc-anchor" href="#block-5-formation-under-pressure">¶</a> Block 5 – Formation Under Pressure</h3>
<ul>
<li>Maintain width and depth.</li>
<li>No collapse on puck.</li>
<li>Restore formation quickly.</li>
</ul><div>

</div><h3 id="block-6-wall-and-corner-systems" class="toc-header"><a class="toc-anchor" href="#block-6-wall-and-corner-systems">¶</a> Block 6 – Wall and Corner Systems</h3>
<ul>
<li>Extract safely from pressure.</li>
<li>Maintain defensive safety near goal.</li>
<li>Support early along wall.</li>
</ul><div>

</div><h3 id="block-7-special-situations" class="toc-header"><a class="toc-anchor" href="#block-7-special-situations">¶</a> Block 7 – Special Situations</h3>
<ul>
<li>Correct power play shape.</li>
<li>Correct penalty kill spacing.</li>
<li>Maintain discipline late in half.</li>
</ul><div>

</div><h3 id="block-8-competitive-game-management" class="toc-header"><a class="toc-anchor" href="#block-8-competitive-game-management">¶</a> Block 8 – Competitive Game Management</h3>
<ul>
<li>Minimal preventable fouls.</li>
<li>Clean substitutions.</li>
<li>Clear communication.</li>
<li>Emotional control.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
<li>Protect middle.</li>
<li>Support early.</li>
<li>Recover immediately.</li>
<li>Hold shape.</li>
<li>Recycle safely.</li>
<li>Discipline first.</li>
</ul><div>

</div><hr><div>

</div><h2 id="finish-with-scrimmage" class="toc-header"><a class="toc-anchor" href="#finish-with-scrimmage">¶</a> Finish with Scrimmage</h2><div>

</div><p>Every session must conclude with competitive scrimmage under structure.</p><div>

</div><ul>
<li>Stop play immediately if structure collapses.</li>
<li>Correct through reset and repetition.</li>
<li>Reinforce discipline and spacing.</li>
</ul><div>

</div><hr><div>

</div><h2 id="exit-standard-summary" class="toc-header"><a class="toc-anchor" href="#exit-standard-summary">¶</a> Exit Standard Summary</h2><div>

</div><p>A Level 3 player consistently:</p><div>

</div><ul>
<li>Wins or neutralizes most 1v1 contests.</li>
<li>Maintains defensive depth under pressure.</li>
<li>Executes attacking variations correctly.</li>
<li>Maintains 2-3-1 at competitive tempo.</li>
<li>Responds correctly in transition.</li>
<li>Maintains discipline across full games.</li>
</ul><div>

</div><p>Consistency across multiple competitive sessions is required for Level 3 award.</p>
