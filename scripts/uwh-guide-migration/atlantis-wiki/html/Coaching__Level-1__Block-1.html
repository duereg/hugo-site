<h2 id="block-goal" class="toc-header"><a class="toc-anchor" href="#block-goal">¶</a> Block Goal</h2>
<p>Introduce players to the equipment, the puck, and their first game of Underwater Hockey.</p>
<p>By the end of this block, players should:</p>
<ul>
<li>Understand the objective of Underwater Hockey</li>
<li>Be comfortable using their equipment</li>
<li>Dive and recover safely</li>
<li>Move comfortably underwater</li>
<li>Touch and move the puck</li>
<li>Understand the three basic rules</li>
<li>Play their first game</li>
</ul>
<hr>

<h1 id="h-1-equipment-fitting" class="toc-header"><a class="toc-anchor" href="#h-1-equipment-fitting">¶</a> 1. Equipment Fitting</h1>
<h2 id="objective" class="toc-header"><a class="toc-anchor" href="#objective">¶</a> Objective</h2>
<p>Ensure every player is comfortable and confident with their equipment before entering the water.</p>
<p><strong>Foundation Badges Supported:</strong> <a href="/en/Coaching/Badges/Foundation#mask-snorkel-control" class="is-internal-link is-valid-page">Mask &amp; Snorkel Control</a></p>
<h2 id="h-1-mask" class="toc-header"><a class="toc-anchor" href="#h-1-mask">¶</a> 1. Mask</h2>
<p>The mask is the most important piece of equipment.</p>
<h3 id="check" class="toc-header"><a class="toc-anchor" href="#check">¶</a> Check</h3>
<ul>
<li>Good seal</li>
<li>Proper strap adjustment</li>
<li>Hair clear of the skirt</li>
<li>Anti-fog applied</li>
</ul>
<h3 id="coach-focus" class="toc-header"><a class="toc-anchor" href="#coach-focus">¶</a> Coach Focus</h3>
<p>A comfortable mask creates a positive first experience. Spend the time needed to achieve a proper fit.</p>
<hr>
<h2 id="h-2-snorkel" class="toc-header"><a class="toc-anchor" href="#h-2-snorkel">¶</a> 2. Snorkel</h2>
<h3 id="explain" class="toc-header"><a class="toc-anchor" href="#explain">¶</a> Explain</h3>
<ul>
<li>Bite gently on the mouthpiece.</li>
<li>Keep your lips sealed around the mouthpiece.</li>
<li>Blow firmly to clear water from the snorkel.</li>
</ul>
<h3 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h3>
<p><strong>Blast Clear</strong></p>
<p>Use a forceful exhalation after surfacing to clear water from the snorkel.</p>
<p><strong>Displacement Clear</strong></p>
<p>Blow a small air bubble into the snorkel just before it breaks the surface, allowing the expanding air to push the water out.</p>
<h3 id="coach-focus-1" class="toc-header"><a class="toc-anchor" href="#coach-focus-1">¶</a> Coach Focus</h3>
<p>Players do not need to master both clearing techniques immediately. Introduce both methods and allow them to use whichever feels most comfortable.</p>
<hr>
<h2 id="h-3-mouthguard" class="toc-header"><a class="toc-anchor" href="#h-3-mouthguard">¶</a> 3. Mouthguard</h2>
<h3 id="coaching-cues-1" class="toc-header"><a class="toc-anchor" href="#coaching-cues-1">¶</a> Coaching Cues</h3>
<ul>
<li>Protects the teeth from accidental contact.</li>
<li>Required for player safety.</li>
</ul>
<hr>
<h2 id="h-4-fins" class="toc-header"><a class="toc-anchor" href="#h-4-fins">¶</a> 4. Fins</h2>
<h3 id="coaching-cues-2" class="toc-header"><a class="toc-anchor" href="#coaching-cues-2">¶</a> Coaching Cues</h3>
<ul>
<li>Correct size and fit</li>
<li>Comfortable with minimal movement</li>
<li>Use socks if needed</li>
<li>Watch for rubbing or blisters</li>
</ul>
<h3 id="coach-focus-2" class="toc-header"><a class="toc-anchor" href="#coach-focus-2">¶</a> Coach Focus</h3>
<p>Comfort is more important than performance. Poorly fitting fins can quickly discourage new players.</p>
<hr>
<h2 id="h-5-cap-glove-stick" class="toc-header"><a class="toc-anchor" href="#h-5-cap-glove-stick">¶</a> 5. Cap, Glove &amp; Stick</h2>
<h3 id="coaching-cues-3" class="toc-header"><a class="toc-anchor" href="#coaching-cues-3">¶</a> Coaching Cues</h3>
<ul>
<li>No need to spend too much time here; equipment will improve as the player improves.</li>
<li>Check glove size and comfort.</li>
<li>Confirm the stick is the correct length and comfortable to hold.</li>
<li>Use distinct coloured stick tape to identify beginner players (for example bright colours for beginners and softer colours for experienced players).</li>
</ul>
<h3 id="coach-focus-3" class="toc-header"><a class="toc-anchor" href="#coach-focus-3">¶</a> Coach Focus</h3>
<p>Spend minimal time fitting these items. Players will naturally become more comfortable using the glove and stick as they gain experience.</p>
<hr>
<h1 id="h-2-water-confidence" class="toc-header"><a class="toc-anchor" href="#h-2-water-confidence">¶</a> 2. Water Confidence</h1>
<p><strong>Linked Individual Fundamental:</strong> <a href="/players/individual_fundamentals/moving_in_the_water/swimming_at_the_surface" class="is-internal-link is-valid-page">Swimming at the surface</a></p>
<h2 id="activity-1-surface-swimming" class="toc-header"><a class="toc-anchor" href="#activity-1-surface-swimming">¶</a> Activity 1 – Surface Swimming</h2>
<h3 id="objective-1" class="toc-header"><a class="toc-anchor" href="#objective-1">¶</a> Objective</h3>
<p>Become comfortable swimming with the equipment.</p>
<p><strong>Resource:</strong> <a href="/players/individual_fundamentals/moving_in_the_water/swimming_at_the_surface" class="is-internal-link is-valid-page">Swimming at the surface</a><br>
<strong>Badge supported:</strong> <a href="/en/Coaching/Badges/Foundation#fin-propulsion-control" class="is-internal-link is-valid-page">Fin Propulsion Control</a></p>
<h3 id="drill" class="toc-header"><a class="toc-anchor" href="#drill">¶</a> Drill</h3>
<p>Swim two lengths using:</p>
<ul>
<li>Face submerged</li>
<li>Snorkel breathing</li>
<li>Arms extended</li>
<li>Flutter kick only</li>
</ul>
<h3 id="coaching-cues-4" class="toc-header"><a class="toc-anchor" href="#coaching-cues-4">¶</a> Coaching Cues</h3>
<ul>
<li>Your legs are your engine.</li>
<li>Relax.</li>
<li>Keep your face down.</li>
<li>Maintain a steady flutter kick.</li>
</ul>
<h3 id="coach-focus-4" class="toc-header"><a class="toc-anchor" href="#coach-focus-4">¶</a> Coach Focus</h3>
<p>Watch for players struggling with snorkel breathing, body position, or fin technique.</p>
<hr>
<h2 id="activity-2-diving-recovery" class="toc-header"><a class="toc-anchor" href="#activity-2-diving-recovery">¶</a> Activity 2 – Diving &amp; Recovery</h2>
<h3 id="objective-2" class="toc-header"><a class="toc-anchor" href="#objective-2">¶</a> Objective</h3>
<p>Learn diving and surfacing techniques.</p>
<p><strong>Resource:</strong> <a href="/en/players/individual_fundamentals/moving_in_the_water/diving_while_swimming" class="is-internal-link is-valid-page">Diving While Swimming</a><br>
<strong>Badge supported:</strong> <a href="/en/Coaching/Badges/Foundation#dive-control" class="is-internal-link is-valid-page">Dive Control</a></p>
<h3 id="drill-1" class="toc-header"><a class="toc-anchor" href="#drill-1">¶</a> Drill</h3>
<p>Swim two lengths while repeating the following sequence:</p>
<ol>
<li>Swim forward.</li>
<li>Take a big breath.</li>
<li>Perform an angled dive.</li>
<li>Touch the bottom with arms outstretched.</li>
<li>Return to the surface.</li>
<li>Clear the snorkel.</li>
<li>Continue swimming.</li>
</ol>
<h3 id="coaching-cues-5" class="toc-header"><a class="toc-anchor" href="#coaching-cues-5">¶</a> Coaching Cues</h3>
<ul>
<li>Dive at an angle.</li>
<li>Keep kicking throughout the dive.</li>
<li>Use your legs to generate momentum.</li>
<li>Avoid using your arms to pull yourself down.</li>
<li>Continue swimming after surfacing.</li>
</ul>
<h3 id="coach-focus-5" class="toc-header"><a class="toc-anchor" href="#coach-focus-5">¶</a> Coach Focus</h3>
<p>Encourage smooth, continuous movement rather than stopping between each dive.</p>
<hr>
<h2 id="activity-3-first-touch-of-the-puck" class="toc-header"><a class="toc-anchor" href="#activity-3-first-touch-of-the-puck">¶</a> Activity 3 – First Touch of the Puck</h2>
<h3 id="objective-3" class="toc-header"><a class="toc-anchor" href="#objective-3">¶</a> Objective</h3>
<p>Become comfortable interacting with the puck.</p>
<p><strong>Resource:</strong> <a href="/en/players/individual_fundamentals/moving_in_the_water/kicking_with_the_puck" class="is-internal-link is-valid-page">Kicking with the Puck</a></p>
<h3 id="drill-2" class="toc-header"><a class="toc-anchor" href="#drill-2">¶</a> Drill</h3>
<p>Allow players to:</p>
<ul>
<li>Dive</li>
<li>Push the puck</li>
<li>Explore freely</li>
</ul>
<p>Do not provide formal technique instruction. Encourage natural discovery and confidence.</p>
<h3 id="coach-focus-6" class="toc-header"><a class="toc-anchor" href="#coach-focus-6">¶</a> Coach Focus</h3>
<p>The objective is comfort, not skill. Allow players to experiment without fear of making mistakes.</p>
<hr>
<h1 id="h-3-introduction-to-the-game" class="toc-header"><a class="toc-anchor" href="#h-3-introduction-to-the-game">¶</a> 3. Introduction to the Game</h1>
<h2 id="objective-4" class="toc-header"><a class="toc-anchor" href="#objective-4">¶</a> Objective</h2>
<p>Introduce the basic objective, rules, and player responsibilities.</p>
<h3 id="explain-1" class="toc-header"><a class="toc-anchor" href="#explain-1">¶</a> Explain</h3>
<p>Two teams compete to score by pushing the puck into the opposing goal.</p>
<p>Players continuously cycle through:</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-text">Dive
 ↓
Help
 ↓
Surface
 ↓
Recover
 ↓
Repeat
</code></pre>
<h2 id="three-basic-rules" class="toc-header"><a class="toc-anchor" href="#three-basic-rules">¶</a> Three Basic Rules</h2>
<ol>
<li>Only the stick may move the puck.</li>
<li>No player contact.</li>
<li>Surface whenever you need air.</li>
</ol>
<h2 id="safety-reminders" class="toc-header"><a class="toc-anchor" href="#safety-reminders">¶</a> Safety Reminders</h2>
<ul>
<li>Stay aware of nearby players.</li>
<li>Look up before leaving the bottom.</li>
<li>Keep your stick under control.</li>
<li>Give other players space when the bottom becomes crowded.</li>
</ul>
<h3 id="coach-focus-7" class="toc-header"><a class="toc-anchor" href="#coach-focus-7">¶</a> Coach Focus</h3>
<p>Keep explanations brief. Players will learn most effectively by getting into the water and playing.</p>
<hr>
<h1 id="h-4-play-your-first-game" class="toc-header"><a class="toc-anchor" href="#h-4-play-your-first-game">¶</a> 4. Play Your First Game</h1>
<h2 id="objective-5" class="toc-header"><a class="toc-anchor" href="#objective-5">¶</a> Objective</h2>
<p>Experience a real game of Underwater Hockey in a safe and enjoyable environment.</p>
<h2 id="new-player-integration" class="toc-header"><a class="toc-anchor" href="#new-player-integration">¶</a> New Player Integration</h2>
<p>Where possible:</p>
<ul>
<li>Use new players as a seventh "floater."</li>
<li>Identify beginners with coloured stick tape.</li>
<li>Encourage experienced players to reduce their intensity.</li>
<li>Allow beginners to dive only when they feel comfortable.</li>
</ul>
<h3 id="coach-focus-8" class="toc-header"><a class="toc-anchor" href="#coach-focus-8">¶</a> Coach Focus</h3>
<p>Encourage:</p>
<ul>
<li>Participation</li>
<li>Frequent diving</li>
<li>Surfacing early</li>
<li>Touching the puck</li>
<li>Having fun</li>
</ul>
<p>Avoid:</p>
<ul>
<li>Stopping play too often</li>
<li>Teaching tactics</li>
<li>Correcting every mistake</li>
</ul>
<p>The goal is for players to experience the game and leave wanting to return.</p>
<hr>
<h1 id="wrap-up" class="toc-header"><a class="toc-anchor" href="#wrap-up">¶</a> Wrap-up</h1>
<p>Ask players:</p>
<ul>
<li>What surprised you?</li>
<li>What felt easier than expected?</li>
<li>What was the most challenging?</li>
<li>Do you have any questions?</li>
</ul>
<p>Finish with:</p>
<blockquote>
<p>We look forward to seeing you at your next session.</p>
</blockquote>
<hr>
<h1 id="coach-success-criteria" class="toc-header"><a class="toc-anchor" href="#coach-success-criteria">¶</a> Coach Success Criteria</h1>
<p>A successful first session is not measured by skill.</p>
<p>Success means players:</p>
<ul>
<li>Felt safe.</li>
<li>Became comfortable with their equipment.</li>
<li>Dove and recovered confidently.</li>
<li>Touched the puck.</li>
<li>Played their first game.</li>
<li>Left excited to return.</li>
</ul>
