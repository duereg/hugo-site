cvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="teams/formations/2-2-2/MuffinTop/AdditionalInfo222.md"><template slot="contents"><div><h1 id="playing-zones" class="toc-header"><a class="toc-anchor" href="#playing-zones">¶</a> Playing Zones</h1>
<p><img src="/underwater_hockey_zones_diagram.jpg" alt="underwater_hockey_zones_diagram.jpg"></p>
<h3 id="open-water-play-zone" class="toc-header"><a class="toc-anchor" href="#open-water-play-zone">¶</a> Open Water Play Zone</h3>
<ul>
<li>Primary operating area of the formation</li>
<li>Covers the central half of the court</li>
<li>Focuses on open-water support and movement</li>
<li>This Zone is where the Muffin Top formation differentiates most from other formations played</li>
</ul>
<h3 id="defend-at-all-costs-zone" class="toc-header"><a class="toc-anchor" href="#defend-at-all-costs-zone">¶</a> Defend at All Costs Zone</h3>
<ul>
<li>Defensive recovery and tray protection area</li>
<li>The ¼ court near the goal we are defending</li>
<li>Includes the sub-zone Defensive Keep Out Zone</li>
</ul>
<h3 id="crash-the-goal-zone" class="toc-header"><a class="toc-anchor" href="#crash-the-goal-zone">¶</a> Crash the Goal Zone</h3>
<ul>
<li>High-pressure offensive scoring area</li>
<li>The ¼ court near the opponent’s goal</li>
<li>Includes sub-zones:
<ul>
<li>Offensive Keep Out Zones</li>
<li>Full Attack Zone 3m circle around the tray</li>
</ul>
</li>
</ul>
<h3 id="muffin-zone" class="toc-header"><a class="toc-anchor" href="#muffin-zone">¶</a> Muffin Zone</h3>
<ul>
<li>Preferred operating area of the formation</li>
<li>Extends ~5m from each side of the centerline</li>
<li>Encourages layered support and passing structure</li>
<li>Players should always redirect play from the walls back to the heart of the formation</li>
</ul>
<hr>

<h1 id="defend-at-all-costs-zone-1" class="toc-header"><a class="toc-anchor" href="#defend-at-all-costs-zone-1">¶</a> Defend at All Costs Zone</h1>
<details>
<summary>Expand Defensive Systems</summary>
<ul>
<li>Move play away from the tray</li>
<li>Protect the center lane</li>
<li>Maintain outside defensive coverage</li>
<li>Prevent reverse movement and breakaways</li>
</ul>
</details>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/DefensiveSystems" class="is-internal-link is-invalid-page">Read Full Defensive Systems</a></p>

<h1 id="crash-the-goal-zone-1" class="toc-header"><a class="toc-anchor" href="#crash-the-goal-zone-1">¶</a> Crash the Goal Zone</h1>
<details>
<summary>Expand Offensive Systems</summary>
<ul>
<li>Maintain offensive pressure near the tray</li>
<li>Create high-quality scoring opportunities</li>
<li>Recycle possession safely</li>
<li>Prevent counterattacks during recovery</li>
</ul>
</details>

<h3 id="center-compression-attack" class="toc-header"><a class="toc-anchor" href="#center-compression-attack">¶</a> Center Compression Attack</h3>
<ul>
<li>Pull defenders inward to create space</li>
</ul>
<h3 id="wing-seam-attack" class="toc-header"><a class="toc-anchor" href="#wing-seam-attack">¶</a> Wing Seam Attack</h3>
<ul>
<li>Attack open-water lanes through movement</li>
</ul>

</ul>
