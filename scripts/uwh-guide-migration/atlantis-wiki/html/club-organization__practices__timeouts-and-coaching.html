club-organization/practices/timeouts-and-coaching.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>When practicing, players and coaches should take time to offer advice to all players in the water. Coaches can call timeouts whenever they wish to speak to a player, allowing plenty of time to fully discuss a point.&nbsp;</p>
<p>Timeouts are limited to one minute each but are not limited in number (unless a team decides otherwise). The time limit is added to make sure everyone still plays enough and that no one gets cold. Players can call timeouts between points or during stoppages due to fouls.&nbsp;</p>
<p>Another option for coaching is calling “teaching moment” stoppages, the same way <a href="/club-organization/practices/self-reffing" class="is-internal-link is-valid-page">self called fouls</a> are called. If a player calls a “teaching moment,” they will award the other team the advantage. They will then coach the player they wish to talk to, generally limiting the discussion to a minute.&nbsp;</p>
