<p>These are hard-won lessons that go beyond knowing the rules — they help you apply them confidently in a real match.</p>
<hr>
<h2 id="general-tips" class="toc-header"><a class="toc-anchor" href="#general-tips">¶</a> General Tips</h2>
<p><strong>Two guiding principles:</strong></p>
<blockquote>
<p>Protect the players (safety first)</p>
</blockquote>
<blockquote>
<p>Keep the puck playing as much as possible</p>
</blockquote>
<h3 id="check-the-clock-when-signalling-a-goal" class="toc-header"><a class="toc-anchor" href="#check-the-clock-when-signalling-a-goal">¶</a> Check the clock when signalling a goal</h3>
<p>Before raising your arms for a goal, glance at the match clock. If the buzzer sounds at the same time as the goal is scored, the sequence matters — did the puck enter the goal <em>before</em> the signal? If the signal came first, it's no goal.</p>
<h3 id="use-your-body-to-measure-puck-placement-distances" class="toc-header"><a class="toc-anchor" href="#use-your-body-to-measure-puck-placement-distances">¶</a> Use your body to measure puck placement distances</h3>
<p>You won't have time to count tiles. Instead, use your own body as a reference tool:</p>
<ul>
<li><strong>Your height + outstretched arms + fins</strong> gives you a reliable rough measure for the common distances (2 m, 3 m, 5 m).</li>
<li>For the <strong>3 m puck placement line</strong>, use the pool tiles as a visual shortcut:</li>
</ul>
<p><img src="/referees/07_tiles_guide.png" alt="07_tiles_guide.png"></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">  2 full black T-lines + 3 tiles = 3 metres
</code></pre>
<p>Practise this in training so it becomes instinctive.</p>
<h3 id="signal-stop-clearly-and-calmly" class="toc-header"><a class="toc-anchor" href="#signal-stop-clearly-and-calmly">¶</a> Signal stop clearly and calmly</h3>
<p>A sharp, unambiguous stop signal (wide rapid wave, arm up) prevents players from continuing to play and accumulating frustration. Hesitant or half-hearted signals create confusion. Own the call.</p>
<h3 id="communicate-with-players-to-de-escalate-frustration" class="toc-header"><a class="toc-anchor" href="#communicate-with-players-to-de-escalate-frustration">¶</a> Communicate with players to de-escalate frustration</h3>
<p>Players who feel unheard escalate. A short, calm explanation ("your arm was blocking") is far more effective than silence. You are not required to justify every call, but a word at the right moment prevents the situation from worsening.</p>
<h3 id="use-the-advantage-rule-as-thinking-time" class="toc-header"><a class="toc-anchor" href="#use-the-advantage-rule-as-thinking-time">¶</a> Use the advantage rule as thinking time</h3>
<p>When you see a potential infringement, don't immediately blow the whistle. Play the advantage and <strong>use those extra seconds to confirm what you saw</strong> and visualise the next likely play. The advantage rule is not just a game mechanic — it is a decision-making tool.</p>
<h3 id="identify-players-by-number-when-stopping-play" class="toc-header"><a class="toc-anchor" href="#identify-players-by-number-when-stopping-play">¶</a> Identify players by number when stopping play</h3>
<p>When signalling a penalty, always point to the player's <strong>cap number</strong>, not just a vague direction. This avoids ambiguity, is documented on the scorecard, and speeds up the penalty box procedure.</p>
<h3 id="flicks-chase-and-obstruction" class="toc-header"><a class="toc-anchor" href="#flicks-chase-and-obstruction">¶</a> "Flicks &amp; chase" and obstruction</h3>
<p>When a player flicks the puck forward and chases it:</p>
<ul>
<li>If a <strong>defender moves towards a different direction</strong> from where the puck went, they are obstructing the path — <strong>call obstruction</strong>.</li>
<li>If the defender moves toward the puck, it is a legitimate contest.</li>
</ul>
<h3 id="referee-time-outs-are-for-nobodys-fault-situations" class="toc-header"><a class="toc-anchor" href="#referee-time-outs-are-for-nobodys-fault-situations">¶</a> Referee time-outs are for "nobody's fault" situations</h3>
<p>Use a referee time-out (time suspension) when something happens that requires stopping play but no player is responsible — e.g., a goal frame shifted out of place, equipment malfunction, or unclear situation requiring a conference. Do not use it as a substitute for making a call.</p>
<p><strong>Signal:</strong> Form a large "O" over the head, then bring hands to shoulder level and pat both shoulders.</p>
<hr>
<h2 id="tips-for-the-chief-referee" class="toc-header"><a class="toc-anchor" href="#tips-for-the-chief-referee">¶</a> Tips for the Chief Referee</h2>
<h3 id="periodically-check-the-substitution-area" class="toc-header"><a class="toc-anchor" href="#periodically-check-the-substitution-area">¶</a> Periodically check the substitution area</h3>
<p>Players sometimes sink their head into the water while in the subs area to watch the play or communicate with teammates underwater. This is illegal. Scan the subs area regularly, especially in tense moments.</p>
<h3 id="dont-give-warnings-too-early" class="toc-header"><a class="toc-anchor" href="#dont-give-warnings-too-early">¶</a> Don't give warnings too early</h3>
<p>Once you issue a formal caution (warning) for an infringement, <strong>all referees are now committed</strong> — the next occurrence must escalate to a time penalty. If you caution too early in a match, you lose the lighter tool. When a situation is minor and truly borderline, a quiet word may be more effective than a formal caution.</p>
<h3 id="advantage-rule-applies-even-on-a-breaking-infringement" class="toc-header"><a class="toc-anchor" href="#advantage-rule-applies-even-on-a-breaking-infringement">¶</a> Advantage rule applies even on a "breaking" infringement</h3>
<p>If a player breaks (leaves the end wall before the start signal) but the other team immediately gains possession and has an advantage, you can play the advantage rule. The infringed team does not have to restart just because there was a false start — assess whether restarting actually helps them.</p>
<hr>
<h2 id="common-faults-how-to-identify-them" class="toc-header"><a class="toc-anchor" href="#common-faults-how-to-identify-them">¶</a> Common Faults &amp; How to Identify Them</h2>
<h3 id="puck-out-of-bounds-who-touched-it-last" class="toc-header"><a class="toc-anchor" href="#puck-out-of-bounds-who-touched-it-last">¶</a> Puck out of bounds — who touched it last?</h3>
<ul>
<li>Track the puck and the last stick to make contact. The last player to touch it with their stick before it leaves the playing area gets the <strong>disadvantage puck</strong>.</li>
<li>If you genuinely did not see who last touched it → <strong>equal puck</strong>. Do not guess.</li>
</ul>
<h3 id="corner-rule-attacking-teams-too" class="toc-header"><a class="toc-anchor" href="#corner-rule-attacking-teams-too">¶</a> Corner rule — attacking teams too</h3>
<p>The corner delay-of-game rule applies to <strong>both teams</strong>. It is common for players and coaches to assume only the defending team can be penalised for a corner infringement. An attacking team holding the puck in the corner in succession without attempting to exit is equally penalisable.</p>
<h3 id="unsportsmanlike-conduct-intent-matters" class="toc-header"><a class="toc-anchor" href="#unsportsmanlike-conduct-intent-matters">¶</a> Unsportsmanlike conduct — intent matters</h3>
<p>Unsportsmanlike conduct is not limited to insults or aggression. <strong>Any action with the intention of damaging someone or deliberately delaying the game</strong> qualifies. This includes moving floating lines, deliberately knocking the goal out of position, or theatrical time-wasting after a stoppage.</p>
<hr>
<h2 id="dangerous-play-flick-decision-tree" class="toc-header"><a class="toc-anchor" href="#dangerous-play-flick-decision-tree">¶</a> Dangerous Play / Flick Decision Tree</h2>
<p>When assessing whether a flick was dangerous play or a legitimate action, work through these questions in order:</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">1. Was the defender moving at the moment of the flick?
   ├─ NO  → point for the DEFENDER (they were stationary or hard to anticipate)
   └─ YES → point for the ATTACKER (defender moved into the path)

2. Was there an opportunity to pass to a teammate instead?
   ├─ NO  → point for the DEFENDER (attacker had no choice but to flick)
   └─ YES → point for the ATTACKER (reckless choice when a pass was available)

3. Was the flick directed towards the goal?
   ├─ NO  → point for the DEFENDER (flick had no productive purpose)
   └─ YES → point for the ATTACKER (legitimate attacking intent)

4. Was the flick aimed at a sensitive body part (head, joint, etc.)?
   ├─ NO  → point for the ATTACKER (no aggravating factor)
   └─ YES → point for the DEFENDER (disproportionate danger regardless of intent)
</code></pre>
<p>Use the overall picture — these are not four separate penalties. They are <strong>factors to weigh</strong> when making the single judgement call of whether the flick was dangerous.</p>
<hr>
<h2 id="legal-player-tactics-to-watch-for" class="toc-header"><a class="toc-anchor" href="#legal-player-tactics-to-watch-for">¶</a> Legal Player Tactics to Watch For</h2>
<p>These are legal plays that sometimes appear suspicious. <strong>Do not penalise them.</strong></p>
<div class="table-container"><table>
<thead>
<tr>
<th>Situation</th>
<th>Why it's legal</th>
</tr>
</thead>
<tbody>
<tr>
<td>Player flicks the puck at an opponent's fins</td>
<td>Fins are part of the play — a puck striking fins during a legitimate flick is not dangerous play</td>
</tr>
<tr>
<td>Player takes the puck outside the 1 m corner arc while keeping possession</td>
<td>The corner rule only applies while the puck is <em>inside</em> the corner; exiting is the correct legal move</td>
</tr>
</tbody>
</table></div>
<hr>
<h2 id="clock-management-reference" class="toc-header"><a class="toc-anchor" href="#clock-management-reference">¶</a> Clock Management Reference</h2>
<div class="table-container"><table>
<thead>
<tr>
<th>Event</th>
<th>Clock behaviour</th>
</tr>
</thead>
<tbody>
<tr>
<td>Team time-out</td>
<td>Stopped · 1 minute per team per half</td>
</tr>
<tr>
<td>Referee time-out</td>
<td>Stopped · duration at CR discretion</td>
</tr>
<tr>
<td>Penalty shot</td>
<td>Stopped · restarts on CR signal after conclusion</td>
</tr>
<tr>
<td>Any infringement in last 2 min of second half</td>
<td>Stopped on each break in play</td>
</tr>
<tr>
<td>Any infringement in last 2 min of second OT period</td>
<td>Stopped on each break in play</td>
</tr>
<tr>
<td>Sudden death period</td>
<td>Stopped on every break in play</td>
</tr>
<tr>
<td>Goal (normal time, outside last 2 min)</td>
<td>Clock keeps running</td>
</tr>
</tbody>
</table></div>
