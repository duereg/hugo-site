oc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Providing food for tournament participants to eat between games is an optional addition to the tournament, but is often greatly appreciated. Since there are often four to six games a day for teams, it is hard to go out and eat a full meal during the day. Because of this, players appreciate having food at the pool that they can snack on throughout the day. A little extra can be added on to the team entry fee to cover the cost of the food.&nbsp;</p>
<p>It is up to the organizers to decide what food and how much food to provide, but here is a general idea of what can be provided:</p>
<ul>
  <li>Bread and sandwich toppings (PB&amp;J, meats, cheeses, hummus, etc.)</li>
  <li>Cup noodles</li>
  <li>Bananas</li>
  <li>Fruits and veggies&nbsp;</li>
  <li>Chips and dips</li>
  <li>Sweets (cookies, candy)</li>
  <li>Gatorade</li>
</ul>
