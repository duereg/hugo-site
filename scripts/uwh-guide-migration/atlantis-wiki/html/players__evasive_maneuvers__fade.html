<p>The fade is a small maneuver used to advance the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> past the <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick </a>of an opponent who is facing the player straight on. The player does a small sideways maneuver to their playing hand side to move the puck around the opponents stick and uses their legs to accelerate past the opponent, getting the puck a safe distance past the opponent.</p>
<p>What to think about with the fade:</p>
<ol>
  <li>The sideways movement of the puck should be just big enough to keep the puck out of the reach of the opponent. If this maneuver gets too large, or the player does too much of a sideways movement, control of the puck is reduced, making it easier for opponents to knock the puck off the player's stick.</li>
  <li>The sideways movement can be done by angling the stick forward, or in other words, increasing the angle between the stick and forearm to push the puck sideways and forward. Once the puck is far enough to the player’s playing hand side to just get around the opponent's stick, the player can then return to advancing the puck straight forward.</li>
  <li>As the player does the sideways movement of the puck, they need to accelerate with their legs. This ensures that once the puck gets past the opponents stick, it will quickly be out of the reach of the opponent.</li>
  <li>The player may enter the <a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">cobra position</a> before lunging forward into the fade maneuver. The player's hips should never lift off the playing surface.</li>
  <li>The free arm should stay at the player's side throughout the maneuver as it is extremely easy to interfere with the opponent with the free arm, which is a foul.</li>
</ol>
<p>This move is extremely effective when paired with the <a href="/players/evasive_maneuvers/deke" class="is-internal-link is-valid-page">deke</a>. A player that can effectively deke and fade can make opponents always question which side of them the player will go to, making it easy to make the opponent commit to the wrong side.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This move is most effective for advancing the puck forward from whatever position the player is currently facing, often straight up pool. It is most effective when a player comes face to face with an opponent whose shoulders, hips and feet are all in line straight ahead of the player. The player can use the fade if there is open space beyond the opponent or a teammate to which a pass may be difficult.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>The fade is difficult to do successfully if the opponent is angled with their torso turned sideways. The opponent already being partially turned around allows them to follow and reach for the puck as the player does the fade maneuver past them. This maneuver also should not be attempted if the opponent jumps hard at the puck as the two players approach each other.</p>

<div class="quickreference green">

  <p><strong><u>SKILL NAME</u></strong></p>
  <ul>
    <li>MOVE THE PUCK AROUND THE PLAYING HAND SIDE OF THE OPPONENT'S STICK AND MOVE PAST THEM BEFORE THEY CAN STEAL THE PUCK</li>
    <li>DON'T MAKE THE MANEUVER TOO BIG IN ORDER TO KEEP MAXIMAL CONTROL&nbsp;</li>
    <li>KICK HARD WHEN MOVING PAST THE OPPONENT</li>
