2ZpbGVuYW1lfSJ9" filename="players/individual_fundamentals/puck_handling/passes.html"><template slot="contents"><div><h1 class="toc-header" id="description"><a href="#description" class="toc-anchor">¶</a> Description</h1>
<p>Passing is a major aspect of Underwater Hockey and is a primary reason the sport evolved from the parent sport of Octopush.</p>
<p>Being able to propel the <a class="is-internal-link is-valid-page" href="/game/gear-setup/pucks">Puck</a> away from yourself and to a teammate is a valuable skill and allows the game to “open" which spreads the <a class="is-internal-link is-valid-page" href="/players">Players</a> around. There are several ways to propel the puck and each has some advantages and disadvantages.&nbsp;</p>
<p>A flick is what many associate with the act of passing the puck and can be performed in several ways. The <a class="is-internal-link is-valid-page" href="/players/individual_fundamentals/puck_handling/passes/flicks-no_stick_lift">Flicks with no stick lift</a> allow for a quick release with little indication that a player is about to make a pass; however, generally the flick distance is not as long. <a class="is-internal-link is-valid-page" href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion">Flicks with full motion</a> take longer to perform (and require more practice to perfect) but can travel further; the drawback for these flicks is that they are often easier to <a class="is-internal-link is-valid-page" href="/players/tackling_maneuvers/knock-downs">Knock-Down</a>.</p>
<p><a class="is-internal-link is-valid-page" href="/players/individual_fundamentals/puck_handling/passes/inside_flicks">Inside Flicks</a> are another option for moving the puck, either to a teammate, to score, or to re-direct the puck away from an offender to a space that is more advantageous for the player.</p>
<p>For smooth <a class="is-internal-link is-valid-page" href="/game/gear-setup/playing_surfaces">Playing Surfaces</a> the option to use a <a class="is-internal-link is-valid-page" href="/players/individual_fundamentals/puck_handling/passes/sliders">Slider</a> is often overlooked but it is a valuable tool when used properly. While slower and easier to intercept than a pass, a slider can set your teammate up for success because they will not need to <a class="is-internal-link is-valid-page" href="/players/individual_fundamentals/puck_handling/settling_the_puck">Settle the Puck</a> when receiving the pass and can immediately enter an <a class="is-internal-link is-valid-page" href="/players/evasive_maneuvers">Evasive Maneuver</a> if necessary.</p>
<p>The most difficult passing option is the <a class="is-internal-link is-valid-page" href="/players/individual_fundamentals/puck_handling/passes/rollers">Roller</a>. Oftentimes a roller occurs accidentally when a player is unsuccessful at their flicking motion. While rollers can be done intentionally, they are usually unpredictable in how they will travel. However, they can travel long distances if rolled into open areas of the play.</p>
