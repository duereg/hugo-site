<p>The fins-first dive is used when a player wishes to dive to the bottom of the pool directly beneath where they are floating on the surface.</p>
<p>Steps to dive fins first:</p>
<ol>
  <li>The playing arm should remain stretched out towards the bottom of the pool throughout the entire dive.</li>
  <li>The free arm should be moved in a wide arc starting at the hip and moving forward and upward in front of the player, pushing the torso downward. The free arm shoulder should be lower, or closer to the bottom of the pool as this motion starts, and as the arm moves through the arc motion, the player’s shoulders should rotate so that the playing hand shoulder is closer to the bottom. This increases the distance the free arm can cover to push the player down.</li>
  <li>The legs should be pointing down, and as the free arm moves in an arc to begin the downward movement of the player, the legs should bend at the knee to aid the downward movement.</li>
  <li>The playing hand and <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> should be the first thing in contact with the bottom of the pool, and shortly thereafter the hips should reach the bottom as well.</li>
  <li>The player should end up in a<a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page"> cobra position,</a> right below their starting point on the surface.</li>
</ol>
<h1 id="demonstration-video" class="toc-header"><a class="toc-anchor" href="#demonstration-video">¶</a> Demonstration Video</h1>

<h1 id="when-to-use" class="toc-header"><a class="toc-anchor" href="#when-to-use">¶</a> When to Use</h1>
<p>This dive should be used as often as possible as it gets the player to the bottom of the pool in a very good body position with their hips low to the bottom. This gives the player more strength if they receive the puck and allows them to see what is around them much better than if their hips are up off the bottom.</p>
<p>This kind of dive is also the fastest way to get to the bottom of the pool, and is therefore commonly used for <a href="/game/protocols/equal_puck" class="is-internal-link is-valid-page">equal pucks</a> where players are racing from the surface straight down to get to the puck first.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>The fins-first dive may not be the best option if the puck is fairly far away from the player or they are chasing an opponent who is swimming away from them. If that is the case, the player may wish to do a <a href="/players/individual_fundamentals/moving_in_the_water/diving_while_swimming" class="is-internal-link is-valid-page">dive while swimming</a><i> </i> which allows the player to follow a more direct path to the puck.</p>

<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
  <p><u>FINS-FIRST-DIVE</u></p>
  <ul>
    <li>START WITH FIN TIPS POINTED TOWARDS THE BOTTOM OF THE POOL&nbsp;</li>
    <li>USE THE FREE ARM TO PUSH YOURSELF DOWN, ROTATING THE SHOULDERS TO GET AS MUCH PUSH FROM THE FREE ARM AS POSSIBLE</li>
    <li>THE PLAYING HAND SHOULD BE THE FIRST THING TO TOUCH THE BOTTOM, AND SHORTLY AFTER THE HIPS SHOULD TOUCH</li>
    <li>THE PLAYER SHOULD REACH THE PLAYING SURFACE RIGHT BELOW THEIR STARTING POINT</li>
  </ul>
