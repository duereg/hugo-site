<p>Finding a pool to start an underwater hockey club at can take a lot of time, but is obviously an important part of the process. Here are a few steps for finding a pool.</p>
<ol>
  <li>Start by using google maps and searching for “community pools,” “aquatic centers,” “swimming.” Also look for recreations centers or YMCA facilities, as these often have pools.</li>
  <li>Create a list of all the pools you find, and include a phone number for each.</li>
  <li>Once a few pools have been identified, begin calling the facilities and ask to speak to the aquatics director or pool manager. (Ask for an email if these people are not available at the time.)</li>
  <li>Questions to ask:<ul>
      <li>Would the facility be interested in and willing to welcome a new sport into their pool? The practices could be added to the pool’s regular programming or it could be added after-hours.</li>
      <li>Is there an area that is at least four lanes wide and 25 yards/meters long that could be used?</li>
      <li>What hours are available for potential pool rental?</li>
      <li>What is the depth of the pool? Is there a slope (not preferred, but can work)? You can ask what kind of surface the bottom of the pool is, but most times they will not know this.</li>
      <li>Is there a time you could tour the facility?</li>
    </ul>
  </li>
  <li>Often times it is helpful to explain how the sport works and the benefits of playing to the pool manager as it makes them more interested in hosting practices.</li>
  <li>Many pools are concerned about the safely of the sport. Here are a few tips for handling this:<ul>
      <li>The sport has limited contact and has only small risk of injury. The most common injuries are bumps/bruises and scrapes.</li>
      <li>The typical breath hold time is 10-12 seconds, which is comparable to the time lap swimmers spend underwater on flip turns.</li>
      <li>Although it is generally better to not bring up shallow water blackout, if the pool asks about it, mention that hyperventilation (which is done to artificially increase O2 levels in the body, leading to shallow water blackout after breath holds) is strongly discouraged.</li>
    </ul>
  </li>
  <li>It can be helpful to email extra information and a recap of the conversation after the call.</li>
  <li>Expect it to take a week or two to hear back from the facilities.</li>
</ol>

          <p><strong><u>FINDING A POOL</u></strong></p>
          <ul>
            <li>FIND POOLS THAT HAVE A 4 TO 6 LANE (25YD/M) AREA THAT IS 6-10 FEET DEEP.</li>
            <li>CONTACT THESE POOLS AND ASK IF AND WHEN THEY COULD HAVE UNDERWATER HOCKEY PRACTICE AT THEIR FACILITY</li>
            <li>IF THEY ARE CONCERNED ABOUT THE SAFETY OF THE SPORT, LET THEM KNOW THAT THE SPROT IS NON CONTACT, AND INJURIES ARE RARE</li>
