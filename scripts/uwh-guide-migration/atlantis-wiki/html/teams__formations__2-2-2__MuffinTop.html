<p>Basic formation structure:</p>
<ul>
<li>2 Forwards</li>
<li>2 Wings</li>
<li>2 Backs</li>
</ul>
<p><img src="/underwater_hockey_combined_legend.jpg" alt="underwater_hockey_combined_legend.jpg"></p>
<hr>
<h2 id="overview" class="toc-header"><a class="toc-anchor" href="#overview">¶</a> Overview</h2>
<p>The Muffin Top is an approximate 2-2-2 formation designed to encourage play through the center of the pool rather than along the walls.</p>
<p>The formation focuses on:</p>
<ul>
<li>Moving play off the walls into open-water</li>
<li>Maintaining possesion of the puck</li>
<li>Developing individual and teamwork skills</li>
</ul>
<p>Primarily used as a development and training formation, the Muffin Top helps players become more comfortable operating in the 3m–6m central area between trays.</p>
<hr>
<h2 id="main-goal" class="toc-header"><a class="toc-anchor" href="#main-goal">¶</a> Main Goal</h2>
<ul>
<li>Move play away from the walls</li>
<li>Maintain layered support through the middle</li>
<li>Create safer passing options in open water</li>
<li>Improve tactical flexibility across other formations</li>
</ul>
<hr>
<h1 id="playing-zones" class="toc-header"><a class="toc-anchor" href="#playing-zones">¶</a> Playing Zones</h1>
<p><img src="/underwater_hockey_zones_diagram.jpg" alt="underwater_hockey_zones_diagram.jpg"></p>
<h3 id="open-water-play-zone" class="toc-header"><a class="toc-anchor" href="#open-water-play-zone">¶</a> Open Water Play Zone</h3>
<ul>
<li>Primary operating area of the formation</li>
<li>Covers the central half of the court</li>
<li>Focuses on open-water support and movement</li>
<li>This Zone is where the Muffin Top formation differentiates most from other formations played</li>
</ul>
<h3 id="defend-at-all-costs-zone" class="toc-header"><a class="toc-anchor" href="#defend-at-all-costs-zone">¶</a> Defend at All Costs Zone</h3>
<ul>
<li>Defensive recovery and tray protection area</li>
<li>The ¼ court near the goal we are defending</li>
<li>Includes the sub-zone Defensive Keep Out Zone</li>
</ul>
<h3 id="crash-the-goal-zone" class="toc-header"><a class="toc-anchor" href="#crash-the-goal-zone">¶</a> Crash the Goal Zone</h3>
<ul>
<li>High-pressure offensive scoring area</li>
<li>The ¼ court near the opponent’s goal</li>
<li>Includes sub-zones:
<ul>
<li>Offensive Keep Out Zones</li>
<li>Full Attack Zone 3m circle around the tray</li>
</ul>
</li>
</ul>
<h3 id="muffin-zone" class="toc-header"><a class="toc-anchor" href="#muffin-zone">¶</a> Muffin Zone</h3>
<ul>
<li>Preferred operating area of the formation</li>
<li>Extends ~5m from each side of the centerline</li>
<li>Encourages layered support and passing structure</li>
<li>Players should always redirect play from the walls back to the heart of the formation</li>
</ul>
<hr>
<h1 id="forward-roles" class="toc-header"><a class="toc-anchor" href="#forward-roles">¶</a> Forward Roles</h1>
<p><img src="/underwater_hockey_movement_diagram.jpg" alt="underwater_hockey_movement_diagram.jpg"></p>
<p>The Forward line consists of:</p>
<ul>
<li>FC — Controlling Forward</li>
<li>FD — Disrupting Forward</li>
</ul>
<p>Both roles work together to:</p>
<ul>
<li>Maintain forward pressure</li>
<li>Support open-water progression</li>
<li>Disrupt opponent structure</li>
<li>Recycle possession safely</li>
</ul>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/ForwardRole" class="is-internal-link is-valid-page">Read Full Forward Role</a></p>
<hr>

<details>
<summary>Expand FC Summary</summary>
<ul>
<li>Maintains controlled possession</li>
<li>Provides safe forward passing option</li>
<li>Supports offensive structure through the center</li>
<li>Recycles possession under pressure</li>
</ul>
</details>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/FCRole" class="is-internal-link is-valid-page">Read Full FC Role</a></p>
<hr>
<h2 id="disrupting-forward-fd" class="toc-header"><a class="toc-anchor" href="#disrupting-forward-fd">¶</a> Disrupting Forward (FD)</h2>
<details>
<summary>Expand FD Summary</summary>
<ul>
<li>Disrupts passing lanes</li>
<li>Pressures transitions</li>
<li>Creates defensive chaos</li>
<li>Supports offensive pushes when needed</li>
</ul>
</details>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/FDRole" class="is-internal-link is-valid-page">Read Full FD Role</a></p>
<hr>
<h1 id="wing-roles" class="toc-header"><a class="toc-anchor" href="#wing-roles">¶</a> Wing Roles</h1>
<p><img src="/underwater_hockey_wing_play_diagram.jpg" alt="underwater_hockey_wing_play_diagram.jpg"></p>
<p>The Wings provide the outside pressure and structure for the formation.</p>
<p>Their primary responsibilities are:</p>
<ul>
<li>Prevent the opposing team from advancing around the outside of the formation</li>
<li>Funnel the puck toward the center or heart of formation towards the support</li>
<li>Support offensive progression through controlled movement and pressure</li>
<li>Maintain defensive balance during transitions</li>
</ul>
<hr>
<h2 id="strong-wing" class="toc-header"><a class="toc-anchor" href="#strong-wing">¶</a> Strong Wing</h2>
<details>
<summary>Expand Strong Wing Summary</summary>
<ul>
<li>Primary offensive pressure player</li>
<li>Attacks open-water lanes</li>
<li>Maintains movement while in possession</li>
<li>Drives offensive progression</li>
</ul>
</details>
<hr>
<h2 id="weak-wing" class="toc-header"><a class="toc-anchor" href="#weak-wing">¶</a> Weak Wing</h2>
<details>
<summary>Expand Weak Wing Summary</summary>
<ul>
<li>Acts as Last Back</li>
<li>Maintains defensive balance</li>
<li>Protects recovery lanes</li>
<li>Supports transitions safely</li>
</ul>
</details>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/WingSystems" class="is-internal-link is-valid-page">Read Full Wing Systems</a></p>
<hr>
<h1 id="back-roles" class="toc-header"><a class="toc-anchor" href="#back-roles">¶</a> Back Roles</h1>
<p><img src="/underwater_hockey_breakout_diagram.jpg" alt="underwater_hockey_breakout_diagram.jpg"></p>
<p>The Backs:</p>
<ul>
<li>Maintain central structure</li>
<li>Support Wings and Forwards</li>
<li>Control offensive cycling</li>
<li>Recycle possession safely</li>
</ul>
<hr>
<h2 id="zig-zag-cycling" class="toc-header"><a class="toc-anchor" href="#zig-zag-cycling">¶</a> Zig-Zag Cycling</h2>
<details>
<summary>Expand Zig-Zag Summary</summary>
<ul>
<li>Shifts defensive pressure laterally</li>
<li>Creates passing lanes</li>
<li>Resets offensive structure</li>
<li>Opens attacking opportunities</li>
</ul>
</details>
