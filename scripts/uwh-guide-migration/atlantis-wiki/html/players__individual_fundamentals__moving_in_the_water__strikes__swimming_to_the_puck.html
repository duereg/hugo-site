<p>Once the player has <a href="/players/individual_fundamentals/moving_in_the_water/strikes/leaving_the_wall" class="is-internal-link is-valid-page">left the wall</a><i> </i> they have two options for swimming to the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>:</p>
<ol>
  <li>Players can immediately do a <a href="/players/individual_fundamentals/moving_in_the_water/diving_while_swimming" class="is-internal-link is-valid-page">dive while swimming</a> and <a href="/players/individual_fundamentals/moving_in_the_water/kicking_mid-water" class="is-internal-link is-valid-page">kick at mid-water</a><i> </i> to get to the puck. Once they get close to the puck they can swim lower to get close to the playing surface and arrive at the puck with a strong body position.</li>
  <li>Players can also swim freestyle on the surface most of the way to the puck, and once they are close do a dive while swimming and end up on the bottom when they reach the puck.</li>
</ol>
<p>Both options are fast and effective ways to get to the puck. In general the swimming underwater method is faster, but is also more difficult because the player can not breathe while swimming to the puck.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>One of these two methods should be used by the player(s) racing for the puck at the beginning of every point. All players on the team can use it, regardless of wether they are the ones going for the puck. All players on the team should be at the bottom ready to play at the start of the point.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>If a player decides to put their head down into a streamline as they swim underwater to the puck, to make themselves faster, they should take care to look up early enough. They should look up well before they get to the puck or before the opponent reaches the puck. It is critical to know what is ahead when taking the strike.</p>
