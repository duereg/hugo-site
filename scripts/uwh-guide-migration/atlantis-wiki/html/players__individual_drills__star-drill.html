<p>This drill is used to practice moving the puck around underneath the torso. Players trace the shape of a star beneath themselves with the puck. Many maneuvers use components of this movement.</p>
<h1 id="drill-setup" class="toc-header"><a class="toc-anchor" href="#drill-setup">¶</a> Drill Setup</h1>
<figure class="image image_resized" style="width:34.32%;"><img src="/star_drill.jpg">
  <figcaption>Trace the path of a star with the puck under the torso.&nbsp;</figcaption>
</figure>

<h1 id="steps-for-running-the-drill" class="toc-header"><a class="toc-anchor" href="#steps-for-running-the-drill">¶</a> Steps for Running the Drill</h1>
<ol>
  <li>Practice moving the puck along one side of the star at a time.<ol>
      <li>Pick one side of the star and move the puck from one end to the other over and over again.</li>
      <li>Looking at the puck through the move at first is ok, but keep practicing until looking up is easy.</li>
      <li>Once looking up the entire time and moving the puck along the line is easy, pick another side and repeat.</li>
    </ol>
  </li>
  <li>Pick two consecutive sides and practice connecting the two into one motion. Again, practice until looking up the entire time is comfortable.</li>
  <li>Repeat with three, then four sides.</li>
  <li>Practice tracing the entire star shape in both directions.</li>
</ol>
<p>&nbsp;</p>
<p>This drill may take several sessions to get to the point where tracing the entire star is possible.&nbsp;</p>
<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
  <p><u>STAR DRILL</u></p>
  <ol>
    <li>SET UP IN A STRONG BODY POSITION ON THE BOTTOM OF THE POOL</li>
    <li>PICTURE A STAR DRAWN BENEATH THE TORSO ON THE PLAYING SURFACE THAT IS REACHES FROM EACH HIP TO A FULL ARM EXTENSION IN FRONT</li>
    <li>TRACE THIS STAR WITH THE PUCK, STARTING WITH ONE SIDE OF THE STAR AT A TIME</li>
  </ol>
