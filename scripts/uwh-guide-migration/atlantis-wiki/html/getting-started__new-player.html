</div><p>
Welcome to Underwater Hockey (UWH). This page is your quick on-ramp: what the sport is, what your first session looks like,
what to bring, what comfort level you should have before joining, and the most common beginner mistakes (so you can avoid them).
</p><div>

</div><hr><div>

</div><h2 id="what-is-underwater-hockey" class="toc-header"><a class="toc-anchor" href="#what-is-underwater-hockey">¶</a> What is Underwater Hockey?</h2><div>

</div><p>
Underwater Hockey is a team sport played on the bottom of a swimming pool. Two teams compete to move a puck along the pool floor
and score by pushing it into the opposing goal using a short stick.
</p><div>

</div><p><b>Basic idea:</b></p>
<ul>
  <li>Play happens mostly underwater on the pool bottom.</li>
  <li>Players take short breath-hold “dives” to play, then return to the surface to breathe.</li>
  <li>The puck is played with the stick only (no hands).</li>
  <li>It’s fast, fun, and very teamwork-focused.</li>
</ul><div>

</div><p><b>What you’ll notice right away:</b></p>
<ul>
  <li>Everyone rotates between underwater effort and surface recovery.</li>
  <li>Good positioning matters more than raw speed.</li>
  <li>Control and calm breathing are your superpowers as a beginner.</li>
</ul><div>
