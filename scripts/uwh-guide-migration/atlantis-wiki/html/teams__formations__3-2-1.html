<p>The <strong>3-2-1</strong> uses three forwards positioned ahead of play, two half backs supporting both attack and defense, and one full back providing defensive security and distribution.</p>
<p><strong>Formation Name:</strong> 3-2-1<br>
<strong>Player Layout:</strong> 3 Forwards, 2 Half Backs, 1 Full Back<br>
<strong>Play Style:</strong> Wide Possession / Space Creation</p>
<p>The formation focuses on:</p>
<ul>
<li>Using space to attack rather than direct straight lines</li>
<li>Creating a wide attacking structure</li>
<li>Opening swimming lanes through width</li>
<li>Avoiding prolonged wall contests</li>
<li>Maintaining possession while stretching the opposition</li>
</ul>
<p>The structure is built around creating open space and forcing the opposition to defend a wider area of the pool, allowing players to swim into space and exploit defensive gaps rather than relying on direct physical contests.</p>
<hr>
<h1 id="main-strengths" class="toc-header"><a class="toc-anchor" href="#main-strengths">¶</a> Main Strengths</h1>
<ul>
<li>Creates an open style of play with fewer stagnant wall contests</li>
<li>Stretches the opposition by creating defensive gaps</li>
<li>Multiple passing options across the width of the pool</li>
<li>Strong attacking line creates sustained pressure</li>
<li>Creates swimming opportunities through width and movement</li>
<li>Flexible structure that adapts well to changing situations</li>
</ul>
<h1 id="main-weaknesses" class="toc-header"><a class="toc-anchor" href="#main-weaknesses">¶</a> Main Weaknesses</h1>
<ul>
<li>Greater spacing can create disconnects between players</li>
<li>Requires excellent communication and positioning</li>
<li>Only three players naturally remain behind the puck</li>
<li>Forwards must recover defensively from weaker positions</li>
<li>Defensive errors can expose large areas of space</li>
</ul>
<hr>
<h1 id="core-principles" class="toc-header"><a class="toc-anchor" href="#core-principles">¶</a> Core Principles</h1>
<ul>
<li>Attack space rather than straight lines</li>
<li>Use width to create defensive gaps</li>
<li>Swim to create opportunities rather than forcing passes</li>
<li>Maintain possession until space opens</li>
<li>Use the full width of the pool</li>
<li>Keep support options available at all times</li>
<li>Forwards must contribute defensively through pressure and back-picking</li>
<li>Defensive players must remain disciplined with only three players behind the puck</li>
</ul>
<hr>
<h1 id="passing-style" class="toc-header"><a class="toc-anchor" href="#passing-style">¶</a> Passing Style</h1>
<p>The 3-2-1 prioritizes wide distribution and controlled movement over direct forward progression.</p>
<p>Progression is often created through:</p>
<ul>
<li>Long wide passes</li>
<li>Cross-pool distribution</li>
<li>Swing passes through the half backs</li>
<li>Swimming into open space when passing options are limited</li>
</ul>
<p>The formation works best when players remain patient, maintain width, and avoid forcing direct forward passes into contested areas.</p>
<hr>
<h1 id="position-responsibilities" class="toc-header"><a class="toc-anchor" href="#position-responsibilities">¶</a> Position Responsibilities</h1>
<h1 id="wings" class="toc-header"><a class="toc-anchor" href="#wings">¶</a> Wings</h1>
<p>The Wings provide width to the attack while maintaining possession and applying pressure to the opposition.</p>
<ul>
<li>Aim to gain ground</li>
<li>Maintain possession</li>
<li>Pressure opposition</li>
<li>Create wide attacking options</li>
<li>Support defensive transitions through back-picking</li>
</ul>
<h2 id="wing-role" class="toc-header"><a class="toc-anchor" href="#wing-role">¶</a> Wing Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Gain ground through controlled possession</li>
<li>Maintain attacking width</li>
<li>Provide passing outlets for the half backs</li>
<li>Support the center forward</li>
<li>Assist defensive recovery through back-picking</li>
<li>Maintain puck retention under pressure</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<p>The Wings should stay wide to stretch the opposition while remaining connected to the attacking structure.</p>
<p>When positioned ahead of the puck:</p>
<ul>
<li>Stay available for passes from the half backs</li>
<li>Create passing options for the center forward</li>
<li>Support swing initiation by curling back toward the half backs</li>
<li>Remain close enough to recover defensively when possession is lost</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Back-pick when possession is lost</li>
<li>Pressure opposition exits</li>
<li>Block backward passing options</li>
<li>Recover quickly into the defensive structure</li>
</ul>
<p><strong>Information required to complete this section:</strong></p>
<ul>
<li>Wall defensive responsibilities</li>
<li>Rotation with the half backs during sustained defense</li>
</ul>
</details>
<hr>
<h1 id="center-forward" class="toc-header"><a class="toc-anchor" href="#center-forward">¶</a> Center Forward</h1>
<p>The Center Forward controls the central attacking channel and acts as both a distributor and primary striking threat.</p>
<p>Unlike a traditional center player, the Center Forward actively assists with attacking drives, strikes, and distribution between the forwards and half backs.</p>
<h2 id="center-forward-role" class="toc-header"><a class="toc-anchor" href="#center-forward-role">¶</a> Center Forward Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Control the central attacking channel</li>
<li>Distribute the puck to attacking outlets</li>
<li>Finish scoring opportunities</li>
<li>Support wing drives</li>
<li>Connect the attacking line with the half backs</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Maintain a central attacking position</li>
<li>Stay available as a passing outlet</li>
<li>Distribute between both wings</li>
<li>Find the half backs to widen the attack</li>
<li>Support attacking drives through the middle</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Assist defensive pressure from the front</li>
<li>Help deny opposition backward passing options</li>
</ul>
<p><strong>Information required to complete this section:</strong></p>
<ul>
<li>Recovery positioning</li>
<li>Back-picking responsibilities</li>
<li>Defensive rotations during transitions</li>
</ul>
</details>
<hr>
<h1 id="half-backs" class="toc-header"><a class="toc-anchor" href="#half-backs">¶</a> Half Backs</h1>
<p>The Half Backs provide the connection between defense and attack through controlled distribution, wall control, and swing play.</p>
<ul>
<li>Stay behind the puck</li>
<li>Control wall progression</li>
<li>Feed the attacking line</li>
<li>Support defensive coverage</li>
<li>Provide swing options</li>
</ul>
<h2 id="half-back-role" class="toc-header"><a class="toc-anchor" href="#half-back-role">¶</a> Half Back Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Control progression along the wall</li>
<li>Feed the wings and center forward</li>
<li>Provide wide swing options</li>
<li>Support possession through distribution</li>
<li>Cover defensively on the opposite side</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<p>The onside Half Back positions higher while remaining behind the puck.</p>
<p>The offside Half Back hangs behind the Full Back at approximately a 45-degree angle.</p>
<p>Both players should:</p>
<ul>
<li>Stay available as swing options</li>
<li>Maintain width during possession</li>
<li>Support controlled recycling of the puck</li>
<li>Stay connected to the defensive structure</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Cover the opposite side defensively</li>
<li>Support back wall rotations</li>
<li>Recover into defensive structure quickly</li>
</ul>
<p><strong>Information required to complete this section:</strong></p>
<ul>
<li>Side wall rotation responsibilities</li>
<li>Engagement priorities</li>
<li>Relationship with the Full Back during defensive pressure</li>
</ul>
</details>
<hr>
<h1 id="full-back" class="toc-header"><a class="toc-anchor" href="#full-back">¶</a> Full Back</h1>
<p>The Full Back anchors the defensive structure and provides controlled distribution from the rear of the formation.</p>
<ul>
<li>Control the middle</li>
<li>Feed supporting players</li>
<li>Organize defensive structure</li>
<li>Initiate swings</li>
</ul>
<h2 id="full-back-role" class="toc-header"><a class="toc-anchor" href="#full-back-role">¶</a> Full Back Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Control the central defensive channel</li>
<li>Feed the puck to supporting teammates</li>
<li>Organize the defensive structure</li>
<li>Initiate swings through the half backs</li>
<li>Protect the direct line to goal</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Position ahead of the covering Half Back</li>
<li>Stay central within the defensive structure</li>
<li>Maintain protection of the main line to goal</li>
<li>Remain connected to the covering Half Back and center defensive support</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<p>The Full Back provides the final layer of defensive security and should maintain discipline with only three players naturally behind the puck.</p>
<p>Responsibilities include:</p>
<ul>
<li>Protecting the central channel</li>
<li>Preventing direct breakaways</li>
<li>Supporting back wall rotations</li>
<li>Maintaining defensive structure</li>
<li>Organizing recovery behind pressure</li>
</ul>
<p><strong>Information required to complete this section:</strong></p>
<ul>
<li>Exact back wall rotation mechanics</li>
<li>Side wall rotation responsibilities</li>
<li>Engagement rules when defending prolonged pressure</li>
</ul>
</details>
<hr>
<h1 id="possession-principles" class="toc-header"><a class="toc-anchor" href="#possession-principles">¶</a> Possession Principles</h1>
<p>The 3-2-1 prioritizes width, movement, and patient possession over forced forward progression.</p>
<p>Players should:</p>
<ul>
<li>Use long wide passes</li>
<li>Swing the puck through the half backs</li>
<li>Swim into available space</li>
<li>Maintain attacking width</li>
<li>Recycle possession when forward options are unavailable</li>
<li>Stretch the opposition before attacking through created gaps</li>
</ul>
<hr>
<h1 id="common-structural-failures" class="toc-header"><a class="toc-anchor" href="#common-structural-failures">¶</a> Common Structural Failures</h1>
<p>The structure commonly breaks down when:</p>
<ul>
<li>Players become disconnected through excessive spacing</li>
<li>Width is lost through unnecessary congestion</li>
<li>Forwards fail to recover defensively</li>
<li>Direct passes are forced into contested areas</li>
<li>Half backs become trapped on the wall</li>
<li>Defensive discipline breaks down with only three players behind the puck</li>
<li>Players stop using width and begin attacking in straight lines</li>
</ul>
