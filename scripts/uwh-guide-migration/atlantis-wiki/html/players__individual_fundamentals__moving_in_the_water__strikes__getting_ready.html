<p>Getting ready to take the strike consists of putting one hand firmly on the wall (generally the free hand) and setting both feet flat on the wall, close to the surface so that the player’s legs are curled up. The player will stretch their hand that is not on the wall out in front of of them, pointing towards the puck at the center of the pool. Their head should be in the water with their ear against the arm stretched in front of the player. Players should be able to breathe through the snorkel in this position to allow them to breathe deeply while they wait for the play to start. The player should hold this position until they hear the buzzer sound and then push off the wall.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This position can be used for the strike at the beginning of every single point. The player going for the puck should set up so that they are in line with the puck at the center of the pool, making their line to the puck as short as possible.</p>
<h1 id="real-life-example-video-clip" class="toc-header"><a class="toc-anchor" href="#real-life-example-video-clip">¶</a> Real-life Example Video Clip</h1>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/oh4yo2anixA?clip=UgkxDT61h6j6w2Yn1iUheXiup8i8UqpfXwXp&amp;clipt=EJaZJBjVuSU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>Here the player taking the strike sets up in the ready position before the buzzer starts the play, allowing him to start as fast as possible.</p>
<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
  <p><u>GETTING READY</u></p>
  <ul>
    <li>HAVE ONE HAND ON THE WALL AND THE OTHER ARM STRETCHED OUT TWARDS THE PUCK</li>
    <li>THE FEET SHOULD BE FLAT ON THE WALL AND NOT FAR BELOW THE SURFACE SO THAT THE LEGS ARE CURLED BETWEEN THE TORSO AND THE WALL.</li>
  </ul>
