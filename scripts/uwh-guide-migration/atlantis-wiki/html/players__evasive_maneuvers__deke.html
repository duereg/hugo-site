<p>The deke is a maneuver that advances the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> and player past an opponent with very little direction change. The player uses a small swerve to move the puck around the opponent's <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a><i>, </i>quickly extends their arm with the puck<i>,</i> and accelerates hard with their kick, putting their body and the puck safely past the opponent.</p>
<p>What to think about with the deke:</p>
<ol>
  <li>The swerve motion with the stick is small and fast. The swerve is a small sideways movement to the left for right handed players (right for left handed players) that is done under the playing hand shoulder.&nbsp; The puck should stay on the front of the stick the entire time.</li>
  <li>When coming out of the swerve the playing arm will extend forward to the left side (or right side for leftys) of the opponent, moving the puck out of the reach of the opponent. This extension should go almost straight in front of the player, meaning in the same direction that the player's torso is pointed in. The maneuver should only angle out enough to lead the players body to the appropriate side of the opponent.</li>
  <li>The player must accelerate with their legs as they do the swerve and extension with their wrist and arm. Failure to do this may allow the opponent to reach back and attack the puck or could result in the puck sliding forward off the player's stick.&nbsp;</li>
  <li>Players can briefly slow down and go into the <a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">cobra position</a> before lunging forward into the swerve. When in the cobra position, the player can do a small move to their stick hand side to try to convince the opponent that they are going in that direction. Once the opponent shifts their position to follow that, the player can then more easily deke them. This makes it harder for opponents to predict which direction the player will go, often giving them more space to successfully perform the deke.</li>
  <li>Hips should stay low to the bottom through the entire deke.</li>
</ol>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This move is most effective for advancing the puck straight forward from whatever position the player is facing. It is most effective when a player comes face to face with an opponent whose shoulders, hips and feet are all in line straight ahead of the player. When the opponent is positioned like this, they do not have time to turn and attack the puck as the player dekes them and moves past them. The deke is an effective way to advance the puck without the risk of a pass being knocked down or blocked.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>This move is extremely difficult to do successfully if the opponent is not directly facing the player with the puck. This includes anytime the opponent’s hips and legs are not on the opposite side of their shoulders from the player with the puck. Even if the deke gets the player past the sideways facing opponent, it is easy for the opponent to turn and stop the forward advancement of the puck.</p>
