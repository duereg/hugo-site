<p>The cobra position is a body position that players can take up on the bottom of the pool that can be used in a variety of situations. Most importantly, the cobra position allows players to maintain a strong presence on the bottom while having a good view of everything around them. The cobra position can be used to lead into several moves including the <a href="/players/evasive_maneuvers/deke" class="is-internal-link is-valid-page">deke</a><i> </i> and <a href="/players/evasive_maneuvers/fade" class="is-internal-link is-valid-page">fade</a> maneuvers.</p>
<p>What to think about for the cobra position:</p>
<ol>
  <li>The cobra position is called this because the player rears up like a cobra snake. This means the player’s hips stay pressed to the playing surface while they arch their backs to raise their shoulders up.</li>
  <li>The puck should be below the playing arm shoulder, so the player's arm will be extended down to the playing surface to maintain contact with the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>.</li>
  <li>The player’s eyes should be up when in the cobra position. Lifting up the shoulders allows the player to more easily lift their eyes up as well. When not in the cobra position it is easy to only look down at the puck and <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick.</a></li>
  <li>To avoid floating up when in this position, players can bend their knees to point their fins up towards the surface and do small kicks from their knees to drive their hips down. The free arm can also be used to push water upward, keeping the player's body down.</li>
  <li>Players can hold this position when waiting for the puck from a teammate or when confronting an opponent that has the puck. This is an ideal position to hold when waiting and ready on the bottom.</li>
</ol>
<p>To practice using this position it is effective to spend some time outside of the game alternating between swimming forward and rearing up into the cobra position. During a game players will go in and out of the cobra position regularly, so building up the muscle memory to go in and out of this position is extremely helpful.</p>

<h1 id="when-to-use" class="toc-header"><a class="toc-anchor" href="#when-to-use">¶</a> When to Use</h1>
<p>The cobra position can be used anytime during a game. It is important for players to look around carefully to find where their teammates are. Once they have located a teammate, the player can <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">flick</a> the puck, lunge forward and swim hard or even maintain the cobra position while swimming forward.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>The only obvious time the cobra position is not good to use is if the player wishes to swim forward full speed. Trying to maintain the cobra position while swimming forward is useful at times but will drastically slow down the player. If the player wishes to move forward quickly, they should drop down to a regular swimming position with their shoulders and hips close to the playing surface, then once they stop again, pull their shoulders up and return to the cobra position.</p>
