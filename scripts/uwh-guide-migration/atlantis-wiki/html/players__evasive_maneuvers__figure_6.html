<p>The figure 6 is a maneuver used to quickly and safely change direction from going straight forward to outward towards the playing hand side.</p>
<p>The maneuver starts with the arm stretched out straight in front of the player. The player will switch the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> from the front of the <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> to the inside of the stick either by doing a <a href="/players/individual_fundamentals/puck_handling/tic-tac" class="is-internal-link is-valid-page">tick tack</a> or a <a href="/players/individual_fundamentals/puck_handling/front_to_back_roll" class="is-internal-link is-valid-page">front to back roll</a>. The player will then pull the puck downward towards their free arm shoulder, then across their chest towards the other shoulder, all with the puck on the inside of the stick. Once the puck moves past the playing hand shoulder, the player will continue moving the puck in that direction until their arm is fully extended. Once the arm is extended, the player should again do a tick tack or front to back roll to get the puck back to the front of their stick. At this point the player’s torso should be turning to allow them to <a href="/players/individual_fundamentals/moving_in_the_water/kicking_out_of_maneuvers" class="is-internal-link is-valid-page">swim out of the maneuver</a> in the direction that the player’s arm was pointing at the end of the move.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This maneuver can be used to quickly switch direction while keeping the puck protected from opponents. Since the puck is on the inside of the stick and under the torso for most of the maneuver it is difficult for opponents to grab the puck. The pull back motion at the beginning of the maneuver will also keep the puck out of the reach of any opponents directly in front of the player. A fast change in direction with the figure 6 can be used anywhere in the playing area, but one example is when a player is on the wall on their free arm side. This maneuver will move them off the wall quickly, giving them more space to advance the puck.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>This maneuver should not be used if there is an opponent on the paying hand side of the player. This is where the puck will end up if a figure 6 is done, making it very easy for that opponent to get the puck. Also, if that opponent is close enough, the player may elbow the opponent as they pull the puck across their torso, which is a <a href="/game/fouls/free-arm" class="is-internal-link is-valid-page">free-arm</a> foul against the player.</p>
