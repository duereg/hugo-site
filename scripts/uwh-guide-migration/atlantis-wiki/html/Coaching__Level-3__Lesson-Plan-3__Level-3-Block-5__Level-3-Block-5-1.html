mh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="Coaching/Level-3/Lesson-Plan-3/Level-3-Block-5/Level-3-Block-5-1.html"><template slot="contents"><div><h1 id="level-4-role-definitions-2-3-1" class="toc-header"><a class="toc-anchor" href="#level-4-role-definitions-2-3-1">¶</a> Level 4 – Role Definitions (2-3-1)</h1><div>

</div><p>This document defines player roles within the 2-3-1 formation at Level 4 (Pelagic). Each role includes responsibilities across all phases of play and situational contexts.</p>
<p>
<b>Formation reference:</b>
<a href="/teams/formations/2-3-1" class="is-internal-link is-valid-page">2-3-1</a>
</p>
<hr><div>


</div><h1 id="forward-role-level-4-pelagic" class="toc-header"><a class="toc-anchor" href="#forward-role-level-4-pelagic">¶</a> Forward Role – Level 4 (Pelagic)</h1>
<p><b>Position:</b> Forward</p><div>

</div><p><b>Primary Function:</b></p>
<ul>
  <li>Stretch the game vertically</li>
  <li>Create attacking opportunities</li>
  <li>Lead transition decisions</li>
  <li>Apply first pressure</li>
</ul><div>

</div><h2 id="attack" class="toc-header"><a class="toc-anchor" href="#attack">¶</a> Attack</h2>
<ul>
  <li>Hold depth to stretch defense</li>
  <li>Stay ahead of the puck</li>
  <li>Receive in advantage</li>
  <li>Finish or connect play</li>
</ul><div>

</div><h2 id="support" class="toc-header"><a class="toc-anchor" href="#support">¶</a> Support</h2>
<ul>
  <li>Provide forward passing option</li>
  <li>Maintain connection to play</li>
</ul><div>

</div><h2 id="pressure" class="toc-header"><a class="toc-anchor" href="#pressure">¶</a> Pressure</h2>
<ul>
  <li>Apply immediate pressure after turnover</li>
  <li>Force play wide</li>
</ul><div>

</div><h2 id="defense" class="toc-header"><a class="toc-anchor" href="#defense">¶</a> Defense</h2>
<ul>
  <li>Track back immediately</li>
  <li>Protect middle first</li>
</ul><div>

</div><h2 id="sprint-off" class="toc-header"><a class="toc-anchor" href="#sprint-off">¶</a> Sprint-Off</h2>
<ul>
  <li>React immediately to outcome</li>
</ul><div>

</div><h2 id="counterattack" class="toc-header"><a class="toc-anchor" href="#counterattack">¶</a> Counterattack</h2>
<ul>
  <li>Move into space quickly</li>
  <li>Stay connected to support</li>
</ul><div>

</div><h2 id="goal-scoring" class="toc-header"><a class="toc-anchor" href="#goal-scoring">¶</a> Goal Scoring</h2>
<ul>
  <li>Finish early when advantage exists</li>
</ul><div>

</div><h2 id="goal-defending" class="toc-header"><a class="toc-anchor" href="#goal-defending">¶</a> Goal Defending</h2>
<ul>
  <li>Protect central lane if last player</li>
</ul><div>

</div><h2 id="situational-play" class="toc-header"><a class="toc-anchor" href="#situational-play">¶</a> Situational Play</h2>
<h3 id="wall" class="toc-header"><a class="toc-anchor" href="#wall">¶</a> Wall</h3>
<ul>
  <li>Provide forward outlet</li>
</ul>
<h3 id="corner" class="toc-header"><a class="toc-anchor" href="#corner">¶</a> Corner</h3>
<ul>
  <li>Stay available, do not collapse</li>
</ul><div>

</div><hr><div>

</div><h1 id="centre-role-level-4-pelagic" class="toc-header"><a class="toc-anchor" href="#centre-role-level-4-pelagic">¶</a> Centre Role – Level 4 (Pelagic)</h1>
<p><b>Position:</b> Centre</p><div>

</div><p><b>Primary Function:</b></p>
<ul>
  <li>Control the middle</li>
  <li>Connect play</li>
  <li>Maintain balance</li>
</ul><div>

</div><h2 id="attack-1" class="toc-header"><a class="toc-anchor" href="#attack-1">¶</a> Attack</h2>
<ul>
  <li>Stay central</li>
  <li>Distribute play</li>
</ul><div>

</div><h2 id="support-1" class="toc-header"><a class="toc-anchor" href="#support-1">¶</a> Support</h2>
<ul>
  <li>Be primary outlet</li>
</ul><div>

</div><h2 id="pressure-1" class="toc-header"><a class="toc-anchor" href="#pressure-1">¶</a> Pressure</h2>
<ul>
  <li>Apply controlled pressure</li>
</ul><div>

</div><h2 id="defense-1" class="toc-header"><a class="toc-anchor" href="#defense-1">¶</a> Defense</h2>
<ul>
  <li>Protect middle</li>
</ul><div>

</div><h2 id="situational" class="toc-header"><a class="toc-anchor" href="#situational">¶</a> Situational</h2>
<ul>
  <li>Stay inside on wall and corner</li>
</ul><div>

</div><hr><div>

</div><h1 id="wing-role-level-4-pelagic" class="toc-header"><a class="toc-anchor" href="#wing-role-level-4-pelagic">¶</a> Wing Role – Level 4 (Pelagic)</h1>
<p><b>Position:</b> Wings</p><div>

</div><p><b>Primary Function:</b></p>
<ul>
  <li>Provide width</li>
  <li>Create space</li>
</ul><div>

</div><h2 id="attack-2" class="toc-header"><a class="toc-anchor" href="#attack-2">¶</a> Attack</h2>
<ul>
  <li>Hold width</li>
  <li>Advance play</li>
</ul><div>

</div><h2 id="support-2" class="toc-header"><a class="toc-anchor" href="#support-2">¶</a> Support</h2>
<ul>
  <li>Provide wide option</li>
</ul><div>

</div><h2 id="defense-2" class="toc-header"><a class="toc-anchor" href="#defense-2">¶</a> Defense</h2>
<ul>
  <li>Cover wide channels</li>
</ul><div>

</div><h2 id="situational-1" class="toc-header"><a class="toc-anchor" href="#situational-1">¶</a> Situational</h2>
<ul>
  <li>Control wall play</li>
</ul><div>

</div><hr><div>

</div><h1 id="back-role-level-4-pelagic" class="toc-header"><a class="toc-anchor" href="#back-role-level-4-pelagic">¶</a> Back Role – Level 4 (Pelagic)</h1>
<p><b>Position:</b> Back</p><div>

</div><p><b>Primary Function:</b></p>
<ul>
  <li>Protect goal</li>
  <li>Start attack</li>
</ul><div>

</div><h2 id="defense-3" class="toc-header"><a class="toc-anchor" href="#defense-3">¶</a> Defense</h2>
<ul>
  <li>Protect middle</li>
</ul><div>

</div><h2 id="attack-3" class="toc-header"><a class="toc-anchor" href="#attack-3">¶</a> Attack</h2>
<ul>
  <li>Distribute safely</li>
</ul><div>

</div><h2 id="situational-2" class="toc-header"><a class="toc-anchor" href="#situational-2">¶</a> Situational</h2>
<ul>
  <li>Control corner and wall exits</li>
</ul><div>

</div><hr><div>

</div><h1 id="system-summary" class="toc-header"><a class="toc-anchor" href="#system-summary">¶</a> System Summary</h1>
<ul>
  <li>Forward = Stretch + Finish + Pressure</li>
  <li>Centre = Control + Connect</li>
  <li>Wings = Width + Space</li>
  <li>Back = Protect + Organize</li>
</ul>
