</div><p>
Progressive badges measure player performance in underwater hockey beyond
the foundational level.
</p><div>

</div><p>
These badges contribute directly to player rank and reflect a player’s
ability to perform under increasing levels of demand.
</p><div>

</div><p>
Progression follows a <b>Shallow → Mid → Deep → Pelagic</b> system.
Each level represents increased control, consistency, and performance under pressure.
</p><div>

</div><p>
Progressive badges are introduced after completion of Foundation badges
and form the basis of rank progression beyond <b>Coral</b>.
</p><div>

</div><hr><div>

</div><h2 id="progressive-badge-categories" class="toc-header"><a class="toc-anchor" href="#progressive-badge-categories">¶</a> Progressive Badge Categories</h2><div>

</div><ul>
<li>Conditioning</li>
<li>Precision</li>
<li>Power</li>
</ul><div>

</div><p>
These categories contribute directly to rank progression.
</p><div>

</div><hr><div>

</div><h2 id="conditioning-badges" class="toc-header"><a class="toc-anchor" href="#conditioning-badges">¶</a> Conditioning Badges</h2><div>

</div><h3 id="uw-swim" class="toc-header"><a class="toc-anchor" href="#uw-swim">¶</a> UW Swim</h3><div>

</div><ul>
<li><b>Shallow</b> — 25m controlled underwater swim.</li>
<li><b>Mid</b> — 50m controlled underwater swim.</li>
<li><b>Deep</b> — 75m controlled underwater swim.</li>
<li><b>Pelagic</b> — 100m controlled underwater swim.</li>
</ul><div>

</div><hr><div>

</div><h3 id="static-breath-hold" class="toc-header"><a class="toc-anchor" href="#static-breath-hold">¶</a> Static Breath Hold</h3><div>

</div><ul>
<li><b>Shallow</b> — 60 seconds.</li>
<li><b>Mid</b> — 120 seconds.</li>
<li><b>Deep</b> — 180 seconds.</li>
<li><b>Pelagic</b> — 240 seconds.</li>
</ul><div>

</div><hr><div>

</div><h3 id="h-30s-simulations" class="toc-header"><a class="toc-anchor" href="#h-30s-simulations">¶</a> 30s Simulations</h3><div>

</div><ul>
<li><b>Shallow</b> — 5 chains.</li>
<li><b>Mid</b> — 10 chains.</li>
<li><b>Deep</b> — 15 chains.</li>
<li><b>Pelagic</b> — 20 chains.</li>
</ul><div>

</div><hr><div>

</div><h2 id="precision-badges" class="toc-header"><a class="toc-anchor" href="#precision-badges">¶</a> Precision Badges</h2><div>

</div><h3 id="puck-batting" class="toc-header"><a class="toc-anchor" href="#puck-batting">¶</a> Puck Batting</h3><div>

</div><ul>
<li><b>Shallow</b> — Control rolling puck 3 times flicked by coach.</li>
<li><b>Mid</b> — Control flicked puck 3 times.</li>
<li><b>Deep</b> — Control contested puck 5 times.</li>
<li><b>Pelagic</b> — Reliable puck control in game situations.</li>
</ul><div>

</div><hr><div>

</div><h3 id="pass-accuracy" class="toc-header"><a class="toc-anchor" href="#pass-accuracy">¶</a> Pass Accuracy</h3><div>

</div><ul>
<li><b>Shallow</b> — 5 ground hits to 30cm target at 1m.</li>
<li><b>Mid</b> — 4/5 flicks through 30cm elevated target.</li>
<li><b>Deep</b> — 4/5 flicks through 20cm elevated target.</li>
<li><b>Pelagic</b> — 4/5 flicks through puck-width opening.</li>
</ul><div>

</div><hr><div>

</div><h3 id="pass-distance" class="toc-header"><a class="toc-anchor" href="#pass-distance">¶</a> Pass Distance</h3><div>

</div><ul>
<li><b>Shallow</b> — Controlled flick to target zone:
  <br>Male: 4ft | Female: 2ft
</li>
<li><b>Mid</b> — Controlled flick to target zone:
  <br>Male: 6ft | Female: 4ft
</li>
<li><b>Deep</b> — Controlled flick to target zone:
  <br>Male: 8ft | Female: 6ft
</li>
<li><b>Pelagic</b> — Controlled flick to target zone:
  <br>Male: 10ft | Female: 8ft
</li>
</ul><div>

</div><hr><div>

</div><h3 id="pass-height" class="toc-header"><a class="toc-anchor" href="#pass-height">¶</a> Pass Height</h3><div>

</div><ul>
<li><b>Shallow</b> — Clean flick over puck (3cm).</li>
<li><b>Mid</b> — Flick over 15cm object.</li>
<li><b>Deep</b> — Flick over 50cm marker.</li>
<li><b>Pelagic</b> — Flick over 80cm–1m obstacle with control.</li>
</ul><div>

</div><hr><div>

</div><h3 id="curl-mastery" class="toc-header"><a class="toc-anchor" href="#curl-mastery">¶</a> Curl Mastery</h3><div>

</div><ul>
<li><b>Shallow</b> — Retain possession after curl vs active defender (4/6).</li>
<li><b>Mid</b> — Retain possession vs equal defender (4/6).</li>
<li><b>Deep</b> — Curl leads to controlled continuation (4/6).</li>
<li><b>Pelagic</b> — Curl creates offensive advantage (5/8).</li>
</ul><div>

</div><hr><div>

</div><h2 id="power-badges" class="toc-header"><a class="toc-anchor" href="#power-badges">¶</a> Power Badges</h2><div>

</div><h3 id="h-25m-flutter-uw" class="toc-header"><a class="toc-anchor" href="#h-25m-flutter-uw">¶</a> 25m Flutter UW</h3><div>

</div><ul>
<li><b>Shallow</b> — Under 18 seconds with correct propulsion.</li>
<li><b>Mid</b> — Under 13 seconds.</li>
<li><b>Deep</b> — Under 12 seconds.</li>
<li><b>Pelagic</b> — Under 10 seconds with controlled recovery.</li>
</ul><div>

</div><hr><div>

</div><h3 id="h-25m-dolphin-uw" class="toc-header"><a class="toc-anchor" href="#h-25m-dolphin-uw">¶</a> 25m Dolphin UW</h3><div>

</div><ul>
<li><b>Shallow</b> — Under 19 seconds with consistent body wave.</li>
<li><b>Mid</b> — Under 14 seconds.</li>
<li><b>Deep</b> — Under 13 seconds.</li>
<li><b>Pelagic</b> — Under 12 seconds with streamlined posture.</li>
</ul><div>

</div><hr><div>

</div><h3 id="h-50m-surface-sprint" class="toc-header"><a class="toc-anchor" href="#h-50m-surface-sprint">¶</a> 50m Surface Sprint</h3><div>

</div><ul>
<li><b>Shallow</b> — Under 45 seconds.</li>
<li><b>Mid</b> — Under 40 seconds.</li>
<li><b>Deep</b> — Under 35 seconds.</li>
<li><b>Pelagic</b> — Under 30 seconds with efficiency.</li>
</ul><div>

</div><hr><div>

</div><h3 id="explosive-start" class="toc-header"><a class="toc-anchor" href="#explosive-start">¶</a> Explosive Start</h3><div>

</div><ul>
<li><b>Shallow</b> — 12.5m in under 6.5 seconds.</li>
<li><b>Mid</b> — Under 6.0 seconds.</li>
<li><b>Deep</b> — Under 5.5 seconds.</li>
<li><b>Pelagic</b> — Under 5.0 seconds.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-guidance" class="toc-header"><a class="toc-anchor" href="#coach-guidance">¶</a> Coach Guidance</h2><div>

</div><ul>
<li>Progressive badges should be observed during normal training where possible.</li>
<li>Short testing blocks may be used for conditioning and power badges.</li>
<li>Do not interrupt game flow for technical testing.</li>
<li>Only sign off when performance is repeatable and controlled.</li>
<li>Prioritize game-relevant performance over isolated drill success.</li>
</ul><div>

</div><p>
Progressive badges reflect a player’s ability to perform under pressure
and are the primary drivers of rank progression beyond Coral.
</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
