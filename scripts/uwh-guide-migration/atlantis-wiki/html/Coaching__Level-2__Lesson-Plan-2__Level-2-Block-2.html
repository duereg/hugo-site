Block 2 – Puck Control Development</h1><div>

</div><p>
Develop puck control while swimming so players can move with the puck, change direction, and recover possession under light pressure.
</p><div>

</div><hr><div>

</div><h2 id="session-flow" class="toc-header"><a class="toc-anchor" href="#session-flow">¶</a> Session Flow</h2><div>

</div><section>
  <h3 id="h-1-stationary-puck-control" class="toc-header"><a class="toc-anchor" href="#h-1-stationary-puck-control">¶</a> 1. Stationary Puck Control</h3>
  <ul>
    <li>Establish strong body position over the puck</li>
    <li>Puck positioned slightly in front (right shoulder)</li>
    <li>Progress from eyes on puck to peripheral awareness</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-2#stationary-puck-control" class="is-internal-link is-valid-page">
      Stationary Puck Control
    </a>
  </p>
  <p><strong>Link:</strong> Foundation for all moving puck control.</p>
</section><div>

</div><section>
  <h3 id="h-2-straight-line-carry" class="toc-header"><a class="toc-anchor" href="#h-2-straight-line-carry">¶</a> 2. Straight Line Carry</h3>
  <ul>
    <li>Swim forward with controlled puck touches</li>
    <li>Maintain consistent speed and spacing</li>
    <li>Keep puck within recovery distance</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-2#straight-line-carry" class="is-internal-link is-valid-page">
      Straight Line Carry
    </a>
  </p>
  <p><strong>Link:</strong> Transfer control from stationary to movement.</p>
</section><div>

</div><section>
  <h3 id="h-3-weave-direction-change" class="toc-header"><a class="toc-anchor" href="#h-3-weave-direction-change">¶</a> 3. Weave Direction Change</h3>
  <ul>
    <li>Navigate through markers with control</li>
    <li>Adjust speed before changing direction</li>
    <li>Keep puck close through turns</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-2#weave-through-markers" class="is-internal-link is-valid-page">
      Weave Through Markers
    </a>
  </p>
  <p><strong>Link:</strong> Introduces controlled direction change while moving.</p>
</section><div>

</div><section>
  <h3 id="h-4-curl-around-marker" class="toc-header"><a class="toc-anchor" href="#h-4-curl-around-marker">¶</a> 4. Curl Around Marker</h3>
  <ul>
    <li>Execute tight controlled turns</li>
    <li>Protect puck using body position</li>
    <li>Exit the turn under control</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-2#curl-around-marker" class="is-internal-link is-valid-page">
      Curl Around Marker
    </a>
  </p>
  <p><strong>Link:</strong> Reinforces control during tighter, game-like turns.</p>
</section><div>

</div><section>
  <h3 id="h-5-pass-and-swim" class="toc-header"><a class="toc-anchor" href="#h-5-pass-and-swim">¶</a> 5. Pass and Swim</h3>
  <ul>
    <li>Pass forward into space</li>
    <li>Swim to recover possession</li>
    <li>Regain control before next action</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-2#pass-and-swim" class="is-internal-link is-valid-page">
      Pass and Swim
    </a>
  </p>
  <p><strong>Link:</strong> Introduces movement off the puck and recovery timing.</p>
</section><div>

</div><section>
  <h3 id="h-6-flick-to-space-and-recover" class="toc-header"><a class="toc-anchor" href="#h-6-flick-to-space-and-recover">¶</a> 6. Flick to Space and Recover</h3>
  <ul>
    <li>Flick puck into reachable space</li>
    <li>Accelerate to recover</li>
    <li>Re-establish control quickly</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-2#flick-and-recover" class="is-internal-link is-valid-page">
      Flick and Recover
    </a>
  </p>
  <p><strong>Link:</strong> Builds separation and recovery under control.</p>
</section><div>

</div><section>
  <h3 id="h-7-light-trailing-pressure" class="toc-header"><a class="toc-anchor" href="#h-7-light-trailing-pressure">¶</a> 7. Light Trailing Pressure</h3>
  <ul>
    <li>Maintain control with a trailing defender</li>
    <li>Protect puck using body and positioning</li>
    <li>Avoid rushed or panic touches</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-2#trailing-pressure-carry" class="is-internal-link is-valid-page">
      Trailing Pressure Carry
    </a>
  </p>
  <p><strong>Link:</strong> Applies all skills under light game pressure.</p>
</section><div>

</div><section>
  <h3 id="h-8-game-integration" class="toc-header"><a class="toc-anchor" href="#h-8-game-integration">¶</a> 8. Game Integration</h3>
  <ul>
    <li>Apply puck control skills in game play</li>
    <li>Focus on control over speed</li>
    <li>Make decisions under light pressure</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-2#short-game-play" class="is-internal-link is-valid-page">
      Short Game Play
    </a>
  </p>
  <p><strong>Link:</strong> Combine all puck control skills into realistic play.</p>
</section><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><ul>
  <li>Swims forward with puck under control</li>
  <li>Changes direction while maintaining control</li>
  <li>Flicks to space and successfully recovers possession</li>
  <li>Maintains control under light trailing pressure</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-principles" class="toc-header"><a class="toc-anchor" href="#key-principles">¶</a> Key Principles</h2><div>

</div><section>
  <h3 id="stationary-control" class="toc-header"><a class="toc-anchor" href="#stationary-control">¶</a> Stationary Control</h3>
  <ul>
    <li>Hips and knees low</li>
    <li>Puck positioned in front (right shoulder)</li>
    <li>Progress from looking at puck to using peripheral vision</li>
  </ul>
</section><div>

</div><section>
  <h3 id="controlled-carry" class="toc-header"><a class="toc-anchor" href="#controlled-carry">¶</a> Controlled Carry</h3>
  <ul>
    <li>Maintain forward movement</li>
    <li>Use small, controlled touches</li>
    <li>Keep puck within recovery distance</li>
    <li>Avoid panic pushes</li>
  </ul>
</section><div>

</div><section>
  <h3 id="direction-change" class="toc-header"><a class="toc-anchor" href="#direction-change">¶</a> Direction Change</h3>
  <ul>
    <li>Slow slightly before turning</li>
    <li>Keep puck close through the turn</li>
    <li>Exit with control</li>
  </ul>
</section><div>

</div><section>
  <h3 id="flick-and-recovery" class="toc-header"><a class="toc-anchor" href="#flick-and-recovery">¶</a> Flick and Recovery</h3>
  <ul>
    <li>Flick to reachable space</li>
    <li>Accelerate to recover</li>
    <li>Control before next action</li>
  </ul>
</section><div>

</div><section>
  <h3 id="control-under-pressure" class="toc-header"><a class="toc-anchor" href="#control-under-pressure">¶</a> Control Under Pressure</h3>
  <ul>
    <li>Protect puck with body position</li>
    <li>Stay composed under pressure</li>
    <li>Avoid rushed touches</li>
  </ul>
</section><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Control first</li>
  <li>Strong body position</li>
  <li>Eyes up</li>
  <li>Protect the puck</li>
  <li>Recover under control</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><strong>Losing contact with the puck</strong> – Emphasize controlled touches</li>
  <li><strong>Losing control during turns</strong> – Slow through the turn</li>
  <li><strong>Over-flicking beyond recovery distance</strong> – Flick to reachable space</li>
  <li><strong>Head down</strong> – Reinforce eyes up</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Keep pressure light and controlled</li>
  <li>Maintain spacing during drills</li>
  <li>Intervene early on poor puck habits</li>
  <li>Progress only when control is consistent</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h2><div>

</div><ul>
  <li>Reduce spacing between markers</li>
  <li>Add controlled 1v1 channel play</li>
  <li>Require pass after successful carry</li>
</ul><div>

</div><h2 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h2><div>

</div><ul>
  <li>Increase spacing between markers</li>
  <li>Remove trailing pressure</li>
  <li>Shorten swim distances</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
