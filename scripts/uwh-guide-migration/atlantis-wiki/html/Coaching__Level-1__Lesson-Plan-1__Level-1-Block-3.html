</div><p>
This block introduces basic attacking and defending roles while developing awareness of teammates and opponents through simple game play.
</p>
<p>
<b>Linked Individual Fundamental:</b> 
<a href="/players/individual_fundamentals/moving_in_the_water" target="_blank" class="is-internal-link is-valid-page">
Moving in the Water
</a> – Players use surface, mid-water, and bottom movement to reposition and support attacking and defending roles.
</p><div>

</div><hr><div>

</div><h2 id="session-run-order" class="toc-header"><a class="toc-anchor" href="#session-run-order">¶</a> Session Run Order</h2><div>

</div><p><b>Role Introduction</b></p>
<ul>
  <li>Attackers</li>
  <li>Defenders</li>
  <li>No limitations on where players may be in the court</li>
</ul>
<p><b>Linked Drill:</b>
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#guided-mini-game" class="is-internal-link is-valid-page">Guided Mini Game</a>
</p>
<p><b>Coach Note:</b> This section is primarily a coach-led explanation and demonstration before players apply roles in play.</p><div>

</div><p><b>Defensive Concepts</b></p>
<ul>
  <li>Get between puck and goal.</li>
  <li>Slow attackers.</li>
  <li>Limit forward movement.</li>
</ul>
<p><b>Linked Drill:</b>
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#numbers-game" class="is-internal-link is-valid-page">Numbers Game</a>
</p><div>

</div><p><b>Attacking Concepts</b></p>
<ul>
  <li>Move toward goal.</li>
  <li>Keep the puck safe.</li>
  <li>Help the team score.</li>
</ul>
<p><b>Linked Drill:</b>
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#support-movement" class="is-internal-link is-valid-page">Support Movement</a>
</p><div>

</div><p><b>Mini Games</b></p>
<ul>
  <li>Short playing area.</li>
  <li>Two teams against each other.</li>
  <li>Frequent resets.</li>
</ul>
<p><b>Linked Drill:</b>
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#guided-mini-game" class="is-internal-link is-valid-page">Guided Mini Game</a>
</p><div>

</div><p>
Full drill descriptions available in the 
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3" class="is-internal-link is-invalid-page">
Attacking and Defending Drill Library
</a>.
</p><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><p>By the end of this block players should demonstrate the following during mini game play:</p><div>

</div><ul>
<li>
Recognises basic attacker and defender roles
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#guided-mini-game" class="is-internal-link is-valid-page">Guided Mini Game</a>
</li>

<li>
Moves to support teammates during play
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#support-movement" class="is-internal-link is-valid-page">Support Movement</a>
</li>

<li>
Applies simple attacking and defending ideas
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#numbers-game" class="is-internal-link is-valid-page">Numbers Game</a>,
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#guided-mini-game" class="is-internal-link is-valid-page">Guided Mini Game</a>
</li>

<li>
Participates safely in mini games
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#guided-mini-game" class="is-internal-link is-valid-page">Guided Mini Game</a>
</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-learning-principles" class="toc-header"><a class="toc-anchor" href="#key-learning-principles">¶</a> Key Learning Principles</h2><div>

</div><h3 id="attacking-role" class="toc-header"><a class="toc-anchor" href="#attacking-role">¶</a> Attacking Role</h3><div>

</div><p>
Attackers aim to move the puck toward the goal while maintaining control and working with teammates.
</p><div>

</div><ul>
  <li>Move toward the goal</li>
  <li>Keep the puck safe and close</li>
  <li>Look for simple passing options</li>
  <li>Support teammates in possession</li>
</ul><div>

</div><p><b>Attacking Rule:</b> Move forward, keep control, support your team.</p><div>

</div><p><b>Linked Drill:</b>
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#support-movement" class="is-internal-link is-valid-page">Support Movement</a>
</p><div>

</div><h3 id="defending-role" class="toc-header"><a class="toc-anchor" href="#defending-role">¶</a> Defending Role</h3><div>

</div><p>
Defenders aim to slow down the attacker and protect the goal by positioning effectively.
</p><div>

</div><ul>
  <li>Get between the puck and the goal</li>
  <li>Slow the attacker</li>
  <li>Limit forward movement</li>
  <li>Avoid chasing the puck without control</li>
</ul><div>

</div><p><b>Defending Rule:</b> Protect space, slow play, stay between puck and goal.</p><div>

</div><p><b>Linked Drill:</b>
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#numbers-game" class="is-internal-link is-valid-page">Numbers Game</a>
</p><div>

</div><h3 id="support-and-awareness" class="toc-header"><a class="toc-anchor" href="#support-and-awareness">¶</a> Support and Awareness</h3><div>

</div><p>
Players begin to recognise where they should be in relation to the puck, teammates, and opponents.
</p><div>

</div><ul>
  <li>Stay close enough to support teammates</li>
  <li>Avoid all players chasing the puck</li>
  <li>Adjust position as play changes</li>
  <li>Recognise when to attack or defend</li>
</ul><div>

</div><p>
There are no fixed positions, but players should always look to stay connected to the play.
</p><div>

</div><p><b>Linked Drills:</b>
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#support-movement" class="is-internal-link is-valid-page">Support Movement</a>,
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-3#guided-mini-game" class="is-internal-link is-valid-page">Guided Mini Game</a>
</p><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Know your role</li>
  <li>Move toward goal</li>
  <li>Get between puck and goal</li>
  <li>Do not chase</li>
  <li>Support your teammate</li>
  <li>Look around</li>
  <li>Surface early</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-good-performance-looks-like" class="toc-header"><a class="toc-anchor" href="#what-good-performance-looks-like">¶</a> What Good Performance Looks Like</h2><div>

</div><ul>
  <li>Players recognise when they are attacking or defending</li>
  <li>Attackers move toward goal with control</li>
  <li>Defenders position between puck and goal</li>
  <li>Players spread out instead of chasing the puck</li>
  <li>Teammates support each other during play</li>
  <li>Mini games are played safely and with awareness</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><b>All players chase the puck</b><br>Cue: Spread out and support.</li>
  <li><b>Defenders do not protect goal space</b><br>Cue: Get between puck and goal.</li>
  <li><b>Attackers lose control moving forward</b><br>Cue: Keep it close.</li>
  <li><b>Players unaware of surroundings</b><br>Cue: Look around.</li>
  <li><b>Players stay underwater too long</b><br>Cue: Surface early.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Keep games small, simple, and structured</li>
  <li>Reset frequently to reinforce roles and positioning</li>
  <li>Encourage awareness over speed or competition</li>
  <li>Reinforce safe play and proper surfacing habits</li>
</ul><div>

</div><hr></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
