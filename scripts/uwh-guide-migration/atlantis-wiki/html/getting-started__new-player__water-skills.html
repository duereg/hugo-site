</div><p>
This block builds the core water skills that make everything else in Underwater Hockey easier and safer.
If you get these right early, you will progress faster and feel more confident in every session.
</p><div>

</div><hr><div>

</div><h3 id="equalizing-your-ears" class="toc-header"><a class="toc-anchor" href="#equalizing-your-ears">¶</a> <b>Equalizing Your Ears</b></h3>
<p>
Equalizing means balancing pressure in your ears as you go down. If you feel pressure or pain, you must slow down and equalize.
Never “push through” ear pain.
</p>
<p><b>How to equalize (simple method):</b></p>
<ul>
  <li>Before you dive, take 1–2 calm breaths.</li>
  <li>As you start descending, <b>pinch your nose through the mask</b> and gently blow until you feel a soft “pop” or release.</li>
  <li>Equalize <b>early and often</b> (every small drop), not only when it hurts.</li>
  <li>If it doesn’t clear, <b>stop descending</b>, come slightly up, and try again.</li>
</ul>
<p><b>Common mistakes:</b></p>
<ul>
  <li>Waiting until it hurts (too late).</li>
  <li>Blowing too hard.</li>
  <li>Diving fast without pauses.</li>
</ul>
<p><b>Rule:</b> Pain = stop. If pain continues, end the session and tell a coach.</p>
<p> [[add illustration]]</p>
<hr><div>

</div><h3 id="mask-use-clearing-defogging" class="toc-header"><a class="toc-anchor" href="#mask-use-clearing-defogging">¶</a> <b>Mask Use, Clearing &amp; Defogging</b></h3>
<p>
A comfortable, clear mask is essential. Leaks and fog create stress and shorten your dives.
</p>
<p><b>Fit basics:</b></p>
<ul>
  <li>Mask should seal gently on your face (not on hair).</li>
  <li>Strap should be snug, not painful.</li>
  <li>Test: place mask on your face (no strap) and inhale gently through your nose—mask should “stick”.</li>
</ul><div>

</div><p><b>Clearing a flooded mask (basic):</b></p>
<ul>
  <li>Keep calm. Tilt your head slightly up.</li>
  <li>Press the top of the mask frame to your forehead to maintain a seal.</li>
  <li>Exhale <b>through your nose</b> in a steady stream until water exits the bottom of the mask.</li>
  <li>Repeat as needed—small clears are easier than one big clear.</li>
</ul><div>

</div><p><b>Defogging (simple):</b></p>
<ul>
  <li>Apply defog solution (or a tiny amount of baby shampoo) to the inside of the lens.</li>
  <li>Rub gently, then rinse lightly (leave a thin film).</li>
  <li>Avoid touching the inside lens after defogging.</li>
</ul><div>

</div><p><b>Common mistakes:</b></p>
<ul>
  <li>Over-tightening the strap (often causes more leaking).</li>
  <li>Clearing with panic breaths (wastes oxygen).</li>
  <li>Rubbing the inside lens mid-session (re-fogs instantly).</li>
</ul><div>

</div><hr><div>

</div><h3 id="snorkel-breathing-clearing" class="toc-header"><a class="toc-anchor" href="#snorkel-breathing-clearing">¶</a> <b>Snorkel Breathing &amp; Clearing</b></h3>
<p>
The snorkel lets you recover at the surface without lifting your head. The goal is relaxed breathing and quick clearing.
</p><div>

</div><p><b>Relaxed snorkel breathing:</b></p>
<ul>
  <li>Face down, body long, fins lightly moving.</li>
  <li>Breathe <b>slow and steady</b> (smooth inhale, longer calm exhale).</li>
  <li>If you feel stressed: roll to your back and recover, then reset.</li>
</ul><div>

</div><p><b>Clearing water after a dive (blast clear):</b></p>
<ul>
  <li>As you break the surface, <b>exhale sharply</b> to blow water out of the snorkel.</li>
  <li>Then take your next breath normally.</li>
</ul><div>

</div><p><b>Head-tilt timed clear:</b></p>
<ul>
  <li>As you surface, tilt your head slightly back so the snorkel tip becomes the lowest point.</li>
  <li>Time a strong exhale right as the snorkel clears the surface.</li>
  <li>This uses gravity + timing to clear with less effort.</li>
</ul><div>

</div><p><b>Common mistakes:</b></p>
<ul>
  <li>Trying to inhale before clearing (you swallow water).</li>
  <li>Short, panicked breaths.</li>
  <li>Removing the snorkel constantly (breaks your rhythm).</li>
</ul><div>

</div><hr><div>

</div><h3 id="staying-calm-underwater" class="toc-header"><a class="toc-anchor" href="#staying-calm-underwater">¶</a> <b>Staying Calm Underwater</b></h3>
<p>
Calmness is a skill. Most “fitness problems” for beginners are actually <b>stress and rushing</b>.
Staying calm makes your breath-holds longer, your skills cleaner, and your decisions safer.
</p><div>

</div><p><b>How to stay calm:</b></p>
<ul>
  <li>Use a “slow start”: first 2–3 dives are gentle and short.</li>
  <li>Keep your movement smooth—avoid sudden bursts unless necessary.</li>
  <li>When you feel stress rising, <b>surface early</b> and reset.</li>
  <li>Use a simple focus cue: “long exhale” or “smooth and slow”.</li>
</ul><div>

</div><p><b>Signs you should surface immediately:</b></p>
<ul>
  <li>Urgent breathing feeling that spikes suddenly.</li>
  <li>Disorientation or tunnel vision.</li>
  <li>Mask/snorkel problems that distract you.</li>
</ul><div>

</div><p><b>Rule:</b> Surfacing early is smart. Surfacing late is risky.</p><div>

</div><hr><div>

</div><h3 id="safe-surfacing" class="toc-header"><a class="toc-anchor" href="#safe-surfacing">¶</a> <b>Safe Surfacing</b></h3>
<p>
Surfacing safely protects you and everyone around you. The key is awareness, control, and predictable movement.
</p><div>

</div><p><b>Safe surfacing checklist:</b></p>
<ul>
  <li><b>Look up</b> before you rise (quick scan for people and walls).</li>
  <li>Surface on an <b>angle</b> rather than shooting straight up under someone.</li>
  <li>Keep your stick close to your body when rising.</li>
  <li>At the surface: get stable first, then communicate.</li>
</ul><div>

</div><p><b>Surface recovery:</b></p>
<ul>
  <li>One calm breath in, longer breath out.</li>
  <li>Re-clear snorkel if needed, then resume relaxed breathing.</li>
</ul><div>

</div><hr><div>

</div><h3 id="what-to-do-if-something-feels-wrong" class="toc-header"><a class="toc-anchor" href="#what-to-do-if-something-feels-wrong">¶</a> <b>What To Do If Something Feels Wrong</b></h3>
<p>
If something feels wrong, the correct response is simple: <b>stop, surface, recover, communicate</b>.
This keeps small issues from becoming big ones.
</p><div>

</div><p><b>The 4-step reset:</b></p>
<ul>
  <li><b>Stop:</b> stop the drill/play and stabilize your body.</li>
  <li><b>Surface:</b> come up calmly (don’t rush into others).</li>
  <li><b>Recover:</b> roll to your back if needed; take calm breaths.</li>
  <li><b>Communicate:</b> signal a coach/teammate and explain the issue.</li>
</ul><div>

</div><p><b>Examples of “something feels wrong”:</b></p>
<ul>
  <li>Ear pain or pressure that won’t clear.</li>
  <li>Dizziness, nausea, or confusion.</li>
  <li>Shortness of breath that doesn’t improve after rest.</li>
  <li>Cramp, sharp pain, or unusual fatigue.</li>
  <li>Mask strap break, severe leak, or mouthguard issue.</li>
</ul><div>

</div><p><b>Non-negotiables:</b></p>
<ul>
  <li><b>Never dive with ear pain.</b></li>
  <li><b>Never push through dizziness or confusion.</b></li>
  <li>If you are unsure, sit out and tell a coach.</li>
</ul>
