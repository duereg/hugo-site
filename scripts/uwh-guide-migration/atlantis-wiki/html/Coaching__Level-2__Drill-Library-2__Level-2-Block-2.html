</div><p><b>Progressive Badges Supported (Observed Where Applicable):</b>
<a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a>,
<a href="/en/Coaching/Badges/Progressive#pass-distance" class="is-internal-link is-valid-page">Pass Distance</a>,
<a href="/en/Coaching/Badges/Progressive#pass-height" class="is-internal-link is-valid-page">Pass Height</a>,
<a href="/en/Coaching/Badges/Progressive#curl-mastery" class="is-internal-link is-valid-page">Curl Mastery</a>
</p><div>

</div><hr><div>

</div><h3 id="stationary-puck-control" class="toc-header"><a class="toc-anchor" href="#stationary-puck-control">¶</a> Stationary Puck Control</h3><div>

</div><ul>
  <li>Set strong body position behind the puck.</li>
  <li>Keep hips and knees low with the puck in front over the playing shoulder.</li>
  <li>Progress from watching the puck while controlling it to lifting the eyes up and using peripheral vision.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> None (foundation drill)</p><div>

</div><hr><div>

</div><h3 id="straight-line-carry" class="toc-header"><a class="toc-anchor" href="#straight-line-carry">¶</a> Straight Line Carry</h3><div>

</div><ul>
  <li>Carry the puck forward in a straight line.</li>
  <li>Maintain contact with the puck while swimming.</li>
  <li>Push the puck in a strong body position.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> None (development drill)</p><div>

</div><hr><div>

</div><h3 id="weave-through-markers" class="toc-header"><a class="toc-anchor" href="#weave-through-markers">¶</a> Weave Through Markers</h3><div>

</div><ul>
  <li>Carry puck through spaced cones.</li>
  <li>Maintain control during direction change.</li>
  <li>Keep contact with the puck during direction change.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> None (development drill)</p><div>

</div><hr><div>

</div><h3 id="curl-around-marker" class="toc-header"><a class="toc-anchor" href="#curl-around-marker">¶</a> Curl Around Marker</h3><div>

</div><ul>
  <li>Approach marker.</li>
  <li>Perform controlled curl.</li>
  <li>Swim out of the curl.</li>
  <li> Keep the hips and shoulders low during the curl.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#curl-mastery" class="is-internal-link is-valid-page">Curl Mastery</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="pass-and-swim" class="toc-header"><a class="toc-anchor" href="#pass-and-swim">¶</a> Pass and Swim</h3><div>

</div><ul>
  <li>Pass to partner, then move into support lane.</li>
  <li>Receiver controls before returning pass.</li>
  <li>Continue swimming to support after release.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="flick-and-recover" class="toc-header"><a class="toc-anchor" href="#flick-and-recover">¶</a> Flick and Recover</h3><div>

</div><ul>
  <li>Flick puck into open space.</li>
  <li>Accelerate and recover possession.</li>
  <li>Regain control before next movement.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#pass-distance" class="is-internal-link is-valid-page">Pass Distance</a></li>
  <li><a href="/en/Coaching/Badges/Progressive#pass-height" class="is-internal-link is-valid-page">Pass Height</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="trailing-pressure-carry" class="toc-header"><a class="toc-anchor" href="#trailing-pressure-carry">¶</a> Trailing Pressure Carry</h3><div>

</div><ul>
  <li>One player carries the puck forward.</li>
  <li>Second player applies light trailing pressure.</li>
  <li>Carrier maintains control and protects the puck.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#curl-mastery" class="is-internal-link is-valid-page">Curl Mastery</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="short-game-play" class="toc-header"><a class="toc-anchor" href="#short-game-play">¶</a> Short Game Play</h3><div>

</div><ul>
  <li>Apply puck control skills in conditioned game play.</li>
  <li>Encourage controlled carry, turns, flick-and-recover, and composure under pressure.</li>
  <li>Reinforce decision-making while maintaining possession.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> Observed where applicable during play</p><div>
