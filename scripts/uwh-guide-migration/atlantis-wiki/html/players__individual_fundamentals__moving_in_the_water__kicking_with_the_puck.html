<p>Exactly as when <a href="/players/individual_fundamentals/moving_in_the_water/kicking_at_the_bottom" class="is-internal-link is-valid-page">swimming along the bottom</a>, players should flutter kick when they have possession of the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>. This is preferable over dolphin kicking because dolphin kick lifts the hips up off the bottom of the pool, putting the player in a much weaker body position. One instance when a player may wish to dolphin kick with the puck is if they are on a breakaway and their dolphin kick is faster than their flutter kick.&nbsp;</p>
<p>As well as flutter kicking when swimming with the puck, players should form the habit of entering the <a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">cobra position</a> whenever they are not actively kicking. The combination of flutter kicking when moving and using the cobra position when not moving will keep the player's hips low to the pool bottom and keep them in an ideal position for maneuvering the puck.&nbsp;</p>

  <p><u>KICKING WITH THE PUCK</u></p>

    <li>DOLPHIN KICK CAN BE USED WHEN NOT MANEUVERING THE PUCK AND EXTRA SPEED IS NEEDED</li>
