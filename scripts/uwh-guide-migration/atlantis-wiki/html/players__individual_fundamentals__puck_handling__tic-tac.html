<p>A tic-tac maneuver is when the <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> is lifted over, and to the opposite side, of the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>. This can happen in a forward and back motion, which is called a vertical tic-tac; or in a side to side motion, which is called a horizontal tic-tac.</p>
<p>Vertical tic-tacs are performed using the <a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page">standard grip</a> and are primarily used to stop the forward momentum and capture the puck&nbsp;in advance of some sort of <a href="/players/evasive_maneuvers" class="is-internal-link is-valid-page">evasive maneuver</a> (by moving the stick from behind the puck to in front), or at the end of such a maneuver when preparing to <a href="/players/individual_fundamentals/moving_in_the_water/kicking_out_of_maneuvers" class="is-internal-link is-valid-page">kick out of the maneuver</a> or make a <a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page">pass</a> (by moving the stick from in front of the puck to behind it).</p>
<p>Horizontal tic-tacs are also performed using the <a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page">standard grip</a> but with the player's arm and wrist rotated so that the front bevel of the stick is contacting the <a href="/game/gear-setup/playing_surfaces" class="is-internal-link is-valid-page">playing surface</a> and the tip of the stick is pointed forward. The top and bottom of the stick are used to re-direct the side to side motion of the puck&nbsp;in an evasive puck-handling maneuver all its own.</p>
<p>Tic-tacs can be done while a player is stationary (in a <a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">cobra position</a>) or when a player is <a href="/players/individual_fundamentals/moving_in_the_water/kicking_with_the_puck" class="is-internal-link is-valid-page">kicking with the puck</a>.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>Tic-tacs are a highly used <a href="/players/individual_fundamentals/puck_handling" class="is-internal-link is-valid-page">puck handling</a> fundamental skill as nearly all <a href="/players/evasive_maneuvers" class="is-internal-link is-valid-page">evasive maneuvers</a>&nbsp;can incorporate a vertical tic-tac at their beginning, end, or both. All stick types can use tic-tacs, where as some sticks with larger hooks have trouble with other similar moves, such as the <a href="/players/individual_fundamentals/puck_handling/front_to_back_roll" class="is-internal-link is-valid-page">vertical front to back roll</a>.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>There are few examples where it is inappropriate to use a tic-tac maneuver. However, tic-tacs should be performed quickly as they require giving up clear possession for a brief moment as the stick travels over the puck.</p>
