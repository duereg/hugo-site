<p>There is a lot that goes in to successfully defending the <a href="/game/gear-setup/goals" class="is-internal-link is-valid-page">goal</a>. One important thing teams should have is redundancy, meaning that the player on the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> is not the last player between the puck and the goal. Backs generally want to cycle so that whenever a back surfaces, they immediately cycle behind the back that is engaged at the moment. This allows them to drop between the puck and the goal every dive.&nbsp;</p>
<p>Forwards don't need to focus as much on where to drop, they just need to go to the puck and try to steal it and block the opponent's <a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page">passes</a>. One of the best things a back can see when an opponent is driving the puck straight towards them and their goal is the forward coming in for a <a href="/players/tackling_maneuvers/back-picks" class="is-internal-link is-valid-page">back pick</a>.&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>Backs should cycle behind each other in all parts of the pool, although the details of who does this and how it is done varies greatly. When defending the goal though, the main objective of the backs is slightly different than in the center of the pool. In general, teams want to drive the puck outward towards the corner of the playing area when getting the puck away from the goal. This area is better protected and it is easier to defend. Driving the puck straight to the middle of the playing area is exposed and the attacking team can more easily disrupt the defenders.</p>
<p>That being said, driving the puck towards the middle can be used sometimes. If a team has been defending for a while and driving the puck into the corner, the attacking team may get pulled into the corner and can leave the center of the pool open, making it a good escape option for the defending team. The defending team must be aware that the attacking team may swing out into the center of the pool as well.</p>
