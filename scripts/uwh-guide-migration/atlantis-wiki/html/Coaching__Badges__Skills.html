</div><p>
Skills badges recognize advanced puck manipulation techniques used to
retain possession, evade defenders, and create attacking continuation.
</p><div>

</div><p>
These badges sit outside the rank engine. They do not directly contribute
to player rank, but they document technical progression and higher-level
game skill.
</p><div>

</div><p>
Skills badges use a <b>Shallow → Mid → Deep → Pelagic</b> progression.
Shallow represents correct execution in a controlled setting, Mid represents
successful use under active pressure, Deep represents application in live play,
and Pelagic represents reliable attacking advantage at game level.
</p><div>

</div><hr><div>

</div><h2 id="skills-badge-list" class="toc-header"><a class="toc-anchor" href="#skills-badge-list">¶</a> Skills Badge List</h2><div>

</div><ul>
<li>Wall Roll &amp; Scoop</li>
<li>Deke</li>
<li>Fade</li>
<li>Inverted Curl</li>
<li>Deep V (Stick-Hand → Free-Hand)</li>
<li>Deep V (Free-Hand → Stick-Hand)</li>
<li>Figure 6</li>
<li>Around the World</li>
<li>Upper Cut</li>
</ul><div>

</div><hr><div>

</div><h2 id="badge-opportunities" class="toc-header"><a class="toc-anchor" href="#badge-opportunities">¶</a> Badge Opportunities</h2><div>

</div><div class="table-container"><table>
  <thead>
    <tr>
      <th>Coaching Level</th>
      <th>Suggested Skills Badges</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Level 2 – Game Function</td>
      <td>No primary Skills badges. Focus remains on Foundation and early Progressive badges.</td>
    </tr>
    <tr>
      <td>Level 3 – Structured Play</td>
      <td>Wall Roll &amp; Scoop, Deke, Fade</td>
    </tr>
    <tr>
      <td>Level 4 – Competitive</td>
      <td>Wall Roll &amp; Scoop, Deke, Fade, Inverted Curl, Deep V (Stick-Hand → Free-Hand), Deep V (Free-Hand → Stick-Hand), Figure 6, Around the World, Upper Cut</td>
    </tr>
  </tbody>
</table></div><div>

</div><hr><div>

</div><h2 id="badge-criteria" class="toc-header"><a class="toc-anchor" href="#badge-criteria">¶</a> Badge Criteria</h2><div>

</div><h3 id="wall-roll-scoop" class="toc-header"><a class="toc-anchor" href="#wall-roll-scoop">¶</a> Wall Roll &amp; Scoop</h3><div>

</div><ul>
<li><b>Shallow</b> — Execute wall roll and scoop cleanly along wall while maintaining control in 4/6 attempts.</li>
<li><b>Mid</b> — Use wall roll and scoop to evade active defender along wall in 4/6 attempts.</li>
<li><b>Deep</b> — Use wall roll and scoop in live play vs equal defender while retaining possession in 4/6 attempts.</li>
<li><b>Pelagic</b> — Wall roll and scoop creates attacking continuation in 5/8 attempts vs equal defender.</li>
</ul><div>

</div><hr><div>

</div><h3 id="deke" class="toc-header"><a class="toc-anchor" href="#deke">¶</a> Deke</h3><div>

</div><ul>
<li><b>Shallow</b> — Execute deke movement to move defender off line in 4/6 attempts vs passive defender.</li>
<li><b>Mid</b> — Successfully evade active defender using deke in 4/6 attempts.</li>
<li><b>Deep</b> — Use deke in live play vs equal defender resulting in controlled continuation in 4/6 attempts.</li>
<li><b>Pelagic</b> — Deke breaks defender and creates attacking advantage in 5/8 attempts vs equal defender.</li>
</ul><div>

</div><hr><div>

</div><h3 id="fade" class="toc-header"><a class="toc-anchor" href="#fade">¶</a> Fade</h3><div>

</div><ul>
<li><b>Shallow</b> — Execute fade movement while maintaining puck control in 4/6 attempts.</li>
<li><b>Mid</b> — Use fade to avoid active tackle in 4/6 attempts.</li>
<li><b>Deep</b> — Fade used in live play vs equal defender while retaining possession in 4/6 attempts.</li>
<li><b>Pelagic</b> — Fade creates offensive continuation in 5/8 attempts vs equal defender.</li>
</ul><div>

</div><hr><div>

</div><h3 id="inverted-curl" class="toc-header"><a class="toc-anchor" href="#inverted-curl">¶</a> Inverted Curl</h3><div>

</div><ul>
<li><b>Shallow</b> — Execute inverted curl cleanly to reverse direction while maintaining possession in 4/6 attempts vs passive defender.</li>
<li><b>Mid</b> — Retain possession using inverted curl vs active defender in 4/6 attempts.</li>
<li><b>Deep</b> — Inverted curl used in live play vs equal defender resulting in controlled continuation in 4/6 attempts.</li>
<li><b>Pelagic</b> — Inverted curl used under pressure to create offensive advantage in 5/8 attempts vs equal defender.</li>
</ul><div>

</div><hr><div>

</div><h3 id="deep-v-stick-hand-free-hand" class="toc-header"><a class="toc-anchor" href="#deep-v-stick-hand-free-hand">¶</a> Deep V (Stick-Hand → Free-Hand)</h3><div>

</div><ul>
<li><b>Shallow</b> — Execute Deep V direction change while maintaining puck control in 4/6 attempts in a controlled drill.</li>
<li><b>Mid</b> — Use Deep V to evade active defender in 4/6 attempts.</li>
<li><b>Deep</b> — Use Deep V in live play vs equal defender resulting in retained possession in 4/6 attempts.</li>
<li><b>Pelagic</b> — Deep V creates attacking continuation (drive or pass) in 5/8 attempts vs equal defender.</li>
</ul><div>

</div><hr><div>

</div><h3 id="deep-v-free-hand-stick-hand" class="toc-header"><a class="toc-anchor" href="#deep-v-free-hand-stick-hand">¶</a> Deep V (Free-Hand → Stick-Hand)</h3><div>

</div><ul>
<li><b>Shallow</b> — Execute Deep V transition while maintaining puck control in 4/6 attempts in a controlled drill.</li>
<li><b>Mid</b> — Use Deep V to avoid active defender in 4/6 attempts.</li>
<li><b>Deep</b> — Use Deep V in live play vs equal defender while retaining possession in 4/6 attempts.</li>
<li><b>Pelagic</b> — Deep V results in offensive continuation in 5/8 attempts vs equal defender.</li>
</ul><div>

</div><hr><div>

</div><h3 id="figure-6" class="toc-header"><a class="toc-anchor" href="#figure-6">¶</a> Figure 6</h3><div>

</div><ul>
<li><b>Shallow</b> — Execute Figure 6 movement cleanly while maintaining puck control in 4/6 attempts.</li>
<li><b>Mid</b> — Use Figure 6 to evade active defender in 4/6 attempts.</li>
<li><b>Deep</b> — Use Figure 6 in live play vs equal defender resulting in retained possession in 4/6 attempts.</li>
<li><b>Pelagic</b> — Figure 6 creates attacking continuation in 5/8 attempts.</li>
</ul><div>

</div><hr><div>

</div><h3 id="around-the-world" class="toc-header"><a class="toc-anchor" href="#around-the-world">¶</a> Around the World</h3><div>

</div><ul>
<li><b>Shallow</b> — Execute Around the World puck movement cleanly in 4/6 attempts.</li>
<li><b>Mid</b> — Use Around the World to avoid active defender in 4/6 attempts.</li>
<li><b>Deep</b> — Use Around the World in live play vs equal defender while retaining possession in 4/6 attempts.</li>
<li><b>Pelagic</b> — Around the World creates attacking advantage in 5/8 attempts vs equal defender.</li>
</ul><div>

</div><hr><div>

</div><h3 id="upper-cut" class="toc-header"><a class="toc-anchor" href="#upper-cut">¶</a> Upper Cut</h3><div>

</div><ul>
<li><b>Shallow</b> — Execute Upper Cut movement while maintaining puck control in 4/6 attempts.</li>
<li><b>Mid</b> — Use Upper Cut to evade active defender in 4/6 attempts.</li>
<li><b>Deep</b> — Upper Cut used in live play vs equal defender while retaining possession in 4/6 attempts.</li>
<li><b>Pelagic</b> — Upper Cut creates attacking continuation in 5/8 attempts vs equal defender.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-guidance" class="toc-header"><a class="toc-anchor" href="#coach-guidance">¶</a> Coach Guidance</h2><div>

</div><ul>
<li>Skills badges should be introduced only after core game function is stable.</li>
<li>Do not replace team play with isolated trick practice.</li>
<li>Sign off skills only when execution is repeatable and game-relevant.</li>
<li>Use controlled drills first, then verify under pressure and live play.</li>
<li>Skills badges document technical progression but do not replace decision making, support, or structure.</li>
</ul><div>

</div><p>
Skills badges recognize advanced attacking tools and should be layered onto
players who already demonstrate reliable game function.
</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
