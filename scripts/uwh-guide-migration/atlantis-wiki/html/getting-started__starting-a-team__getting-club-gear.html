g-a-team/getting-club-gear.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>It is important that the club can provide gear for players, as pretty much all new players will have none or little of the gear needed to play. New players can be encouraged to bring their own mask, fins and snorkel, but not all of them will have those. Therefore clubs should have all of the following gear to loan out:</p>
<ol>
  <li><a href="/game/gear-setup/caps" class="is-internal-link is-valid-page">Black and white water polo caps</a>.</li>
  <li><a href="/game/gear-setup/masks" class="is-internal-link is-valid-page">Masks</a></li>
  <li><a href="/game/gear-setup/snorkels" class="is-internal-link is-valid-page">Snorkels</a></li>
  <li><a href="/game/gear-setup/fins" class="is-internal-link is-valid-page">Fins</a></li>
  <li><a href="/game/gear-setup/mouth-guards" class="is-internal-link is-valid-page">Mouth guards on the snorkels</a></li>
  <li><a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">Sticks</a> (both colors)</li>
  <li><a href="/game/gear-setup/gloves" class="is-internal-link is-valid-page">Gloves</a></li>
</ol>
<p>Once players start playing regularly they should be encouraged to start buying their own gear, freeing up the club gear for new players coming in to the sport.&nbsp;</p>
<p>There is some gear that the club should have as well for use in practices:</p>
<ol>
  <li><a href="/game/gear-setup/goals" class="is-internal-link is-valid-page">Goals</a> (2)</li>
  <li><a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">Pucks</a></li>
  <li><a href="/game/gear-setup/walls" class="is-internal-link is-valid-page">Boundary walls or markers</a> (optional)</li>
</ol>
<p>There are a few places that gear can be ordered from. Some of the gear can be found on various swimming websites or stores, such as mask, fins, snorkels, and water polo caps, although it should be confirmed that gear bought from these places are legal for underwater hockey and pass all the restrictions. Other gear is not as easy to find, such as the gloves, sticks, pucks and goals. Some websites that sell all the gear needed are HydroUWH and CANAM underwater hockey.&nbsp;</p>
