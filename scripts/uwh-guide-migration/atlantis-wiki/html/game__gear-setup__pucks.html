ader" id="description"><a href="#description" class="toc-anchor">¶</a> Description</h1>
<p>The puck is approximately 1.3kg (~2.8lbs). It is roughly 30mm (~1.2in) tall with a diameter of 80mm (~3.1in). Pucks can have either plastic or metal sliders on the top and bottom and have a protective plastic coating around the edge. The pucks must be a bright and distinctive color so that it is easy for players and referees to spot.</p>
