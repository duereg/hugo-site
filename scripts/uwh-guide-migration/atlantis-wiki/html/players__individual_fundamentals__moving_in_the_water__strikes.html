ls/moving_in_the_water/strikes.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Strikes are an important part of the game, they determine who gets possestion of the puck first each point. </p>
<p>Strikes occur at the start of every point. Both teams start at their wall (the wall at which the goal they are protecting is at). Each player must have a hand on the wall that is visible to the cheif referee. The <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> starts at the center of the <a href="/game/gear-setup/courts" class="is-internal-link is-valid-page">playing area</a>. Once the <a href="/game/gear-setup/buzzers" class="is-internal-link is-valid-page">buzzer</a> sounds, the players may push off the wall and race to get to the puck first. </p>
