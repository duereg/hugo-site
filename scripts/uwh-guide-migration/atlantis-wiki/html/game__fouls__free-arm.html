<p>The arm that is not being used to hold a <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> and advance the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> is referred to as the free arm. Free-arming is using this arm to grab, push, or pull another player or their stick. This may occur unintentionally as players use their free arm to turn themselves, accidentally pushing off of other players. If an opponent is next to a player, they must be careful to keep their free arm away from the opponent.&nbsp;</p>
<p>Using the non-playing hand to hold or support the stick while in possession of the puck is also a free-arm foul.&nbsp;</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>A free-arm foul should be called anytime a player blocks, pushes, or grabs an opponent with their free arm, or supports their stick with the non-playing hand. If a player or team repeatedly commits the free-arm foul, a warning should be given and if it still continues, the offending player should be given a one minute penalty.</p>
<p>The signal to call free arming is the back and forth movement of a horizontal forearm, simulating the movement of elbowing something.</p>
<figure class="image image_resized" style="width:48.29%;"><img src="/free_arm.png"></figure>
<h1 id="when-not-to-call-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-call-and-what-to-watch-out-for">¶</a> When not to Call and What to Watch Out For</h1>
<p>The free arm infringement should not be called if a player uses their arm to turn themselves without coming into contact with an opponent.</p>
