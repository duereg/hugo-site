</div><p>
Introduce pressure in both defending and attacking situations, focusing on closing space quickly, maintaining control, and supporting immediately.
</p><div>

</div><hr><div>

</div><h2 id="session-flow" class="toc-header"><a class="toc-anchor" href="#session-flow">¶</a> Session Flow</h2><div>

</div><section>
  <h3 id="h-1-defensive-pressure-close-and-hold" class="toc-header"><a class="toc-anchor" href="#h-1-defensive-pressure-close-and-hold">¶</a> 1. Defensive Pressure – Close and Hold</h3>
  <ul>
    <li>Close space quickly once attacker passes marker</li>
    <li>Stop at controlled distance</li>
    <li>Stay balanced without over-committing</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-6#defensive-pressure-close-and-hold" class="is-internal-link is-valid-page">
      Defensive Pressure – Close and Hold
    </a>
  </p>
  <p><strong>Link:</strong> Introduces how to apply pressure correctly.</p>
</section><div>

</div><section>
  <h3 id="h-2-defensive-recovery-pressure" class="toc-header"><a class="toc-anchor" href="#h-2-defensive-recovery-pressure">¶</a> 2. Defensive Recovery Pressure</h3>
  <ul>
    <li>Recover quickly to get between puck and goal</li>
    <li>Re-establish position before applying pressure</li>
    <li>Control body and spacing</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-6#defensive-recovery-pressure" class="is-internal-link is-valid-page">
      Defensive Recovery Pressure
    </a>
  </p>
  <p><strong>Link:</strong> Adds recovery into pressure situations.</p>
</section><div>

</div><section>
  <h3 id="h-3-attacking-pressure-flick-and-follow" class="toc-header"><a class="toc-anchor" href="#h-3-attacking-pressure-flick-and-follow">¶</a> 3. Attacking Pressure – Flick and Follow</h3>
  <ul>
    <li>Flick puck into space past opponent</li>
    <li>Accelerate immediately to follow</li>
    <li>Apply pressure to regain possession</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-6#attacking-pressure-flick-and-follow" class="is-internal-link is-valid-page">
      Attacking Pressure – Flick and Follow
    </a>
  </p>
  <p><strong>Link:</strong> Introduces attacking pressure through movement.</p>
</section><div>

</div><section>
  <h3 id="h-4-attacking-pressure-through-opponent" class="toc-header"><a class="toc-anchor" href="#h-4-attacking-pressure-through-opponent">¶</a> 4. Attacking Pressure Through Opponent</h3>
  <ul>
    <li>Move puck past opponent into space</li>
    <li>Drive through to regain control</li>
    <li>Continue play after action</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-6#attacking-pressure-through-opponent" class="is-internal-link is-valid-page">
      Attacking Pressure Through Opponent
    </a>
  </p>
  <p><strong>Link:</strong> Reinforces continuous attacking movement.</p>
</section><div>

</div><section>
  <h3 id="h-5-2v1-pressure-and-support" class="toc-header"><a class="toc-anchor" href="#h-5-2v1-pressure-and-support">¶</a> 5. 2v1 Pressure and Support</h3>
  <ul>
    <li>Apply pressure with immediate support option</li>
    <li>Support stays available for simple pass</li>
    <li>React quickly to pressure situations</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-6#2v1-pressure-support" class="is-internal-link is-valid-page">
      2v1 Pressure and Support
    </a>
  </p>
  <p><strong>Link:</strong> Connects pressure with support play.</p>
</section><div>

</div><section>
  <h3 id="h-6-game-integration" class="toc-header"><a class="toc-anchor" href="#h-6-game-integration">¶</a> 6. Game Integration</h3>
  <ul>
    <li>Apply pressure concepts in small-sided play</li>
    <li>Defenders close space quickly</li>
    <li>Attackers respond with simple support</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-6#short-game-pressure" class="is-internal-link is-valid-page">
      Short Game Pressure Play
    </a>
  </p>
  <p><strong>Link:</strong> Combine attacking and defensive pressure in play.</p>
</section><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><ul>
  <li>Closes space quickly as first defender</li>
  <li>Applies controlled pressure without over-committing</li>
  <li>Recovers quickly when out of position</li>
  <li>Uses attacking pressure to regain or maintain possession</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-principles" class="toc-header"><a class="toc-anchor" href="#key-principles">¶</a> Key Principles</h2><div>

</div><section>
  <h3 id="defensive-pressure" class="toc-header"><a class="toc-anchor" href="#defensive-pressure">¶</a> Defensive Pressure</h3>
  <ul>
    <li>Close space quickly</li>
    <li>Stay between player and goal</li>
    <li>Do not over-commit</li>
  </ul>
</section><div>

</div><section>
  <h3 id="recovery" class="toc-header"><a class="toc-anchor" href="#recovery">¶</a> Recovery</h3>
  <ul>
    <li>Recover early</li>
    <li>Re-position before pressuring</li>
    <li>Stay composed</li>
  </ul>
</section><div>

</div><section>
  <h3 id="attacking-pressure" class="toc-header"><a class="toc-anchor" href="#attacking-pressure">¶</a> Attacking Pressure</h3>
  <ul>
    <li>Create space with flick or movement</li>
    <li>Follow immediately</li>
    <li>Continue through the action</li>
  </ul>
</section><div>

</div><section>
  <h3 id="support" class="toc-header"><a class="toc-anchor" href="#support">¶</a> Support</h3>
  <ul>
    <li>Provide immediate simple option</li>
    <li>Stay available under pressure</li>
    <li>Keep distance appropriate</li>
  </ul>
</section><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Close fast</li>
  <li>Hold, don’t dive</li>
  <li>Between player and goal</li>
  <li>Follow your flick</li>
  <li>Support early</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><strong>Over-committing on defense</strong> – Reinforce control after closing space</li>
  <li><strong>Slow to apply pressure</strong> – Emphasize quick reaction</li>
  <li><strong>Not recovering position</strong> – Encourage early recovery</li>
  <li><strong>Flick without follow</strong> – Reinforce immediate chase</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Keep pressure controlled (no diving)</li>
  <li>Ensure safe spacing between players</li>
  <li>Reinforce positioning over intensity</li>
  <li>Progress only when control is consistent</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h2><div>

</div><ul>
  <li>Increase speed of pressure</li>
  <li>Add more active defenders</li>
  <li>Reduce time and space</li>
</ul><div>

</div><h2 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h2><div>

</div><ul>
  <li>Slow tempo</li>
  <li>Increase space</li>
  <li>Limit defender movement</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
