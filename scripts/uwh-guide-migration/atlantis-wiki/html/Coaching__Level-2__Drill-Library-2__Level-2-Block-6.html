</div><p><b>Progressive Badges Supported (Observed Where Applicable):</b> None (foundation block)</p><div>

</div><hr><div>

</div><h3 id="defensive-pressure-close-and-hold" class="toc-header"><a class="toc-anchor" href="#defensive-pressure-close-and-hold">¶</a> Defensive Pressure – Close and Hold</h3><div>

</div><ul>
  <li>Attacker starts with puck and swims toward a marker.</li>
  <li>As soon as the attacker passes the marker, defender closes space quickly.</li>
  <li>Defender stops at controlled distance and holds position.</li>
  <li>Focus on no over-commitment and staying balanced.</li>
</ul><div>

</div><p><b>Key Focus:</b> Close space fast, then control.</p><div>

</div><hr><div>

</div><h3 id="defensive-recovery-pressure" class="toc-header"><a class="toc-anchor" href="#defensive-recovery-pressure">¶</a> Defensive Recovery Pressure</h3><div>

</div><ul>
  <li>Defender starts slightly behind or to the side.</li>
  <li>Recover quickly to get between puck and goal.</li>
  <li>Apply controlled pressure once position is regained.</li>
</ul><div>

</div><p><b>Key Focus:</b> Recover quickly, then apply pressure.</p><div>

</div><hr><div>

</div><h3 id="attacking-pressure-flick-and-follow" class="toc-header"><a class="toc-anchor" href="#attacking-pressure-flick-and-follow">¶</a> Attacking Pressure – Flick and Follow</h3><div>

</div><ul>
  <li>Player with puck flicks it past the opponent into space.</li>
  <li>Immediately accelerates to follow the flick.</li>
  <li>Applies pressure onto the opponent while recovering the puck.</li>
</ul><div>

</div><p><b>Key Focus:</b> Create space, then attack it.</p><div>

</div><hr><div>

</div><h3 id="attacking-pressure-through-opponent" class="toc-header"><a class="toc-anchor" href="#attacking-pressure-through-opponent">¶</a> Attacking Pressure Through Opponent</h3><div>

</div><ul>
  <li>Player approaches opponent with puck under control.</li>
  <li>Flick or move puck into space past opponent.</li>
  <li>Drive through to regain possession and continue play.</li>
</ul><div>

</div><p><b>Key Focus:</b> Do not stop after action—continue through.</p><div>

</div><hr><div>

</div><h3 id="h-2v1-pressure-support" class="toc-header"><a class="toc-anchor" href="#h-2v1-pressure-support">¶</a> 2v1 Pressure and Support</h3><div>

</div><ul>
  <li>One attacker under pressure with immediate support option.</li>
  <li>Defender applies controlled pressure.</li>
  <li>Support player stays available for simple release pass.</li>
</ul><div>

</div><p><b>Key Focus:</b> Pressure triggers support.</p><div>

</div><hr><div>

</div><h3 id="short-game-pressure" class="toc-header"><a class="toc-anchor" href="#short-game-pressure">¶</a> Short Game Pressure Play</h3><div>

</div><ul>
  <li>Small-sided game focusing on first defender role.</li>
  <li>Defenders close space quickly without diving.</li>
  <li>Attackers respond with simple support options.</li>
</ul><div>

</div><p><b>Key Focus:</b> Apply pressure, recover, and support.</p><div>
