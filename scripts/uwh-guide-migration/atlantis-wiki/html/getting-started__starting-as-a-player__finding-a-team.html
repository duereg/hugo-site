d/starting-as-a-player/finding-a-team.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Finding a team to practice with can be done in a couple of ways:</p>
<ol>
  <li>First, players can reach out to the country's federation and ask if there are any clubs in the area, and find a contact form the club.</li>
  <li>Players can look at UWH tourist, a database with many clubs all over the world, including contacts for the clubs. This can be found at pucku.org/tourist/.</li>
</ol>
