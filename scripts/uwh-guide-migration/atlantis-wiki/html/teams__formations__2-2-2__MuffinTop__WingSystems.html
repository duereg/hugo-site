op/WingSystems.md"><template slot="contents"><div><h1 id="wing-systems" class="toc-header"><a class="toc-anchor" href="#wing-systems">¶</a> Wing Systems</h1>
<p><a href="../MuffinTop" class="is-asset-link">← Return to Muffin Top</a></p>
<p><img src="/underwater_hockey_wing_play_diagram.jpg" alt="underwater_hockey_wing_play_diagram.jpg"></p>
<p>The Wings provide the outside pressure and structure for the formation.</p>
<p>Their primary responsibilities are:</p>
<ul>
<li>Prevent the opposing team from advancing around the outside of the formation</li>
<li>Funnel the puck toward the center and support structure</li>
<li>Support offensive progression through controlled movement and pressure</li>
<li>Maintain defensive balance during transitions</li>
</ul>
<p>The passing and swimming options available to the Wings are shown in the diagram above.</p>
<p>The position shown represents the Wing’s real-time location. If the Wing moves from position “A” to position “B”, the same movement and passing principles apply throughout the movement. This allows the Wing to:</p>
<ul>
<li>Read the play dynamically</li>
<li>Move according to available space</li>
<li>Maintain predictable support structure for teammates</li>
</ul>
<hr>
<h1 id="strong-wing" class="toc-header"><a class="toc-anchor" href="#strong-wing">¶</a> Strong Wing</h1>
<h2 id="primary-purpose" class="toc-header"><a class="toc-anchor" href="#primary-purpose">¶</a> Primary Purpose</h2>
<p>The Strong Wing is the formation’s primary offensive pressure player.</p>
<hr>
<h2 id="main-responsibilities" class="toc-header"><a class="toc-anchor" href="#main-responsibilities">¶</a> Main Responsibilities</h2>
<ul>
<li>Aggressively attack open-water lanes</li>
<li>Drive offensive progression through space</li>
<li>Maintain continuous movement while in possession</li>
<li>Create offensive pressure through controlled movement</li>
</ul>
<hr>
<h2 id="offensive-role" class="toc-header"><a class="toc-anchor" href="#offensive-role">¶</a> Offensive Role</h2>
<p>The Strong Wing should:</p>
<ul>
<li>Attack through or across the centerline</li>
<li>Focus on movement rather than direct stick battles</li>
<li>Advance the puck through:
<ul>
<li>Controlled puck handling</li>
<li>Continuous movement</li>
<li>Quick support passing</li>
</ul>
</li>
</ul>
<h3 id="important" class="toc-header"><a class="toc-anchor" href="#important">¶</a> Important</h3>
<p>While in possession:</p>
<ul>
<li>Keep moving</li>
<li>Avoid becoming stationary</li>
<li>Maintain awareness of support options</li>
</ul>
<hr>
<h2 id="support-and-recovery" class="toc-header"><a class="toc-anchor" href="#support-and-recovery">¶</a> Support and Recovery</h2>
<p>If support becomes unavailable:</p>
<ul>
<li>Move toward the Weak Wing side</li>
<li>Look for a Back as a recycle option</li>
</ul>
<p>Avoid:</p>
<ul>
<li>Stopping while low on air</li>
<li>Becoming trapped without support</li>
</ul>
<p>The Strong Wing should plan:</p>
<ul>
<li>Dives</li>
<li>Movement</li>
<li>Recovery routes</li>
</ul>
<p>around available support positioning.</p>
<hr>
<h1 id="weak-wing" class="toc-header"><a class="toc-anchor" href="#weak-wing">¶</a> Weak Wing</h1>
<h2 id="primary-purpose-1" class="toc-header"><a class="toc-anchor" href="#primary-purpose-1">¶</a> Primary Purpose</h2>
<p>The Weak Wing acts as the formation’s Last Back.</p>
<hr>
<h2 id="main-responsibilities-1" class="toc-header"><a class="toc-anchor" href="#main-responsibilities-1">¶</a> Main Responsibilities</h2>
<ul>
<li>Maintain defensive balance</li>
<li>Protect the center recovery lane</li>
<li>Prevent breakaways through the middle</li>
<li>Support offensive transitions safely</li>
</ul>
<hr>
<h2 id="positioning-guidelines" class="toc-header"><a class="toc-anchor" href="#positioning-guidelines">¶</a> Positioning Guidelines</h2>
<p>The Weak Wing should maintain positioning between:</p>
<ul>
<li>The puck</li>
<li>The center of the defended tray</li>
</ul>
<h3 id="supporting-strong-wing-transitions" class="toc-header"><a class="toc-anchor" href="#supporting-strong-wing-transitions">¶</a> Supporting Strong Wing Transitions</h3>
<p>When the Strong Wing cuts across the formation:</p>
<ul>
<li>The Weak Wing may move up to support</li>
<li>Nearby Backs temporarily help cover Last Back responsibilities</li>
</ul>
<h3 id="important-1" class="toc-header"><a class="toc-anchor" href="#important-1">¶</a> Important</h3>
<p>The Weak Wing should:</p>
<ul>
<li>NOT move ahead of the Strong Wing</li>
<li>Continue acting as a recovery layer</li>
</ul>
<p>Passes to the Weak Wing should still be:</p>
<ul>
<li>Backward-directed support passes</li>
<li>Even if mostly lateral</li>
</ul>
<hr>
<h2 id="advancing-after-receiving-the-puck" class="toc-header"><a class="toc-anchor" href="#advancing-after-receiving-the-puck">¶</a> Advancing After Receiving the Puck</h2>
<p>After receiving possession:</p>
<ul>
<li>The Weak Wing may cut across the Strong Wing’s fins</li>
<li>Continue advancing up-pool through open space</li>
</ul>
<p>Avoid:</p>
<ul>
<li>Immediately attacking the wall the Strong Wing just vacated</li>
</ul>
<p>Why:</p>
<ul>
<li>Support may not yet have recovered to that side</li>
</ul>
<hr>
<h1 id="last-back-responsibilities-weak-wing" class="toc-header"><a class="toc-anchor" href="#last-back-responsibilities-weak-wing">¶</a> Last Back Responsibilities (Weak Wing)</h1>
<p>When defending an opponent breakaway, the Weak Wing acts as the formation’s Last Back.</p>
<p>Responsibilities should be prioritized in the following order:</p>
<hr>
<h2 id="h-1-do-not-lunge-for-the-puck" class="toc-header"><a class="toc-anchor" href="#h-1-do-not-lunge-for-the-puck">¶</a> 1. Do NOT Lunge for the Puck</h2>
<ul>
<li>Avoid overcommitting directly at the puck carrier</li>
<li>Opponents often use lunges to maneuver around defenders</li>
</ul>
<p>Priority:</p>
<ul>
<li>Stay controlled</li>
<li>Maintain positioning</li>
</ul>
<hr>
<h2 id="h-2-protect-the-direct-lane-to-goal" class="toc-header"><a class="toc-anchor" href="#h-2-protect-the-direct-lane-to-goal">¶</a> 2. Protect the Direct Lane to Goal</h2>
<p>Position the body and/or stick between:</p>
<ul>
<li>The puck carrier</li>
<li>The defended tray</li>
</ul>
<h3 id="highest-priority" class="toc-header"><a class="toc-anchor" href="#highest-priority">¶</a> Highest Priority</h3>
<p>Prevent a direct scoring lane.</p>
<hr>
<h2 id="h-3-force-the-opponent-wide" class="toc-header"><a class="toc-anchor" href="#h-3-force-the-opponent-wide">¶</a> 3. Force the Opponent Wide</h2>
<p>Guide the attacker toward:</p>
<ul>
<li>Defensive corners</li>
<li>Side walls</li>
<li>Areas away from the center lane</li>
</ul>
<h3 id="best-outcome" class="toc-header"><a class="toc-anchor" href="#best-outcome">¶</a> Best Outcome</h3>
<ul>
<li>Stop the attack against the wall</li>
</ul>
<hr>
<h2 id="h-4-limit-support-passing-lanes" class="toc-header"><a class="toc-anchor" href="#h-4-limit-support-passing-lanes">¶</a> 4. Limit Support Passing Lanes</h2>
<p>Once the puck carrier is controlled:</p>
<ul>
<li>Reduce passing opportunities</li>
<li>Disrupt lateral support options</li>
</ul>
<h3 id="important-2" class="toc-header"><a class="toc-anchor" href="#important-2">¶</a> Important</h3>
<p>The puck carrier remains the primary threat.</p>
<p>Stopping the puck carrier takes priority over:</p>
<ul>
<li>Covering secondary attackers</li>
</ul>
<p>Recovering teammates are more likely to cover support players through the middle.</p>
<hr>
<h1 id="things-to-avoid-as-a-wing" class="toc-header"><a class="toc-anchor" href="#things-to-avoid-as-a-wing">¶</a> Things to Avoid as a Wing</h1>
<hr>
<h2 id="avoid-letting-the-play-get-around-the-outside" class="toc-header"><a class="toc-anchor" href="#avoid-letting-the-play-get-around-the-outside">¶</a> Avoid Letting the Play Get Around the Outside</h2>
<ul>
<li>Maintain outside defensive coverage</li>
<li>Prevent opponents from advancing between the formation and the wall</li>
</ul>
<h3 id="recovery-priority" class="toc-header"><a class="toc-anchor" href="#recovery-priority">¶</a> Recovery Priority</h3>
<p>If possession is lost after moving toward the center:</p>
<ul>
<li>Surface diagonally back toward your side</li>
<li>Re-establish defensive positioning quickly</li>
</ul>
<hr>
<h2 id="avoid-taking-the-puck-toward-your-own-strong-side-wall" class="toc-header"><a class="toc-anchor" href="#avoid-taking-the-puck-toward-your-own-strong-side-wall">¶</a> Avoid Taking the Puck Toward Your Own Strong-Side Wall</h2>
<p>If carrying or receiving the puck in the Muffin Zone:</p>
<ul>
<li>Avoid drifting back toward the strong-side wall</li>
<li>Unless there is a clear attacking opportunity</li>
</ul>
<h3 id="why" class="toc-header"><a class="toc-anchor" href="#why">¶</a> Why</h3>
<p>Moving outward:</p>
<ul>
<li>Exposes the outside lane</li>
<li>Reduces support options</li>
<li>Creates vulnerability when low on air</li>
</ul>
<h3 id="preferred-response" class="toc-header"><a class="toc-anchor" href="#preferred-response">¶</a> Preferred Response</h3>
<ul>
<li>End the dive</li>
<li>Leave the puck in the Muffin Zone</li>
<li>Allow support players to continue the attack</li>
</ul>
<hr>
<h2 id="avoid-being-forced-to-the-wall" class="toc-header"><a class="toc-anchor" href="#avoid-being-forced-to-the-wall">¶</a> Avoid Being Forced to the Wall</h2>
<p>If pressure pushes the Wing outward:</p>
<ul>
<li>Turn inward early</li>
<li>Curl</li>
<li>Pass back to a Back</li>
</ul>
<h3 id="important-3" class="toc-header"><a class="toc-anchor" href="#important-3">¶</a> Important</h3>
<p>Do this BEFORE reaching:</p>
<ul>
<li>Approximately 2m from the side wall</li>
</ul>
<hr>
<h2 id="avoid-passing-directly-to-a-forward-outside-the-crash-the-goal-zone" class="toc-header"><a class="toc-anchor" href="#avoid-passing-directly-to-a-forward-outside-the-crash-the-goal-zone">¶</a> Avoid Passing Directly to a Forward Outside the Crash the Goal Zone</h2>
<p>Forwards are generally not positioned to safely support Wings during open-water play.</p>
<h3 id="preferred-option" class="toc-header"><a class="toc-anchor" href="#preferred-option">¶</a> Preferred Option</h3>
<ul>
<li>Pass diagonally backward to a Back</li>
<li>Allow the Back to determine whether a Forward pass is appropriate</li>
</ul>
<hr>
<h2 id="avoid-losing-the-puck-forward" class="toc-header"><a class="toc-anchor" href="#avoid-losing-the-puck-forward">¶</a> Avoid Losing the Puck Forward</h2>
<ul>
<li>Prioritize controlled progression</li>
<li>Avoid forcing risky forward plays</li>
<li>Recycle possession when necessary</li>
</ul>
<hr>
<h2 id="avoid-getting-too-close-as-a-weak-wing" class="toc-header"><a class="toc-anchor" href="#avoid-getting-too-close-as-a-weak-wing">¶</a> Avoid Getting Too Close as a Weak Wing</h2>
<p>The Weak Wing must maintain enough spacing to:</p>
<ul>
<li>Perform effective Kelp Dives</li>
<li>Present a defensive obstacle</li>
<li>Avoid interfering with the Backs</li>
</ul>
<h3 id="if-too-close" class="toc-header"><a class="toc-anchor" href="#if-too-close">¶</a> If Too Close</h3>
<ul>
<li>Defensive coverage weakens</li>
<li>Recovery becomes difficult</li>
<li>Central support lanes become congested</li>
</ul>
<hr>
<h2 id="avoid-moving-too-far-ahead-as-a-weak-wing" class="toc-header"><a class="toc-anchor" href="#avoid-moving-too-far-ahead-as-a-weak-wing">¶</a> Avoid Moving Too Far Ahead as a Weak Wing</h2>
<p>The Weak Wing must remain positioned:</p>
<ul>
<li>Between the puck and the center of the defended tray</li>
</ul>
<h3 id="if-too-far-forward" class="toc-header"><a class="toc-anchor" href="#if-too-far-forward">¶</a> If Too Far Forward</h3>
<ul>
<li>Wall coverage weakens</li>
<li>Recovery angles worsen</li>
<li>Opponent breakaways become more dangerous</li>
</ul>
<hr>
