</div><h3 id="individual-contest-mechanics" class="toc-header"><a class="toc-anchor" href="#individual-contest-mechanics">¶</a> Individual Contest Mechanics</h3><div>

</div><h4 id="l3-drill-absorb-1v1" class="toc-header"><a class="toc-anchor" href="#l3-drill-absorb-1v1">¶</a> 1v1 Absorb Challenge</h4><div>

</div><ul>
  <li>Attacker swims toward defender with the puck under control.</li>
  <li>Defender applies forward pressure and initiates contact.</li>
  <li>Defender absorbs the attacker’s force and redirects it to take the puck cleanly.</li>
  <li>Focus on timing, soft hands, and using momentum rather than stopping the player.</li>
</ul><div>

</div><p><b>Progression:</b></p>
<ul>
  <li>Start with light pressure and slower approach speed.</li>
  <li>Increase swim speed as players become more successful.</li>
  <li>Add firmer, controlled contact while maintaining clean technique.</li>
</ul><div>

</div><p><b>Coaching Focus:</b></p>
<ul>
  <li>Absorb, don’t collide</li>
  <li>Use their movement</li>
  <li>Redirect into possession</li>
</ul><div>

</div><p><b>Badge Opportunities:</b>
<a href="/en/Coaching/Badges/Progressive#puck-batting" class="is-internal-link is-valid-page">Puck Batting</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/players/tackling_maneuvers/absorbing" class="is-internal-link is-valid-page">Absorb and Stabilise</a>
</p><div>

</div><hr><div>


</div><h4 id="l3-drill-tackle-stick-hand" class="toc-header"><a class="toc-anchor" href="#l3-drill-tackle-stick-hand">¶</a> Controlled Stick-Hand Tackle</h4><div>

</div><ul>
  <li>Attacker moves slowly with the puck.</li>
  <li>Defender approaches from the stick-hand side.</li>
  <li>Execute clean puck-first contact and secure possession before moving away.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> none
</p><div>

</div><p><b>Video:</b>
<a href="/en/players/tackling_maneuvers/tackle_2" class="is-internal-link is-valid-page">Stick-Hand Tackle Mechanics</a>
</p><div>

</div><hr><div>

</div><h4 id="l3-drill-tackle-free-hand" class="toc-header"><a class="toc-anchor" href="#l3-drill-tackle-free-hand">¶</a> Controlled Free-Hand Tackle</h4><div>

</div><ul>
  <li>Attacker moves slowly with the puck.</li>
  <li>Defender approaches from the free-hand side.</li>
  <li>Use correct angle and timing to win the puck legally and settle possession.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b>
none
</p><div>

</div><p><b>Video:</b>
<a href="/en/players/tackling_maneuvers/tackle_1" class="is-internal-link is-valid-page">Free-Hand Tackle Mechanics</a>
</p><div>

</div><hr><div>

</div><h4 id="l3-drill-tackle-combo" class="toc-header"><a class="toc-anchor" href="#l3-drill-tackle-combo">¶</a> Combo Tackle Sequence</h4><div>

</div><ul>
  <li>Defender completes a sequence of tackles from alternating sides.</li>
  <li>Coach or partner varies entry angle.</li>
  <li>Focus on choosing correct tackle side and securing possession each time.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b>
none
</p><div>

</div><p><b>Video:</b>
<a href="/en/players/tackling_maneuvers/tackle_1" class="is-internal-link is-valid-page">Free-Hand Tackle Mechanics</a>,
<a href="/en/players/tackling_maneuvers/tackle_2" class="is-internal-link is-valid-page">Stick-Hand Tackle Mechanics</a>
</p><div>

</div><hr><div>

</div><h4 id="l3-drill-back-pick-chase" class="toc-header"><a class="toc-anchor" href="#l3-drill-back-pick-chase">¶</a> Back-Pick Chase Drill</h4><div>

</div><ul>
  <li>Attacker starts ahead with the puck.</li>
  <li>Defender tracks from behind and waits for attacker to curl.</li>
  <li>Attempt back-pick only when the puck is exposed and recover control immediately.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b>
none
</p><div>

</div><p><b>Video:</b>
<a href="/en/players/tackling_maneuvers/back-picks" class="is-internal-link is-valid-page">Back-Picks</a>
</p><div>

</div><hr><div>

</div><h4 id="l3-drill-intercept-static" class="toc-header"><a class="toc-anchor" href="#l3-drill-intercept-static">¶</a> Static Interception</h4><div>

</div><ul>
  <li>Coach or partner sends a puck into reachable space.</li>
  <li>Player moves onto the line of the puck early.</li>
  <li>Focus on batting the puck and controlling first contact.</li>
</ul><div>


</div><p><b>Badge Opportunities:</b>
<a href="/en/Coaching/Badges/Progressive#puck-batting" class="is-internal-link is-valid-page">Puck Batting</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/players/tackling_maneuvers/knock-downs" class="is-internal-link is-valid-page">Knock-Downs</a>
</p><div>

</div><hr><div>

</div><h4 id="l3-drill-intercept-pass" class="toc-header"><a class="toc-anchor" href="#l3-drill-intercept-pass">¶</a> Intercept the Pass</h4><div>

</div><ul>
  <li>Two players pass while a defender reads the lane.</li>
  <li>Defender steps into the passing line and intercepts cleanly.</li>
  <li>Secure the puck before the original attackers can pressure.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b>
<a href="/en/Coaching/Badges/Progressive#puck-batting" class="is-internal-link is-valid-page">Puck Batting</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/players/tackling_maneuvers/knock-downs" class="is-internal-link is-valid-page">Knock-Downs</a>
</p><div>

</div><hr><div>

</div><h3 id="team-contest-behaviours" class="toc-header"><a class="toc-anchor" href="#team-contest-behaviours">¶</a> Team Contest Behaviours</h3><div>

</div><h4 id="l3-drill-breakaway-rotation" class="toc-header"><a class="toc-anchor" href="#l3-drill-breakaway-rotation">¶</a> Breakaway Containment Rotation</h4><div>

</div><ul>
  <li>Attacker begins ahead with the puck.</li>
  <li>Defender(s) close using correct angle and positioning.</li>
  <li>Focus on containment first, not immediate tackle.</li>
  <li>Rotate roles and introduce support defenders progressively.</li>
</ul><div>

</div><hr><div>

</div><p><strong>Method 1: Backwards Facing Containment</strong></p><div>

</div><p><b>When to Use</b></p>
<ul>
  <li>You are ahead of or level with the attacker</li>
  <li>You can turn to face your own goal</li>
  <li>The attacker is still building speed</li>
</ul><div>

</div><p><b>Key Concepts</b></p>
<ul>
  <li>Face back toward your own goal</li>
  <li>Look down and back at the attacker</li>
  <li>Swim slightly <b>above</b> or just off the bottom</li>
  <li>Angle the attacker toward a side wall</li>
</ul><div>

</div><p><b>This position:</b></p>
<ul>
  <li>Gives clear vision of the play</li>
  <li>Makes it easier to contain rather than collide</li>
  <li>Creates opportunities for steals from above</li>
</ul><div>

</div><hr><div>

</div><p><strong>Method 2: Parallel Chase on the Bottom</strong></p><div>

</div><p><b>When to Use</b></p>
<ul>
  <li>You are slightly behind or level with the attacker</li>
  <li>You are <b>flat</b> and parallel with attacker</li>
  <li>The puck is reachable from the side</li>
</ul><div>

</div><p><b>Key Concepts</b></p>
<ul>
  <li>Stay flat on the bottom</li>
  <li>Chase on either side of the attacker</li>
  <li>Match speed without contacting the body</li>
  <li>Look for side tackles or knock-downs</li>
</ul><div>

</div><p><b>This method is best for:</b></p>
<ul>
  <li>Stick-hand or free-hand side tackles</li>
  <li>Forcing a curl</li>
</ul><div>

</div><hr><div>

</div><p><strong>Method 3: Two-Player Chase</strong></p><div>

</div><p><b>When to Use</b></p>
<ul>
  <li>Two defenders are close enough to chase together</li>
  <li>The breakaway is central or high risk</li>
</ul><div>

</div><p><b>Key Concepts</b></p>
<ul>
  <li>One defender on each side of the attacker</li>
  <li>Force the attacker to curl</li>
  <li>As the attacker curls, one defender executes the back-pick</li>
  <li>The second defender protects space if the steal fails</li>
  <li>Alternative: first defender taps the puck across to the second defender to secure possession</li>
</ul><div>

</div><p><b>This method is best for:</b></p>
<ul>
  <li>High-pressure recovery situations</li>
  <li>Creating controlled turnovers instead of risky tackles</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> None (team defensive behaviour)</p><div>

</div><p><b>Video:</b>
<a href="/en/players/tackling_maneuvers/chasing_breakaways" class="is-internal-link is-valid-page">Breakaway Containment</a>
</p><div>

</div><hr><div>



</div><h4 id="l3-drill-short-game-contest" class="toc-header"><a class="toc-anchor" href="#l3-drill-short-game-contest">¶</a> Short Game Contest Play</h4><div>

</div><ul>
  <li>Small-sided game with emphasis on legal contest, clean possession wins, and immediate recovery.</li>
  <li>Reward players who win the puck cleanly and reconnect quickly to team play.</li>
  <li>Stop repeated fouls and restart with clear coaching focus.</li>
</ul><div>

</p><div>
