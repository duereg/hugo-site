<h2 id="overview" class="toc-header"><a class="toc-anchor" href="#overview">¶</a> Overview</h2>
<p>The Forward positions are divided into two specialized roles:</p>
<ul>
<li>FC — Controlling Forward</li>
<li>FD — Disrupting Forward</li>
</ul>
<p>Although both Forwards are shown side-by-side in the formation, their positioning changes depending on:</p>
<ul>
<li>Puck location</li>
<li>Team possession</li>
<li>Flow of play</li>
<li>Opponent pressure</li>
</ul>
<p>Each Forward has a primary responsibility:</p>
<ul>
<li>Approximately 75% focus on their primary role</li>
<li>Approximately 25% support for the other Forward’s responsibilities</li>
</ul>
<hr>
<h2 id="general-forward-responsibilities" class="toc-header"><a class="toc-anchor" href="#general-forward-responsibilities">¶</a> General Forward Responsibilities</h2>
<h3 id="main-objectives" class="toc-header"><a class="toc-anchor" href="#main-objectives">¶</a> Main Objectives</h3>
<ul>
<li>Support offensive progression through the middle</li>
<li>Maintain forward pressure</li>
<li>Stay ahead of the puck</li>
<li>Support open-water structure</li>
<li>Recycle possession safely</li>
<li>Disrupt opponent transitions when needed</li>
</ul>
<hr>
<h2 id="movement-priorities" class="toc-header"><a class="toc-anchor" href="#movement-priorities">¶</a> Movement Priorities</h2>
<p>Forwards should generally move:</p>
<ul>
<li>Toward the opponent’s tray</li>
<li>Toward the centerline of the Muffin Zone</li>
<li>Backward only when safely recycling possession to a Back</li>
</ul>
<h3 id="movement-philosophy" class="toc-header"><a class="toc-anchor" href="#movement-philosophy">¶</a> Movement Philosophy</h3>
<ul>
<li>Prioritize movement through open space</li>
<li>Maintain support lanes</li>
<li>Avoid becoming isolated from support</li>
</ul>
<hr>
<h2 id="positioning-philosophy" class="toc-header"><a class="toc-anchor" href="#positioning-philosophy">¶</a> Positioning Philosophy</h2>
<ul>
<li>The displayed Forward position represents their real-time location</li>
<li>If a Forward moves from position “A” to “B”:
<ul>
<li>Their movement and passing responsibilities remain consistent throughout the swim</li>
</ul>
</li>
</ul>
<p>This allows:</p>
<ul>
<li>Freedom to read the play</li>
<li>Dynamic positioning</li>
<li>Predictable support for teammates</li>
</ul>
<h3 id="positioning-goals" class="toc-header"><a class="toc-anchor" href="#positioning-goals">¶</a> Positioning Goals</h3>
<ul>
<li>Stay available for support passes</li>
<li>Maintain offensive structure</li>
<li>Stay ahead of the puck whenever possible</li>
<li>Support open-water cycling</li>
</ul>
<p>[FORWARD MOVEMENT IMAGE]</p>
<hr>
<h2 id="offensive-responsibilities" class="toc-header"><a class="toc-anchor" href="#offensive-responsibilities">¶</a> Offensive Responsibilities</h2>
<h3 id="controlling-forward-fc" class="toc-header"><a class="toc-anchor" href="#controlling-forward-fc">¶</a> Controlling Forward (FC)</h3>
<p>The FC focuses primarily on:</p>
<ul>
<li>Controlled possession</li>
<li>Safe offensive progression</li>
<li>Supporting structure through the center</li>
<li>Recycling possession under pressure</li>
</ul>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/FCRole" class="is-internal-link is-valid-page">Read Full FC Role</a></p>
<hr>
<h3 id="disrupting-forward-fd" class="toc-header"><a class="toc-anchor" href="#disrupting-forward-fd">¶</a> Disrupting Forward (FD)</h3>
<p>The FD focuses primarily on:</p>
<ul>
<li>Disrupting opponent structure</li>
<li>Pressuring transitions</li>
<li>Interfering with passing lanes</li>
<li>Supporting offensive pressure when needed</li>
</ul>
<p><a href="/en/teams/formations/2-2-2/MuffinTop/FDRole" class="is-internal-link is-valid-page">Read Full FD Role</a></p>
<hr>
<h2 id="things-to-avoid-as-a-forward" class="toc-header"><a class="toc-anchor" href="#things-to-avoid-as-a-forward">¶</a> Things to Avoid as a Forward</h2>
<h3 id="avoid-passing-directly-to-the-other-forward" class="toc-header"><a class="toc-anchor" href="#avoid-passing-directly-to-the-other-forward">¶</a> Avoid Passing Directly to the Other Forward</h3>
<p>Unless both Forwards are near the Full Attack Zone:</p>
<ul>
<li>Forward-to-Forward passes are high risk</li>
<li>Limited awareness often exposes the receiving Forward to heavy pressure</li>
</ul>
<hr>
<h3 id="avoid-crossing-the-centerline-to-reach-the-weak-wing" class="toc-header"><a class="toc-anchor" href="#avoid-crossing-the-centerline-to-reach-the-weak-wing">¶</a> Avoid Crossing the Centerline to Reach the Weak Wing</h3>
<p>If uncertain which Wing is the Weak Wing:</p>
<ul>
<li>Recycle possession to a Back instead</li>
</ul>
<p>Especially important:</p>
<ul>
<li>Within ~1m on either side of the centerline</li>
</ul>
<hr>
<h3 id="avoid-getting-behind-the-puck" class="toc-header"><a class="toc-anchor" href="#avoid-getting-behind-the-puck">¶</a> Avoid Getting Behind the Puck</h3>
<p>Forwards should remain:</p>
<ul>
<li>Between the puck and the opponent’s goal</li>
</ul>
<p>Leave direct head-to-head defensive coverage to:</p>
<ul>
<li>Wings</li>
<li>Backs</li>
</ul>
<hr>
<h3 id="avoid-prolonged-stick-battles" class="toc-header"><a class="toc-anchor" href="#avoid-prolonged-stick-battles">¶</a> Avoid Prolonged Stick Battles</h3>
<p>Except when actively attempting to score within the Full Attack Zone:</p>
<ul>
<li>Avoid extended physical engagement</li>
</ul>
<p>If resistance develops:</p>
<ul>
<li>Turn away</li>
<li>Curl</li>
<li>Swim into space</li>
<li>Pass safely to a Wing or Back</li>
</ul>
<hr>
<h2 id="key-skills" class="toc-header"><a class="toc-anchor" href="#key-skills">¶</a> Key Skills</h2>
<ul>
<li>Awareness</li>
<li>Open-water positioning</li>
<li>Puck protection</li>
<li>Controlled passing</li>
<li>Offensive patience</li>
<li>Movement through traffic</li>
<li>Support positioning</li>
<li>Pressure management</li>
</ul>
<hr>
