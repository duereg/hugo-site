<p>There are several methods for chasing someone who has broken out from the main group of players. Deciding which method to use is often dependent on where a player is positioned when the breakaway starts.</p>
<p>The first method players can use is a backwards facing method in which the player is facing back towards their own goal, looking down and back towards the play. This position gives the defender a good view of the play, while also positioning them in a way that allows them to easily and effectively contain the breakaway by <a href="/players/tackling_maneuvers/re-directing_opponents" class="is-internal-link is-valid-page">directing the opponent</a> to one of the sidewalls. This position can also be a good position for stealing the puck from the opponent, such as using the <a href="/players/tackling_maneuvers/toruk_steal" class="is-internal-link is-valid-page">toruk steal</a> to come from above the player in the breakaway and take the puck.&nbsp;</p>
<p>Another method players can use when chasing breakaways is to chase on either side of the player flat on the bottom of the pool. This can be a good position to use <a href="/players/tackling_maneuvers/tackle_1" class="is-internal-link is-valid-page">tackles</a> to steal the puck.&nbsp;</p>
<p>It is also extremely effective if two players chase a breakaway together. If one player set up on each side, as soon as they can get the opponent to curl, one of them will have easy access to the puck and can <a href="/players/tackling_maneuvers/back-picks" class="is-internal-link is-valid-page">back pick</a> the opponent.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>Players have to chase breakaways in all games. Deciding how to chase down the player that broke away (from above or from one side or the other) is largely dependent on the starting position of the player. When an opponent has a breakaway, there is no time to lose and players generally take the shortest and fastest approach to the opponent.&nbsp;</p>
<h1 id="what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#what-to-watch-out-for">¶</a> What to Watch Out For</h1>
<p>Players should be aware that there are going to be players that are faster than themselves, and when those players break away, it is extremely difficult to catch them. Therefore it is important for backs to position themselves so that they can stop players that break out form the crowd before they get up to full speed.&nbsp;</p>
<p>It is also important for players to be careful to not swim into the opponent while chasing them. Pushing into them and not allowing them to swim in the direction they want is an <a href="/game/fouls/obstruction-barging" class="is-internal-link is-valid-page">obstruction foul</a>. Players should keep a little bit of space between themselves and the opponent to ensure they are not fouling them.</p>

  <p><u>CHASING BREAKAWAYS</u></p>
  <ul>
    <li>PLAYERS CAN CHASE FROM ABOVE AND TRY TO STEAL THE PUCK OR KNOCK IT OFF THE OPPONENT'S STICK</li>
    <li>PLAYERS CAN CHASE NEXT TO THE OPPONENT AND TRY TO PICK THE PUCK OFF THE OPPONENT</li>
