</div><p>
This block teaches players to apply structured team defense using Pressure and Support. Players learn to control space, protect the danger zone, and work together to contain and recover the puck.
</p><div>

</div><hr><div>

</div><h2 id="session-run-order" class="toc-header"><a class="toc-anchor" href="#session-run-order">¶</a> Session Run Order</h2><div>

</div><section>
  <h3 id="h-1-pressure-and-support" class="toc-header"><a class="toc-anchor" href="#h-1-pressure-and-support">¶</a> 1. Pressure and Support</h3>
  <ul>
    <li>The closest player to the puck becomes the Pressure player</li>
    <li>The next closest player becomes Support</li>
    <li>When Pressure commits, Support must activate at the same time</li>
    <li>If Support does not move, a gap is created and structure breaks</li>
    <li>Players must stay connected through the contest</li>
  </ul>

  <p><strong>Linked Drill:</strong>
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-2#l3-drill-psb-mechanics" class="is-internal-link is-valid-page">3v2 Pressure Support</a>
  </p>

  <p><strong>Video:</strong>
    <a href="/en/Coaching/Level-3/Video-Library-3#l3-video-psb" class="is-internal-link is-invalid-page">Pressure Support</a>
  </p>
</section><div>

</div><section>
  <h3 id="h-2-support-positioning" class="toc-header"><a class="toc-anchor" href="#h-2-support-positioning">¶</a> 2. Support Positioning</h3>
  <ul>
    <li>Support adjusts position based on the situation</li>
    <li>Support behind for flicks and broken plays</li>
    <li>Support in front for curls and inside turns</li>
    <li>Support must always be available when Pressure engages</li>
  </ul>

  <p><strong>Linked Drill:</strong>
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-2#l3-drill-support-options" class="is-internal-link is-valid-page">Support Positioning Drill</a>
  </p>

  <p><strong>Video:</strong>
    <a href="/en/Coaching/Level-3/Video-Library-3#l3-video-support" class="is-internal-link is-invalid-page">Support Positioning</a>
  </p>
</section><div>

</div><section>
  <h3 id="h-3-danger-zone-and-containment-zones" class="toc-header"><a class="toc-anchor" href="#h-3-danger-zone-and-containment-zones">¶</a> 3. Danger Zone and Containment Zones</h3>
  <ul>
    <li>Protect the middle (danger zone) first</li>
    <li>Steer play toward the wall and corner (containment zones)</li>
    <li>Maintain inside positioning at all times</li>
    <li>Containment zones are safer and reduce scoring risk</li>
    <li>Opportunities to attack through the middle may appear, but carry higher risk if unsuccessful</li>
  </ul>

  <p><strong>Linked Drill:</strong>
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-2#l3-drill-danger-zone" class="is-internal-link is-valid-page">3v3 Safe Zone Containment</a>
  </p>

  <p><strong>Video:</strong>
    <a href="/en/Coaching/Level-3/Video-Library-3#l3-video-danger-zone" class="is-internal-link is-invalid-page">Danger Zone Defense</a>
  </p>
</section><div>

</div><section>
  <h3 id="h-4-back-wall-rotation" class="toc-header"><a class="toc-anchor" href="#h-4-back-wall-rotation">¶</a> 4. Back Wall Rotation</h3>
  <ul>
    <li>Rotation can be 2-player or 3-player depending on situation</li>
    <li>Maintain continuous pressure along the wall</li>
    <li>Keep gaps between players small to prevent attackers splitting through</li>
    <li>Replace exiting players immediately</li>
    <li>Prioritize containment over risky tackles</li>
  </ul>

  <p><strong>Rules Awareness:</strong></p>
  <ul>
    <li>Do not use the glove to advance the puck</li>
    <li>Be aware of the 
      <a href="/en/Rules/CMAS#corner-rule" class="is-internal-link is-invalid-page">Corner Rule</a>
    </li>
  </ul>

  <p><strong>Linked Drill:</strong>
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-2#l3-drill-back-wall-rotation" class="is-internal-link is-valid-page">Back Wall Rotation Drill</a>
  </p>

  <p><strong>Video:</strong>
    <a href="/en/Coaching/Level-3/Video-Library-3#l3-video-back-wall" class="is-internal-link is-invalid-page">Back Wall Rotation</a>
  </p>
</section><div>

</div><section>
  <h3 id="h-5-conditioned-game" class="toc-header"><a class="toc-anchor" href="#h-5-conditioned-game">¶</a> 5. Conditioned Game</h3>
  <ul>
    <li>Apply defensive roles in game play</li>
    <li>Reward structure and containment</li>
    <li>Reinforce Pressure and Support connection</li>
  </ul>

  <p><strong>Linked Drill:</strong>
    <a href="/en/Coaching/Level-3/Drill-Library-3/Level-3-Block-2#l3-drill-conditioned-game" class="is-internal-link is-valid-page">4v4 Conditioned Defense Game</a>
  </p>

  <p><strong>Video:</strong>
    <a href="/en/Coaching/Level-3/Video-Library-3#l3-video-defense-game" class="is-internal-link is-invalid-page">Conditioned Defense Game</a>
  </p>
</section><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><p>By the end of this block players should demonstrate the following during game play:</p><div>

</div><ul>
  <li>Clear Pressure and Support roles based on proximity</li>
  <li>Support activates with Pressure (no gaps created)</li>
  <li>Consistent protection of the danger zone</li>
  <li>Play is regularly steered into containment zones</li>
  <li>Effective back wall rotation with minimal gaps</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-team-principles" class="toc-header"><a class="toc-anchor" href="#key-team-principles">¶</a> Key Team Principles</h2><div>

</div><section>
  <h3 id="pressure-and-support" class="toc-header"><a class="toc-anchor" href="#pressure-and-support">¶</a> Pressure and Support</h3>
  <ul>
    <li>Closest player applies pressure</li>
    <li>Next player supports immediately</li>
    <li>Both players move together as a unit</li>
  </ul>
</section><div>

</div><section>
  <h3 id="space-control" class="toc-header"><a class="toc-anchor" href="#space-control">¶</a> Space Control</h3>
  <ul>
    <li>Protect the middle first</li>
    <li>Steer play to wall and corner</li>
    <li>Contain before attempting to win</li>
  </ul>
</section><div>

</div><section>
  <h3 id="rotation" class="toc-header"><a class="toc-anchor" href="#rotation">¶</a> Rotation</h3>
  <ul>
    <li>Rotate continuously along the wall</li>
    <li>Keep gaps small</li>
    <li>Replace early to maintain structure</li>
  </ul>
</section><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Closest goes</li>
  <li>Support with him</li>
  <li>No gaps</li>
  <li>Protect the middle</li>
  <li>Force wide</li>
  <li>Rotate early</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-good-defensive-structure-looks-like" class="toc-header"><a class="toc-anchor" href="#what-good-defensive-structure-looks-like">¶</a> What Good Defensive Structure Looks Like</h2><div>

</div><ul>
  <li>Immediate pressure from closest player</li>
  <li>Support arrives at the same time</li>
  <li>No visible gaps between defenders</li>
  <li>Play consistently pushed to safe zones</li>
  <li>Rotation stays tight and connected</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><b>Pressure without support</b><br>Cue: Go together.</li>
  <li><b>Support too far away</b><br>Cue: Close the gap.</li>
  <li><b>Middle left open</b><br>Cue: Protect first.</li>
  <li><b>Overcommitting</b><br>Cue: Contain first.</li>
  <li><b>Large gaps in rotation</b><br>Cue: Stay tight.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Stop play when gaps appear</li>
  <li>Reset roles clearly before reps</li>
  <li>Reinforce connection over speed</li>
  <li>Progress only when structure holds</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression-and-regression" class="toc-header"><a class="toc-anchor" href="#progression-and-regression">¶</a> Progression and Regression</h2><div>

</div><h3 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h3>
<ul>
  <li>Increase tempo</li>
  <li>Add attackers</li>
  <li>Reduce decision time</li>
</ul><div>

</div><h3 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h3>
<ul>
  <li>Reduce numbers</li>
  <li>Slow play</li>
  <li>Fix roles without pressure</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
