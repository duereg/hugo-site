</div><h2 id="is-underwater-hockey-safe-for-your-patrons-and-facility" class="toc-header"><a class="toc-anchor" href="#is-underwater-hockey-safe-for-your-patrons-and-facility">¶</a> Is Underwater Hockey safe for your patrons and facility?</h2><div>

</div><p>Yes! Underwater hockey is a <strong>limited-contact and rules based</strong> sport that has been run successfully in aquatic centers, YMCAs, and competition venues across the USA and around the world for many years. Facility leaders who host the sport consistently describe it as safe, well-managed, and an overall positive for their programming.</p><div>

</div><h3 id="what-makes-it-safe" class="toc-header"><a class="toc-anchor" href="#what-makes-it-safe">¶</a> What makes it safe?</h3><div>

</div><p>Underwater hockey is played at the bottom of a pool using a puck specifically designed to avoid damaging pool floors and walls. Players wear standard protective gear including ear-protecting caps, gloves, and mouthguards in addition to their mask, snorkel, and fins. 
  
</p><p>The sport is governed by rules that emphasize <strong>limited contact and controlled play while benefiting from active supervision by experienced players and coaches</strong>. In fact, underwater hockey tends to be safer than other "common" limited contact sports such as basketball, soccer, or field hockey because there is no risk of fall or weight bearing injuries. </p><div>

</div><h3 id="is-underwater-hockey-a-shallow-water-blackout-risk" class="toc-header"><a class="toc-anchor" href="#is-underwater-hockey-a-shallow-water-blackout-risk">¶</a> Is underwater hockey a (shallow water) blackout risk?</h3><div>

</div><p>No! Underwater hockey gameplay itself guards against this risk due to the sport being fast paced and high action. Because a player's heart rate is elevated during gameplay the "need to breath" is a strong and persistant force guiding a player's actions. The dives are short and risky behaviors that contribute towards shallow water blackouts, such as hyperventilating before a dive, are just not beneficial to underwater hockey gameplay.
  
</p><p>A 2023 study measuring <strong>2,000 actual submersion periods</strong> found that players were underwater for an average of <strong>11.0 seconds</strong>, not the one- to three-minute breath-holds sometimes assumed by nonparticipants. Even during active play, average submersion was <strong>12.1 seconds</strong>, with the longest recorded drop at <strong>27 seconds</strong>. The study concluded that underwater hockey is more accurately understood as a <strong>breath-control sport</strong>, more similar to competitive swimming than to extreme apnea activities. For full details, see:
<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10425162/" target="_blank" rel="noopener noreferrer" class="is-external-link">Measured Submersion Times in Underwater Hockey</a>.

</p><p>The same study found that common safety concerns are often based on <strong>misperceptions of how long players stay submerged</strong>. It notes that aquatic directors’ estimates were, on average, <strong>106% longer than actual measured times</strong>. The authors concluded that concerns about underwater hockey as an extreme apneic sport are <strong>not supported by the measured data</strong>, while still reinforcing standard aquatic safety practices such as discouraging hyperventilation before breath-holds.</p><div>

</div><h3 id="what-do-facility-directors-say" class="toc-header"><a class="toc-anchor" href="#what-do-facility-directors-say">¶</a> What do facility directors say?</h3><div>

</div><ul>
  <li>The Rosen Aquatic and Fitness Center’s executive director described underwater hockey as a positive, inclusive program that supports safety, sportsmanship, and community engagement, while also generating memberships and rental income during otherwise underused pool hours.</li>
  <li>The Walter Schroeder Aquatic Center reported about 15 years of hosting the sport and said their experience has been “nothing but positive,” noting that the local club was respectful, responsible, and safe in its use of the facility.</li>
</ul><div>

</div><h3 id="is-it-safe-for-the-pool-itself" class="toc-header"><a class="toc-anchor" href="#is-it-safe-for-the-pool-itself">¶</a> Is it safe for the pool itself?</h3><div>

</div><p>Yes. The puck used in underwater hockey is made for pool use and is designed to glide along the bottom without damaging tile or walls. Clubs also typically supply their own sport-specific equipment and manage setup, gameplay, and cleanup in coordination with facility staff.</p><div>

</div><h3 id="operational-fit-for-facilities" class="toc-header"><a class="toc-anchor" href="#operational-fit-for-facilities">¶</a> Operational fit for facilities</h3><div>

</div><p>Underwater hockey can be a practical program for aquatic centers because clubs are often self-sufficient and flexible with scheduling. Typical practices use <strong>4–6 swim lanes</strong> and work best in <strong>4–10 feet of water</strong>, with <strong>6–8 feet ideal</strong>. Facilities that host clubs may also benefit from year-round participation, tournament hosting, and added programming diversity.</p><div>

</div><h3 id="bottom-line" class="toc-header"><a class="toc-anchor" href="#bottom-line">¶</a> Bottom line</h3><div>

</div><p>Underwater hockey has a long track record in organized aquatic facilities and is supported by both <strong>measured safety data</strong> and <strong>positive facility manager experience</strong>. For pool operators evaluating the sport, the evidence suggests it can be a safe, manageable, and worthwhile addition to aquatic programming when run with normal supervision and established rules.</p><div>
