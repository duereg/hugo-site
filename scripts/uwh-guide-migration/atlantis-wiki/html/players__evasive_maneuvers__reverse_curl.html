<p>A curl is a motion that maneuvers the puck around a player’s body so that the puck is protected from access by an opponent. The player is not allowed to “push into” another player while the puck is protected by the body; this would be an <a href="/game/fouls/obstruction-barging" class="is-internal-link is-valid-page">obstruction (barging)</a> foul.</p>
<p>The puck is most often maneuvered with the inside (hook side) of the stick after using a <a href="/players/individual_fundamentals/puck_handling/tic-tac" class="is-internal-link is-valid-page">tic-tac</a> or <a href="/players/individual_fundamentals/puck_handling/front_to_back_roll" class="is-internal-link is-valid-page">front to back roll</a> motion. With the puck on the inside of the stick, the player bends their arm to move the puck towards the stick-arm side (the straighter the stick-arm the more difficult the maneuver becomes, although a <a href="/players/individual_fundamentals/puck_handling/monkey_grip" class="is-internal-link is-valid-page">monkey grip</a> makes this motion easier).</p>
<p>Alternatively, the puck could remain on the front of the stick and the player can use a portion of the <a href="/players/individual_fundamentals/puck_handling/infinity_swerve" class="is-internal-link is-valid-page">infinity swerve</a> to maneuver the puck towards their stick-arm side. With the puck on the front of the stick, the player uses a bent arm (the straighter the stick-arm is, the more difficult the maneuver becomes).</p>
<p>During a reverse curl a player’s torso is rotated so that their free-arm is near the <a href="/game/gear-setup/playing_surfaces" class="is-internal-link is-valid-page">playing surface</a> and the other shoulder is turned upwards. The player bends forward at the waist and uses their momentum and/or kicks their fins in a “reverse bicycle pedaling” motion to propel their body thru the curl.</p>
<p>The player’s free-arm’s side shoulder, ribs, and hip should be near or touching the playing surface throughout to prevent an opponent from reaching beneath them for the puck. Just in front of the sternum is the approximate pivot point of the maneuver (oftentimes this is also the puck’s location). The player’s free-arm can be held against their body, or held in front of their body (be careful to avoid pushing on any nearby opponent(s) or blocking their access to the puck with the free-arm to avoid a <a href="/game/fouls/free-arm" class="is-internal-link is-valid-page">free-arm</a> foul).</p>
<p>Keep the puck on the stick throughout in order to avoid an <a href="/game/fouls/obstruction-blocking" class="is-internal-link is-valid-page">obstruction (blocking)</a> foul and do not push with the glove or wrist to avoid an <a href="/game/fouls/illegal_advancement" class="is-internal-link is-valid-page">illegal advancement</a> foul.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This move can be used when an opponent is getting close enough to challenge possession of the puck, or if the opponent is actively trying to steal the puck. The reverse curl can be used if the opponent is in front of or on the free-hand side of the player with the puck. The area to the player’s stick-arm side and behind should ideally be clear of opponents.</p>
<p>When performing a reverse curl it is important for a player to keep their vision up and look for teammates and opponents before starting, and also during, the maneuver. At the end of their curl a player should either make a <a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page">pass</a> to a teammate, or kick out of the curl to swim to an opening.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Because all curls are fairly static, generally players should avoid curling when near their own goal, especially if they are directly in front of their own goal within the 3m arc.</p>
<p>Because curls stop forward momentum they should not be used if a player’s team is on an <a href="/teams/teamwork/offensive_push" class="is-internal-link is-valid-page"> offensive push</a> or if a player has just received a pass.</p>
<p>Players should watch out for opponents above, to their stick-arm side, and/or behind them before performing a reverse curl. If an opponent is in those areas there is a chance of being <a href="/players/tackling_maneuvers/back-picks" class="is-internal-link is-valid-page">back-picked</a> when performing a reverse curl.</p>
