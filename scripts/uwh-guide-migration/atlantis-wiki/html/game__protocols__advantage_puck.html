<p>Advantage pucks are awarded to a team when the other team commits a foul. This is signaled by the referee extending their arm with their hand flat towards the team that committed the foul (in this case the opposing team), as if they are pushing that team back. When a team has an advantage puck, all their players are allowed to set up wherever they like. One of their players will line up to take the puck, and once the starting <a href="/game/gear-setup/buzzers" class="is-internal-link is-valid-page">buzzer</a> sounds they will have five seconds to touch the puck. The opposing team must set up three meters back from the puck and may not move closer until the player touches the puck. If the puck is not touched within five seconds the play will be stopped again and the opposing team will be awarded the advantage.</p>

<h1 id="when-and-where" class="toc-header"><a class="toc-anchor" href="#when-and-where">¶</a> When and Where</h1>
<p>Fouls can be called anywhere in the pool and advantage pucks can be set up anywhere within the five and two meter box in the <a href="/game/gear-setup/courts" class="is-internal-link is-valid-page">playing area</a>. This box includes all of the playing area except everything two meters or less from the side walls and five meters or less from the end walls. If the foul was committed inside the five and two box the puck will be set where the foul occurred.&nbsp; If the foul was committed ousted of the five and two box, the puck will be moved to the closest point on the edge of that box.</p>
