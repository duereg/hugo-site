<p>The wall roll and scoop is a maneuver that can be used to move the<a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page"> puck</a> off the <a href="/game/gear-setup/walls" class="is-internal-link is-valid-page">wall</a>. It is started by using the full length of the <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> to spin the puck along the wall. Then the stick is quickly placed with the tip against the wall, angled outward so that the puck rolls onto the stick. This gets the puck to roll off the wall, right onto the inside edge of the stick where many other maneuvers can then be used.&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This maneuver is most easily used if a player is facing straight towards the wall with the puck touching the wall. There is not much that can be done when in this position, so the wall roll and scoop can be used to get the puck away from physically touching the wall, and gives the player a bit of space to maneuver the puck away form the wall.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Players should be aware that moving the puck off the wall can expose it more so that opponents can more easily get at it. This is not too much of a problem if players use this move to give themselves plenty of space, allowing themselves to maneuver and avoid those opponents.&nbsp;</p>

  <p><u>WALL ROLL AND SCOOP</u></p>
  <ul>
    <li>USE THIS WHEN PERPENDICULAR TO THE WALL</li>
    <li>ROLL THE PUCK ALONG THE WALL, AND THEN QUICKLY PUT THE STICK TIP AGINST THE WALL</li>
    <li>“CATCH” THE ROLL AND LET THE PUCK'S MOMENTUM TAKE IT OFF THE WALL ONTO THE STICK</li>
