ic2NyaXB0IjpmYWxzZSwic3R5bGUiOmZhbHNlfSwic3lzdGVtIjp7Im1hbmFnZSI6ZmFsc2V9fQ==" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="game/fouls/advantage-rule.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>The advantage rule is used to reduce the number of calls by not calling fouls that do not result in the offending player’s team gaining an advantage. An example of this would be if a white player gloves the puck (<a href="/game/fouls/illegal_advancement" class="is-internal-link is-valid-page">illegal advancement</a> of the puck), but shortly after that the defending black player gains possession and makes forward progress. Due to the advantage rule, the referee would not call the gloving, since the player that gloved the puck did not gain any impactful advantage from committing the foul.&nbsp;</p>
<p>If a referee sees a foul and would like to see if the foul resulted in any advantage, they should extend one finger, hold it above the water horizontally and draw circles with the finger tip. The referee should continue to do this until the team the foul was committed against gains clear possession or the referee decides to call the foul. If the referee decides to call the foul, they should signal the chief referee and call the foul as usual. The advantage signal described above is done so that the chief referee knows that the water referee is playing the advantage rule. If a different referee calls a foul as one referee is signaling the advantage rule, the chief referee will default the call to the advantage rule referee, as that foul occurred first. It is important for water referees to always look at the chief referee when the play is stopped and determine which referee’s call occurred first. The chief referee will point at the water referee whose call will be followed.</p>

<h1 id="when-not-to-call-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-call-and-what-to-watch-out-for">¶</a> When not to Call and What to Watch Out For</h1>
<p>Advantage rule should not be used for extreme fouls such as <a href="/game/fouls/unsportsmanlike_conduct" class="is-internal-link is-valid-page">unsportsmanlike conduct</a>. Advantage rule is mostly used for minor fouls that in general do not have a huge impact on the play.</p>

<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference orange">
  <p><u>ADVANTAGE RULE</u></p>
  <ul>
    <li>STOPS FOULS THAT DO NOT RESULT IN ANY ADVANTAGE FROM BEING CALLED</li>
    <li>ONLY USED FOR MINOR FOULS (FOULS SUCH AS HEAD SHOTS WILL ALWAYS BE CALLED TO MAKE SURE THE PLAYER IS OK)</li>
  </ul>
