vel-4-performance" class="toc-header"><a class="toc-anchor" href="#level-4-performance">¶</a> Level 4 — Performance</h1><div>

</div><p>
<b>Purpose:</b> Advanced game influence and decision making.
</p><div>

</div><p>
Level 4 focuses on advanced performance and team systems. Players must execute reliably under match demands,
maintain structure under pressure, and make consistent decisions at speed. Coaches should review these documents
before running sessions to ensure consistency in delivery and performance standards.
</p><div>

</div><hr><div>

</div><h2 id="core-coaching-documents" class="toc-header"><a class="toc-anchor" href="#core-coaching-documents">¶</a> Core Coaching Documents</h2><div>

</div><ul>
  <li>
    <b><a href="/en/Coaching/Level-4/Coach-Quick-Start-4" class="is-internal-link is-valid-page">Coach Quick Start</a></b><br>
    A high-speed overview designed for rapid pre-session review. Covers coaching priorities,
    common errors, and session focus areas.
  </li>

  <br>

  <li>
    <b><a href="/en/Coaching/Level-4/Lesson-Plan-4" class="is-internal-link is-valid-page">Lesson Plan</a></b><br>
    The operational guide for delivering Level 4, including developmental blocks,
    recommended session flow, and coaching emphasis.
  </li>

  <br>

  <li>
    <b><a href="/en/Coaching/Level-4/Drill-Library-4" class="is-internal-link is-valid-page">Drill Library</a></b><br>
    A categorized collection of drills aligned with Level 4 capability targets.
    Use these drills to reinforce execution under pressure, team systems, and match decision-making,
    not to create chaos.
  </li>

  <br>

  <li>
    <b><a href="/en/Coaching/Level-4/Exit-Standards-4" class="is-internal-link is-valid-page">Exit Standards</a></b><br>
    Defines the minimum capability required for Level 4 readiness and performance expectations.
    Protects match standards and ensures players can perform consistently under fatigue and pressure.
  </li>
</ul><div>

</div><hr><div>

</div><h2 id="level-4-coaching-emphasis" class="toc-header"><a class="toc-anchor" href="#level-4-coaching-emphasis">¶</a> Level 4 Coaching Emphasis</h2><div>

</div><ul>
  <li>Execution before complexity.</li>
  <li>System behaviour before individual play.</li>
  <li>Pressure control before speed.</li>
  <li>Repeatability before variation.</li>
</ul><div>

</div><p>
Level 4 is where players stop improvising and begin delivering team performance on demand.
</p><div>

</div><hr><div>

</div><h2 id="coach-reminder" class="toc-header"><a class="toc-anchor" href="#coach-reminder">¶</a> Coach Reminder</h2><div>

</div><ul>
  <li>Do not add complexity if execution is unstable.</li>
  <li>Do not reward high risk play that breaks system rules.</li>
  <li>Correct spacing and reset habits immediately.</li>
  <li>Train match decisions under fatigue, not chaotic scrambles.</li>
</ul><div>

</div><p>
Level 4 builds reliable match performance. Consistency across coaches creates system clarity,
stronger cohesion, and better tournament outcomes.
</p>
