<p>Tackles of this sort are seen when two players are somewhat parallel to each other, one with the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> and the other attempting to take the puck from that player. In this tackle, the opponent is on the player's free hand side. The player reaches across their torso and pulls the puck off the opponent's <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a>, dropping their shoulder immedialty to block the opponent from getting the puck back.</p>
<p>Things to think about when tackling:</p>
<ol>
  <li>The player stealing the puck does the steal when they are ahead of the opponent, meaning their shoulders are closer to the puck than the opponents shoulders. This is important because the tackler has to have a bent arm. If their arm is fully extended out in front of them, the will not be able to hold their stick at the proper angle to pull the puck off the opponent.</li>
  <li>To get their stick on the puck the player reaches across their own body with the stick held so that the angle between the stick and forearm is as small as possible (as opposed to a ninety degree angle when the stick is held in the <a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page">natural position</a>). This angle can also be achieved by holding the stick in a <i> </i><a href="/players/individual_fundamentals/puck_handling/monkey_grip" class="is-internal-link is-valid-page">monkey grip</a><i>.</i></li>
  <li>While the player is reaching across their body for the puck, the playing hand side shoulder is very close to the playing surface. The player will then hook their stick on the puck and pull it across, perpendicular to their torso in front of them. As they pull the puck across, their torso will rotate so that their other shoulder (free arm shoulder) follows the puck and ends up pressed into the bottom of the pool between the puck and the opponent. Doing this will completely block the opponent from accessing the puck again.</li>
  <li>Players can then finish the maneuver with a <a href="/players/evasive_maneuvers/reverse_curl" class="is-internal-link is-valid-page">reverse curl </a>if they wish to change their direction drastically.</li>
</ol>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This tackle is an effective way to gain possession of the puck when the player’s and opponent’s torsos are generally facing the same direction, such as when chasing an opponent on a breakaway. It can be done anytime the player is far enough ahead of the opponent to properly bend their arm for the tackle.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>This tackle should not be done if the tackler is too far behind the opponent and their arm is stretched out in front of them. The player should keep kicking hard until they are able to bend their arm to get their stick into the proper position to pull the puck off sideways.</p>
<p>Players should also not attempt this tackle after the opponent has started to curl, as this causes the player to follow the curl around, pulling them out of position and making it very easy for the opponent to keep the puck out of their reach.</p>

<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
  <p><strong><u>TACKLES (PLAYER'S FREE-HAND SIDE)</u></strong></p>
  <ul>
    <li>PLAYERS SHOULD REACH AROUND TO GET THE PUCK ON THE INSIDE OF THEIR STICK AND PULL IT OFF THE OPPONENTS STICK TOWARD THEMSELVES</li>
    <li>AS THEY DO THAT, THEY SHOULD DROP THEIR SHOULDER TO GO INTO A REVERSE CURL, BLOCKING THE OPPONENT'S ACCESS TO THE PUCK COMPLETELY</li>
    <li>MONKEY GRIP CAN BE USED WHILE PULLING THE PUCK OF THE OPPONENT'S STICK</li>
  </ul>
