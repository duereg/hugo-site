<p>During a game, staying stationary should only be done sparingly as it allows opponents to get close and gives them more chances to steal the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>. Because of this, it is important to keep swimming after maneuvering the puck. Players maneuver the puck to get around or past opponents, and need to swim away from those opponents so they maintain complete possession of the puck. Different maneuvers result in players swimming away at different angles, but no matter the angle, players should finish the maneuver by swimming hard away from the opponent (if they choose to not pass the puck).&nbsp;</p>
<p>An example of this can be seen with the <a href="/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page">standard curl</a>. When a player enters the curl, they may only turn a quarter of the way, or all the way around. Either way, once they decide to exit the curl, they should keep kicking and swim away from where they curled. Stopping when they curl may allow opponents to reach around them or under them. If the player does not swim out of the curl, they should pass the puck to a teammate or another favorable location.&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>Players should kick out of any maneuver as staying still is easier for opponents to defend against. The combination of a maneuver and kicking out of it will often advance a player well past an opponent.&nbsp;</p>
<p>Players should get in the habit of always kicking out of their maneuvers. They only time kicking out of a maneuver is not nessesary is if the player passes the puck. Either way, the puck does not stay stationary for a long time.</p>
