<h2 id="purpose" class="toc-header"><a class="toc-anchor" href="#purpose">¶</a> Purpose</h2>
<p>A player's first experience often determines whether they return.</p>
<p>Preparing players before they arrive reduces anxiety, improves safety, saves valuable pool time, and allows coaches to focus on introducing Underwater Hockey rather than solving equipment problems.</p>
<p>This page provides a simple checklist for coaches to complete before a player's first session.</p>
<hr>
<h1 id="new-player-questionnaire" class="toc-header"><a class="toc-anchor" href="#new-player-questionnaire">¶</a> New Player Questionnaire</h1>
<p>Collect the following information before the player's first session.</p>
<h2 id="player-information" class="toc-header"><a class="toc-anchor" href="#player-information">¶</a> Player Information</h2>
<ul>
<li>Full Name</li>
<li>Email Address</li>
<li>Phone Number</li>
<li>Emergency Contact Name</li>
<li>Emergency Contact Phone Number</li>
</ul>
<hr>
<h2 id="swimming-experience" class="toc-header"><a class="toc-anchor" href="#swimming-experience">¶</a> Swimming Experience</h2>
<p>Ask about the player's previous experience.</p>
<ul>
<li>Can you swim confidently?</li>
<li>Have you used a snorkel before?</li>
<li>Have you worn fins before?</li>
<li>Have you tried freediving or scuba diving?</li>
<li>Have you played Underwater Hockey before?</li>
</ul>
<h3 id="coach-focus" class="toc-header"><a class="toc-anchor" href="#coach-focus">¶</a> Coach Focus</h3>
<p>Understanding a player's water confidence helps coaches provide the right level of support during their first session.</p>
<hr>
<h2 id="equipment" class="toc-header"><a class="toc-anchor" href="#equipment">¶</a> Equipment</h2>
<p>Record:</p>
<ul>
<li>
<p>Shoe Size</p>
</li>
<li>
<p>Equipment already owned:</p>
<ul>
<li>Mask</li>
<li>Snorkel</li>
<li>Mouthguard</li>
<li>Fins</li>
<li>Glove</li>
<li>Stick</li>
<li>Cap</li>
</ul>
</li>
</ul>
<h3 id="coach-focus-1" class="toc-header"><a class="toc-anchor" href="#coach-focus-1">¶</a> Coach Focus</h3>
<p>Knowing what equipment players already have allows coaches to prepare any loan equipment before the session begins.</p>
<hr>
<h2 id="attendance" class="toc-header"><a class="toc-anchor" href="#attendance">¶</a> Attendance</h2>
<p>Encourage new players to commit to attending at least <strong>two introductory sessions within their first two weeks</strong>.</p>
<h3 id="coach-focus-2" class="toc-header"><a class="toc-anchor" href="#coach-focus-2">¶</a> Coach Focus</h3>
<p>Most players require more than one session before they become comfortable with the equipment and the game.</p>
<hr>
<h1 id="welcome-information" class="toc-header"><a class="toc-anchor" href="#welcome-information">¶</a> Welcome Information</h1>
<p>Send new players a welcome message before their first session.</p>
<p>Include:</p>
<ul>
<li>Pool location</li>
<li>Arrival time (30 minutes before the session)</li>
<li>Session duration</li>
<li>Parking information (if required)</li>
<li>Coach contact details</li>
<li>Link to the introductory video</li>
</ul>
<hr>
<h1 id="what-to-bring" class="toc-header"><a class="toc-anchor" href="#what-to-bring">¶</a> What to Bring</h1>
<p>Ask players to bring:</p>
<ul>
<li>Swimsuit</li>
<li>Towel</li>
<li>Water bottle</li>
<li>Socks (recommended for fin comfort)</li>
</ul>
<p>If players own equipment, ask them to bring:</p>
<ul>
<li>Mask</li>
<li>Snorkel</li>
<li>Fins</li>
<li>Mouthguard</li>
</ul>
<hr>
<h1 id="coach-preparation-checklist" class="toc-header"><a class="toc-anchor" href="#coach-preparation-checklist">¶</a> Coach Preparation Checklist</h1>
<p>Before the player arrives, ensure:</p>
<p>☐ Loan equipment is available in the correct sizes.</p>
<p>☐ Beginner stick tape is ready for player identification.</p>
<p>☐ Spare masks and snorkels are available.</p>
<p>☐ Spare mouthguards are available if required.</p>
<p>☐ Session plan is prepared.</p>
<p>☐ Experienced players understand they will be supporting beginners.</p>
