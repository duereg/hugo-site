</div><h2 id="scope-and-limits" class="toc-header"><a class="toc-anchor" href="#scope-and-limits">¶</a> Scope and Limits</h2>
<p>Level 0 introduces players to underwater hockey in a safe, calm, and achievable way. It is the entry point of the Atlantis Sports pathway. This manual defines what is taught, in what order, and to what standard. Detailed drills, diagrams, and videos are hosted on the wiki.</p><div>

</div><h2 id="entry-assumptions-who-level-0-is-for" class="toc-header"><a class="toc-anchor" href="#entry-assumptions-who-level-0-is-for">¶</a> Entry Assumptions / Who Level 0 Is For</h2>
<ul>
<li>New to underwater hockey.</li>
<li>Comfortable swimmers.</li>
<li>No prior underwater hockey experience.</li>
<li>Content applies to juniors and adults (delivery adjusted for age).</li>
</ul>
<p></p><div>

</div><h2 id="ready-to-progress-when-the-player-can" class="toc-header"><a class="toc-anchor" href="#ready-to-progress-when-the-player-can">¶</a> Ready to Progress When the Player Can</h2>
<ul>
<li>Enter and exit the water calmly.</li>
<li>Move along the pool bottom with control.</li>
<li>Push and stop the puck while swimming.</li>
<li>Understand basic ideas of attack and defence.</li>
<li>Take part in simple structured play.</li>
</ul>
<p></p><div>

</div><h2 id="safety-notice-applies-to-all-levels" class="toc-header"><a class="toc-anchor" href="#safety-notice-applies-to-all-levels">¶</a> Safety Notice (Applies to All Levels)</h2>
<ul>
<li>Players may surface at any time.</li>
<li>Stop if ears hurt or equalisation is difficult.</li>
<li>Report any head impacts before continuing.</li>
<li>Equalise early, gently, and often.</li>
</ul>
<p></p><div>

</div><p>See <a href="/Safety" class="is-internal-link is-valid-page"> Safety: Equalisation and Injury Reporting </a> for full safety guidance.</p><div>

</div><h2 id="h-1-equipment-introduction-and-fit" class="toc-header"><a class="toc-anchor" href="#h-1-equipment-introduction-and-fit">¶</a> 1. Equipment Introduction and Fit</h2>

</div><h2 id="h-2-breathing-fundamentals-of-snorkel-use" class="toc-header"><a class="toc-anchor" href="#h-2-breathing-fundamentals-of-snorkel-use">¶</a> 2. Breathing: Fundamentals of Snorkel Use</h2><div>

</div><p><strong>Swimming With the Snorkel on the Surface</strong></p>
<p>Swim on the surface, face down, breathing through the snorkel. Keep the head low and relaxed; no need to lift the face to breathe. This enables players to watch the game, remain calm, and move efficiently without stopping.</p><div>

</div><p><strong>Clearing the Snorkel</strong></p><div>

</div><p><strong>Primary Method:</strong> When water enters the snorkel during a dive, clear it by exhaling sharply as you reach the surface.</p><div>

</div><p><strong>Head Position and Timing:</strong> Tilt your head slightly backward and begin exhaling just before the snorkel tip breaks the surface.</p><div>

</div><p><strong>Air Bubble Technique:</strong> Create a small air pocket before surfacing to assist clearing.</p><div>

</div><h2 id="h-3-movement-and-water-entry" class="toc-header"><a class="toc-anchor" href="#h-3-movement-and-water-entry">¶</a> 3. Movement and Water Entry</h2><div>

</div><p><a href="/players/individual_fundamentals/moving_in_the_water/swimming_at_the_surface" class="is-internal-link is-valid-page"><strong>Surface Swimming</strong></a></p>
<p>Players can swim at the surface by only kicking or by taking front crawl strokes. Ensure the stroke path is clear.</p><div>

</div><p><a href="/players/individual_fundamentals/moving_in_the_water/kicking_mid-water" class="is-internal-link is-valid-page"><strong>Midwater Swimming</strong></a></p><div>

</div><p> <strong>Types of Kicking</strong></p>
<p>Dolphin: Wave motion from chest to feet with engaged core.</p>
<p>Flutter: Kick from the hip, keep knees straight, toes pointed.</p><div>

</div><p><strong>Diving</strong></p>
<p>
  </p><ul>
  <li><a href="/players/individual_fundamentals/moving_in_the_water/diving_while_swimming" class="is-internal-link is-valid-page">Duck Dive:</a> Hard dolphin kick, bend slightly at the hip, dive at an angle.</li>
<li><a href="/players/individual_fundamentals/moving_in_the_water/fins-first_dive" class="is-internal-link is-valid-page">Kelp / Fins-First Dive: </a> Angle fins downward, use the free arm to push into the dive, playing hand touches first.</li>
  </ul><div>

</div><p><strong>Bottom Movement</strong></p><div>

</div><p><strong>Body Position</strong></p>
<p><a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page"> The Cobra </a> Position keeps the chest up and hips low, allowing players to stay strong and stable on the bottom while maintaining a clear view.</p><div>

</div><p>[PLACEHOLDER: DIAGRAM – COBRA POSITION]</p><div>

</div><p><a href="/players/individual_fundamentals/moving_in_the_water/kicking_at_the_bottom" class="is-internal-link is-valid-page">Swimming at the Bottom</a></p>
<p>Flutter or dolphin kicking. Flutter is preferred for torso strength and hip positioning.</p><div>

</div><h2 id="h-4-basic-stick-and-puck-skills" class="toc-header"><a class="toc-anchor" href="#h-4-basic-stick-and-puck-skills">¶</a> 4. Basic Stick and Puck Skills</h2><div>

</div><p><a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page"><strong>Gripping the Stick:</strong></a> Use either hand, but only one hand on the stick at a time.</p><div>

</div><p><strong>Swim With the Puck:</strong> Keep the puck in front while maintaining control.</p><div>

</div><p><strong>Control the Puck (Push Pull):</strong> Push forward. Pull back under control.</p><div>

</div><p><a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page"><strong>Flick or Passing:</strong></a> Execute short, controlled flicks and passes.</p><div>

</div><p><a href="/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page"><strong>Protecting the Puck (Curling):</strong> </a> Wide curling turns while maintaining control.</p><div>

</div><p><strong>Simple Skill Combination</strong></p>
<ul>
<li>Swim then flick.</li>
<li>Push pull then swim.</li>
<li>Curl then swim.</li>
</ul>
<p></p><div>

</div><h2 id="h-5-introductory-roles" class="toc-header"><a class="toc-anchor" href="#h-5-introductory-roles">¶</a> 5. Introductory Roles</h2><div>

</div><p><strong>Attackers</strong></p>
<p>An attacker is the player with the puck or supporting it toward the goal.</p><div>

</div><p>Fundamentals:</p>
<ul>
<li>Move the puck toward the goal.</li>
<li>Keep the puck safe.</li>
<li>Help the team score.</li>
</ul>
<p></p><div>

</div><p><strong>Defenders</strong></p>
<p>A defender is any player whose team does not have the puck.</p><div>

</div><p>Fundamentals:</p>
<ul>
<li>Get between the puck and the goal.</li>
<li>Slow the attacker down.</li>
<li>Make forward movement difficult.</li>
</ul>
<p></p><div>

</div><p>Roles change constantly; focus is on understanding intent, not fixed position.</p><div>

</div><h2 id="h-6-contact-in-attack-and-defence" class="toc-header"><a class="toc-anchor" href="#h-6-contact-in-attack-and-defence">¶</a> 6. Contact in Attack and Defence</h2><div>

</div><p><strong>Contact Includes:</strong></p>
<ul>
<li>Stick on puck pressure.</li>
<li>Blocking the puck with the stick.</li>
<li>Pressure while contesting the puck.</li>
<li>Attempting to gain position.</li>
</ul>
<p></p><div>

</div><p><strong>CMAS Aligned — Illegal Actions:</strong></p>
<ul>
<li><a href="/game/fouls/stick_infringement" class="is-internal-link is-valid-page">Stick contacting the opponent’s body. </a></li>
<li>Stick contacting the opponent’s stick instead of the puck.</li>
<li>Using the glove or body to hold the puck.</li>
<li>Holding or leaning after the puck moves.</li>
  <li><a href="/game/fouls/obstruction-blocking" class="is-internal-link is-valid-page"> Blocking without attempting to play the puck.</a> </li>
</ul>
<p></p><div>

</div><p><strong>Player Drills:</strong></p>
<ul>
<li>Attacking and defending space.</li>
<li>Transitioning between the two.</li>
<li>Playing short 1v1, 2v2, or 3v3 games.</li>
</ul>
<p></p><div>

</div><h2 id="h-7-structured-play" class="toc-header"><a class="toc-anchor" href="#h-7-structured-play">¶</a> 7. Structured Play</h2><div>

</div><p><strong>Teams</strong></p>
<ul>
<li>Two teams attempt to move the puck into the opposing goal.</li>
<li>Standard is 6 players per team but can be adapted.</li>
</ul>
<p></p><div>

</div><p><strong>Differentiating Teams</strong></p>
<ul>
<li>Different colored caps.</li>
<li>Matching stick colors.</li>
</ul>
<p></p><div>

</div><p><strong>Basic Rules</strong></p>
<ul>
<li>Start with a <a href="/players/individual_fundamentals/moving_in_the_water/strikes" class="is-internal-link is-valid-page">Strike</a> from the wall.</li>
<li>Use the stick only.</li>
<li>No grabbing, pushing, or holding.</li>
<li>Work together to score.</li>
</ul>
<p></p><div>

</div><h2 id="h-8-playing-area-guidance" class="toc-header"><a class="toc-anchor" href="#h-8-playing-area-guidance">¶</a> <a href="/game/gear-setup/courts" class="is-internal-link is-valid-page">8. Playing Area Guidance</a> </h2><div>

</div><ul>
<li>Goals at each end.</li>
<li>Rectangular playing area.</li>
<li>Centre point start.</li>
<li>Court markings vary.</li>
</ul>
<p></p><div>


</div><h2 id="h-9-basic-rule-awareness" class="toc-header"><a class="toc-anchor" href="#h-9-basic-rule-awareness">¶</a> 9. Basic Rule Awareness</h2>
<ul>
<li>One hand on the stick.</li>
<li>No grabbing or pushing.</li>
<li>Move the puck with the stick only.</li>
</ul>
<p></p><div>

</div><h2 id="h-10-training-framework" class="toc-header"><a class="toc-anchor" href="#h-10-training-framework">¶</a> 10. Training Framework</h2><div>

</div><ul>
<li>Safety and orientation.</li>
<li>Movement without the puck.</li>
<li>One new skill or concept.</li>
<li>Controlled application.</li>
<li>Calm reset.</li>
</ul>
<p></p><div>

</div><h2 id="age-specific-adaptations" class="toc-header"><a class="toc-anchor" href="#age-specific-adaptations">¶</a> Age-Specific Adaptations</h2><div>

</div><p><strong>Juniors New to the Sport</strong></p>
<p>Focus: Fun before form. Short explanations. Frequent breaks.</p><div>

</div><p><strong>Youth Entry Programs</strong></p>
<p>Focus: Intensity control. Managing competitiveness.</p><div>

</div><p><strong>Adult Beginners</strong></p>
<p>Focus: Permission to stop. Normalizing mistakes.</p><div>

</div><h2 id="level-0-exit-standards" class="toc-header"><a class="toc-anchor" href="#level-0-exit-standards">¶</a> Level 0 Exit Standards</h2>
<ul>
<li>Enter water and equalise confidently.</li>
<li>Maintain calm control with the puck.</li>
<li>Understand attack and defence flow.</li>
<li>Play within rules and safety expectations.</li>
</ul>
<p></p>
