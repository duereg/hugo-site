<p>Unsportsmanlike conduct can be called in the following situations, but is not limited to these situations:</p>
<ol>
  <li>Dangerous play (such as a headshot) - <a href="/game/protocols/warnings" class="is-internal-link is-valid-page">Team warning</a> and 2 minute <a href="/game/protocols/time-penalties" class="is-internal-link is-valid-page">penalty</a></li>
  <li>Handling an opponent - 2 minute penalty</li>
  <li>Insulting other players or referees - 2 or 5 minute penalty</li>
  <li>Refusing to accept a referee’s decision - 2 or 5 minute penalty</li>
  <li>Removing another player’s equipment - 5 minute penalty</li>
  <li>Deliberately removing of the puck from the goal - 5 minute penalty</li>
  <li>Attacking and hurting an opponent - Game dismissal</li>
</ol>
<p>If multiple instances of any of these fouls occur several times the penalty will be escalated. The penalty will also vary depending on whether the referee believed the foul was committed intentionally or not.</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>Unsportsmanlike conduct should be called any time any of the above situations occur or if referees determine the actions of a player to be unsportsmanlike. The signal is the tapping of a closed fist on the forehead.</p>
<p>When determining the penalty, referees should first determine if the foul was intentional. If it was, the penalty should be increased. If the player or team has already committed this foul, the penalty should be increased each time.</p>

  <p><strong><u>UNSPORTMANLIKE CONDUCT</u></strong></p>
