</div><p>
This block teaches players to manage common match situations using clear structure, role discipline, and low-risk decision making.
</p><div>

</div><hr><div>

</div><h2 id="session-run-order" class="toc-header"><a class="toc-anchor" href="#session-run-order">¶</a> Session Run Order</h2><div>

</div><!-- 1. 5v6 --><div>

</div><p><b>Playing a Player Down (5v6)</b></p>
<ul>
  <li>Maintain defensive structure under pressure</li>
  <li>Protect the middle and danger zone</li>
  <li>Force play into safe zones</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-5v6" class="is-internal-link is-valid-page">5v6 Defensive Shape Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-5v6" class="is-internal-link is-invalid-page">5v6 Defense</a>
</p><div>

</div><!-- 2. PROTECT --><div>

</div><p><b>Protecting a Lead</b></p>
<ul>
  <li>Control possession and tempo</li>
  <li>Avoid central risk</li>
  <li>Use wall and corner to reset</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-protect-lead" class="is-internal-link is-valid-page">Protect Lead Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-protect" class="is-internal-link is-invalid-page">Protect Lead</a>
</p><div>

</div><!-- 3. CHASE --><div>

</div><p><b>Chasing a Goal</b></p>
<ul>
  <li>Increase pressure and tempo</li>
  <li>Maintain structure while attacking</li>
  <li>Create quick scoring opportunities</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-chase-goal" class="is-internal-link is-valid-page">Chase Goal Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-chase" class="is-internal-link is-invalid-page">Chase Goal</a>
</p><div>

</div><!-- 4. POWER --><div>

</div><p><b>Power Play (6v5)</b></p>
<ul>
  <li>Use extra player to create advantage</li>
  <li>Maintain width and passing lanes</li>
  <li>Move puck faster than defense</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-power-play" class="is-internal-link is-valid-page">6v5 Power Play Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-power" class="is-internal-link is-invalid-page">Power Play</a>
</p><div>

</div><!-- 5. GAME --><div>

</div><p><b>Conditioned Game – Special Situations</b></p>
<ul>
  <li>Rotate through different match scenarios</li>
  <li>Apply correct structure and decisions</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-special-game" class="is-internal-link is-valid-page">Special Situations Game</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-special-game" class="is-internal-link is-invalid-page">Special Situations Game</a>
</p><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><p>By the end of this block players should demonstrate the following during game play:</p><div>

</div><ul>
  <li>Maintains structure when short handed (5v6)</li>
  <li>Controls possession when protecting a lead</li>
  <li>Applies pressure without losing structure when chasing</li>
  <li>Uses extra player effectively in power play (6v5)</li>
  <li>Makes low-risk decisions in all situations</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-team-principles" class="toc-header"><a class="toc-anchor" href="#key-team-principles">¶</a> Key Team Principles</h2><div>

</div><h3 id="structure-first" class="toc-header"><a class="toc-anchor" href="#structure-first">¶</a> Structure First</h3>
<ul>
  <li>Maintain shape in all situations</li>
  <li>Do not break structure under pressure</li>
</ul><div>

</div><h3 id="risk-management" class="toc-header"><a class="toc-anchor" href="#risk-management">¶</a> Risk Management</h3>
<ul>
  <li>Avoid central turnovers</li>
  <li>Use safe zones when under pressure</li>
</ul><div>

</div><h3 id="situation-awareness" class="toc-header"><a class="toc-anchor" href="#situation-awareness">¶</a> Situation Awareness</h3>
<ul>
  <li>Recognize game context quickly</li>
  <li>Adjust decisions based on situation</li>
</ul><div>

</div><h3 id="tempo-control" class="toc-header"><a class="toc-anchor" href="#tempo-control">¶</a> Tempo Control</h3>
<ul>
  <li>Slow down when protecting a lead</li>
  <li>Increase tempo when chasing a goal</li>
</ul><div>

</div><h3 id="numerical-advantage" class="toc-header"><a class="toc-anchor" href="#numerical-advantage">¶</a> Numerical Advantage</h3>
<ul>
  <li>Use extra player effectively</li>
  <li>Maintain spacing and passing lanes</li>
</ul><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Slot in now</li>
  <li>Protect the middle</li>
  <li>Wall and corner first</li>
  <li>Angle to the box</li>
  <li>Possession mode</li>
  <li>Pressure mode</li>
  <li>Extra player, move it</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-good-looks-like" class="toc-header"><a class="toc-anchor" href="#what-good-looks-like">¶</a> What Good Looks Like</h2><div>

</div><ul>
  <li>Team holds structure under pressure</li>
  <li>No central turnovers</li>
  <li>Clear role execution in each situation</li>
  <li>Controlled tempo based on game context</li>
  <li>Effective use of numerical advantage</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><b>Chasing and opening the middle</b><br>Cue: Protect the middle.</li>
  <li><b>Turning over centrally</b><br>Cue: Wall and corner first.</li>
  <li><b>Forcing play when protecting lead</b><br>Cue: Possession mode.</li>
  <li><b>Solo play when chasing</b><br>Cue: Go with support.</li>
  <li><b>Bunching on power play</b><br>Cue: Move the puck.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Stop play for role confusion</li>
  <li>Reset when structure breaks down</li>
  <li>Reinforce decision-making over speed</li>
  <li>Ensure signals are understood before reps</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression-and-regression" class="toc-header"><a class="toc-anchor" href="#progression-and-regression">¶</a> Progression and Regression</h2><div>

</div><h3 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h3>
<ul>
  <li>Increase pressure and tempo</li>
  <li>Reduce decision time</li>
  <li>Add fatigue through continuous play</li>
</ul><div>

</div><h3 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h3>
<ul>
  <li>Walk through structure on deck</li>
  <li>Reduce player numbers</li>
  <li>Slow tempo and reset frequently</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
