<p>The diamond drill works on several moves in succession to provide a game like situation both in complexity and length of dive. There are two different setups and both are described for right-handed players. For left-handed players, use the diamond drill setup #2 but the steps for <a href="/players/individual_drills/diamond_drill_1" class="is-internal-link is-valid-page">diamond drill setup #1</a>. Players should maintain good <a href="/players/individual_fundamentals/moving_in_the_water/kicking_with_the_puck" class="is-internal-link is-valid-page"><u>kicking with the puck</u></a> form when moving to/away from each position of the drill.</p>
<p>This drill can be done solo or with a group. The positions 1, 2, 3, &amp; 4 can be marked with extra pucks, be features of the pool bottom (lane line markings, vents, etc.), extra pucks, and/or other weighted markings. The distances shown are provided for reference, but can be adjusted if needed.</p>

<h1 id="steps-for-running-the-drill" class="toc-header"><a class="toc-anchor" href="#steps-for-running-the-drill">¶</a> Steps for Running the Drill</h1>
<ol>
  <li>The player begins with the puck near the START location.</li>
  <li>The player swims forward with the puck and performs a <a href="/players/evasive_maneuvers/fade" class="is-internal-link is-valid-page"><u>fade</u></a> maneuver at position 1 (to the outside, not between positions 1 &amp; 4).</li>
  <li>The player then swims the puck past position 2 (to the outside, not between positions 2 &amp; 3) until their shoulders are about even with position 2 and performs an <a href="/players/evasive_maneuvers/upper-cut" class="is-internal-link is-valid-page">upper cut</a> or a <a href="/players/evasive_maneuvers/deep_v_1" class="is-internal-link is-valid-page"><u>deep V (stick-hand side to free-hand side)</u></a> maneuver so that the puck travels in between positions 1 &amp; 2.</li>
  <li>The player then swims the puck past position 3 (to the inside, between positions 3 &amp; 4) where they perform a <a href="/players/evasive_maneuvers/reverse_curl" class="is-internal-link is-valid-page"><u>reverse curl</u></a> with the puck traveling all the way around position 3 and passing between positions 3 &amp; 4 again.</li>
  <li>The player then kicks hard pushing the puck past position 4 (to the outside, not between positions 1 &amp; 4) to the END location and makes a <a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page">pass</a> back to the START location.</li>
  <li>If there is a group of players the next player in line takes the puck and begins the drill.<ul>
      <li>If there are enough players, 2 pucks can be used.</li>
      <li>The player with the 2nd puck waits until the player with the 1st puck is swimming towards position 3 before beginning the drill.</li>
    </ul>
  </li>
</ol>
