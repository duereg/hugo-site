<a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>The easiest schedule for games is a “round robin” in which each team plays all of the other teams. This will vary depending on how many teams attend and if there is enough time, a double round robin could be done to allow teams more games. After the round robin there can be playoff games.&nbsp;</p>
<h1 id="examples" class="toc-header"><a class="toc-anchor" href="#examples">¶</a> Examples</h1>
