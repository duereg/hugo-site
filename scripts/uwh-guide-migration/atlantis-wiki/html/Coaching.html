</div><p>
Welcome to the Atlantis Coaching Programme.
This pathway provides a structured progression from a player's first experience in the water through to advanced team play and competitive Underwater Hockey.
Each level builds on the previous one, developing confident, skilled, and intelligent players.
</p><div>

</div><hr><div>

</div><h2 id="coaching-levels" class="toc-header"><a class="toc-anchor" href="#coaching-levels">¶</a> Coaching Levels</h2><div>

</div><ul>
  <li><a href="/en/Coaching/Level-1" class="is-internal-link is-valid-page">Level 1 — Learn the Game</a></li>
  <li><a href="/en/Coaching/Level-2" class="is-internal-link is-valid-page">Level 2 — Fundamental Skills</a></li>
  <li><a href="/en/Coaching/Level-3" class="is-internal-link is-valid-page">Level 3 — Advanced Skills &amp; Team Application</a></li>
  <li><a href="/en/Coaching/Level-4" class="is-internal-link is-valid-page">Level 4 — Advanced Collective Play</a></li>
</ul><div>

</div><hr><div>

</div><h2 id="level-1-learn-the-game" class="toc-header"><a class="toc-anchor" href="#level-1-learn-the-game">¶</a> Level 1 — Learn the Game</h2><div>

</div><p>
Introduce new players to Underwater Hockey by developing confidence, safety, and enjoyment in the aquatic environment.
</p><div>

</div><h3 id="players-develop" class="toc-header"><a class="toc-anchor" href="#players-develop">¶</a> Players develop:</h3><div>

</div><ul>
  <li>Water confidence and safe participation.</li>
  <li>Equipment skills and basic movement.</li>
  <li>First puck control and simple hockey skills.</li>
  <li>An understanding of the rules and objective of the game.</li>
</ul><div>

</div><hr><div>

</div><h2 id="level-2-fundamental-skills" class="toc-header"><a class="toc-anchor" href="#level-2-fundamental-skills">¶</a> Level 2 — Fundamental Skills</h2><div>

</div><p>
Develop the technical skills and core principles required to play Underwater Hockey confidently.
</p><div>

</div><h3 id="players-develop-1" class="toc-header"><a class="toc-anchor" href="#players-develop-1">¶</a> Players develop:</h3><div>

</div><ul>
  <li>Efficient movement and body position.</li>
  <li>Puck control, passing, receiving, and protection.</li>
  <li>Basic attacking and defensive principles.</li>
  <li>Support, decision-making, and game understanding.</li>
</ul><div>

</div><hr><div>

</div><h2 id="level-3-advanced-skills-team-application" class="toc-header"><a class="toc-anchor" href="#level-3-advanced-skills-team-application">¶</a> Level 3 — Advanced Skills &amp; Team Application</h2><div>

</div><p>
Expand the player's technical toolbox while introducing how advanced individual skills are applied within team play.
</p><div>

</div><h3 id="players-develop-2" class="toc-header"><a class="toc-anchor" href="#players-develop-2">¶</a> Players develop:</h3><div>

</div><ul>
  <li>Advanced attacking and defensive techniques.</li>
  <li>Advanced passing, receiving, and puck control skills.</li>
  <li>Movement without the puck and support play.</li>
  <li>Applying individual skills within small group and team situations.</li>
</ul><div>

</div><hr><div>

</div><h2 id="level-4-advanced-collective-play" class="toc-header"><a class="toc-anchor" href="#level-4-advanced-collective-play">¶</a> Level 4 — Advanced Collective Play</h2><div>

</div><p>
Combine advanced individual skills into coordinated team systems and tactical play.
</p><div>

</div><h3 id="players-develop-3" class="toc-header"><a class="toc-anchor" href="#players-develop-3">¶</a> Players develop:</h3><div>

</div><ul>
  <li>Collective skills and multi-player combinations.</li>
  <li>Advanced rotations and team structure.</li>
  <li>Formation understanding and tactical systems.</li>
  <li>Game intelligence, tactical adaptation, and competitive performance.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coaching-philosophy" class="toc-header"><a class="toc-anchor" href="#coaching-philosophy">¶</a> Coaching Philosophy</h2><div>

</div><p>
Every level follows the same learning pathway:
</p><div>

</div><pre v-pre="true">Learn the Skill
        ↓
Understand When to Use It
        ↓
Apply It with Teammates
        ↓
Use It in Game Play
</pre><div>

</div><p>
This progression ensures players develop strong individual skills before learning how to combine those skills into effective team play.
</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
