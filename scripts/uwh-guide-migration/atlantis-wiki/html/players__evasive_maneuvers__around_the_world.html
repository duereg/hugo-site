<p>The around the world maneuver is a large circular sweeping movement with the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>. The movement is done by moving the puck from in front of the playing hand shoulder, outward and down to the hips, then back up on the opposite side of the body. The puck should move almost a full circle under the player’s torso.</p>
<p>What to think about:</p>
<ol>
  <li>The player should keep their arm fairly straight through the entire maneuver.</li>
  <li>At the top of the maneuver, when the puck is in front of the player, the player should begin to angle their arm outward, and then the player should rotate their <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> around the puck in a <a href="/players/individual_fundamentals/puck_handling/front_to_back_roll" class="is-internal-link is-valid-page">front to back roll</a>. The players hand should flip over as the stick turns around the puck. The top of the stick will stay in contact with the puck.</li>
  <li>Once the stick is on the far side of the puck, the player will begin to sweep the puck out and around from their torso, with their arm straight the entire time.</li>
  <li>The players will continue this down to their hips where the puck will rest on the inside edge&nbsp;of their stick, still with their palm facing upwards. The sweeping motion will continue past their hips to the other side of the torso, and continue up.</li>
  <li>Once the puck is outside of the non-playing hand shoulder, the player should&nbsp; again rotate their stick around the puck to get the puck back on the front edge of their stick and their hand back into the <a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page">standard grip.</a> The player will then rotate their body to follow the puck in the direction of their choice (anywhere towards their free-hand side that is out of the reach of the opponent).&nbsp;</li>
  <li>Players should keep their hips and chest low throughout this maneuver, just high enough to leave space for their arm and puck to go under them.</li>
</ol>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>One instance when this move can be used is when the player is being chased by an opponent who is parallel to them on the non-playing hand side. The around the world can be done to change direction and swim the puck under the opponent. In this case the puck will travel approximately three quarters of the way around the circle, as the player will swim out of the maneuver shortly after the puck passes their hip. This maneuver is not restricted to this one situation, it can be used anytime a player has space to their playing hand side and would like to change direction.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>The around the world maneuver should not be used if there are any opponents close on the playing hand side of the player. While sweeping the puck around it is very likely that an opponent could grab the puck as that is not a strong arm position for the player and it is very difficult to fight for the puck.</p>

  <p><u>AROUND THE WORLD</u></p>
  <ul>
    <li>THIS MOVE BEGINS WHEN THE PUCK IS ON THE STICK AND THE ARM IS OUTSTRETCHED IN FRONT OF THE PLAYER</li>
    <li>ANGLE THE STICK HAND ARM OUTWARD, STILL KEEPING IT STRAIGHT</li>
    <li>ROLL THE STICK AROUND THE PUCK SO THAT IT CAN BE SWEPT DOWNWARD TOWARDS THE HIP</li>
    <li>MOVE THE PUCK IN A LARGE CIRLCE BELOW THE TORSO</li>
    <li>EXIT THE CIRCEL MOVEMENT WERE DESIRED AND FOLLOW THE PUCK AND SWIM OUT OF THE MOVE</li>
