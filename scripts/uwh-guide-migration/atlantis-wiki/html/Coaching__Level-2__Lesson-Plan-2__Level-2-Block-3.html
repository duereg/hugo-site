</div><p>
Develop decision-making by teaching players when to pass or carry based on support position and available space.
</p><div>

</div><hr><div>

</div><h2 id="session-flow" class="toc-header"><a class="toc-anchor" href="#session-flow">¶</a> Session Flow</h2><div>

</div><section>
  <h3 id="h-1-head-up-scan" class="toc-header"><a class="toc-anchor" href="#h-1-head-up-scan">¶</a> 1. Head Up Scan</h3>
  <ul>
    <li>Lift head before making any decision</li>
    <li>Identify space and support position</li>
    <li>Pause briefly to avoid automatic actions</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-3#head-up-scan" class="is-internal-link is-valid-page">
      Head Up Scan
    </a>
  </p>
  <p><strong>Link:</strong> Establish awareness before introducing decisions.</p>
</section><div>

</div><section>
  <h3 id="h-2-support-position-decision" class="toc-header"><a class="toc-anchor" href="#h-2-support-position-decision">¶</a> 2. Support Position Decision</h3>
  <ul>
    <li>Support player rotates between behind, level, and ahead</li>
    <li>Carrier reads position and chooses pass or carry</li>
    <li>Emphasize correct decision over speed</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-3#support-position-decision" class="is-internal-link is-valid-page">
      Support Position Decision
    </a>
  </p>
  <p><strong>Link:</strong> Introduces decision-making based on support.</p>
</section><div>

</div><section>
  <h3 id="h-3-moving-support-lane" class="toc-header"><a class="toc-anchor" href="#h-3-moving-support-lane">¶</a> 3. Moving Support Lane</h3>
  <ul>
    <li>Support player changes position during the rep</li>
    <li>Carrier must continuously reassess decision</li>
    <li>Encourage scanning before and during movement</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-3#moving-support-lane" class="is-internal-link is-valid-page">
      Moving Support Lane
    </a>
  </p>
  <p><strong>Link:</strong> Develops dynamic decision-making.</p>
</section><div>

</div><section>
  <h3 id="h-4-guided-2v1-decision" class="toc-header"><a class="toc-anchor" href="#h-4-guided-2v1-decision">¶</a> 4. Guided 2v1 Decision</h3>
  <ul>
    <li>Two attackers vs one passive defender</li>
    <li>Support varies position (behind, level, ahead)</li>
    <li>Carrier decides based on defender and support</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-3#guided-2v1-decision" class="is-internal-link is-valid-page">
      Guided 2v1 Decision
    </a>
  </p>
  <p><strong>Link:</strong> Applies decisions under simple pressure.</p>
</section><div>

</div><section>
  <h3 id="h-5-game-integration" class="toc-header"><a class="toc-anchor" href="#h-5-game-integration">¶</a> 5. Game Integration</h3>
  <ul>
    <li>Apply decision-making in small-sided play</li>
    <li>Encourage scanning before every action</li>
    <li>Reinforce correct choices over outcomes</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-3#short-game-decision-play" class="is-internal-link is-valid-page">
      Short Game Decision Play
    </a>
  </p>
  <p><strong>Link:</strong> Combine awareness and decision-making in play.</p>
</section><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><ul>
  <li>Looks up before making decisions</li>
  <li>Chooses appropriately between pass and carry</li>
  <li>Adjusts decisions based on support position</li>
  <li>Avoids automatic or rushed actions</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-principles" class="toc-header"><a class="toc-anchor" href="#key-principles">¶</a> Key Principles</h2><div>

</div><section>
  <h3 id="awareness-first" class="toc-header"><a class="toc-anchor" href="#awareness-first">¶</a> Awareness First</h3>
  <ul>
    <li>Head up before action</li>
    <li>Scan for space and support</li>
    <li>Do not rush decisions</li>
  </ul>
</section><div>

</div><section>
  <h3 id="support-recognition" class="toc-header"><a class="toc-anchor" href="#support-recognition">¶</a> Support Recognition</h3>
  <ul>
    <li>Support behind = likely carry</li>
    <li>Support level = option to pass or carry</li>
    <li>Support ahead = look to pass</li>
  </ul>
</section><div>

</div><section>
  <h3 id="simple-decisions" class="toc-header"><a class="toc-anchor" href="#simple-decisions">¶</a> Simple Decisions</h3>
  <ul>
    <li>Avoid overthinking</li>
    <li>Choose first clear option</li>
    <li>Commit to the decision</li>
  </ul>
</section><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Head up</li>
  <li>What do you see?</li>
  <li>Pass or carry?</li>
  <li>Don’t rush</li>
  <li>Make a decision</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><strong>Head down</strong> – Reinforce scanning before action</li>
  <li><strong>Automatic passing</strong> – Ask player what they saw</li>
  <li><strong>Hesitation</strong> – Encourage committing to first option</li>
  <li><strong>Ignoring support</strong> – Highlight support position</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Keep pressure low initially</li>
  <li>Stop and question decisions when needed</li>
  <li>Reinforce correct choices, not just outcomes</li>
  <li>Ensure clear spacing between players</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h2><div>

</div><ul>
  <li>Increase speed of support movement</li>
  <li>Add light defensive pressure</li>
  <li>Reduce time available to decide</li>
</ul><div>

</div><h2 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h2><div>

</div><ul>
  <li>Keep support static</li>
  <li>Remove defenders</li>
  <li>Slow tempo of drills</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
