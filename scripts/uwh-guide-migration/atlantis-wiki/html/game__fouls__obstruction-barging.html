<p>Obstruction is when a player interferes with an opponent's accessibility to the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck </a>or actively uses their body to prevent the advancement of a player.</p>
<p>Barging is one of three subsets of the obstruction foul. Barging occurs when a player swims into another player. This can occur if a player has the puck and swims into an opponent, pushing into them with their shoulder, free arm or any other body part. Barging also occurs if the player does not have the puck, but swims into an opponent, preventing them from advancing the puck or moving them out of their desired position.</p>
<p>This foul commonly occurs when players swim with the puck behind themselves. Swimming in this position often results in that player running into an opponent with their shoulder or head. If that opponent was stationary, the player with the puck is at fault. If the opponent moved into the path of that player and blocked their forward access, then the opponent is at fault. &nbsp;</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>Barging is signaled by grabbing both wrists and holing the arms above the surface of the water, then moving the hands in and out from the chest.&nbsp;</p>
<p>This foul should be called anytime it alters the outcome of the play. Referees should be aware that incidental contact between players often occurs when both are trying to reach the puck, which should not be called as barging. Barging should be called if a player is not swimming in a direct line to the puck and is pushing into the opponent. It is helpful for referees to determine what &nbsp;the first point-of-contact is between players; body-first contact typically means that some form of obstruction is occurring.</p>
<p>There are many situations in which barging can occur, and it is ultimately up to the referee to determine if the barging affected the outcome of the play and whether it should be called.&nbsp;</p>
