p7Im1hbmFnZSI6ZmFsc2V9fQ==" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="players/evasive_maneuvers/upper-cut.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>The uppercut is a move used to slide the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> quickly underneath an opponent that is swimming on the free hand side of a player. The player starts with the puck in a natural position for swimming with the puck, either with the puck out in front of them or under their shoulder. To do the upper cut, the player will switch the puck to the inside of their <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> and pull it back until it is under their stomach, then rotate their stick and <a href="/players/individual_fundamentals/puck_handling/passes/sliders" class="is-internal-link is-valid-page">slide</a> the puck straight out to their non playing hand side. The puck should move in an approximate “L” shape.&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This move is effective when an opponent is swimming parallel to a player's free hand side and the player has a teammate on the opposite side of that opponent. The upper cut can be used to slide the puck under the chest or hips of the opponent to a teammate. If an opponent is reaching forward to block a forward pass, the upper cut will take advantage of the space under their hips to which they can not quickly reach back to. &nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Some players will keep their stick back under their chest when chasing someone. It is difficult to do an upper cut when an opponent does this since they can quickly reach under their hips to block the slider. If the opponent does this, it may be easier to do a forward pass instead.&nbsp;</p>
