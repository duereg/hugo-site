<h2 id="block-goal" class="toc-header"><a class="toc-anchor" href="#block-goal">¶</a> Block Goal</h2>
<p>Introduce the basic principles of attacking and defending so players understand what to do when their team has possession and when the opposition has possession.</p>
<p>By the end of this block, players should:</p>
<ul>
<li>Understand their role when their team has possession</li>
<li>Move forward to support the attack</li>
<li>Maintain possession through passing, puck protection, and beating a defender</li>
<li>Understand their role when the opposition has possession</li>
<li>Position themselves between the puck and the goal</li>
<li>Perform a simple, controlled tackle to regain possession</li>
<li>Apply attacking and defensive principles during game play</li>
</ul>
<hr>

<h1 id="h-1-review" class="toc-header"><a class="toc-anchor" href="#h-1-review">¶</a> 1. Review</h1>
<h2 id="objective" class="toc-header"><a class="toc-anchor" href="#objective">¶</a> Objective</h2>
<p>Refresh the individual skills developed in Block 2 before introducing attacking and defensive concepts.</p>
<h3 id="quick-review" class="toc-header"><a class="toc-anchor" href="#quick-review">¶</a> Quick Review</h3>
<p>Players demonstrate:</p>
<ul>
<li>Bottom positioning</li>
<li>Puck control</li>
<li>Standard curl</li>
<li>Slide pass</li>
<li>Flick pass</li>
</ul>
<h3 id="coach-focus" class="toc-header"><a class="toc-anchor" href="#coach-focus">¶</a> Coach Focus</h3>
<p>Today's session is about using individual skills to become a better attacker and defender.</p>
<hr>
<h1 id="h-2-attacking-principles" class="toc-header"><a class="toc-anchor" href="#h-2-attacking-principles">¶</a> 2. Attacking Principles</h1>
<h2 id="activity-1-possession-of-the-puck" class="toc-header"><a class="toc-anchor" href="#activity-1-possession-of-the-puck">¶</a> Activity 1 – Possession of the Puck</h2>
<h3 id="objective-1" class="toc-header"><a class="toc-anchor" href="#objective-1">¶</a> Objective</h3>
<p>Understand what to do when your team has possession.</p>
<h3 id="drill" class="toc-header"><a class="toc-anchor" href="#drill">¶</a> Drill</h3>
<h4 id="setup" class="toc-header"><a class="toc-anchor" href="#setup">¶</a> Setup</h4>
<p>Place a line of markers on the bottom of the pool approximately 1.5 ft apart.</p>
<p><strong>Weave Through Markers</strong></p>
<p>Swim two lengths weaving through the markers while controlling the puck.</p>
<p><strong>Scan</strong></p>
<p>Repeat for two lengths while using peripheral vision to control the puck.</p>
<p><strong>Pass</strong></p>
<p>Pair up and swim two lengths continuously passing to one another while moving forward.</p>
<h3 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h3>
<ul>
<li>Keep the puck in contact with the stick.</li>
<li>Keep your body low by kicking continuously.</li>
<li>Look around to find your teammate before passing.</li>
</ul>
<h3 id="coach-focus-1" class="toc-header"><a class="toc-anchor" href="#coach-focus-1">¶</a> Coach Focus</h3>
<p>Players without the puck are just as important as the puck carrier. Encourage continuous movement to provide passing options and maintain possession.</p>
<hr>
<h2 id="activity-2-maintain-possession" class="toc-header"><a class="toc-anchor" href="#activity-2-maintain-possession">¶</a> Activity 2 – Maintain Possession</h2>
<h3 id="objective-2" class="toc-header"><a class="toc-anchor" href="#objective-2">¶</a> Objective</h3>
<p>Learn how to maintain possession while attacking.</p>
<p><strong>Foundation Badges Supported:</strong> <a href="/en/Coaching/Badges/Foundation#supportive-play" class="is-internal-link is-valid-page">Supportive Play</a></p>
<h3 id="drill-1" class="toc-header"><a class="toc-anchor" href="#drill-1">¶</a> Drill</h3>
<h4 id="braiding-drill" class="toc-header"><a class="toc-anchor" href="#braiding-drill">¶</a> Braiding Drill</h4>
<p>Groups of three swim two lengths.</p>
<ol>
<li>The first player swims at an angle, performs a standard curl, and passes to the teammate behind.</li>
<li>The second player collects the puck, swims at the opposite angle, performs a curl, and passes to the third teammate.</li>
<li>Continue the sequence for the full length.</li>
</ol>
<h3 id="coaching-cues-1" class="toc-header"><a class="toc-anchor" href="#coaching-cues-1">¶</a> Coaching Cues</h3>
<ul>
<li>Keep your hips low while curling.</li>
<li>Protect the puck.</li>
<li>Look before passing.</li>
<li>Pass before pressure arrives.</li>
</ul>
<h3 id="coach-focus-2" class="toc-header"><a class="toc-anchor" href="#coach-focus-2">¶</a> Coach Focus</h3>
<p>Encourage players to recognise that passing, curling, and carrying the puck are all tools for maintaining possession. Players should begin choosing the best option rather than always carrying the puck.</p>
<hr>
<h1 id="h-3-defensive-principles-1-vs-1" class="toc-header"><a class="toc-anchor" href="#h-3-defensive-principles-1-vs-1">¶</a> 3. Defensive Principles (1 vs 1)</h1>
<h2 id="objective-3" class="toc-header"><a class="toc-anchor" href="#objective-3">¶</a> Objective</h2>
<p>Understand what to do when the opposition has possession while introducing basic 1 vs 1 attacking and defending.</p>
<p><strong>Foundation Badges Supported:</strong> <a href="/en/Coaching/Badges/Foundation#individual-positioning" class="is-internal-link is-valid-page">Individual Positioning</a></p>
<h3 id="drill-2" class="toc-header"><a class="toc-anchor" href="#drill-2">¶</a> Drill</h3>
<h4 id="setup-1" class="toc-header"><a class="toc-anchor" href="#setup-1">¶</a> Setup</h4>
<ul>
<li>One attacker</li>
<li>One defender</li>
<li>Small playing area</li>
<li>One goal or designated scoring line</li>
</ul>
<p>The attacker begins with the puck.</p>
<p>The defender starts between the attacker and the goal.</p>
<p><strong>The attacker attempts to:</strong></p>
<ul>
<li>Move forward.</li>
<li>Protect the puck.</li>
<li>Beat the defender when the opportunity is available.</li>
<li>Score.</li>
</ul>
<p><strong>The defender attempts to:</strong></p>
<ul>
<li>Stay between the attacker and the goal.</li>
<li>Perform a controlled tackle.</li>
<li>Win possession or stop the attacker from scoring.</li>
</ul>
<p>Rotate roles after each repetition so every player attacks and defends.</p>
<h3 id="attacker-coaching-cues" class="toc-header"><a class="toc-anchor" href="#attacker-coaching-cues">¶</a> Attacker Coaching Cues</h3>
<ul>
<li>Move forward.</li>
<li>Attack the space.</li>
<li>Protect the puck.</li>
<li>Beat the defender if the opportunity is there.</li>
</ul>
<h3 id="defender-coaching-cues" class="toc-header"><a class="toc-anchor" href="#defender-coaching-cues">¶</a> Defender Coaching Cues</h3>
<ul>
<li>Protect the goal.</li>
<li>Stay between the puck and the goal.</li>
<li>Keep your body low.</li>
<li>Stay patient.</li>
<li>Win possession under control.</li>
</ul>
<h3 id="coach-focus-3" class="toc-header"><a class="toc-anchor" href="#coach-focus-3">¶</a> Coach Focus</h3>
<p>Defending is not chasing the puck.</p>
<p>Defending is protecting space, slowing the attack, and winning possession under control.</p>
<hr>
<h1 id="h-4-game" class="toc-header"><a class="toc-anchor" href="#h-4-game">¶</a> 4. Game</h1>
<h2 id="objective-4" class="toc-header"><a class="toc-anchor" href="#objective-4">¶</a> Objective</h2>
<p>Apply today's attacking and defensive principles during game play.</p>
<h3 id="focus" class="toc-header"><a class="toc-anchor" href="#focus">¶</a> Focus</h3>
<p><strong>When Attacking</strong></p>
<ul>
<li>Move forward together.</li>
<li>Support the puck carrier.</li>
<li>Maintain possession.</li>
<li>Protect the puck.</li>
<li>Beat defenders when opportunities arise.</li>
</ul>
<p><strong>When Defending</strong></p>
<ul>
<li>Protect the goal.</li>
<li>Stay between the puck and the goal.</li>
<li>Make controlled tackles.</li>
<li>Win possession.</li>
</ul>
<h3 id="coach-focus-4" class="toc-header"><a class="toc-anchor" href="#coach-focus-4">¶</a> Coach Focus</h3>
<p>Allow play to flow with minimal interruptions.</p>
<p>Pause only to reinforce key principles or address safety concerns.</p>
<p>Encourage players to make their own decisions and learn through the game.</p>
<p>Reinforce that successful teams support one another when attacking and protect space when defending.</p>
<hr>
<h1 id="wrap-up" class="toc-header"><a class="toc-anchor" href="#wrap-up">¶</a> Wrap-up</h1>
<p>Ask players:</p>
<ul>
<li>What did you do to support your teammate while attacking?</li>
<li>When did you choose to pass instead of carrying the puck?</li>
<li>What helped you defend successfully?</li>
<li>What made it easier to keep possession?</li>
</ul>
<p>Finish with:</p>
<blockquote>
<p>Every player has a role, whether your team has the puck or not. Successful teams move forward together when attacking, protect the goal together when defending, and maintain possession through good decision-making.</p>
</blockquote>
<hr>
<h1 id="coach-success-criteria" class="toc-header"><a class="toc-anchor" href="#coach-success-criteria">¶</a> Coach Success Criteria</h1>
<p>A successful Block 3 means players:</p>
<ul>
<li>Move forward to support the attack.</li>
<li>Understand that support players are essential to maintaining possession.</li>
<li>Make better decisions about when to pass, protect the puck, or beat a defender.</li>
<li>Defend by protecting space rather than chasing the puck.</li>
<li>Perform simple, controlled tackles.</li>
<li>Support teammates while attacking.</li>
<li>Begin to understand Underwater Hockey as a game of teamwork rather than individual play.</li>
</ul>
