cuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="teams/teamwork/pinches.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>A pinch is a type of two against one play. There are several pinching methods, but in general it is important to have each teammate close to the opponent, taking away the space the opponent has to maneuver the puck.&nbsp;</p>
<p>The goal of a pinch is to have two players set up so that the opponent doesn't have any (or very few) options to get away from the puck. This can be done by compromising the opponent's body position or presence on the bottom and putting the puck where one of the two players pinching can easily pick it up.&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>Pinches can be used in any part of the playing area and should be used as much as possible. Having two players set up on one player is the most reliable way to advance the puck, because a well done pinch will almost always go in favor of the two, regardless of the levels of the players involved.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>When pinching a player, it is important to be careful to avoid obstructing the opponent. This can happen if a player without the puck sets up next to an opponent and ends up blocking the opponent from getting the puck (<a href="/game/fouls/obstruction-screeing-shepherding" class="is-internal-link is-valid-page">screening</a>) or any of the player involved swim into another player (<a href="/game/fouls/obstruction-barging" class="is-internal-link is-valid-page">barging</a>).&nbsp;</p>
<h1 id="real-life-example-video-clip" class="toc-header"><a class="toc-anchor" href="#real-life-example-video-clip">¶</a> Real-life Example Video Clip</h1>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/ikH0WZxSK1E?si=VKp9Ruc9Yq6FXVE-&amp;clip=UgkxsuXp4b_GYpr6WJzLT7zkVw2KETZkIFsQ&amp;clipt=EPGCJhiYriY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>The two black team players get on either side of the opponent. Even though the white team player got her stick on the puck for a moment, the other two were close enough that they still easily ended up with the puck. </p>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/MamFbRY7EBo?si=EZQYDQky1HHvyi9p&amp;clip=Ugkxf08tVs3lR9cenukrNGKTonzn0CQeYtlB&amp;clipt=ENrdxwEY4rHIAQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>In this example a player on the black team does a hard drive up the pool, and players on the white team follow and pinch from either side. The two white players take away the options of the black player and end up with the puck because they both stayed close.</p>
