<p>This drill works on curling and back passing between teammates. The goal is to work on the skill of curing quickly and correctly as well as the skill of knowing when a teammate is about to curl and look for a back pass.&nbsp;</p>

<h1 id="steps-for-running-the-drill" class="toc-header"><a class="toc-anchor" href="#steps-for-running-the-drill">¶</a> Steps for Running the Drill</h1>
<ol>
  <li>Three players take part in the drill at a time.</li>
  <li>The players will follow a channel across the pool, the easiest is to follow two lane line markers on the bottom of the pool.</li>
  <li>Player 1 will start with the puck on one of the lines and will swim diagonally forward to the other line. Once they reach the opposite line, they will curl to the outside (away from the center of the channel) and pass the puck straight back to their teammate, player 2.</li>
  <li>Player 2 will then swim diagonally forward, returning to the first line. Once the reach that line they will again curl to the outside (this will be the opposite direction than the last player curled) and pass straight back to player 3.</li>
  <li>Player 3 will then do what the fist teammate did, swim diagonally forward, curl to the outside and pass back to player 1.</li>
  <li>The players can surface to get a few breaths after they pass the puck back and set up for receiving their next back pass.</li>
</ol>
