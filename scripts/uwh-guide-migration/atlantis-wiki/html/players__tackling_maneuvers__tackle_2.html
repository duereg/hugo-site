<p>Tackles of this sort are seen when two players are somewhat parallel to each other, one with the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> and the other attempting to take the puck from that player. In this tackle the opponent is on the player's stick hand side. The player should come at the opponent with their elbow high and get the bottom face of their <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick </a> on the puck. The player will sweep the puck off the opponent’s stick, ending in a <a href="/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page">standard curl.</a></p>
<p>What to think about when tackling:</p>
<ol>
  <li>When coming at the opponent for a tackle the player should have their stick turned sideways with the hook pointing up toward the surface of the water. They should keep their elbow high to get a good angle at the puck.</li>
  <li>When the stick is in this position, the player can shove the puck off the opponent's stick, towards themselves. They can then enter a standard curl. It is extremely important that the player does not hit the opponent's stick or glove while doing this as this is a <a href="/game/fouls/stick_infringement" class="is-internal-link is-valid-page">stick infringement</a>.</li>
  <li>Once the player’s stick is on the puck, they should maintain contact with the puck for the rest of the tackle. The can use their stick to move the puck across (perpendicularly to their torso) and off the opponent’s stick. Once it is off the opponent's stick, they can lay their stick flat on the bottom again, keeping the puck on the inside edge of their stick.</li>
  <li>Once the puck is off the opponent’s stick, the player can then drop their playing arm shoulder between them and the opponent, going straight into a standard curl.</li>
</ol>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This can be done anytime the tackler’s and opponent’s torsos are pointing in generally the same direction and the tackler is on the free arm side of the opponent.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>It is easy for a player to hit the opponent's glove or stick with their stick when attempting this steal, which is a <a href="/game/fouls/stick_infringement" class="is-internal-link is-valid-page">stick foul</a>. Players should make sure that the first thing their stick touches with this steal is the puck.&nbsp;</p>

<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
  <p><strong><u>TACKLES (PLAYER'S STICK-HAND SIDE)</u></strong></p>
  <ul>
    <li>PLAYERS SHOULD COME DOWN OVER THE TOP OF THE PUCK WITH THEIR STICK AND PULL THE PUCK OFF THE OPPONENT'S STICK</li>
    <li>AS THEY DO THIS, PLAYERS SHOULD ALREADY START DROPPING THEIR SHOULDER, SO THAT ONCE THEY HAVE FULL POSSESSION OF THE PUCK, THEY CAN GET THEIR SHOULDER FLAT ON THE BOTTOM TO PROTECT THE PUCK</li>
    <li>PLAYERS MUST BE CARFUL TO NOT HIT THE OPPONENT'S STICK OR GLOVE AS THEY GO FOR THE PUCK</li>
  </ul>
