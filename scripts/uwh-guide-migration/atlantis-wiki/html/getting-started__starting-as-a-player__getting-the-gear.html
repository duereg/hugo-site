arted/starting-as-a-player/getting-the-gear.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>When a new player starts, the club should provide all the gear necessary until they can get their own gear. The only thing a player needs to bring is a swimsuit. If they have their own <a href="/game/gear-setup/masks" class="is-internal-link is-valid-page">mask</a>, <a href="/game/gear-setup/fins" class="is-internal-link is-valid-page">fins</a> and <a href="/game/gear-setup/snorkels" class="is-internal-link is-valid-page">snorkel</a>, they can bring those if they want.</p>
<p>Once a player decides to invest in their own gear, there are many places they can get everything. It can be helpful to ask other players where to get the gear.&nbsp;</p>
<p>Newer players can also ask other club members if they could try on some of the gear. Fins, for example, are quite variable and it is good to try some on before buying a set. The same is true for <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">sticks</a> and <a href="/game/gear-setup/gloves" class="is-internal-link is-valid-page">gloves</a>. Size and shape is variable and some styles work better for different players.&nbsp;</p>
