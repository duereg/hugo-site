<p>Obstruction is when a player interferes with an opponent's accessibility to the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck </a>or actively uses their body to prevent the advancement of a player.</p>
<p>Blocking is one of three subsets of obstruction and occurs when a player stops an opponent's progress or blocks their access to the puck by blocking them with their body. An example of this is if a player <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">flicks</a> the puck and tries to chase it, but an opponent swims into the path of that player and prevents them from being able to get to the puck.&nbsp;</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>Barging is signaled by grabbing both wrists and holing the arms above the surface of the water, then moving the hands in and out from the chest.&nbsp;</p>
<p>This foul should be called anytime it alters the outcome of the play. If a player gets in the way of an opponent, preventing their access to the puck, obstruction should be called.&nbsp;</p>

<p>In this case, player #7 on the black team is driving the puck up the wall and #8 on the white team curls on the wall, blocking the progress of the black team player.&nbsp;</p>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/Gp_NtI_0yYA?si=tOuXbhEY9iDxOfEo&amp;clip=Ugkx9AZSsM1VuJTxgtr8uoB1hnxrQHlTQ0rh&amp;clipt=EPTesQkYs5SyCQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>In this example, the white team player attempts a flick and chase, but the opponent uses his body to prevent the white team player form getting to the puck after he flicks it.&nbsp;</p>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/jL7yRSLMFY8?si=txEWiC8sML3cKFwm&amp;clip=UgkxnhE_N027YH6Em_-QsiR6mZX0C_Ho4vLW&amp;clipt=EIjq0A4YkJHRDg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>In this play, a white team player knocks the puck off the black team players stick, but then they get tangled and the black team player prevents the white team player from following the puck. </p><p>
