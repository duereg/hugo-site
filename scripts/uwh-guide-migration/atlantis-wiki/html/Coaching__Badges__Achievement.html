</div><p>
Achievement badges recognize competitive outcomes and performance milestones
achieved in formal competition environments.
</p><div>

</div><p>
These badges do not influence player rank. They exist to recognize success,
progression, and contribution in competitive play.
</p><div>

</div><p>
Achievement badges are typically awarded based on verified results rather
than coach observation.
</p><div>

</div><hr><div>

</div><h2 id="achievement-badge-list" class="toc-header"><a class="toc-anchor" href="#achievement-badge-list">¶</a> Achievement Badge List</h2><div>

</div><ul>
<li>Tournament Medal</li>
<li>Event Recognition</li>
<li>Tournament Participation</li>
<li>Regional Rank Up</li>
<li>National Debut</li>
</ul><div>

</div><hr><div>

</div><h2 id="badge-opportunities" class="toc-header"><a class="toc-anchor" href="#badge-opportunities">¶</a> Badge Opportunities</h2><div>

</div><div class="table-container"><table>
  <thead>
    <tr>
      <th>Coaching Level</th>
      <th>Suggested Achievement Badges</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Level 2 – Game Function</td>
      <td>Tournament Participation</td>
    </tr>
    <tr>
      <td>Level 3 – Structured Play</td>
      <td>Tournament Participation, Event Recognition</td>
    </tr>
    <tr>
      <td>Level 4 – Competitive</td>
      <td>Tournament Medal, Event Recognition, Regional Rank Up, National Debut</td>
    </tr>
  </tbody>
</table></div><div>

</div><hr><div>

</div><h2 id="badge-criteria" class="toc-header"><a class="toc-anchor" href="#badge-criteria">¶</a> Badge Criteria</h2><div>

</div><h3 id="tournament-participation" class="toc-header"><a class="toc-anchor" href="#tournament-participation">¶</a> Tournament Participation</h3><div>

</div><ul>
<li><b>Level 1</b> — Participates in first tournament event.</li>
<li><b>Level 2</b> — Competes in multiple structured matches.</li>
<li><b>Level 3</b> — Regular tournament participation across season.</li>
</ul><div>

</div><hr><div>

</div><h3 id="event-recognition" class="toc-header"><a class="toc-anchor" href="#event-recognition">¶</a> Event Recognition</h3><div>

</div><ul>
<li><b>Level 1</b> — Recognized for contribution within team.</li>
<li><b>Level 2</b> — Recognized at event or competition level.</li>
<li><b>Level 3</b> — Consistent recognition across multiple events.</li>
</ul><div>

</div><hr><div>

</div><h3 id="tournament-medal" class="toc-header"><a class="toc-anchor" href="#tournament-medal">¶</a> Tournament Medal</h3><div>

</div><ul>
<li><b>Bronze</b> — Club-level medal.</li>
<li><b>Silver</b> — Regional or provincial medal.</li>
<li><b>Gold</b> — National or international medal.</li>
</ul><div>

</div><hr><div>

</div><h3 id="regional-rank-up" class="toc-header"><a class="toc-anchor" href="#regional-rank-up">¶</a> Regional Rank Up</h3><div>

</div><ul>
<li><b>Single</b> — Selected from club level to regional or provincial team.</li>
</ul><div>

</div><hr><div>

</div><h3 id="national-debut" class="toc-header"><a class="toc-anchor" href="#national-debut">¶</a> National Debut</h3><div>

</div><ul>
<li><b>Single</b> — First official national-level match.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-guidance" class="toc-header"><a class="toc-anchor" href="#coach-guidance">¶</a> Coach Guidance</h2><div>

</div><ul>
<li>Achievement badges should be verified through official results or records.</li>
<li>Coaches should not award these based on opinion alone.</li>
<li>These badges recognize outcomes, not training performance.</li>
<li>Use these badges to reinforce motivation and progression.</li>
</ul><div>

</div><p>
Achievement badges represent competitive success and should be used to
highlight player progression beyond training environments.
</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
