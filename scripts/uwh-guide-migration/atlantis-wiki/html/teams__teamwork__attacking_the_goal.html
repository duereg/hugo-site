ZSI6ZmFsc2V9fQ==" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="teams/teamwork/attacking_the_goal.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Attacking the <a href="/game/gear-setup/goals" class="is-internal-link is-valid-page">goal</a> is a part of the game that often takes a lot of coordination and effort from the team. Teams defending their goal will have as many people down as possible, and to score against a defensive effort like that, the attacking team also has to have several players down. Teams should focus on blocking any “escape routs” the defenders may use to clear the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> away from the goal. There should be players set up on either end of the goal, and the space in the middle between them. The more effectively a team can cover all this area, the more likely that they will be able to keep the puck in the goal area until it goes in.&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>When attacking the goal, teams should have as many players down and collapsing on the goal as possible. The defending team will have as many players down as they can, so the attackers should match (or exceed) those numbers.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Players should not always attack the goal, they should first be sure that they have support, a good chance of scoring, and will be able to maintain possession of the puck. It is very important that possession of the puck is maintained even if the goal isn't quite scored. If the defenders get the puck and can then clear it out of the goal area, it is much harder to get another chance to score. Ideally, if a player goes for the goal and it doesn't quite make it in, they will see that they wont get it in the goal early enough that they can curl and pass to a teammate and let them try again.&nbsp;</p>
