i8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="game/protocols/ref_timeouts.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Referees may call timeouts at any point in the game to discuss fouls. The game clock will be stopped. Referee timeouts have no specified length, referees use as much time as needed to resolve the issue. The signal for a referee timeout is the formation of an “O” over the head with both arms, then tapping the shoulders to indicate the referee is the one calling the timeout.</p>
<h1 id="when-and-where" class="toc-header"><a class="toc-anchor" href="#when-and-where">¶</a> When and Where</h1>
<p>Referees may wish to call a timeout if there is any disagreement between referees on the direction of a foul or if a referee is uncertain of how a foul should be called.</p>
