ts"><div><h1 class="toc-header" id="description"><a href="#description" class="toc-anchor">¶</a> Description</h1>
<p>The playing surface is the bottom of the pool where play happens. Playing surfaces can vary greatly and the <a class="is-internal-link is-valid-page" href="/game/gear-setup/pucks">puck</a> will move differently on each one. The most common playing surface is tile. Tiles provide a smooth surface that the puck slides across quite quickly. Some pools have cement bottoms, or a mixture of cement and tile. Some pools have a court installed for underwater hockey called sport court. This surface allows the puck to slide very quickly.</p>
<p>Different types of pucks are used for different surfaces. In general, pucks with brass sliders are very good for cement bottom pools while pucks with plastic sliders are much better on tile surfaces.</p>
