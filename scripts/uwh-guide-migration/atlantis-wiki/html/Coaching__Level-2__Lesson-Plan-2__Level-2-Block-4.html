</div><p>
Develop the ability to beat a player in 1v1 situations and use a teammate effectively in 2v1 scenarios.
</p><div>

</div><hr><div>

</div><h2 id="session-flow" class="toc-header"><a class="toc-anchor" href="#session-flow">¶</a> Session Flow</h2><div>

</div><section>
  <h3 id="h-1-1v1-beat-player" class="toc-header"><a class="toc-anchor" href="#h-1-1v1-beat-player">¶</a> 1. 1v1 Beat Player</h3>
  <ul>
    <li>Start with puck against a single defender</li>
    <li>Use change of direction or speed to get past</li>
    <li>Maintain control after beating the defender</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-4#1v1-beat-player" class="is-internal-link is-valid-page">
      1v1 Beat Player
    </a>
  </p>
  <p><strong>Link:</strong> Introduces individual attacking ability.</p>
</section><div>

</div><section>
  <h3 id="h-3-2v1-basic" class="toc-header"><a class="toc-anchor" href="#h-3-2v1-basic">¶</a> 3. 2v1 Basic</h3>
  <ul>
    <li>Two attackers vs one defender</li>
    <li>Recognize and use numerical advantage</li>
    <li>Keep execution simple (pass or carry)</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-4#2v1-basic" class="is-internal-link is-valid-page">
      2v1 Basic
    </a>
  </p>
  <p><strong>Link:</strong> Introduces use of teammate.</p>
</section><div>

</div><section>
  <h3 id="h-4-2v1-to-goal-area" class="toc-header"><a class="toc-anchor" href="#h-4-2v1-to-goal-area">¶</a> 4. 2v1 to Goal Area</h3>
  <ul>
    <li>Play 2v1 into a marked goal area (D)</li>
    <li>Continue until outcome is clear</li>
    <li>Goal = puck enters D → restart</li>
    <li>Defended = puck exits D → restart</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-4#2v1-to-goal-area" class="is-internal-link is-valid-page">
      2v1 to Goal Area
    </a>
  </p>
  <p><strong>Link:</strong> Applies advantage in a realistic outcome-based scenario.</p>
</section><div>

</div><section>
  <h3 id="h-5-game-integration" class="toc-header"><a class="toc-anchor" href="#h-5-game-integration">¶</a> 5. Game Integration</h3>
  <ul>
    <li>Apply 1v1 and 2v1 skills in small-sided play</li>
    <li>Encourage recognition of when to attack or use support</li>
    <li>Keep decisions simple and effective</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-4#small-game-numbers-advantage" class="is-internal-link is-valid-page">
      Small Game – Numbers Advantage
    </a>
  </p>
  <p><strong>Link:</strong> Combine individual and team attacking decisions.</p>
</section><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><ul>
  <li>Successfully beats a defender in 1v1 situations</li>
  <li>Recognizes and uses 2v1 advantage</li>
  <li>Keeps control during attacking actions</li>
  <li>Avoids forcing plays under pressure</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-principles" class="toc-header"><a class="toc-anchor" href="#key-principles">¶</a> Key Principles</h2><div>

</div><section>
  <h3 id="h-1v1-attack" class="toc-header"><a class="toc-anchor" href="#h-1v1-attack">¶</a> 1v1 Attack</h3>
  <ul>
    <li>Attack with intent</li>
    <li>Use change of direction or speed</li>
    <li>Protect the puck</li>
  </ul>
</section><div>

</div><section>
  <h3 id="h-2v1-advantage" class="toc-header"><a class="toc-anchor" href="#h-2v1-advantage">¶</a> 2v1 Advantage</h3>
  <ul>
    <li>Recognize numerical advantage</li>
    <li>Draw the defender before passing</li>
    <li>Keep execution simple</li>
  </ul>
</section><div>

</div><section>
  <h3 id="decision-simplicity" class="toc-header"><a class="toc-anchor" href="#decision-simplicity">¶</a> Decision Simplicity</h3>
  <ul>
    <li>Do not force plays</li>
    <li>Choose the clearest option</li>
    <li>Commit to the action</li>
  </ul>
</section><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Attack the defender</li>
  <li>Use your speed</li>
  <li>Draw and pass</li>
  <li>Keep it simple</li>
  <li>Don’t force it</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><strong>Slowing too early in 1v1</strong> – Encourage attacking with intent</li>
  <li><strong>Forcing passes in 2v1</strong> – Reinforce reading defender</li>
  <li><strong>Poor control when beating player</strong> – Emphasize puck control</li>
  <li><strong>Not recognizing advantage</strong> – Highlight numbers early</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Keep pressure controlled (no diving or unsafe play)</li>
  <li>Ensure clear spacing between reps</li>
  <li>Reinforce simple, correct decisions</li>
  <li>Progress only when execution is consistent</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h2><div>

</div><ul>
  <li>Increase defender pressure</li>
  <li>Reduce space in channels</li>
  <li>Increase speed of entry into drills</li>
</ul><div>

</div><h2 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h2><div>

</div><ul>
  <li>Widen channels</li>
  <li>Reduce defender pressure</li>
  <li>Slow tempo of drills</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
