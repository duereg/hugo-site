dGVtIjp7Im1hbmFnZSI6ZmFsc2V9fQ==" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="players/tackling_maneuvers/toruk_steal.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Named after the Toruk Makto (the last shadow) from the movie Avatar, the Toruk steal is a tackle made when an opponent is swimming with the puck out in front of them and the defender positions themself above the opponent and reaches down to steal the puck in a “swooping” motion.&nbsp;</p>
<p>This tackle is difficult to perform without first committing a <a href="/game/fouls/stick_infringement" class="is-internal-link is-valid-page">stick infringement</a> foul, but if performed cleanly is a high-success way to steal the puck or at least position the defender well to slow additional forward motion by the opponent.</p>
<p>How to do the tourk steal:</p>
<ol>
  <li>The player sets this tackle up by swimming approximately an arm's length above the playing surface, over the opponent. They should be swimming in the same direction as the opponent.</li>
  <li>This tackle is easiest if the player is a bit ahead of the opponent. The player can rely on their speed to get ahead of the opponent, but this is difficult, as there are always players that are faster. It is better to set up for this tackle early enough so that the opponent never passes the player.</li>
  <li>Once the player is set up over and a bit ahead of the opponent, they can reach over the shoulder of the opponent and scoop the puck off the opponent's stick.</li>
  <li>When the player gets the puck, they must continue to kick, and get their body down to the playing surface as quickly as possible. Doing this will block the opponent from grabbing the puck back and will prepare the player for their next play.</li>
</ol>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This tackle should be used if an opponent is swimming with the puck exposed, generally when they are making a hard run towards the goal. Players in the back of the formation are the most likely to find themselves in a good position for this tackle when they are using backwards facing defense.&nbsp;</p>
<p>This tackle is also most effective if the opponent does not see it coming. It is very difficult to see right above yourself while swimming with the puck, which is why this tackle is often hard to spot. To stay out of the sight of the opponent when setting up for this tackle, players should keep their arm drawn back until their torso is close enough to the puck that they can reach out and steal the puck in one quick motion, before the opponent sees their arm.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>This maneuver leaves the puck in a relatively weak position for a few seconds right after the player steals the puck. The opponent will still be under the player until they can take a few kicks and get their hips down. Swimming with the puck when an opponent is underneath is a very weak position, and players should plan an escape method from that position. As described above, players can kick hard until they have enough space to get their hips on the bottom between themselves and the opponent. Another method is to <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">flick</a> the puck quickly to a teammate right after stealing it. This flick will be short due to the body position of the player, so should only be done if a teammate is very close.&nbsp;</p>
<p>When tackling from above, players should be careful to not squish the opponent down into the playing surface, as this is an <a href="/game/fouls/obstruction-blocking" class="is-internal-link is-valid-page">obstruction foul</a>. Players should also make sure they do not hit the opponent's stick when scooping the puck, as this is a <a href="/game/fouls/stick_infringement" class="is-internal-link is-valid-page">stick infringement</a>.&nbsp;</p>
