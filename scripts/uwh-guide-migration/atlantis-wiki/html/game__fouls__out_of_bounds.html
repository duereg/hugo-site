<p>Out of bounds is called anytime the<i> </i><a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck goes</a> outside of the designated <a href="/game/gear-setup/courts" class="is-internal-link is-valid-page">playing area (court)</a>. A <a href="/game/protocols/disadvantage_puck" class="is-internal-link is-valid-page">disadvantage puck</a> will be called against the team that last touched the puck before it went out of bounds. An <a href="/game/protocols/equal_puck" class="is-internal-link is-valid-page">equal puck</a> may be called if the referee believes that both teams played a role in moving the puck out of bounds.</p>
<h1 id="demonstration-video" class="toc-header"><a class="toc-anchor" href="#demonstration-video">¶</a> Demonstration Video</h1>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>Out of bounds should be called any time the puck goes over the playing area <a href="/game/gear-setup/walls" class="is-internal-link is-valid-page">wall</a> or across the playing area demarcation line. Referees should call the foul against the player(s) that last touched the puck and moved it out of the playing area. If this includes players from both teams, an equal puck should be called. The signal for out of bounds is the movement of one hand in an arc over a horizontal forearm, simulating the movement of the puck over the top of a wall.</p>

<p>&nbsp;</p>
<div class="quickreference orange">
  <p><strong><u>OUT OF BOUNDS</u></strong></p>
  <ul>
    <li>THIS IS CALLED ANY TIME THE PUCK LEAVES THE PLAYING AREA</li>
    <li>THE FOUL WILL BE CALLED AGAINST THE PLAYER THAT LAST TOUCHED THE PUCK BEFROE GOING OUT OF BOUNDS</li>
