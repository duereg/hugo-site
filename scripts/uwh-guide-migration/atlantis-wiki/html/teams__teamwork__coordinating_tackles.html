<p>Players are most effective when working with teammates. The best way to get past an opponent is to work with a teammate. One common coordinated tackle is the <a href="/teams/teamwork/pinches" class="is-internal-link is-valid-page">pinch</a>, where one player goes on either side of an opponent, not allowing that opponent to turn in either direction. Another coordinated tackle that can be used is a back confronting an opponent and making them curl, allowing a good opportunity for a forward to <a href="/players/tackling_maneuvers/back-picks" class="is-internal-link is-valid-page">back pick</a> the opponent. Coordinated tackles can come up in any way during a game. It depends greatly on the <a href="/teams/formations" class="is-internal-link is-valid-page">formation</a> and game plan of each team.&nbsp;</p>
<p>To properly coordinate tackles with each other, teammates should have a plan, and play in a way that is predictable for their teammates. Since communication is difficult underwater, teammates should know what to expect from each other ahead of time and will then be able to coordinate plays and tackles together.&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>Teams can use coordinated tackles anytime during play. As long as each teammate involved knows what the intent of the play is, they should each be able to commit and do their part of the play.&nbsp;</p>
