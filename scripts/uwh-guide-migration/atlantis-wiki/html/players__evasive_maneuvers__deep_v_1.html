<p>A deep V is a motion that brings the puck from an extended position in front of a player straight back to at least the player’s shoulder in order to maneuver the puck out along a different direction.</p>
<p>During a deep V (free-hand side to stick-hand side) the puck is most often brought to the back (hook side) of the stick using a <a href="/players/individual_fundamentals/puck_handling/tic-tac" class="is-internal-link is-valid-page"><u>tic-tac</u></a> or <a href="/players/individual_fundamentals/puck_handling/front_to_back_roll" class="is-internal-link is-valid-page"><u>front to back roll</u></a> motion. With the puck on the back of the stick, the player propels the puck using a small inside flick, or slider, back towards their belly where the player catches the puck on the front of the stick.</p>
<p>Alternatively, the puck could remain on the front of the stick and the player can use a portion of the <a href="/players/individual_fundamentals/puck_handling/infinity_swerve" class="is-internal-link is-valid-page"><u>infinity swerve</u></a> to maneuver the puck towards their belly.</p>
<p>While the puck is being brought back towards the player’s belly while their head and torso are lifted into a <a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page"><u>cobra position</u></a>. Once in the Cobra Position with the puck on the front of the stick the player can choose which way to exit the motion; but for this situation, they will rotate their torso and hips towards their free-arm, the hips will be the pivot point for the motion. Once facing this new direction the player will push the puck forward and kick while lowering their head and body back down to re-enter a good <a href="/players/individual_fundamentals/moving_in_the_water/kicking_with_the_puck" class="is-internal-link is-valid-page"><u>kicking with the puck</u></a> body position.</p>
<p>The player’s free-arm can be used to help rotate the torso and hips (be careful to avoid pushing on any nearby opponent(s) or blocking their access to the puck with the free-arm to avoid a <a href="/game/fouls/free-arm" class="is-internal-link is-valid-page"><u>free-arm</u></a> foul). The hips and knees should be close to, or touching, the <a href="/game/gear-setup/playing_surfaces" class="is-internal-link is-valid-page">playing surface</a>. The legs and fins can be lifted and/or slightly spread to allow for a strong kick to exit the maneuver.</p>

</div><h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This move can be used when an opponent is/is getting close enough to challenge possession of the puck, or if the opponent is actively trying to steal the puck. The deep V (stick-hand side to free-hand side) can be used if the opponent is in front of and on the stick-hand side of the player with the puck. The area to the player’s free-arm side, and at both hips, should ideally be clear of opponents.</p>
<p>When performing a deep V it is important for a player to keep their vision up and look for teammates and opponents before, and during, the maneuver. At the end of their deep V a player should kick out of the move to swim to an open area.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>This maneuver is dynamic and can be used in most situations and locations within the pool. It is more difficult to successfully perform this maneuver if there are opponents near either hip as the puck is not well protected from <a href="/players/tackling_maneuvers/back-picks" class="is-internal-link is-valid-page"><u>back-picks</u></a> during the cobra position. The front area to the free-hand side should also be clear.</p>

<div class="quickreference green">

  <p><strong><u>DEEP V (STICK-HAND SIDE TO FREE-HAND SIDE)</u></strong></p>
  <ul>
    <li>PULL PUCK BACK AND COBRA UP, KEEP HIPS AND KNEES DOWN</li>
    <li>PIVOT ABOUT THE HIPS TO FACE THE NEW DIRECTION</li>
    <li>KICK HARD OUT OF THE MOTION INTO FREE SPACE</li>
