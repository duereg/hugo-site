<p><a href="../MuffinTop" class="is-asset-link">← Return to Muffin Top</a></p>
<p><img src="/underwater_hockey_pool_layout_variant.jpg" alt="underwater_hockey_pool_layout_variant.jpg"></p>
<p>The FD is the “Disrupting Forward” and can generally play anywhere in the pool except the 1m closest to their own goal, as shown in the grayed-out area of the image.</p>
<hr>
<h2 id="primary-purpose" class="toc-header"><a class="toc-anchor" href="#primary-purpose">¶</a> Primary Purpose</h2>
<p>Disrupt opponent structure, passing lanes, and offensive flow.</p>
<hr>
<h2 id="main-responsibilities" class="toc-header"><a class="toc-anchor" href="#main-responsibilities">¶</a> Main Responsibilities</h2>
<ul>
<li>Interrupt opponent plays</li>
<li>Pressure passing lanes</li>
<li>Back-pick curls</li>
<li>Force mistakes and rushed decisions</li>
<li>Create chaos in transition situations</li>
</ul>
<hr>
<h2 id="defensive-role" class="toc-header"><a class="toc-anchor" href="#defensive-role">¶</a> Defensive Role</h2>
<p>The FD focuses heavily on:</p>
<ul>
<li>Disrupting the opposition’s teamwork</li>
<li>Breaking offensive rhythm</li>
<li>Applying pressure during transitions</li>
</ul>
<p>This includes:</p>
<ul>
<li>Entering passing lanes</li>
<li>Pressuring wall play</li>
<li>Poking pucks toward supporting teammates</li>
</ul>
<hr>
<h2 id="offensive-role" class="toc-header"><a class="toc-anchor" href="#offensive-role">¶</a> Offensive Role</h2>
<p>When in possession, the FD should:</p>
<ul>
<li>Quickly recycle the puck to:
<ul>
<li>Wings</li>
<li>Backs</li>
</ul>
</li>
<li>Avoid holding possession too long</li>
<li>Return to the surface quickly to maintain awareness</li>
</ul>
<hr>
<h2 id="positioning-guidelines" class="toc-header"><a class="toc-anchor" href="#positioning-guidelines">¶</a> Positioning Guidelines</h2>
<ul>
<li>Can operate almost anywhere in the pool</li>
<li>Avoid the 1m area closest to the defended goal</li>
</ul>
<hr>
<h2 id="surface-expectations" class="toc-header"><a class="toc-anchor" href="#surface-expectations">¶</a> Surface Expectations</h2>
<ul>
<li>Often remains on the surface</li>
<li>Uses short, explosive dives strategically</li>
<li>Conserves energy for disruption opportunities</li>
</ul>
<hr>
<h2 id="supporting-offensive-pushes" class="toc-header"><a class="toc-anchor" href="#supporting-offensive-pushes">¶</a> Supporting Offensive Pushes</h2>
<p>The FD may temporarily assist offensively when:</p>
<ul>
<li>A strong offensive push develops</li>
<li>Additional support is needed in open water</li>
</ul>
<p>This falls under the FD’s secondary responsibilities.</p>
<hr>
<h2 id="wall-play-behavior" class="toc-header"><a class="toc-anchor" href="#wall-play-behavior">¶</a> Wall Play Behavior</h2>
<h3 id="if-the-team-is-progressing-successfully" class="toc-header"><a class="toc-anchor" href="#if-the-team-is-progressing-successfully">¶</a> If the team is progressing successfully:</h3>
<ul>
<li>Remain on the surface</li>
<li>Monitor the developing play</li>
</ul>
<h3 id="if-the-play-stalls-or-becomes-dangerous" class="toc-header"><a class="toc-anchor" href="#if-the-play-stalls-or-becomes-dangerous">¶</a> If the play stalls or becomes dangerous:</h3>
<ul>
<li>Drop ahead of the play</li>
<li>Pressure the opponent’s advance</li>
<li>Redirect the puck toward:
<ul>
<li>Wings</li>
<li>Backs</li>
</ul>
</li>
</ul>
<h3 id="if-the-fd-gains-possession-near-the-wall" class="toc-header"><a class="toc-anchor" href="#if-the-fd-gains-possession-near-the-wall">¶</a> If the FD gains possession near the wall:</h3>
<ul>
<li>Push toward the centerline</li>
<li>Recycle possession to a Back</li>
<li>Avoid becoming trapped against the wall</li>
</ul>
<hr>
