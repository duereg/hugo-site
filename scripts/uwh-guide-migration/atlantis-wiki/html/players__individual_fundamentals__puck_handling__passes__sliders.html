<p>Sliders are a simple method of passing the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> to a teammate. A slider is done by pushing the puck along the bottom of the pool without lifting it up or flipping it, it will just slide along the bottom smoothly.</p>
<p>To slide the puck, players should not flick their wrist at all, but should rather use their arm to propel the puck forward. The motion should be firm, but not all that fast, as a fast push will often result in the puck tumbling. The stick can extend gently at the end of the maneuver to give the puck a bit of spin, which will improve the slide distance.</p>
<p>Becoming comfortable doing sliders (especially with a lot of spin) will make it much easier to learn <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">flicks</a>.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>During the game sliders are a good method of passing the puck to a teammate, especially if it is a short pass. Sliders also guarantee that the puck is flat and settled when the teammate receives the puck, eliminating any time that would be spent settling the puck from a full flick. This allows the teammate to react faster and do a move or flick the puck again immediately.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Sliders should generally not be done if and opponent’s stick is close to the path the slider would take, as it is easy to block sliders. If that is the case, it is generally better to use an evasive maneuver or full flick to get the puck past the opponent.</p>
