</div><p>
This block teaches players to exit closed wall and corner space with control, then move the puck into open space using a swing to create attack.
</p><div>

</div><hr><div>

</div><h2 id="session-run-order" class="toc-header"><a class="toc-anchor" href="#session-run-order">¶</a> Session Run Order</h2><div>

</div><!-- 1. WALL EXIT --><div>

</div><p><b>Corner Exit Up the Wall</b></p>
<ul>
  <li>Exit closed space with control</li>
  <li>Use support to maintain possession</li>
  <li>Protect against turnover into danger zone</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-wall-exit" class="is-internal-link is-valid-page">Corner Exit Wall Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-wall-exit" class="is-internal-link is-invalid-page">Wall Exit</a>
</p><div>

</div><!-- 2. CROSS --><div>

</div><p><b>Cross Danger Zone Exit</b></p>
<ul>
  <li>Use cross only when space is available</li>
  <li>Maintain weak side coverage</li>
  <li>Secure possession after cross</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-cross" class="is-internal-link is-valid-page">Cross Danger Zone Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-cross" class="is-internal-link is-invalid-page">Cross Exit</a>
</p><div>

</div><!-- 3. SWING --><div>

</div><p><b>Swing from Closed to Open Space</b></p>
<ul>
  <li>Move puck from wall stack into open space</li>
  <li>Use centre receiver before crossing</li>
  <li>Gain ground after swing</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-swing" class="is-internal-link is-valid-page">Swing Attack Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-swing" class="is-internal-link is-invalid-page">Swing Attack</a>
</p><div>

</div><!-- 4. GAME --><div>

</div><p><b>Conditioned Game – Exits and Swings</b></p>
<ul>
  <li>Apply exits and swings in game play</li>
  <li>Reward controlled exits and space creation</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-exit-game" class="is-internal-link is-valid-page">4v4 Exit Game</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-exit-game" class="is-internal-link is-invalid-page">Exit Game</a>
</p><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><p>By the end of this block players should demonstrate the following during game play:</p><div>

</div><ul>
  <li>Exits the corner with control and support</li>
  <li>Maintains possession under pressure</li>
  <li>Uses cross only when weak side is covered</li>
  <li>Stops opposition swing through weak side patrol</li>
  <li>Executes swing from closed to open space</li>
  <li>Gains ground after exiting pressure</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-team-principles" class="toc-header"><a class="toc-anchor" href="#key-team-principles">¶</a> Key Team Principles</h2><div>

</div><h3 id="closed-vs-open-space" class="toc-header"><a class="toc-anchor" href="#closed-vs-open-space">¶</a> Closed vs Open Space</h3>
<ul>
  <li>Recognize when space is limited</li>
  <li>Move play toward open space</li>
</ul><div>

</div><h3 id="wall-exit-control" class="toc-header"><a class="toc-anchor" href="#wall-exit-control">¶</a> Wall Exit Control</h3>
<ul>
  <li>Support before driving up the wall</li>
  <li>Maintain possession first</li>
  <li>Use flick, curl, or deke under pressure</li>
</ul><div>

</div><h3 id="cross-decision" class="toc-header"><a class="toc-anchor" href="#cross-decision">¶</a> Cross Decision</h3>
<ul>
  <li>Use cross only when safe</li>
  <li>Ensure weak side coverage</li>
  <li>Avoid blind crosses</li>
</ul><div>

</div><h3 id="weak-side-patrol" class="toc-header"><a class="toc-anchor" href="#weak-side-patrol">¶</a> Weak Side Patrol</h3>
<ul>
  <li>Stay off the wall stack</li>
  <li>Stop opponent swing</li>
  <li>Protect the danger zone</li>
</ul><div>

</div><h3 id="swing-attack" class="toc-header"><a class="toc-anchor" href="#swing-attack">¶</a> Swing Attack</h3>
<ul>
  <li>Move puck away from pressure</li>
  <li>Use centre as first receiver</li>
  <li>Attack open space immediately</li>
</ul><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Support before drive</li>
  <li>Weak side on patrol</li>
  <li>Keep possession first</li>
  <li>Exit then attack</li>
  <li>Swing into space</li>
  <li>No blind cross</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-good-looks-like" class="toc-header"><a class="toc-anchor" href="#what-good-looks-like">¶</a> What Good Looks Like</h2><div>

</div><ul>
  <li>Clean exits from corner without turnovers</li>
  <li>Controlled movement up the wall</li>
  <li>Safe and effective cross decisions</li>
  <li>Weak side always covered</li>
  <li>Smooth swing into open space</li>
  <li>Immediate forward progress after exit</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><b>No support on wall</b><br>Cue: Support first.</li>
  <li><b>Blind cross</b><br>Cue: No blind cross.</li>
  <li><b>Weak side uncovered</b><br>Cue: Patrol first.</li>
  <li><b>Forcing play in closed space</b><br>Cue: Exit first.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Stop play for repeated turnovers in corner</li>
  <li>Reset when weak side is not covered</li>
  <li>Reinforce possession before speed</li>
  <li>Progress only when exits are controlled</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression-and-regression" class="toc-header"><a class="toc-anchor" href="#progression-and-regression">¶</a> Progression and Regression</h2><div>

</div><h3 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h3>
<ul>
  <li>Increase defensive pressure</li>
  <li>Add more players</li>
  <li>Increase speed of execution</li>
</ul><div>

</div><h3 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h3>
<ul>
  <li>Reduce pressure</li>
  <li>Isolate wall exits</li>
  <li>Slow tempo and reset frequently</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
