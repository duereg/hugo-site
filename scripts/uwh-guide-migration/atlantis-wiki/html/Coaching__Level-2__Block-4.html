or" href="#block-4-support-decision-making">¶</a> Block 4 – Support &amp; Decision Making</h1>
<h2 id="block-goal" class="toc-header"><a class="toc-anchor" href="#block-goal">¶</a> Block Goal</h2>
<p>Teach players how to support teammates, maintain team shape, and make better decisions about positioning, timing, and recovery.</p>
<h3 id="key-outcomes" class="toc-header"><a class="toc-anchor" href="#key-outcomes">¶</a> Key Outcomes</h3>
<p>By the end of this block, players should be able to:</p>
<ul>
<li>Support the puck carrier effectively.</li>
<li>Create passing options.</li>
<li>Stay connected to teammates.</li>
<li>Avoid filling the same space as a teammate.</li>
<li>Time dives and recovery effectively.</li>
<li>Understand basic rotation.</li>
<li>Adjust their position as play changes.</li>
</ul>

<h1 id="activity-1-principles-of-effective-support" class="toc-header"><a class="toc-anchor" href="#activity-1-principles-of-effective-support">¶</a> Activity 1 – Principles of Effective Support</h1>
<h2 id="objective" class="toc-header"><a class="toc-anchor" href="#objective">¶</a> Objective</h2>
<p>Learn how good support helps teammates play together.</p>
<h2 id="explain" class="toc-header"><a class="toc-anchor" href="#explain">¶</a> Explain</h2>
<p>Because players cannot communicate underwater, predictability is one of the team's greatest strengths.</p>
<p>Holding your line and maintaining team shape allows teammates to recognise passing options without needing to communicate.</p>
<p>Good support helps your team:</p>
<ul>
<li>Keep possession.</li>
<li>Create scoring opportunities.</li>
<li>Conserve oxygen.</li>
<li>Move the puck efficiently.</li>
</ul>
<h2 id="positioning" class="toc-header"><a class="toc-anchor" href="#positioning">¶</a> Positioning</h2>
<p>Stay within <strong>flicking range</strong> of the puck carrier.</p>
<p>Support should usually be to the left or right of the puck carrier.</p>
<p>Avoid filling the same space as a teammate.</p>
<p>Instead, move into open space where you become another passing option.</p>
<h3 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h3>
<ul>
<li>Hold your line.</li>
<li>Stay connected.</li>
<li>Stay in flicking range.</li>
<li>Don't fill the same space.</li>
<li>Give the puck an option.</li>
</ul>
<h3 id="common-errors" class="toc-header"><a class="toc-anchor" href="#common-errors">¶</a> Common Errors</h3>
<ul>
<li>Swimming into a teammate's space.</li>
<li>Following the puck instead of supporting it.</li>
<li>Supporting too far away.</li>
<li>Losing connection with the play.</li>
</ul>
<h3 id="coach-focus" class="toc-header"><a class="toc-anchor" href="#coach-focus">¶</a> Coach Focus</h3>
<p>Players should support the space around the puck, not the puck itself. Every player should create another passing option rather than duplicating one that already exists.</p>
<h1 id="activity-2-support-positions" class="toc-header"><a class="toc-anchor" href="#activity-2-support-positions">¶</a> Activity 2 – Support Positions</h1>
<h2 id="objective-1" class="toc-header"><a class="toc-anchor" href="#objective-1">¶</a> Objective</h2>
<p>Recognise where to support the puck carrier.</p>
<h2 id="explain-1" class="toc-header"><a class="toc-anchor" href="#explain-1">¶</a> Explain</h2>
<p>Support changes as the play changes.</p>
<p>Players should understand three basic support positions.</p>
<h3 id="forward-support" class="toc-header"><a class="toc-anchor" href="#forward-support">¶</a> Forward Support</h3>
<p>Position ahead of the puck carrier to provide a passing option and be ready to recover the puck if possession is lost.</p>
<h3 id="lateral-support" class="toc-header"><a class="toc-anchor" href="#lateral-support">¶</a> Lateral Support</h3>
<p>Position to the side of the puck carrier to provide a safe outlet and help move the puck away from pressure.</p>
<h3 id="rear-support" class="toc-header"><a class="toc-anchor" href="#rear-support">¶</a> Rear Support</h3>
<p>Position behind the puck carrier to provide a safe option to maintain possession and reset the attack.</p>
<h2 id="connections" class="toc-header"><a class="toc-anchor" href="#connections">¶</a> Connections</h2>
<p>Support can involve:</p>
<ul>
<li>Two-player connections.</li>
<li>Three-player connections.</li>
<li>Rotational support.</li>
</ul>
<p>The aim is always to keep the team connected while creating passing options.</p>
<h3 id="coaching-cues-1" class="toc-header"><a class="toc-anchor" href="#coaching-cues-1">¶</a> Coaching Cues</h3>
<ul>
<li>Stay available.</li>
<li>Create an option.</li>
<li>Stay connected.</li>
<li>Move with the play.</li>
</ul>
<h3 id="common-errors-1" class="toc-header"><a class="toc-anchor" href="#common-errors-1">¶</a> Common Errors</h3>
<ul>
<li>Filling the same space.</li>
<li>Standing still.</li>
<li>Leaving no backward option.</li>
<li>Getting disconnected from teammates.</li>
</ul>
<h3 id="coach-focus-1" class="toc-header"><a class="toc-anchor" href="#coach-focus-1">¶</a> Coach Focus</h3>
<p>Support positions should change with the play. Players should always look for the next available space rather than following the puck.</p>
<h1 id="activity-3-dive-timing-rotation" class="toc-header"><a class="toc-anchor" href="#activity-3-dive-timing-rotation">¶</a> Activity 3 – Dive Timing &amp; Rotation</h1>
<h2 id="objective-2" class="toc-header"><a class="toc-anchor" href="#objective-2">¶</a> Objective</h2>
<p>Learn when to dive, recover, and rotate to stay connected with the team.</p>
<h2 id="explain-2" class="toc-header"><a class="toc-anchor" href="#explain-2">¶</a> Explain</h2>
<p>Every dive should have a purpose.</p>
<p>Good players don't dive simply because they have taken a breath. They dive because they can contribute to the next phase of play.</p>
<p>Choosing the right time to dive helps you:</p>
<ul>
<li>Arrive ready to support.</li>
<li>Defend dangerous space.</li>
<li>Receive a pass.</li>
<li>Recover sooner for the next play.</li>
</ul>
<p>Choose the dive that gets you to the play most effectively.</p>
<ul>
<li>Use a <strong><a href="/players/individual_fundamentals/moving_in_the_water/diving_while_swimming" class="is-internal-link is-valid-page">Duck Dive (Diving While Swimming)</a></strong> when supporting a moving play or chasing the puck.</li>
<li>Use a <strong><a href="/players/individual_fundamentals/moving_in_the_water/fins-first_dive" class="is-internal-link is-valid-page">Kelp Dive (Fins-First Dive)</a></strong> when the puck is directly below you or when joining a stationary contest.</li>
</ul>
<h2 id="when-to-dive" class="toc-header"><a class="toc-anchor" href="#when-to-dive">¶</a> When to Dive</h2>
<p>Dive when:</p>
<ul>
<li>You are closest to the puck.</li>
<li>You can support the puck carrier.</li>
<li>You are in position to receive a pass.</li>
<li>Your team needs defensive cover.</li>
</ul>
<h2 id="when-to-surface" class="toc-header"><a class="toc-anchor" href="#when-to-surface">¶</a> When to Surface</h2>
<p>Surface when:</p>
<ul>
<li>You are no longer involved in the play.</li>
<li>The puck has moved away from your area.</li>
<li>You have completed your role.</li>
</ul>
<p>Surface facing the play so you are ready for your next dive.</p>
<h2 id="rotation" class="toc-header"><a class="toc-anchor" href="#rotation">¶</a> Rotation</h2>
<p>Rotation allows one player to recover while another player supports the play.</p>
<p>The player rotating in temporarily fills the space while the other player recovers before returning to their position.</p>
<h3 id="coaching-cues-2" class="toc-header"><a class="toc-anchor" href="#coaching-cues-2">¶</a> Coaching Cues</h3>
<ul>
<li>Dive with purpose.</li>
<li>Choose the right dive.</li>
<li>Arrive ready.</li>
<li>Recover early.</li>
<li>Rotate together.</li>
</ul>
<h3 id="common-errors-2" class="toc-header"><a class="toc-anchor" href="#common-errors-2">¶</a> Common Errors</h3>
<ul>
<li>Diving without a purpose.</li>
<li>Using the wrong dive for the situation.</li>
<li>Staying underwater too long.</li>
<li>Recovering too late.</li>
<li>Leaving gaps during rotation.</li>
</ul>
<h3 id="coach-focus-2" class="toc-header"><a class="toc-anchor" href="#coach-focus-2">¶</a> Coach Focus</h3>
<p>Players should begin selecting the most effective dive for the situation rather than using the same dive every time. Every dive should help the team by supporting the next phase of play.</p>
<h1 id="activity-4-decision-making" class="toc-header"><a class="toc-anchor" href="#activity-4-decision-making">¶</a> Activity 4 – Decision Making</h1>
<h2 id="objective-3" class="toc-header"><a class="toc-anchor" href="#objective-3">¶</a> Objective</h2>
<p>Make simple decisions that help the team.</p>
<h2 id="explain-3" class="toc-header"><a class="toc-anchor" href="#explain-3">¶</a> Explain</h2>
<p>Every decision should make the game easier for your teammates.</p>
<p>Think about where you can best help the team rather than simply following the puck.</p>
<p>Good decisions help your team:</p>
<ul>
<li>Keep possession.</li>
<li>Stay connected.</li>
<li>Defend dangerous space.</li>
<li>Create passing options.</li>
<li>Recover efficiently.</li>
</ul>
<h2 id="before-you-dive" class="toc-header"><a class="toc-anchor" href="#before-you-dive">¶</a> Before You Dive</h2>
<p>Ask yourself:</p>
<ul>
<li>Can I support?</li>
<li>Can I receive?</li>
<li>Can I defend?</li>
<li>Should I recover?</li>
</ul>
<h3 id="coaching-cues-3" class="toc-header"><a class="toc-anchor" href="#coaching-cues-3">¶</a> Coaching Cues</h3>
<ul>
<li>Think first.</li>
<li>Support first.</li>
<li>Stay connected.</li>
<li>Recover early.</li>
</ul>
<h3 id="common-errors-3" class="toc-header"><a class="toc-anchor" href="#common-errors-3">¶</a> Common Errors</h3>
<ul>
<li>Chasing the puck.</li>
<li>Diving without a purpose.</li>
<li>Filling the same space as a teammate.</li>
<li>Ignoring support opportunities.</li>
<li>Staying down too long.</li>
</ul>
<h3 id="coach-focus-3" class="toc-header"><a class="toc-anchor" href="#coach-focus-3">¶</a> Coach Focus</h3>
<p>Help players think about what the team needs rather than simply reacting to the puck.</p>
<h1 id="activity-5-drills" class="toc-header"><a class="toc-anchor" href="#activity-5-drills">¶</a> Activity 5 – Drills</h1>
<h2 id="objective-4" class="toc-header"><a class="toc-anchor" href="#objective-4">¶</a> Objective</h2>
<p>Develop support, positioning, timing, and decision making.</p>
<h3 id="drill-1-braiding-weaving" class="toc-header"><a class="toc-anchor" href="#drill-1-braiding-weaving">¶</a> Drill 1 – Braiding / Weaving</h3>
<h4 id="setup" class="toc-header"><a class="toc-anchor" href="#setup">¶</a> Setup</h4>
<ul>
<li>Groups of three or more.</li>
<li>One puck.</li>
<li>Use a channel between two lane lines.</li>
</ul>
<h4 id="execution" class="toc-header"><a class="toc-anchor" href="#execution">¶</a> Execution</h4>
<ol>
<li>Player 1 swims diagonally with the puck.</li>
<li>Perform a curl.</li>
<li>Lay the puck off to the next player.</li>
<li>Continue the pattern across the pool.</li>
<li>Players may surface after passing before preparing for their next support position.</li>
</ol>
<p><strong>Focus</strong></p>
<ul>
<li>Timing.</li>
<li>Support.</li>
<li>Movement.</li>
<li>Passing.</li>
</ul>
<h4 id="variation" class="toc-header"><a class="toc-anchor" href="#variation">¶</a> Variation</h4>
<p>Instead of curling, players may pass forward to a supporting teammate.</p>
<h1 id="game" class="toc-header"><a class="toc-anchor" href="#game">¶</a> Game</h1>
<h2 id="objective-5" class="toc-header"><a class="toc-anchor" href="#objective-5">¶</a> Objective</h2>
<p>Apply support and decision-making during game play.</p>
<h3 id="coach-focus-4" class="toc-header"><a class="toc-anchor" href="#coach-focus-4">¶</a> Coach Focus</h3>
<p>Encourage players to:</p>
<ul>
<li>Hold their line.</li>
<li>Stay within flicking range.</li>
<li>Create passing options.</li>
<li>Don't fill the same space.</li>
<li>Dive with purpose.</li>
<li>Recover when no longer involved.</li>
<li>Rotate to support teammates.</li>
</ul>
<p>Allow players to discover how good support makes the game easier for everyone.</p>
<h1 id="wrap-up" class="toc-header"><a class="toc-anchor" href="#wrap-up">¶</a> Wrap-up</h1>
<p>Ask players:</p>
<ul>
<li>When did your support help a teammate?</li>
<li>Did you create a new passing option?</li>
<li>When did recovering early help the team?</li>
<li>How did staying connected improve your play?</li>
</ul>
<p>Finish with:</p>
<blockquote>
<p>Good support isn't about following the puck. It's about being where your teammate needs you before they need you.</p>
</blockquote>
<h1 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h1>
<p>Players can:</p>
<ul>
<li>Support teammates effectively.</li>
<li>Create passing options.</li>
<li>Stay connected to the team.</li>
<li>Avoid filling the same space as teammates.</li>
<li>Time dives and recovery effectively.</li>
<li>Understand basic rotational movement.</li>
<li>Make simple decisions that benefit the team.</li>
</ul>
