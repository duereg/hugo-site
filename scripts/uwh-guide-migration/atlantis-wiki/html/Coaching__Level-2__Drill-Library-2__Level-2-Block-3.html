</div><p><b>Progressive Badges Supported (Observed Where Applicable):</b>
<a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a>
</p><div>

</div><hr><div>

</div><h3 id="support-position-decision" class="toc-header"><a class="toc-anchor" href="#support-position-decision">¶</a> Support Position Decision</h3><div>

</div><ul>
  <li>Ball carrier moves forward with puck under control.</li>
  <li>Support player rotates between positions (behind, next to, ahead).</li>
  <li>Carrier must scan and decide to pass or carry based on support position.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#decision-making" class="is-internal-link is-valid-page">Decision Making</a></li>
  <li><a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="head-up-scan" class="toc-header"><a class="toc-anchor" href="#head-up-scan">¶</a> Head Up Scan</h3><div>

</div><ul>
  <li>Player lifts head before acting.</li>
  <li>Identifies space, pressure, and support position.</li>
  <li>Delays action briefly to make a decision.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> None (awareness drill)</p><div>

</div><hr><div>

</div><h3 id="moving-support-lane" class="toc-header"><a class="toc-anchor" href="#moving-support-lane">¶</a> Moving Support Lane</h3><div>

</div><ul>
  <li>Support player actively changes position during the rep.</li>
  <li>Carrier adjusts decision in real time (pass vs carry).</li>
  <li>Encourages continuous scanning and adaptation.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#decision-making" class="is-internal-link is-valid-page">Decision Making</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="guided-2v1-decision" class="toc-header"><a class="toc-anchor" href="#guided-2v1-decision">¶</a> Guided 2v1 Decision</h3><div>

</div><ul>
  <li>Two attackers vs one passive defender.</li>
  <li>Support player varies position (behind, level, ahead).</li>
  <li>Carrier reads defender and support to decide pass or carry.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#decision-making" class="is-internal-link is-valid-page">Decision Making</a></li>
  <li><a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="short-game-decision-play" class="toc-header"><a class="toc-anchor" href="#short-game-decision-play">¶</a> Short Game Decision Play</h3><div>

</div><ul>
  <li>Small-sided game with emphasis on decision-making.</li>
  <li>Support players encouraged to constantly adjust position.</li>
  <li>Carrier avoids automatic decisions and reacts to support.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> Observed where applicable during play</p><div>
