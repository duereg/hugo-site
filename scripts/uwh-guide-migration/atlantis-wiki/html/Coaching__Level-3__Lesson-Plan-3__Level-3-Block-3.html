</div><p>
This block teaches players to react immediately to turnovers, make correct counterattack or delay decisions, and stop opposition counterattacks while maintaining team structure.
</p><div>

</div><hr><div>

</div><h2 id="session-run-order" class="toc-header"><a class="toc-anchor" href="#session-run-order">¶</a> Session Run Order</h2><div>

</div><!-- 1. DECISION --><div>

</div><p><b>Turnover Decision – Counter or Delay</b></p>
<ul>
  <li>Recognize possession change immediately</li>
  <li>Decide to counter or delay within three seconds</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-counter-delay" class="is-internal-link is-valid-page">Counter vs Delay Decision Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-counter-delay" class="is-internal-link is-invalid-page">Counter vs Delay</a>
</p><div>

</div><!-- 2. COUNTER --><div>

</div><p><b>Counterattack Timing</b></p>
<ul>
  <li>Counter only when support is present</li>
  <li>Attack immediately if opposition is unbalanced</li>
  <li>Maintain connection while gaining ground</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-counter-timing" class="is-internal-link is-valid-page">Counterattack Timing Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-counter" class="is-internal-link is-invalid-page">Counterattack Timing</a>
</p><div>

</div><!-- 3. DELAY --><div>

</div><p><b>Delay and Control</b></p>
<ul>
  <li>Delay when support or structure is not ready</li>
  <li>Use wall or corner to protect possession</li>
  <li>Wait for support before building attack</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-delay" class="is-internal-link is-valid-page">Delay and Control Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-delay" class="is-internal-link is-invalid-page">Delay and Control</a>
</p><div>

</div><!-- 4. DEFENSE --><div>

</div><p><b>Stopping the Counterattack</b></p>
<ul>
  <li>Apply immediate pressure after turnover</li>
  <li>Protect the middle and danger zone</li>
  <li>Force play into safe zones</li>
  <li>Do not overcommit as last defender</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-stop-counter" class="is-internal-link is-valid-page">Stop Counterattack Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-stop-counter" class="is-internal-link is-invalid-page">Stopping the Counter</a>
</p><div>

</div><!-- 5. GAME --><div>

</div><p><b>Conditioned Transition Game</b></p>
<ul>
  <li>Apply transition decisions in live play</li>
  <li>Reward correct first actions after turnover</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-transition-game" class="is-internal-link is-valid-page">4v4 Transition Game</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-transition-game" class="is-internal-link is-invalid-page">Transition Game</a>
</p><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><p>By the end of this block players should demonstrate the following during game play:</p><div>

</div><ul>
  <li>React immediately to turnovers</li>
  <li>Make correct counter or delay decisions</li>
  <li>Counterattack with support and control</li>
  <li>Delay effectively when structure is not ready</li>
  <li>Stop opposition counterattacks early</li>
  <li>Maintain structure through transitions</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-team-principles" class="toc-header"><a class="toc-anchor" href="#key-team-principles">¶</a> Key Team Principles</h2><div>

</div><h3 id="turnover-reaction" class="toc-header"><a class="toc-anchor" href="#turnover-reaction">¶</a> Turnover Reaction</h3>
<ul>
  <li>React immediately on every turnover</li>
  <li>Nearest player acts first</li>
  <li>No hesitation or drifting out of play</li>
</ul><div>

</div><h3 id="counterattack-timing" class="toc-header"><a class="toc-anchor" href="#counterattack-timing">¶</a> Counterattack Timing</h3>
<ul>
  <li>Counter only with support</li>
  <li>Attack when opposition is unbalanced</li>
  <li>Do not isolate the puck carrier</li>
</ul><div>

</div><h3 id="delay-decision" class="toc-header"><a class="toc-anchor" href="#delay-decision">¶</a> Delay Decision</h3>
<ul>
  <li>Delay when team is not ready</li>
  <li>Use wall or corner to hold possession</li>
  <li>Build attack once structure is restored</li>
</ul><div>

</div><h3 id="stopping-the-counterattack" class="toc-header"><a class="toc-anchor" href="#stopping-the-counterattack">¶</a> Stopping the Counterattack</h3>
<ul>
  <li>Apply immediate pressure</li>
  <li>Protect the middle first</li>
  <li>Force play to safe zones</li>
  <li>Avoid overcommitting</li>
</ul><div>

</div><h3 id="transition-control" class="toc-header"><a class="toc-anchor" href="#transition-control">¶</a> Transition Control</h3>
<ul>
  <li>Every turnover requires a decision</li>
  <li>Maintain structure through all transitions</li>
</ul><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>First three seconds</li>
  <li>Counter or delay</li>
  <li>Go with support</li>
  <li>Hold on the wall</li>
  <li>Pressure immediately</li>
  <li>Protect the middle</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-good-transition-play-looks-like" class="toc-header"><a class="toc-anchor" href="#what-good-transition-play-looks-like">¶</a> What Good Transition Play Looks Like</h2><div>

</div><ul>
  <li>Immediate reaction after turnover</li>
  <li>Clear decision between counter and delay</li>
  <li>Connected support during attack</li>
  <li>Early pressure stopping counterattacks</li>
  <li>Structure maintained throughout transitions</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><b>Forcing counter without support</b><br>Cue: Delay and recover.</li>
  <li><b>Losing possession immediately</b><br>Cue: Control first.</li>
  <li><b>Overcommitting defensively</b><br>Cue: Slow it down.</li>
  <li><b>Losing the middle</b><br>Cue: Protect first.</li>
  <li><b>No reaction after turnover</b><br>Cue: First three seconds.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Stop play for poor turnover decisions</li>
  <li>Reinforce correct first action</li>
  <li>Keep reps short and repeatable</li>
  <li>Prioritize decision quality over speed</li>
  <li>Reset players who are out of play</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression-and-regression" class="toc-header"><a class="toc-anchor" href="#progression-and-regression">¶</a> Progression and Regression</h2><div>

</div><h3 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h3>
<ul>
  <li>Increase transition speed</li>
  <li>Reduce decision time</li>
  <li>Add pressure from opposition</li>
</ul><div>

</div><h3 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h3>
<ul>
  <li>Slow tempo</li>
  <li>Reduce player numbers</li>
  <li>Walk through decisions before live play</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
