</div><p>
This index provides a structured breakdown of the Level 1 Lesson Plan. Each block represents a major stage
in beginner development and should be delivered sequentially unless strong coaching judgment suggests otherwise.
</p><div>

</div><p>
Level 1 is designed to transform a new participant into a calm, safe, and capable beginner who is ready
to enter Level 2 without anxiety.
</p><div>

</div><hr><div>

</div><h2 id="how-to-use-this-lesson-plan" class="toc-header"><a class="toc-anchor" href="#how-to-use-this-lesson-plan">¶</a> How To Use This Lesson Plan</h2><div>

</div><ul>
  <li>Follow the blocks in order, they build on one another.</li>
  <li>Do not rush progression.</li>
  <li>Players advance through demonstration of comfort, not attendance.</li>
  <li>Multiple blocks may be combined into a single session when appropriate.</li>
</ul><div>

</div><p><b>Reminder:</b> Confidence is the primary performance metric at Level 1.</p><div>

</div><hr><div>

</div><h2 id="lesson-plan-structure" class="toc-header"><a class="toc-anchor" href="#lesson-plan-structure">¶</a> Lesson Plan Structure</h2><div>

</div><ul>
  <li>
    <a href="/en/Coaching/Level-1/Lesson-Plan-1/Level-1-Block-1" class="is-internal-link is-valid-page">Block 1 - Water Comfort &amp; First Puck Contact</a>
    <br>
    Establish breathing control, equipment familiarity, safe diving, and the player's first controlled interaction with the puck.
  </li>

  <li>
    <a href="/en/Coaching/Level-1/Lesson-Plan-1/Level-1-Block-2" class="is-internal-link is-valid-page">Block 2 - Basic Movement, Passing &amp; Simple Rules</a>
    <br>
    Develop underwater movement, introduce legal stick handling, and begin cooperative puck play.
  </li>

  <li>
    <a href="/en/Coaching/Level-1/Lesson-Plan-1/Level-1-Block-3" class="is-internal-link is-valid-page">Block 3 - Attacking, Defending &amp; Mini Games</a>
    <br>
    Introduce player roles, defensive awareness, attacking intent, and structured small-area games.
  </li>

  <li>
    <a href="/en/Coaching/Level-1/Lesson-Plan-1/Level-1-Block-4" class="is-internal-link is-valid-page">Block 4 - Game Flow, Strikes &amp; Simple Strategy</a>
    <br>
    Prepare players for real game participation by teaching strikes, restarts, direction of play, and basic team structure.
  </li>
</ul><div>

</div><hr><div>

</div><h2 id="recommended-coaching-flow" class="toc-header"><a class="toc-anchor" href="#recommended-coaching-flow">¶</a> Recommended Coaching Flow</h2><div>

</div><p>
Coaches should understand where each block fits within the larger developmental picture:
</p><div>

</div><ul>
  <li><b>Block 1:</b> Build calm athletes.</li>
  <li><b>Block 2:</b> Build controlled athletes.</li>
  <li><b>Block 3:</b> Build aware athletes.</li>
  <li><b>Block 4:</b> Build participating athletes.</li>
</ul><div>

</div><p>
Do not attempt to accelerate this progression. Strong foundations dramatically improve long-term player success.
</p><div>

</div><hr><div>

</div><h2 id="when-to-move-forward" class="toc-header"><a class="toc-anchor" href="#when-to-move-forward">¶</a> When To Move Forward</h2><div>

</div><p>Advance to the next block when:</p><div>

</div><ul>
  <li>Players appear emotionally comfortable.</li>
  <li>Safety habits are becoming automatic.</li>
  <li>Movement is predictable.</li>
  <li>The group looks organized rather than chaotic.</li>
</ul><div>

</div><p>
If these behaviors are inconsistent, remain in the current block.
Regression is intelligent coaching, not failure.
</p><div>

</div><hr><div>

</div><h2 id="coach-reminder" class="toc-header"><a class="toc-anchor" href="#coach-reminder">¶</a> Coach Reminder</h2><div>

</div><ul>
  <li>Do not overload beginners.</li>
  <li>Do not condition Level 1 players.</li>
  <li>Safety overrides drill completion.</li>
  <li>Calm environments produce faster learning.</li>
</ul><div>

</div><p>
<strong>Level 1 sets the emotional foundation for every player who enters your programme.</strong>
Build it carefully.
</p>
