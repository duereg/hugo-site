der"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Tournament games have to have three referees in the water and one on the surface.&nbsp;</p>
<p>The easiest way to ensure there are referees in each game is to use what is known in the US as the “Minnesota Rule.” The “Minnesota Rule” refers to the expectation that teams provide referees after each of their games to ref the next game.&nbsp;</p>
<p>There may be a basic rules course or test that players must pass before acting as a referee in a game.&nbsp;</p>
<p>Tournaments can also hire dedicated referees, usually at least paying for all their travel and housing costs. Dedicated referees are usually better trained in the rules and can provide better reffing than the average player. That is why tournament hosts are encouraged to hire referees if they have the budget for it.&nbsp;</p>
<p>If there are no full time referees, teams will have to provide two players to ref after each game, three will stay in the water and the fourth will act as chief referee on the deck. If there are full time referees, teams will not have to provide as many players to ref after each game.&nbsp;</p>
<p>In addition to the four referees, a time/score keeper is needed for each game. This role is often covered by several volunteers that are not playing in the tournament. This job does not require extensive knowledge of the game rules.</p>
