9fQ==" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="teams/teamwork/defensive_stand.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Defense, like in any sport, is extremely important in underwater hockey. Defensive strategies can be used at any time in a game, they are low risk and effective.&nbsp;</p>
<p>When playing defensively, forwards should focus on coming back towards the play, still on the front side of the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a>, and <a href="/players/tackling_maneuvers/back-picks" class="is-internal-link is-valid-page">back-pick</a> or disrupt <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">passes</a>. It is easy to feel that a forward's main job is receiving passes form the backs and driving the puck forward, but playing defense as a forward is critical. The other team attacks offensively using all six of their players, so all six of the defending team must work to defend them. &nbsp;Backs are set up between the goal they are defending and the puck, and are playing defensively for much of the game.&nbsp;</p>
<p>A defensive stand occurs when the opponents do an <a href="/teams/teamwork/offensive_push" class="is-internal-link is-valid-page">offensive push</a>. They best way to successfully defend an offensive push is to have more players down than the opponents. So, the forwards should be down back-picking and disrupting pass and as many backs as possible should be down, covering every attacking player.  </p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>Defensive stands should be used every time the opponents start a hard offensive push. If the other team is not pushing hard, the team should take that opportunity to push offensively as much as possible. </p><p>

</p><h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Teams and players should be aware and ensure they don't miss offensive opportunities by being too focused on defense.</p>

<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
          <p><strong><u>DEFENSIVE STAND</u></strong></p>
          <ul>
            <li>TO SUCCESSFULLY DEFEND, THE TEAM SHOULD HAVE AT LEAST AS MANY PLAYERS DOWN AS THE OPPONENTS, MORE IF POSSIBLE.</li>
            <li>FORWARDS SHOULD COME BACK AND ACTIVELY HELP WITH DEFENSE</li>
          </ul>
