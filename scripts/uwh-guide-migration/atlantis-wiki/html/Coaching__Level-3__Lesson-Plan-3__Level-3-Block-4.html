</div><p>
This block teaches players to execute individual attacking skills under pressure and connect them into simple supported attacks. Focus is on control, decision-making, and maintaining support.
</p><div>

</div><hr><div>

</div><h2 id="session-run-order" class="toc-header"><a class="toc-anchor" href="#session-run-order">¶</a> Session Run Order</h2><div>

</div><!-- 1. DEKE --><div>

</div><p><b>Deke</b></p>
<ul>
  <li>Beat a defender using a controlled direction change</li>
  <li>Accelerate immediately after the move</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-deke" class="is-internal-link is-valid-page">Deke Progression Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/players/evasive_maneuvers/deke" class="is-internal-link is-valid-page">Deke</a>
</p><div>

</div><!-- 2. FADE --><div>

</div><p><b>Fade</b></p>
<ul>
  <li>Create space by moving away from pressure</li>
  <li>Keep the puck controlled and accelerate out</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-fade" class="is-internal-link is-valid-page">Fade Progression Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/players/evasive_maneuvers/fade" class="is-internal-link is-valid-page">Fade</a>
</p><div>

</div><!-- 3. CURL --><div>

</div><p><b>Standard and Reverse Curl</b></p>
<ul>
  <li>Protect the puck under pressure</li>
  <li>Change direction while maintaining control</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-curl" class="is-internal-link is-valid-page">Curl Under Pressure Drill</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/players/evasive_maneuvers/reverse_curl" class="is-internal-link is-valid-page">Reverse Curl</a>, <a href="/en/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page">Standard Curl</a>
</p><div>

</div><!-- 4. CHIP --><div>

</div><p><b>Chip and Chase</b></p>
<ul>
  <li>Create space behind a defender</li>
  <li>Win the race to regain possession</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-chip-chase" class="is-internal-link is-valid-page">Chip and Chase Drill</a>
</p><div>

</div><!-- 5. TEAM --><div>

</div><p><b>2v1 and Coordinated Attack</b></p>
<ul>
  <li>Use support to create advantage</li>
  <li>Commit defender before passing or finishing</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-2v1" class="is-internal-link is-valid-page">2v1 Attack Drill</a>,
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-braid" class="is-internal-link is-valid-page">Braid Drill</a>,
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-swim-flick" class="is-internal-link is-valid-page">Swim and Flick Drill</a>
</p><div>

</div><!-- 6. GAME --><div>

</div><p><b>Conditioned Game</b></p>
<ul>
  <li>Apply individual skills in game situations</li>
  <li>Reward supported attacks and controlled execution</li>
</ul><div>

</div><p><b>Linked Drill:</b>
<a href="/en/Coaching/Level-3/Drill-Library-3#l3-drill-attacking-game" class="is-internal-link is-valid-page">4v4 Attacking Game</a>
</p><div>


</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><p>By the end of this block players should demonstrate the following during game play:</p><div>

</div><ul>
  <li>Executes attacking moves under pressure and keeps possession</li>
  <li>Protects the puck using curls when under pressure</li>
  <li>Creates space using chip and chase when appropriate</li>
  <li>Uses support effectively in attacking situations</li>
  <li>Connects individual skills into team attacks</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-team-principles" class="toc-header"><a class="toc-anchor" href="#key-team-principles">¶</a> Key Team Principles</h2><div>

</div><h3 id="individual-control" class="toc-header"><a class="toc-anchor" href="#individual-control">¶</a> Individual Control</h3>
<ul>
  <li>Control the puck before increasing speed</li>
  <li>Keep movements small and efficient</li>
</ul><div>

</div><h3 id="beating-a-defender" class="toc-header"><a class="toc-anchor" href="#beating-a-defender">¶</a> Beating a Defender</h3>
<ul>
  <li>Beat the stick, not the player</li>
  <li>Accelerate immediately after the move</li>
</ul><div>

</div><h3 id="puck-protection" class="toc-header"><a class="toc-anchor" href="#puck-protection">¶</a> Puck Protection</h3>
<ul>
  <li>Keep body between puck and defender</li>
  <li>Use curls to maintain control under pressure</li>
</ul><div>

</div><h3 id="support-in-attack" class="toc-header"><a class="toc-anchor" href="#support-in-attack">¶</a> Support in Attack</h3>
<ul>
  <li>Do not isolate the puck carrier</li>
  <li>Maintain clear support lanes</li>
</ul><div>

</div><h3 id="decision-making" class="toc-header"><a class="toc-anchor" href="#decision-making">¶</a> Decision Making</h3>
<ul>
  <li>Commit the defender before passing</li>
  <li>Choose between pass or finish based on pressure</li>
</ul><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Control first, then speed</li>
  <li>Beat the stick</li>
  <li>Accelerate out</li>
  <li>Eyes up</li>
  <li>Keep the puck close</li>
  <li>Go with support</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-good-attacking-play-looks-like" class="toc-header"><a class="toc-anchor" href="#what-good-attacking-play-looks-like">¶</a> What Good Attacking Play Looks Like</h2><div>

</div><ul>
  <li>Player beats defenders while maintaining control</li>
  <li>Puck stays protected under pressure</li>
  <li>Support players are connected and available</li>
  <li>Attacks create space and clear opportunities</li>
  <li>Decisions are made early and executed cleanly</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><b>Move too large, losing control</b><br>Cue: Small move, then accelerate.</li>
  <li><b>Lifting body during movement</b><br>Cue: Stay low and stable.</li>
  <li><b>Chip too short</b><br>Cue: Flick into space, not into contact.</li>
  <li><b>Isolated attack</b><br>Cue: Use support.</li>
  <li><b>Forcing play through pressure</b><br>Cue: Beat the stick, not the body.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Reinforce control before speed</li>
  <li>Stop play for repeated loss of possession</li>
  <li>Ensure support lanes are present</li>
  <li>Progress pressure only when control is consistent</li>
  <li>Reset players who isolate themselves</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression-and-regression" class="toc-header"><a class="toc-anchor" href="#progression-and-regression">¶</a> Progression and Regression</h2><div>

</div><h3 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h3>
<ul>
  <li>Add defensive pressure</li>
  <li>Increase speed of execution</li>
  <li>Add recovery defenders</li>
</ul><div>

</div><h3 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h3>
<ul>
  <li>Remove pressure</li>
  <li>Slow movement speed</li>
  <li>Increase spacing between players</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
