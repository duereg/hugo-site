LmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="Coaching/Level-2/index.html"><template slot="contents"><div><h1 id="level-2-foundations-of-hockey" class="toc-header"><a class="toc-anchor" href="#level-2-foundations-of-hockey">¶</a> Level 2: Foundations of Hockey</h1><div>

</div><p><b>Who this is for:</b> Players who have completed Level 1 or can safely participate in Underwater Hockey and understand the basic objective of the game.</p><div>

</div><p><b>Goal of this level:</b> Develop the technical skills, movement patterns, decision-making, and game understanding required to become a reliable and effective hockey player.</p><div>

</div><p><b>Typical delivery:</b> Five developmental blocks delivered over multiple sessions with repeated practice and game application.</p><div>

</div><p>By the end of Level 2, players should be able to:</p><div>

</div><ul>
  <li>Move efficiently into strong playing positions</li>
  <li>Control and protect the puck under pressure</li>
  <li>Pass and receive consistently</li>
  <li>Apply basic attacking and defensive principles</li>
  <li>Support teammates effectively</li>
  <li>Understand positions, formations, and the flow of the game</li>
  <li>Participate confidently in structured team play</li>
</ul><div>

</div><p><b>Development tracking:</b> Foundation Badge skills continue to be introduced and observed throughout Level 2. Coaches should use normal training and game situations to assess progress without interrupting the learning experience.</p><div>

</div><hr><div>

</div><h2 id="level-2-learning-journey" class="toc-header"><a class="toc-anchor" href="#level-2-learning-journey">¶</a> Level 2 Learning Journey</h2><div>

</div><p>
Strong Position<br>
↓<br>
Control<br>
↓<br>
Decision Making<br>
↓<br>
Support<br>
↓<br>
Game Understanding
</p><div>

</div><p>
Every skill introduced in Level 2 supports one of these five stages of player development and builds the foundation for future tactical learning.
</p><div>

</div><hr><div>

</div><h2 id="level-2-learning-blocks" class="toc-header"><a class="toc-anchor" href="#level-2-learning-blocks">¶</a> Level 2 Learning Blocks</h2><div>

</div><ul>

<li>
<b><a href="/en/Coaching/Level-2/Block-1" class="is-internal-link is-valid-page">Block 1 – Strong Position &amp; Movement</a></b><br>
Develop efficient movement patterns, strong body position, effective diving techniques, and surface recovery to arrive ready to play.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-2/Block-2" class="is-internal-link is-valid-page">Block 2 – Puck Control</a></b><br>
Build reliable puck control through passing, receiving, swimming with the puck, and protecting possession under pressure.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-2/Block-3" class="is-internal-link is-valid-page">Block 3 – Attack &amp; Defence Principles</a></b><br>
Learn the fundamental principles of attacking and defending while developing strong individual positioning and decision-making.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-2/Block-4" class="is-internal-link is-valid-page">Block 4 – Support &amp; Decision Making</a></b><br>
Develop support play, dive timing, rotational movement, and teamwork to become an effective teammate.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-2/Block-5" class="is-internal-link is-valid-page">Block 5 – Game Understanding &amp; Rules</a></b><br>
Combine technical skills and game principles within structured match play while learning positions, formations, and rules.
</li>

</ul><div>

</div><hr><div>

</div><h2 id="coach-resources" class="toc-header"><a class="toc-anchor" href="#coach-resources">¶</a> Coach Resources</h2><div>

</div><ul>

<li>
<b><a href="/en/Coaching/Level-2/Drill-Library-2" class="is-internal-link is-valid-page">Drill Library</a></b><br>
A categorized collection of drills aligned with Level 2 capability targets. Use these drills to reinforce movement, puck control, decision-making, support, and game understanding.
</li>

<br>

<li>
<b><a href="/en/Coaching/Badges/Foundation" class="is-internal-link is-valid-page">Foundation Badges</a></b><br>
Skills that may be observed and signed off throughout Level 2 as players demonstrate consistent competency.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-2/Exit-Standards-2" class="is-internal-link is-valid-page">Exit Standards</a></b><br>
Defines the minimum capability required for progression to Level 3 and ensures players possess the technical and tactical foundations for continued development.
</li>

</ul><div>

</div><hr><div>

</div><h2 id="level-2-philosophy" class="toc-header"><a class="toc-anchor" href="#level-2-philosophy">¶</a> Level 2 Philosophy</h2><div>

</div><ul>
  <li>Position before possession.</li>
  <li>Control before speed.</li>
  <li>Decision-making before tactics.</li>
  <li>Support before individual play.</li>
  <li>Consistency before complexity.</li>
</ul><div>

</div><p>
Level 2 develops players who no longer simply react to the game but begin making purposeful decisions based on sound hockey principles.
</p><div>

</div><hr><div>

</div><p>
A successful Level 2 player is not yet an advanced player. A successful Level 2 player moves efficiently, controls and protects the puck with confidence, supports teammates, understands the principles of attack and defence, and contributes effectively within a structured team environment.
</p><div>
