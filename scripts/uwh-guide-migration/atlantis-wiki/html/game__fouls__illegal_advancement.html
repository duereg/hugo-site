bmFnZSI6ZmFsc2V9fQ==" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="game/fouls/illegal_advancement.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Illegal advancement of the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> is called if the puck is moved with anything other than the legal playing section of the <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a>. The most frequent occurrence of this foul is advancing the puck with the <a href="/game/gear-setup/gloves" class="is-internal-link is-valid-page">glove</a> (known as "gloving"), but includes any advancement of the puck using the free hand or any other part of the body. Incidental contact between the puck and glove will not be called as a foul unless the contact is deliberately used to advance the puck.</p>
<h1 id="demonstration-video" class="toc-header"><a class="toc-anchor" href="#demonstration-video">¶</a> Demonstration Video</h1>
<p>Demo video coming soon!</p>
<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>This should be called if a player gains an advantage by advancing the puck with anything other than their stick. The signal to call this foul is done by punching one fist into the palm of the other hand.</p>
<figure class="image image_resized" style="width:48.29%;"><img src="/illegal_advancement.png"></figure>
<h1 id="when-not-to-call-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-call-and-what-to-watch-out-for">¶</a> When not to Call and What to Watch Out For</h1>
<p>Illegal advancement should not be called if there is incidental contact between the puck and the glove that does not give the player any significant advantage. This is true for incidental contact between any body part or piece of gear.</p>
<h1 id="real-life-example-video-clip" class="toc-header"><a class="toc-anchor" href="#real-life-example-video-clip">¶</a> Real-life Example Video Clip</h1>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/Y9bzMDe2hJk?si=dC5iV6rL9svBWLJB&amp;clip=UgkxhUBqIBSjTZaf1cvigyaoHJr9CaO0SsX2&amp;clipt=EPyNwQEY1MTBAQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>In this example black team player #1 hits the puck with his glove, illegally advancing it. Notice how he realizes this quickly and flips his stick to avoid hitting the puck with his glove again.</p>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/9p6xknWd0Ag?si=s7Oe1YTlp4k9PT8X&amp;clip=UgkxPFMn_bTGcf2sU6jxZGQWr99FC-79ryH6&amp;clipt=EOr7Zhj8uGc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>In this example, black player #40 pins the puck against the wall. The white player tries to push it forward, but can't because the black player's glove is stopping any movement along the wall.</p>
<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference orange">
  <p><strong><u>ILLEGAL ADVANCEMENT OF THE PUCK</u></strong></p>
  <ul>
    <li>CAN BE CALLED IF ANYTHING OTHER THEN THE LEGAL PLAYING PART OF THE STICK IS USED TO ADVANCE THE PUCK.</li>
  </ul>
