<p>Good positioning is the foundation of effective refereeing. A well-positioned referee sees more, decides faster, and earns player trust.</p>
<p><strong>Two guiding principles:</strong></p>
<blockquote>
<p>Protect the players (safety first)</p>
</blockquote>
<blockquote>
<p>Keep the puck playing as much as possible</p>
</blockquote>
<p>The diagrams below use a simplified top-down view of the pool. Positions are shown for a <strong>3-Water-Referee system</strong> (the preferred setup). In a 2-WR system, WR3 is absent — WR1 and WR2 cover both sides.</p>
<p><img src="/referees/01_position_game_start.png" alt="01_position_game_start.png"></p>
<hr>
<h2 id="start-of-the-game" class="toc-header"><a class="toc-anchor" href="#start-of-the-game">¶</a> Start of the Game</h2>
<p>Players are lined up along their end walls. The CR gives the 30-second warning, then the start signal.</p>
<p><img src="../images/01_position_game_start.png" alt="" title="3 referees positioned watching the starting of the game"></p>
<p><strong>What to watch:</strong></p>
<ul>
<li>All players must have at least one hand <strong>visibly touching</strong> their end wall.</li>
<li>Substitutes must be in their substitution area.</li>
<li>At the start signal, look for <strong>breaking</strong> (any player leaving the wall early).</li>
<li>WR1 and WR3 focus on the goal end — players near that goal are the most likely to break.</li>
</ul>
<p><strong>Signal if breaking occurs:</strong> Arm extended straight up, index finger pointing up, hand rotated to inscribe a circle → Advantage puck to the other team.</p>
<hr>
<h2 id="puck-on-the-wall" class="toc-header"><a class="toc-anchor" href="#puck-on-the-wall">¶</a> Puck on the Wall</h2>
<p>When the puck is being played along or near a side wall, WRs must reposition to maintain a clear view while staying out of the way.</p>
<blockquote>
<p>If the puck goes to the opposite side where the CR is, then the WRs will be naturally positioned with a little adjustment on the distance, no rotation needed.</p>
</blockquote>
<p><img src="/referees/02_position_wall_1-ref.png" alt="02_position_wall_1-ref.png"></p>
<blockquote>
<p>If the puck goes to the same side where the CR is, then a quick rotation will be required. WR2 must choose a side to cleary show the other 2 WRs where to position. There is no wrong side for the WR2.</p>
</blockquote>
<p><img src="/referees/03_position_wall_2-refs.png" alt="03_position_wall_2-refs.png"></p>
<p><strong>Key principles:</strong></p>
<ul>
<li>Never both WRs on the same side without coverage of the other half.</li>
<li>WRs stay close enough to the wall to see puck-to-stick contact, but <strong>never block player movement</strong>.</li>
</ul>
<p><strong>What to watch:</strong></p>
<ul>
<li>Obstruction along the wall is very common here — players using their body to shield the puck.</li>
<li>Free arm violations are frequent in wall play.</li>
<li>Puck going out of bounds — note which player last touched it.</li>
</ul>
<hr>
<h2 id="puck-in-the-corner" class="toc-header"><a class="toc-anchor" href="#puck-in-the-corner">¶</a> Puck in the Corner</h2>
<p>The corner is the most contested and foul-prone area of the pool. The 1 m radius arc defines it — once the puck touches the arc, the <strong>corner rule</strong> applies.</p>
<p><img src="/referees/04_position_corner.png" alt="04_position_corner.png"></p>
<p><strong>Key principles:</strong></p>
<ul>
<li><strong>One WR must get close to the corner</strong> — obstruction and delay-of-game fouls here are invisible from distance.</li>
<li>The corner rule activates the moment the puck enters the 1 m arc (not just the corner walls).</li>
<li>Count the possession: two same-team players holding the puck in the corner in succession = delay of game.</li>
</ul>
<p><strong>What to watch:</strong></p>
<ul>
<li>Two teammates passing the puck to each other inside the corner without attempting to exit → <strong>delay of game</strong>.</li>
<li>Obstruction: using the body to shield an opponent from reaching the puck.</li>
<li>The corner rule still applies when <strong>attacking</strong> — both teams can be penalised.</li>
</ul>
<p><strong>Corner delay-of-game signal:</strong> One hand placed on the opposite shoulder, arm horizontal, elbow pointing at the infringing player.</p>
<hr>
<h2 id="advantage-puck" class="toc-header"><a class="toc-anchor" href="#advantage-puck">¶</a> Advantage Puck</h2>
<p>Play has stopped for an infringement. The WRs set up the restart giving one team the advantage.</p>
<p><img src="/referees/05_position_advantage.png" alt="05_position_advantage.png"></p>
<p><strong>Step-by-step:</strong></p>
<ol>
<li>WRs align on the puck, then hold up one hand towards the infringing team (<strong>stop</strong> signal for them).</li>
<li>Both WRs swim <strong>3 m toward the infringing team</strong>, forming the imaginary line.</li>
<li>Infringing team retreats behind the line; infringed team can position anywhere.</li>
<li>When ready, both WRs raise one arm (open hand) → CR gives the restart signal.</li>
<li>Infringed team must take possession <strong>within 5 seconds</strong>.</li>
</ol>
<blockquote>
<p>If the infringing team fails to retreat behind the line before the restart, the puck may be advanced an <strong>additional 3 m</strong> toward their goal.</p>
</blockquote>
<p><strong>Signal:</strong> Back up with extended arm (palm toward infringing team) → sweep free arm in 90° arc to indicate the line → raise arm vertically (open hand) when ready.</p>
<hr>
<h2 id="penalty-shot" class="toc-header"><a class="toc-anchor" href="#penalty-shot">¶</a> Penalty Shot</h2>
<p>A penalty shot is awarded for an infringement inside the <strong>3 m goal area</strong> that prevented a likely goal. The clock is stopped.</p>
<p><img src="/referees/06_position_penaltyshot.png" alt="06_position_penaltyshot.png"></p>
<p><strong>Setup checklist:</strong></p>
<ul>
<li>Puck on the <strong>penalty spot</strong> (3 m from end line, centre of goal)</li>
<li>2 attackers on the surface, behind the puck — selected by the <strong>infringed</strong> team's captain</li>
<li>1 defender at the end wall, one hand touching the wall — selected by the <strong>infringing</strong> team's captain</li>
<li>All other players returned to their substitution areas</li>
<li>WRs signal CR (arm raised) when everything is in position</li>
</ul>
<p><strong>During the shot:</strong></p>
<ul>
<li>Attacker must take possession <strong>within 5 seconds</strong> — if not, shot is defended.</li>
<li>Defender keeps hand on wall until the attacker takes possession.</li>
<li>If the puck exits the penalty shot area (fully crosses the 6 m line) → <strong>no goal</strong>.</li>
<li>If an attacker infringes → <strong>no goal</strong>, even if already scored.</li>
<li>If the defender infringes → <strong>goal</strong> awarded.</li>
</ul>
<p><strong>Signal:</strong> Stop play → pump clenched fist up and down vertically.</p>
