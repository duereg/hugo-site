</div><p>
Leadership badges recognize coaching contribution, session leadership,
and progression from assisting within a club environment to leading
structured programs and teams.
</p><div>

</div><p>
These badges do not influence player rank. They exist to acknowledge
leadership, responsibility, and contribution to the development of others.
</p><div>

</div><p>
Leadership badges are awarded through demonstrated contribution over time,
not through isolated session performance.
</p><div>

</div><hr><div>

</div><h2 id="leadership-badge-list" class="toc-header"><a class="toc-anchor" href="#leadership-badge-list">¶</a> Leadership Badge List</h2><div>

</div><ul>
<li>Coaching Assistant</li>
<li>Coaching</li>
</ul><div>

</div><hr><div>

</div><h2 id="badge-opportunities" class="toc-header"><a class="toc-anchor" href="#badge-opportunities">¶</a> Badge Opportunities</h2><div>

</div><h2 id="badge-criteria" class="toc-header"><a class="toc-anchor" href="#badge-criteria">¶</a> Badge Criteria</h2><div>

</div><h3 id="coaching-assistant" class="toc-header"><a class="toc-anchor" href="#coaching-assistant">¶</a> Coaching Assistant</h3><div>

</div><ul>
<li><b>Level 1</b> — Assisted in 5 structured training sessions.</li>
<li><b>Level 2</b> — Assisted in 15 sessions and led warm-up independently.</li>
<li><b>Level 3</b> — Planned and delivered 3 structured sessions.</li>
<li><b>Level 4</b> — Mentored a new assistant coach for a minimum of 1 season.</li>
</ul><div>

</div><hr><div>

</div><h3 id="coaching" class="toc-header"><a class="toc-anchor" href="#coaching">¶</a> Coaching</h3><div>

</div><ul>
<li><b>Level 1</b> — Active club coach for 1 season.</li>
<li><b>Level 2</b> — Delivered a structured seasonal program.</li>
<li><b>Level 3</b> — Led a team at an official tournament.</li>
<li><b>Level 4</b> — Regional or national coaching appointment.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-guidance" class="toc-header"><a class="toc-anchor" href="#coach-guidance">¶</a> Coach Guidance</h2><div>

</div><ul>
<li>Leadership badges should be awarded based on verified contribution over time.</li>
<li>These badges recognize responsibility, planning, delivery, and mentorship.</li>
<li>Do not award leadership badges for one-off help unless the stated criteria are met.</li>
<li>Use simple records of session assistance, delivery, and coaching roles.</li>
</ul><div>

</div><p>
Leadership badges recognize contribution to the growth of the sport and the
development of other players and coaches.
</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
