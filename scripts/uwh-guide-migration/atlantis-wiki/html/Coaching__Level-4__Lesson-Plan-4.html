l0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="Coaching/Level-4/Lesson-Plan-4.html"><template slot="contents"><div><h1 id="level-4-lesson-plan-index" class="toc-header"><a class="toc-anchor" href="#level-4-lesson-plan-index">¶</a> Level 4 - Lesson Plan Index</h1><div>

</div><p>
This index provides direct links to the major sections of the Level 4 Lesson Plan. It is designed
to help coaches navigate the instructional content quickly, find the right block of work, and
understand the progression within Level 4.
</p><div>

</div><p>
Level 4 focuses on developing complete, high-performance players and teams who can control
matches, execute systems under pressure, manage tempo, dominate transitions, and sustain
repeatable performance across all phases of play.
</p><div>

</div><hr><div>

</div><h2 id="lesson-plan-structure" class="toc-header"><a class="toc-anchor" href="#lesson-plan-structure">¶</a> Lesson Plan Structure</h2><div>

</div><!-- GAME UNDERSTANDING -->
<h3 id="game-understanding" class="toc-header"><a class="toc-anchor" href="#game-understanding">¶</a> Game Understanding</h3>
<ul>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-1" class="is-internal-link is-invalid-page"><b>Block 1 - Game Model and Match Control</b></a><br>
    Match phases, control vs chaos, team identity, tactical awareness, and game state decision-making.
  </li>
  <br>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-8" class="is-internal-link is-invalid-page"><b>Block 8 - Decision-Making Under Pressure</b></a><br>
    Cue recognition, timing, risk management, and correct decisions based on game context.
  </li>
</ul><div>

</div><br><div>

</div><!-- TEAM STRUCTURE -->
<h3 id="team-structure" class="toc-header"><a class="toc-anchor" href="#team-structure">¶</a> Team Structure</h3>
<ul>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-2" class="is-internal-link is-invalid-page"><b>Block 2 - Role Mastery and Integration</b></a><br>
    Role purpose, tactical zone responsibilities, cover and replace logic, and structure through movement.
  </li>
  <br>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-3" class="is-internal-link is-invalid-page"><b>Block 3 - Team Systems</b></a><br>
    Team shape, attacking and defensive structure, line connection, and reset behavior.
  </li>
  <br>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-5" class="is-internal-link is-invalid-page"><b>Block 5 - Support and Connection</b></a><br>
    Support lines, spacing, timing, and maintaining playable structure.
  </li>
</ul><div>

</div><br><div>

</div><!-- TRANSITION & CONTROL -->
<h3 id="transition-and-control" class="toc-header"><a class="toc-anchor" href="#transition-and-control">¶</a> Transition and Control</h3>
<ul>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-4" class="is-internal-link is-invalid-page"><b>Block 4 - Transition Dominance</b></a><br>
    Winning the first three seconds after turnover and rebuilding structure immediately.
  </li>
  <br>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-14" class="is-internal-link is-invalid-page"><b>Block 14 - Tempo Control</b></a><br>
    Managing pace, knowing when to slow, accelerate, and reset.
  </li>
</ul><div>

</div><br><div>

</div><!-- EXECUTION -->
<h3 id="execution" class="toc-header"><a class="toc-anchor" href="#execution">¶</a> Execution</h3>
<ul>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-6" class="is-internal-link is-invalid-page"><b>Block 6 - Service and Receipt Control</b></a><br>
    Passing and receiving as one action, role-based receiving, and first-touch advantage.
  </li>
  <br>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-7" class="is-internal-link is-invalid-page"><b>Block 7 - Skill Speed and Precision</b></a><br>
    High-speed execution, clean first touch, and precision under pressure.
  </li>
  <br>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-9" class="is-internal-link is-invalid-page"><b>Block 9 - Space Creation and Denial</b></a><br>
    Creating attacking space and denying central space defensively.
  </li>
</ul><div>

</div><br><div>

</div><!-- GAME APPLICATION -->
<h3 id="game-application" class="toc-header"><a class="toc-anchor" href="#game-application">¶</a> Game Application</h3>
<ul>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-11" class="is-internal-link is-invalid-page"><b>Block 11 - Attacking Systems</b></a><br>
    Structured progression, channel use, and high-quality scoring opportunities.
  </li>
  <br>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-12" class="is-internal-link is-invalid-page"><b>Block 12 - Defensive Systems</b></a><br>
    Protecting middle, controlled pressure, and maintaining defensive shape.
  </li>
  <br>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-13" class="is-internal-link is-invalid-page"><b>Block 13 - Wall and Boundary Play</b></a><br>
    Corner behavior, wall exits, and boundary control under pressure.
  </li>
</ul><div>

</div><br><div>

</div><!-- PERFORMANCE -->
<h3 id="performance" class="toc-header"><a class="toc-anchor" href="#performance">¶</a> Performance</h3>
<ul>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-15" class="is-internal-link is-invalid-page"><b>Block 15 - Physical and Breath Integration</b></a><br>
    UWH-specific conditioning, recovery, and breath control systems.
  </li>
  <br>
  <li>
    <a href="/en/Coaching/Level-4/Lesson-Plan-4/Level-4-Block-16" class="is-internal-link is-invalid-page"><b>Block 16 - Competition and Game Management</b></a><br>
    Match preparation, adjustments, and consistent performance under pressure.
  </li>
</ul><div>

</div><hr>
