<p>In full length games, both teams can call one timeout per half. Each timeout is one minute long and the game clock is stopped. The timeout is called by the coach or captain of the team signaling an “O” with their arms over their heads to the chief referee. The chief referee will acknowledge the timeout by repeating the signal and stopping the game clock.</p>
<p>Not every tournament allows teams to call timeouts, so make sure to check the captains notes or ask the tournament organizers if timeouts are allowed.</p>
<h1 id="when-and-where" class="toc-header"><a class="toc-anchor" href="#when-and-where">¶</a> When and Where</h1>
<p>Teams may call timeouts at any stop in the play, such as between points, or when fouls are called. One timeout per team may be called in each half.</p>
