==" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="game/fouls/delay_of_game.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Delay of game is any action taken by a player or players to delay or stall the game. This can occur in two ways: by holding the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> in the corner or by throwing the puck <a href="/game/fouls/out_of_bounds" class="is-internal-link is-valid-page">out of bounds</a>.</p>
<p>Corner play:</p>
<p>If two subsequent players on the same team hold the puck in the corner without making any clear attempts to get the puck one meter out of the corner and opponents do not gain possession during this time, the play may be stopped and a delay of game foul called against those players. The corner is defined as the area enclosed by the end and side <a href="/game/gear-setup/walls" class="is-internal-link is-valid-page">walls</a> and a one-meter arc centered at the corner. The foul may be called in any of the four corners of the playing area.</p>
<p>Out of bounds:</p>
<p>Intentional <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">flicks</a> out of bounds will be called against the offending player for the first occurrence. Any subsequent occurrences of this will result in a one minute penalty for the player who flicked the puck out of bounds. If this continues beyond the first penalty, the referee may escalate the penalty time. Deflection of the puck after it was flicked by a stick or body part will not be considered delay of game unless the referee believes the deflection to be intentional.</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>Delay of game should be called if two players on the same team hold the puck, one after the other, in the corner without making any obvious effort to move the puck out of the corner. After the first occurrence of this, referees will issue a team warning. Any further occurrences of this will result in a one minute penalty for the second player holding the puck in the corner.</p>
<p>Delay of game should also be called if players have intentionally flicked or deflected the puck out of bounds more than one time, and penalties should escalate if this occurs more then once.</p>
<p>The signal for delay of game is the placement of one hand on the opposite shoulder, and raising the elbow above the water to simulate the shape of the corner of the pool.</p>
<figure class="image image_resized" style="width:48.29%;"><img src="/delay_of_game.png"></figure>
<h1 id="when-not-to-call-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-call-and-what-to-watch-out-for">¶</a> When not to Call and What to Watch Out For</h1>
<p>Delay of game should not be called if players clearly attempt to move the puck out of the corner or if an opponent gains possession of the puck while it is in the corner.</p>
<p>If a player flicks the puck and it is incidentally deflected out of bounds by the stick or any body part of another player, delay of game will not be called.</p>
