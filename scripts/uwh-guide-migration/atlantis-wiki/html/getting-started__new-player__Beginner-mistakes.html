</div><p>
Everyone makes beginner mistakes. The difference is whether you learn them the easy way (by reading this list) or the hard way (by repeating them in the pool).
</p><div>

</div><p><b>1) Over-breathing or rushing before a dive</b></p>
<ul>
  <li>Taking frantic big breaths makes you feel worse, not better.</li>
  <li><b>Fix:</b> slow, relaxed breathing. Smooth inhale, calm exhale.</li>
</ul><div>

</div><p><b>2) Staying down too long</b></p>
<ul>
  <li>Beginners often “push it” and surface stressed.</li>
  <li><b>Fix:</b> surface early. Build repeatable short dives first.</li>
</ul><div>

</div><p><b>3) Losing the puck and chasing it wildly</b></p>
<ul>
  <li>Chasing creates collisions and wastes energy.</li>
  <li><b>Fix:</b> keep your body controlled, approach at an angle, use your stick to slow/stop the puck.</li>
</ul><div>

</div><p><b>4) Forgetting to look up</b></p>
<ul>
  <li>New players stare at the puck and miss teammates, opponents, and walls.</li>
  <li><b>Fix:</b> “touch and scan” — brief look at puck, then look up.</li>
</ul><div>

</div><p><b>5) Poor mask/snorkel setup</b></p>
<ul>
  <li>Leaks, fog, and snorkel discomfort ruin your session.</li>
  <li><b>Fix:</b> take time to fit gear properly; use defog; adjust strap tension (snug, not painful).</li>
</ul><div>

</div><p><b>6) Using hands on the puck</b></p>
<ul>
  <li>It’s unsafe and usually against the rules.</li>
  <li><b>Fix:</b> puck is played with the stick only. Reset if you lose control.</li>
</ul><div>

</div><p><b>7) Big fin splashes, not enough control</b></p>
<ul>
  <li>Big kicks wastes energy and doesnt result in faster swimming.</li>
  <li><b>Fix:</b> controlled finning, less splashing will be more effecient.</li>
</ul><div>
