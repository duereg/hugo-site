<p>A substitution foul will be called when a team incorrectly uses their <a href="/game/protocols/substitutions" class="is-internal-link is-valid-page">substitution</a> players. During a game, there must always be four substitute players in the team’s designated subbing area and six players in the playing area. The only time teams do not need four people in the sub box is during <a href="/game/protocols/half-time" class="is-internal-link is-valid-page">half time</a>, between points, or during a <a href="/game/protocols/team_timeouts" class="is-internal-link is-valid-page">team timeout</a>. If at any point outside those times there are fewer than four players in the sub box, a subbing foul will be called and one player of the offending team will serve a one minute penalty.</p>
<p>If teams do not have a full team of ten players, meaning they will have fewer than four subs, the chief referee should be notified before the game begins. If the team fails to do this, the chief referee may assume the team had more than six players in the game and call a substitution foul. Similarly, if a player must exit the water for any reason (such as broken gear) during the game, they should not leave the substitution area until the chief referee has been notified.</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>This foul should be called if a team has more than six players in the playing area during play. The Chief Referee may decide to delay stopping the game to call an illegal substitution. The Chief Referee should use their discretion regarding if the illegal substitution is actively giving advantage to the fouling team. The signal for a substitution foul is hand over hand rotation.</p>
<figure class="image image_resized" style="width:48.29%;"><img src="/illegal_substitution.png"></figure>
<h1 id="when-not-to-call-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-call-and-what-to-watch-out-for">¶</a> When not to Call and What to Watch Out For</h1>
<p>Substitution fouls should not be called if the game is between points, in half time or in a team timeout.</p>
