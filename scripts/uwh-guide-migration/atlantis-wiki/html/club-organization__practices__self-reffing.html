lass="toc-anchor" href="#description">¶</a> Description</h1>
<p>During practices there are often no referees, so players will generally self-ref the games. It is great if teams can have referees in the water during their practices, but if not there are a few ways that teams can handle fouls.&nbsp;</p>
<p>The most common method is to allow all players to call any fouls they see, whether it is a foul that they were not involved in, one they committed, or one committed against them.&nbsp;</p>
<p>Another method is to only allow players to call fouls committed against them, or fouls they are not involved in. Not allowing players to call fouls they committed will allow the <a href="/game/fouls/advantage-rule" class="is-internal-link is-valid-page">advantage rule</a> to play out more frequently. A player that was fouled may decide to not call the foul if they think they didn't lose the advantage. This will reduce the number of stoppages.</p>
<p>The last method some teams use is to only allow players to call fouls they commit or fouls they are not involved in. This approach keeps the spirit of the game lighter and reduces the number of arguments about calls. Occasionally players foul without realizing it which is why players not engaged can still call fouls. This approach also reduces retaliatory and misjudged calls. Retaliatory fouls occur when players get a bit worked up during games, and call fouls against their opponents in retaliation. Also, often plays that are clean can feel like fouls to the player who loses the puck. Not allowing players to call fouls against opponents they are engaged with eliminates retaliatory fouls and misjudged fouls.&nbsp;</p>
<p>Each team has their own preferences as to how they self-ref during practices, and teams may have to try out a few methods to determine which one works the best for them.&nbsp;</p>
<p>&nbsp;</p>
<p>Stopping play:</p>
<p>In general to stop the play during a practice, the player that wishes to stop the play will repeatedly hit their <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> on the bottom of the pool, the gutter, their hand, or anything that will make noise until all players have stopped and surfaced.&nbsp;</p>
<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">

  <p><u>SELF REFFING</u></p>
  <ul>
    <li>PLAYERS WHO ARE NOT INVOLVED IN A PLAY SHOULD CALL ANY FOULS THEY SEE, WHILE STILL TAKING THE ADVANTAGE RULE INTO CONSIDERATION.</li>
    <li>FOR PLAYERS ENGAGED IN THE PLAY:<ul>
      <li>PLAYERS SHOULD ONLY CALL FOULS COMMITTED AGAINST THEMSELVES</li>
      <li><u>OR</u></li>
      <li>PLAYERS SHOULD ONLY CALL FOULS THEY THEMSELVES HAVE COMMITTED (WHILE TAKING THE ADVANTAGE RULE INTO ACCOUNT)</li>
      </ul>
    </li>
  </ul>
