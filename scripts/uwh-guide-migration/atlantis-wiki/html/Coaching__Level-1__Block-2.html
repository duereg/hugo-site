<h2 id="block-goal" class="toc-header"><a class="toc-anchor" href="#block-goal">¶</a> Block Goal</h2>
<p>Develop the individual skills needed to confidently control the puck while moving underwater.</p>
<p>By the end of this block, players should:</p>
<ul>
<li>Maintain a stable body position while on the bottom</li>
<li>Swim with the puck under control</li>
<li>Look up while maintaining possession</li>
<li>Use peripheral vision to track teammates and opponents</li>
<li>Protect the puck using a standard curl</li>
<li>Make accurate short passes using a slide pass and a flick</li>
<li>Apply these skills during game play</li>
</ul>
<hr>

<h1 id="h-1-equipment-water-confidence-check" class="toc-header"><a class="toc-anchor" href="#h-1-equipment-water-confidence-check">¶</a> 1. Equipment &amp; Water Confidence Check</h1>
<h2 id="objective" class="toc-header"><a class="toc-anchor" href="#objective">¶</a> Objective</h2>
<p>Confirm players are comfortable with the equipment and underwater movement introduced in Block 1 before progressing to puck skills.</p>
<h3 id="quick-check" class="toc-header"><a class="toc-anchor" href="#quick-check">¶</a> Quick Check</h3>
<p>Players should confidently demonstrate:</p>
<ul>
<li>Snorkel clearing</li>
<li>Comfortable mask use</li>
<li>Angled diving</li>
<li>Comfortable underwater swimming</li>
<li>Controlled surfacing</li>
</ul>
<h3 id="coach-focus" class="toc-header"><a class="toc-anchor" href="#coach-focus">¶</a> Coach Focus</h3>
<p>Players should now spend very little mental effort managing their equipment so they can focus on developing hockey skills.</p>
<hr>
<h1 id="h-2-bottom-position-puck-control" class="toc-header"><a class="toc-anchor" href="#h-2-bottom-position-puck-control">¶</a> 2. Bottom Position &amp; Puck Control</h1>
<h2 id="activity-1-introducing-bottom-position" class="toc-header"><a class="toc-anchor" href="#activity-1-introducing-bottom-position">¶</a> Activity 1 – Introducing Bottom Position</h2>
<h3 id="objective-1" class="toc-header"><a class="toc-anchor" href="#objective-1">¶</a> Objective</h3>
<p>Develop an efficient body position while moving along the bottom with the puck.</p>
<p><strong>Resource:</strong> <a href="/en/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">Cobra Position</a></p>
<p><strong>Foundation Badges Supported:</strong> <a href="/en/Coaching/Badges/Foundation#body-position-(Cobra)" class="is-internal-link is-valid-page">Cobra Position</a></p>
<h3 id="drill" class="toc-header"><a class="toc-anchor" href="#drill">¶</a> Drill</h3>
<p>Swim two lengths while carrying the puck.</p>
<p>Focus on:</p>
<ul>
<li>Staying low on the bottom</li>
<li>Maintaining a steady flutter kick</li>
<li>Keeping the stick arm straight</li>
<li>Maintaining continuous movement</li>
</ul>
<h3 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h3>
<ul>
<li>Keep kicking to stay on the bottom.</li>
<li>Lift your head.</li>
<li>Keep your eyes looking forward.</li>
</ul>
<h3 id="coach-focus-1" class="toc-header"><a class="toc-anchor" href="#coach-focus-1">¶</a> Coach Focus</h3>
<p>Players often stop kicking once they reach the bottom. Encourage continuous propulsion so they remain balanced, stable, and ready to react.</p>
<h3 id="resources" class="toc-header"><a class="toc-anchor" href="#resources">¶</a> Resources</h3>
<blockquote>
<p>🎥 Video Placeholder: Cobra Position</p>
</blockquote>
<hr>
<h2 id="activity-2-puck-handling-progression" class="toc-header"><a class="toc-anchor" href="#activity-2-puck-handling-progression">¶</a> Activity 2 – Puck Handling Progression</h2>
<h3 id="objective-2" class="toc-header"><a class="toc-anchor" href="#objective-2">¶</a> Objective</h3>
<p>Develop puck control while improving awareness of the game.</p>
<p><strong>Foundation Badges Supported:</strong> <a href="/en/Coaching/Badges/Foundation#puck-control" class="is-internal-link is-valid-page">Puck Control</a></p>
<h3 id="progression-1-track-the-puck" class="toc-header"><a class="toc-anchor" href="#progression-1-track-the-puck">¶</a> Progression 1 – Track the Puck</h3>
<p>Swim two lengths with:</p>
<ul>
<li>A straight stick arm</li>
<li>Eyes tracking the puck</li>
</ul>
<h3 id="coach-focus-2" class="toc-header"><a class="toc-anchor" href="#coach-focus-2">¶</a> Coach Focus</h3>
<p>Develop confidence controlling the puck before introducing scanning.</p>
<hr>
<h3 id="progression-2-look-ahead" class="toc-header"><a class="toc-anchor" href="#progression-2-look-ahead">¶</a> Progression 2 – Look Ahead</h3>
<p>Repeat for two lengths while:</p>
<ul>
<li>Looking farther ahead</li>
<li>Using peripheral vision to monitor the puck</li>
</ul>
<h3 id="coaching-cues-1" class="toc-header"><a class="toc-anchor" href="#coaching-cues-1">¶</a> Coaching Cues</h3>
<ul>
<li>Look where you're going.</li>
<li>The puck should stay in your peripheral vision.</li>
</ul>
<h3 id="coach-focus-3" class="toc-header"><a class="toc-anchor" href="#coach-focus-3">¶</a> Coach Focus</h3>
<p>Players begin learning to see more than just the puck.</p>
<hr>
<h3 id="progression-3-partner-tracking" class="toc-header"><a class="toc-anchor" href="#progression-3-partner-tracking">¶</a> Progression 3 – Partner Tracking</h3>
<h4 id="drill-1" class="toc-header"><a class="toc-anchor" href="#drill-1">¶</a> Drill</h4>
<p>Players work in pairs.</p>
<p>While swimming with the puck they should:</p>
<ul>
<li>Identify their partner</li>
<li>Identify the coach's signals</li>
<li>Scan for open space</li>
</ul>
<h3 id="coaching-cues-2" class="toc-header"><a class="toc-anchor" href="#coaching-cues-2">¶</a> Coaching Cues</h3>
<ul>
<li>Look around.</li>
<li>Find your teammate.</li>
<li>Keep the puck under control.</li>
</ul>
<h3 id="coach-focus-4" class="toc-header"><a class="toc-anchor" href="#coach-focus-4">¶</a> Coach Focus</h3>
<p>This introduces scanning the pool before passing, particularly toward the end of a breath hold.</p>
<hr>
<h1 id="h-3-puck-protection" class="toc-header"><a class="toc-anchor" href="#h-3-puck-protection">¶</a> 3. Puck Protection</h1>
<h2 id="activity-standard-curl" class="toc-header"><a class="toc-anchor" href="#activity-standard-curl">¶</a> Activity – Standard Curl</h2>
<h3 id="objective-3" class="toc-header"><a class="toc-anchor" href="#objective-3">¶</a> Objective</h3>
<p>Protect possession while changing direction.</p>
<p><strong>Resource:</strong> <a href="/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page">Curling</a></p>
<p><strong>Foundation Badges Supported:</strong> <a href="/en/Coaching/Badges/Foundation#curling" class="is-internal-link is-valid-page">Curl</a></p>
<h3 id="drill-2" class="toc-header"><a class="toc-anchor" href="#drill-2">¶</a> Drill</h3>
<p>Set up several markers.</p>
<p>Players:</p>
<ol>
<li>Swim toward a marker.</li>
<li>Perform a standard curl around the marker.</li>
<li>Protect the puck throughout the turn.</li>
<li>Continue swimming to the next marker.</li>
<li>Repeat for two lengths.</li>
</ol>
<h3 id="coaching-cues-3" class="toc-header"><a class="toc-anchor" href="#coaching-cues-3">¶</a> Coaching Cues</h3>
<ul>
<li>Turn your body.</li>
<li>Protect the puck.</li>
<li>Keep your hips low.</li>
<li>Avoid exposing the front of the stick.</li>
<li>Keep the puck beside your body.</li>
</ul>
<h3 id="coach-focus-5" class="toc-header"><a class="toc-anchor" href="#coach-focus-5">¶</a> Coach Focus</h3>
<p>Introduce the curl as the standard method of protecting possession, not simply turning around.</p>
<p>Players should remain balanced and maintain control throughout the movement.</p>
<hr>
<h1 id="h-4-passing" class="toc-header"><a class="toc-anchor" href="#h-4-passing">¶</a> 4. Passing</h1>
<h2 id="activity-passing-circle" class="toc-header"><a class="toc-anchor" href="#activity-passing-circle">¶</a> Activity – Passing Circle</h2>
<h3 id="objective-4" class="toc-header"><a class="toc-anchor" href="#objective-4">¶</a> Objective</h3>
<p>Introduce the passing technique.</p>
<p><strong>Resource:</strong> <a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page">Passes</a></p>
<p><strong>Foundation Badges Supported:</strong> <a href="/en/Coaching/Badges/Foundation#passing" class="is-internal-link is-valid-page">Passing</a></p>
<h3 id="drill-3" class="toc-header"><a class="toc-anchor" href="#drill-3">¶</a> Drill</h3>
<h4 id="setup" class="toc-header"><a class="toc-anchor" href="#setup">¶</a> Setup</h4>
<p>Players form a circle and pass the puck around the circle.</p>
<h3 id="coaching-cues-4" class="toc-header"><a class="toc-anchor" href="#coaching-cues-4">¶</a> Coaching Cues</h3>
<ul>
<li>Start with the puck close to the glove.</li>
<li>Focus on flicking the puck rather than hitting it.</li>
</ul>
<h3 id="coach-focus-6" class="toc-header"><a class="toc-anchor" href="#coach-focus-6">¶</a> Coach Focus</h3>
<p>A short pass is sufficient for the first introduction to passing.</p>
<hr>
<h1 id="h-5-game" class="toc-header"><a class="toc-anchor" href="#h-5-game">¶</a> 5. Game</h1>
<h2 id="objective-5" class="toc-header"><a class="toc-anchor" href="#objective-5">¶</a> Objective</h2>
<p>Apply today's puck control skills in a game environment.</p>
<h3 id="focus" class="toc-header"><a class="toc-anchor" href="#focus">¶</a> Focus</h3>
<p>Encourage players to:</p>
<ul>
<li>Stay low on the bottom.</li>
<li>Keep kicking continuously.</li>
<li>Look up before passing.</li>
<li>Protect the puck with a standard curl.</li>
<li>Use both slide passes and flick passes.</li>
<li>Maintain possession whenever possible.</li>
</ul>
<h3 id="coach-focus-7" class="toc-header"><a class="toc-anchor" href="#coach-focus-7">¶</a> Coach Focus</h3>
<p>Avoid:</p>
<ul>
<li>Tactical coaching.</li>
<li>Frequent stoppages.</li>
<li>Perfectionism.</li>
</ul>
<p>Allow players to discover when each skill is most effective through game play.</p>
<hr>
<h1 id="wrap-up" class="toc-header"><a class="toc-anchor" href="#wrap-up">¶</a> Wrap-up</h1>
<p>Ask players:</p>
<ul>
<li>When did looking up help you?</li>
<li>Which pass felt easier?</li>
<li>When did the curl help protect the puck?</li>
<li>What felt more comfortable than last session?</li>
</ul>
<p>Finish with:</p>
<blockquote>
<p>Great puck control starts with great body position. The more stable you are on the bottom, the easier it becomes to see the game, protect the puck, and make good passes.</p>
</blockquote>
<hr>
<h1 id="coach-success-criteria" class="toc-header"><a class="toc-anchor" href="#coach-success-criteria">¶</a> Coach Success Criteria</h1>
<p>A successful Block 2 means players:</p>
<ul>
<li>Maintain an effective bottom position.</li>
<li>Keep kicking while moving underwater.</li>
<li>Lift their head and use peripheral vision.</li>
<li>Swim comfortably with the puck.</li>
<li>Protect possession using a standard curl.</li>
<li>Complete short slide passes and flick passes.</li>
<li>Begin making good decisions while carrying the puck instead of simply reacting.</li>
<li>Show increased confidence and control compared to Block 1.</li>
</ul>
