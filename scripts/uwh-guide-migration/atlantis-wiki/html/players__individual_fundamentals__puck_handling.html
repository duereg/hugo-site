l"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>One of the core aspects of playing underwater hockey is puck handling. Maneuvering the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> successfully to maintain possession and advantage is critical to being able to score and prevent the other team from scoring.</p>
<p>Puck handling requires a <a href="/players" class="is-internal-link is-valid-page">player</a> to grip their <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> properly. Nearly all maneuvers use the <a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page">standard grip</a>, but there are a few variations that make some maneuvers easier, such as the <a href="/players/individual_fundamentals/puck_handling/monkey_grip" class="is-internal-link is-valid-page">monkey Grip</a> and <a href="/players/individual_fundamentals/puck_handling/fingertip_grip" class="is-internal-link is-valid-page">fingertip grip</a>.</p>
<p>As a player maneuvers the puck they often need to bring the puck to the back (or hook) side of the stick and vise versa to the front side. The options for this are to perform a <a href="/players/individual_fundamentals/puck_handling/tic-tac" class="is-internal-link is-valid-page">tic-tac</a> or a <a href="/players/individual_fundamentals/puck_handling/front_to_back_roll" class="is-internal-link is-valid-page">front to back roll</a> maneuver. Additionally, the puck can travel throughout a player's range of motion entirely on the front side of the stick (with a little help from the top) by using the <a href="/players/individual_fundamentals/puck_handling/infinity_swerve" class="is-internal-link is-valid-page">infinity swerve</a> maneuver. The puck can also be moved with the back side of the stick across the front of a player and down their stick-hand side using a <a href="/players/individual_fundamentals/puck_handling/half_yin-yang" class="is-internal-link is-valid-page">half yin-yang</a> maneuver.</p>
<p><a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page">Passes</a> allow players to interact with their teammates and if a pass was too high, or the puck bounces when it lands, being able to quickly <a href="/players/individual_fundamentals/puck_handling/settling_the_puck" class="is-internal-link is-valid-page">settle the puck</a> is very important.</p>
<p>When the puck is up against the <a href="/game/gear-setup/walls" class="is-internal-link is-valid-page">court barrier (wall) </a>many of the puck-handling options are limited; there are also important stick positions to consider when <a href="/players/individual_fundamentals/puck_handling/playing_at_the_wall" class="is-internal-link is-valid-page">playing at the wall</a>. When attempting to move the puck off the wall a player can use portions of the <a href="/players/individual_fundamentals/puck_handling/tic-tac" class="is-internal-link is-valid-page">tic-tac</a> or they can use the wall itself to help in a <a href="/players/individual_fundamentals/puck_handling/wall_roll_and_scoop" class="is-internal-link is-valid-page">roll and scoop</a> maneuver.</p>
