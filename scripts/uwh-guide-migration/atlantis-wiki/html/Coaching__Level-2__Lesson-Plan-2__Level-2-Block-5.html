</div><p>
Develop effective support by improving timing, passing and receiving, and movement to create simple width and depth without introducing structure.
</p><div>

</div><hr><div>

</div><h2 id="session-flow" class="toc-header"><a class="toc-anchor" href="#session-flow">¶</a> Session Flow</h2><div>

</div><section>
  <h3 id="h-1-pass-and-move" class="toc-header"><a class="toc-anchor" href="#h-1-pass-and-move">¶</a> 1. Pass and Move</h3>
  <ul>
    <li>Pass and immediately move to a new support position</li>
    <li>Stay available after releasing the puck</li>
    <li>Avoid standing still</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-5#pass-and-move" class="is-internal-link is-valid-page">
      Pass and Move
    </a>
  </p>
  <p><strong>Link:</strong> Establish movement after passing.</p>
</section><div>

</div><section>
  <h3 id="h-2-support-from-behind" class="toc-header"><a class="toc-anchor" href="#h-2-support-from-behind">¶</a> 2. Support from behind</h3>
  <ul>
    <li>Swim diagonally, curl to the outside, and pass back</li>
    <li>Learn to protect the puck and find team mate supporting from behind
    </li><li>Recognize when teammate is about to curl</li>
    <li>Deliver accurate back passes</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-5#braid" class="is-internal-link is-valid-page">
      Braid
    </a>
  </p>
  <p><strong>Link:</strong> Develop connection and timing between players.</p>
</section><div>

</div><section>
  <h3 id="h-3-support-timing-with-breath" class="toc-header"><a class="toc-anchor" href="#h-3-support-timing-with-breath">¶</a> 3. Support Timing with Breath</h3>
  <ul>
    <li>Time movement with breathing cycle</li>
    <li>Arrive as a support option at the right moment</li>
    <li>Avoid arriving too early or too late</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-5#support-timing-breath" class="is-internal-link is-valid-page">
      Support Timing with Breath
    </a>
  </p>
  <p><strong>Link:</strong> Improves timing and availability.</p>
</section><div>

</div><section>
  <h3 id="h-4-support-distance-control" class="toc-header"><a class="toc-anchor" href="#h-4-support-distance-control">¶</a> 4. Support Distance Control</h3>
  <ul>
    <li>Maintain effective distance from puck</li>
    <li>Adjust position as play moves</li>
    <li>Keep clear passing lanes</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-5#support-distance-control" class="is-internal-link is-valid-page">
      Support Distance Control
    </a>
  </p>
  <p><strong>Link:</strong> Builds consistent support positioning.</p>
</section><div>

</div><section>
  <h3 id="h-5-width-and-depth-movement" class="toc-header"><a class="toc-anchor" href="#h-5-width-and-depth-movement">¶</a> 5. Width and Depth Movement</h3>
  <ul>
    <li>Move laterally (width) and forward/back (depth)</li>
    <li>Create simple passing angles</li>
    <li>Avoid clustering around the puck</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-5#width-and-depth-movement" class="is-internal-link is-valid-page">
      Width and Depth Movement
    </a>
  </p>
  <p><strong>Link:</strong> Introduces spatial awareness without structure.</p>
</section><div>

</div><section>
  <h3 id="h-6-continuous-support-play" class="toc-header"><a class="toc-anchor" href="#h-6-continuous-support-play">¶</a> 6. Continuous Support Play</h3>
  <ul>
    <li>Maintain continuous movement and passing</li>
    <li>Always stay available as a passing option</li>
    <li>Focus on flow and connection</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-5#continuous-support-play" class="is-internal-link is-valid-page">
      Continuous Support Play
    </a>
  </p>
  <p><strong>Link:</strong> Reinforces ongoing support habits.</p>
</section><div>

</div><section>
  <h3 id="h-7-game-integration" class="toc-header"><a class="toc-anchor" href="#h-7-game-integration">¶</a> 7. Game Integration</h3>
  <ul>
    <li>Apply support and connection in small-sided play</li>
    <li>Encourage movement after every pass</li>
    <li>Reinforce spacing and timing naturally</li>
  </ul>
  <p>
    <a href="/en/Coaching/Level-2/Drill-Library-2/Level-2-Block-5#short-game-support-play" class="is-internal-link is-valid-page">
      Short Game Support Play
    </a>
  </p>
  <p><strong>Link:</strong> Combine support skills in realistic play.</p>
</section><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><ul>
  <li>Moves immediately after passing</li>
  <li>Maintains effective support distance</li>
  <li>Times support with play and breath</li>
  <li>Creates width and depth naturally</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-principles" class="toc-header"><a class="toc-anchor" href="#key-principles">¶</a> Key Principles</h2><div>

</div><section>
  <h3 id="stay-available" class="toc-header"><a class="toc-anchor" href="#stay-available">¶</a> Stay Available</h3>
  <ul>
    <li>Move after every pass</li>
    <li>Always provide a passing option</li>
    <li>Avoid standing still</li>
  </ul>
</section><div>

</div><section>
  <h3 id="support-distance" class="toc-header"><a class="toc-anchor" href="#support-distance">¶</a> Support Distance</h3>
  <ul>
    <li>Not too close</li>
    <li>Not too far</li>
    <li>Adjust with play</li>
  </ul>
</section><div>

</div><section>
  <h3 id="timing" class="toc-header"><a class="toc-anchor" href="#timing">¶</a> Timing</h3>
  <ul>
    <li>Arrive at the right moment</li>
    <li>Use breath to reset and rejoin</li>
    <li>Stay connected to play</li>
  </ul>
</section><div>

</div><section>
  <h3 id="width-and-depth" class="toc-header"><a class="toc-anchor" href="#width-and-depth">¶</a> Width and Depth</h3>
  <ul>
    <li>Spread out naturally</li>
    <li>Create simple angles</li>
    <li>Avoid crowding the puck</li>
  </ul>
</section><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
  <li>Move after you pass</li>
  <li>Stay available</li>
  <li>Good distance</li>
  <li>Arrive on time</li>
  <li>Spread out</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
  <li><strong>Standing still after pass</strong> – Reinforce immediate movement</li>
  <li><strong>Too close to puck</strong> – Create space</li>
  <li><strong>Too far from play</strong> – Stay connected</li>
  <li><strong>Late support</strong> – Improve timing with breath</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
  <li>Keep tempo moderate to allow learning</li>
  <li>Stop and correct spacing issues early</li>
  <li>Reinforce movement after pass consistently</li>
  <li>Avoid introducing structured positioning</li>
</ul><div>

</div><hr><div>

</div><h2 id="progression" class="toc-header"><a class="toc-anchor" href="#progression">¶</a> Progression</h2><div>

</div><ul>
  <li>Increase tempo of drills</li>
  <li>Add light defensive pressure</li>
  <li>Reduce time between passes</li>
</ul><div>

</div><h2 id="regression" class="toc-header"><a class="toc-anchor" href="#regression">¶</a> Regression</h2><div>

</div><ul>
  <li>Slow tempo</li>
  <li>Increase space between players</li>
  <li>Remove pressure</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
