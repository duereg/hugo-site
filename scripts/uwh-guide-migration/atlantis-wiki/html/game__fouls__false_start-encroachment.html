<p>Encroachment, or a false start can occur either at the start of a point, at a <a href="/game/protocols/disadvantage_puck" class="is-internal-link is-valid-page">disadvantage puck </a>or at an <a href="/game/protocols/equal_puck" class="is-internal-link is-valid-page">equal puck</a>. In the case of the strikes, false start is called if a player starts early (before the <a href="/game/gear-setup/buzzers" class="is-internal-link is-valid-page">buzzer</a> sounds). If this occurs, a foul will be called and the opposing team will be awarded an <a href="/game/protocols/advantage_puck" class="is-internal-link is-valid-page">advantage puck</a> in the center of the pool. In the case of disadvantage pucks, encroachment is called if a player on the team against which the foul had been called is on the incorrect side of the referee line before the other team touches the puck. In an equal puck, all players must be on their team's side of the puck and remain on the surface until the buzzer sounds. Players must watch the referees and make sure they are far enough back when in a disadvantage puck.</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>This foul should be called any time a player leaves the wall early at the start of a point or, in a disadvantage puck, crosses the referee three meter line before the opposing team touches the puck. Encroachment should also be called if a player is on the incorrect side of the puck at an equal puck or submerges (their snorkel tip goes below the surface) before the buzzer sounds.&nbsp;</p>
<p>The signal used for this foul is the arm and index finger pointing straight up and rotated in a circle.</p>
<p>If encroachment is called during a disadvantage puck, the referee will move the puck three meters toward the offending player’s team and set up another disadvantage puck. If the puck is already at the five meter line from the end wall, the puck will be moved to the middle of the court, straight out five meters from the center of the goal. If a false start is called off the strike, there will be a disadvantage puck in the center of the pool against the team that false started.</p>
<figure class="image image_resized" style="width:48.29%;"><img src="/false_start.png"></figure>
<h1 id="when-not-to-call-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-call-and-what-to-watch-out-for">¶</a> When not to Call and What to Watch Out For</h1>
<p>If a player starts early on the strike but then goes back and touches the wall, they should not be called for a false start. If a player is on the wrong side of the referee line on a disadvantage puck when the buzzer sounds, but moves behind the line before the puck is touched, they should not be called.</p>

<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference orange">
  <p><u>FALSE START OR ENCROACHMENT</u></p>
  <ul>
    <li>CAN BE CALLED IN THREE SITUATIONS:</li>
    <li>START OF A POINT: IS CALLED IF A PLAYER LEAVES THE WALL BEFORE THE BUZZER SOUNDS</li>
    <li>DISADVANTAGE PUCK: IS CALLED IF A PLAYER ON THE DISADVANTAGED TEAM IS IN FRONT OF THE REF LINE WHEN THE OPPONENTS TOUCH THE PUCK</li>
    <li>EQUAL PUCK: IS CALLED IF A PLAYER IS NOT ON THEIR TEAM'S SIDE OF THE LINE WHEN THE BUZZER SOUNDS OR IF A PLAYER SUBMERGES BEFORE THE BUZZER SOUNDS</li>
  </ul>
