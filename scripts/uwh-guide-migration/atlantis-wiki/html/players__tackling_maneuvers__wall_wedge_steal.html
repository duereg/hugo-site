NlfSwic3lzdGVtIjp7Im1hbmFnZSI6ZmFsc2V9fQ==" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="players/tackling_maneuvers/wall_wedge_steal.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>The wall wedge steal is a move that allows players to quickly move the puck off the wall while using the opponent's momentum against them.&nbsp;</p>
<p>To use the wall wedge steal, players will set up with their shoulder against the wall, facing an opponent that is driving the puck along the wall towards them. The player will use their stick to redirect the puck off the wall, using the extra space to swim the puck forward or outward. The proper stick position to do this is to put the front edge of the stick downward so that the hook is pointing up, then press the tip of the stick into the wall. The stick should be angled outward anywhere from ten degrees to sixty degrees, depending on which direction the player wishes to direct the puck.&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This move is ideal for any play on the wall, regardless which side of the pool it is on. Players should look to use this move anytime the other team is driving hard down the wall. It is difficult to reverse the momentum of the play directly back into the opponents up the wall, so it is much more effective to move the puck off the wall into space and advance from there. The wall wedge steal is a straight forward way to achieve this movement off the wall while gaining possession from the opponent.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>When using the wall wedge steal players should make sure the tip of their stick is pointing forward when making the wedge to ensure the puck hits their stick and not their glove when the opponent pushes the puck along the wall. Blocking their movement with a glove is <a href="/game/fouls/illegal_advancement" class="is-internal-link is-valid-page">illegal advancement</a> of the puck.&nbsp;</p>

<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
  <p><u>WALL WEDGE STEAL</u></p>
  <ul>
    <li>ANGLE THE STICK WITH THE TIP AGAINST THE WALL AND THE HOOK POINTING UPWARDS</li>
    <li>SET THIS UP AS AN OPPONENT PUSHES THE PUCK ALONG THE WALL</li>
    <li>WHEN THE PUCK HITS THE ANGLED STICK, IT WILL BE REDIRECTED OFF THE WALL INTO SPACE</li>
    <li>FOLLOW THE PUCK OFF THE WALL AND USE THE SPACE THAT WAS GAINED</li>
    <li>THIS SETUP CAN BE USED ON EITHER WALL</li>
  </ul>
</div>
