<h2 id="purpose" class="toc-header"><a class="toc-anchor" href="#purpose">¶</a> Purpose</h2>
<p>Level 1 Exit Standards define the minimum knowledge, skills, and confidence expected before a player progresses to Level 2.</p>
<p>The focus is not on perfect technique. Instead, players should demonstrate safe participation, growing confidence, and an understanding of the fundamental skills introduced throughout Level 1.</p>
<hr>
<h2 id="a-player-is-ready-for-level-2-when-they-can-consistently-demonstrate" class="toc-header"><a class="toc-anchor" href="#a-player-is-ready-for-level-2-when-they-can-consistently-demonstrate">¶</a> A Player is Ready for Level 2 When They Can Consistently Demonstrate</h2>
<h3 id="equipment-water-confidence" class="toc-header"><a class="toc-anchor" href="#equipment-water-confidence">¶</a> Equipment &amp; Water Confidence</h3>
<p>The player can:</p>
<ul>
<li>Use their mask, snorkel, fins, glove, and stick confidently.</li>
<li>Clear their snorkel independently.</li>
<li>Dive and surface comfortably.</li>
<li>Swim confidently underwater while wearing their equipment.</li>
</ul>
<hr>
<h3 id="individual-skills" class="toc-header"><a class="toc-anchor" href="#individual-skills">¶</a> Individual Skills</h3>
<p>The player can:</p>
<ul>
<li>Maintain a stable body position on the bottom.</li>
<li>Swim with the puck under control.</li>
<li>Look ahead while maintaining possession.</li>
<li>Protect the puck using a standard curl.</li>
<li>Complete short slide passes and flick passes with reasonable accuracy.</li>
</ul>
<hr>
<h3 id="game-understanding" class="toc-header"><a class="toc-anchor" href="#game-understanding">¶</a> Game Understanding</h3>
<p>The player demonstrates an understanding of:</p>
<ul>
<li>The objective of Underwater Hockey.</li>
<li>The three basic rules of the game.</li>
<li>Supporting teammates while attacking.</li>
<li>Staying between the puck and the goal while defending.</li>
<li>The importance of maintaining possession whenever possible.</li>
</ul>
<hr>
<h3 id="safe-participation" class="toc-header"><a class="toc-anchor" href="#safe-participation">¶</a> Safe Participation</h3>
<p>The player consistently:</p>
<ul>
<li>Surfaces before becoming uncomfortable.</li>
<li>Shows awareness of nearby players.</li>
<li>Uses their stick safely and under control.</li>
<li>Follows coach instructions.</li>
<li>Participates confidently in game situations.</li>
</ul>
<hr>
<h2 id="coach-decision-guide" class="toc-header"><a class="toc-anchor" href="#coach-decision-guide">¶</a> Coach Decision Guide</h2>
<p>A player is ready to progress when they:</p>
<ul>
<li>Participate confidently throughout a game.</li>
<li>Demonstrate the core skills introduced in all three Level 1 blocks.</li>
<li>Understand the basic attacking and defensive principles.</li>
<li>Can play safely with minimal coach intervention.</li>
<li>Show enthusiasm and confidence to continue learning.</li>
</ul>
<p>Players do <strong>not</strong> need perfect technique before progressing to Level 2.</p>
<hr>
<h2 id="before-progressing" class="toc-header"><a class="toc-anchor" href="#before-progressing">¶</a> Before Progressing</h2>
<p>Players should have completed:</p>
<p>✔ Block 1 – Play Your First Game</p>
<p>✔ Block 2 – Control the Puck</p>
<p>✔ Block 3 – Attacking &amp; Defensive Principles</p>
<hr>
<h2 id="final-standard" class="toc-header"><a class="toc-anchor" href="#final-standard">¶</a> Final Standard</h2>
<p>A successful Level 1 graduate is <strong>a safe, confident, and enthusiastic participant</strong> who understands the basic flow of Underwater Hockey and is ready to begin developing stronger individual skills and game understanding in Level 2.</p>
