<p>A deep V is a motion that brings the puck from an extended position in front of a player straight back to at least the player’s shoulder in order to maneuver the puck out along a different direction.</p>
<p>During a deep V (free-hand side to stick-hand side):</p>
<ol>
  <li>The head and torso can stay close to the <a href="/game/gear-setup/playing_surfaces" class="is-internal-link is-valid-page">playing surface</a><ol>
      <li>If the body stays low the puck is most often brought to the back (hook side) of the stick using a <a href="/players/individual_fundamentals/puck_handling/tic-tac" class="is-internal-link is-valid-page"><u>tic-tac</u></a> or <a href="/players/individual_fundamentals/puck_handling/front_to_back_roll" class="is-internal-link is-valid-page"><u>front to back roll</u></a> motion. With the puck on the back of the stick, the player propels the puck using a small inside flick, or slider, back towards their stick-hand side ribs, where the player catches the puck on the front of the stick.</li>
      <li>Alternatively, the puck could remain on the front of the stick and the player can use a portion of the <a href="/players/individual_fundamentals/puck_handling/infinity_swerve" class="is-internal-link is-valid-page"><u>infinity swerve</u></a> to maneuver the puck towards their stick-hand ribs.</li>
      <li>The player will then rotate their body towards their stick-hand side and push the puck out on a line from the player’s hip to the puck and re-enter a good <a href="/players/individual_fundamentals/moving_in_the_water/kicking_with_the_puck" class="is-internal-link is-valid-page"><u>kicking with the puck</u></a> body position.</li>
    </ol>
  </li>
  <li>The head and torso can be lifted into a <a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page"><u>cobra position</u></a>.<ol>
      <li>If the body is raised into a cobra position the puck is most often brought to the back (hook side) of the stick using a tic-tac or front to back roll motion. With the puck on the back of the stick, the player propels the puck using a small inside flick, or slider, back towards the player’s belly, where the player catches the puck on the front of the stick.</li>
      <li>Alternatively, the puck could remain on the front of the stick and the player can use a portion of the infinity swerve to maneuver the puck towards their belly.</li>
      <li>The player can choose which way to exit the motion; but for this situation, they will rotate their torso and hips towards their stick-arm, the hips will be the pivot point for the motion. Once facing this new direction the player will push the puck forward and kick while lowering their head and body back down to re-enter a good kicking with the puck body position.</li>
    </ol>
  </li>
</ol>
<p>For either option the player’s free-arm can be used to help rotate the torso and hips (be careful to avoid pushing on any nearby opponent(s) or blocking their access to the puck with the free-arm to avoid a <a href="/game/fouls/free-arm" class="is-internal-link is-valid-page"><u>free-arm</u></a> foul). The hips and knees should be close to, or touching, the playing surface. The legs and fins can be lifted and/or slightly spread to allow for a strong kick to exit the maneuver.&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This move can be used when an opponent is/is getting close enough to challenge possession of the puck, or if the opponent is actively trying to steal the puck. The deep V (free-hand side to stick-hand side) can be used if the opponent is in front of and on the free-hand side of the player with the puck. The area to the player’s stick-arm side, and at both hips, should ideally be clear of opponents. If the player’s torso stays low then there is less concern for an opponent being at their hip on the free-hand side.</p>
<p>When performing a deep V it is important for a player to keep their vision up and look for teammates and opponents before, and during, the maneuver. At the end of their deep V a player should kick out of the move to swim to an open area.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>This maneuver is dynamic and can be used in most situations and locations within the pool. It is more difficult to successfully perform this maneuver if there are opponents near either hip as the puck is not well protected from <a href="/players/tackling_maneuvers/back-picks" class="is-internal-link is-valid-page"><u>back-picks</u></a> during the cobra position. The front area to the free-hand side should also be clear.</p>

</p><h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
  <p><strong><u>DEEP V (FREE-HAND SIDE TO STICK-HAND SIDE)</u></strong></p>
  <ul>
    <li>PULL PUCK BACK AND EITHER KEEP BODY LOW OR COBRA UP, KEEP HIPS AND KNEES DOWN</li>
    <li>PIVOT ABOUT THE HIPS TO FACE THE NEW DIRECTION</li>
    <li>KICK HARD OUT OF THE MOTION INTO FREE SPACE</li>
  </ul>
</div>
