</div><h2 id="safety-summary" class="toc-header"><a class="toc-anchor" href="#safety-summary">¶</a> Safety Summary</h2>
<p>This document is a short safety reference for players, parents, and coaches. It highlights the most important safety topics for participation in underwater hockey.</p><div>

</div><h2 id="ear-equalisation" class="toc-header"><a class="toc-anchor" href="#ear-equalisation">¶</a> Ear Equalisation</h2><div>

</div><p><strong>What it is</strong></p>
<p>The middle ear is an air filled space. As you go underwater, pressure increases and must be equalised.</p><div>

</div><p><strong>What to do</strong></p>
<ul>
<li>Equalise early, gently, and often.</li>
<li>Equalise on the surface before diving.</li>
<li>Equalisation should feel easy.</li>
</ul>
<p></p><div>

</div><p><strong>When not to dive</strong></p>
<ul>
<li>Do not dive if equalisation is uncomfortable.</li>
<li>Do not force equalisation.</li>
</ul>
<p></p><div>

</div><p><strong>Important note</strong></p>
<p>When you are unwell, such as with a cold, flu, or blocked sinuses, equalisation can be harder. If you are unwell, do not dive.</p><div>

</div><p><strong>Signs of a problem</strong></p>
<ul>
<li>Pain.</li>
<li>Pressure or fullness in the ear.</li>
<li>Dizziness or nausea.</li>
</ul>
<p></p><div>

</div><p>If these occur, exit the water and seek medical advice.</p><div>

</div><h2 id="concussion-awareness" class="toc-header"><a class="toc-anchor" href="#concussion-awareness">¶</a> Concussion Awareness</h2>
<p>Head impacts can occur accidentally.</p><div>

</div><p><strong>Possible signs of concussion include:</strong></p>
<ul>
<li>Headache.</li>
<li>Dizziness.</li>
<li>Nausea or vomiting.</li>
<li>Disorientation.</li>
<li>Vision or speech difficulty.</li>
<li>Memory problems.</li>
</ul>
<p></p><div>

</div><p><strong>What to do</strong></p>
<ul>
<li>Exit the water immediately.</li>
<li>Do not return to play that session.</li>
<li>Seek medical assessment.</li>
</ul>
<p></p><div>

</div><h2 id="injury-reporting" class="toc-header"><a class="toc-anchor" href="#injury-reporting">¶</a> Injury Reporting</h2>
<p>All injuries and near misses must be taken seriously.</p><div>

</div><p><strong>If an injury occurs:</strong></p>
<ul>
<li>Stop activity if required.</li>
<li>Exit the water calmly.</li>
<li>Inform a coach immediately.</li>
</ul>
<p></p><div>

</div><p><strong>The following information should be recorded:</strong></p>
<ul>
<li>Date.</li>
<li>What happened.</li>
<li>Who was involved.</li>
<li>Suspected injury.</li>
</ul>
<p></p><div>

</div><p>Reporting injuries helps prevent future incidents.</p><div>

</div><h2 id="key-safety-principle" class="toc-header"><a class="toc-anchor" href="#key-safety-principle">¶</a> Key Safety Principle</h2>
<p><strong>When unsure, stop.</strong></p>
<p>Stopping early prevents more serious injury.</p>
