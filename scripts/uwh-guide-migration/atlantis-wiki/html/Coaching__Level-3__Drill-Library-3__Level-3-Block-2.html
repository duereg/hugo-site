</div><p><b>Progressive Badges Supported (Observed Where Applicable):</b>
<a href="/en/Coaching/Badges/Progressive#puck-control" class="is-internal-link is-valid-page">Puck Control</a>,
<a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a>,
<a href="/en/Coaching/Badges/Progressive#curl-mastery" class="is-internal-link is-valid-page">Curl Mastery</a>
</p><div>

</div><hr><div>

</div><h3 id="pressure-support-mechanics" class="toc-header"><a class="toc-anchor" href="#pressure-support-mechanics">¶</a> Pressure &amp; Support Mechanics</h3><div>

</div><h4 id="l3-drill-psb-mechanics" class="toc-header"><a class="toc-anchor" href="#l3-drill-psb-mechanics">¶</a> 3v2 Pressure Support </h4><div>

</div><ul>
  <li>Three defenders vs two attackers in a defined space.</li>
  <li>Closest defender becomes Pressure.</li>
  <li>Next closest becomes Support and must move at the same time.</li>
  <li>Rotate roles continuously as players move and exit.</li>
</ul><div>

</div><p><b>Coaching Focus:</b></p>
<ul>
  <li>Pressure and Support activate together</li>
  <li>No gaps between players</li>
  <li>Protect middle first</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> None (team defensive behaviour)</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-psb" class="is-internal-link is-invalid-page">Pressure Support </a>
</p><div>

</div><hr><div>

</div><h3 id="support-positioning" class="toc-header"><a class="toc-anchor" href="#support-positioning">¶</a> Support Positioning</h3><div>

</div><h4 id="l3-drill-support-options" class="toc-header"><a class="toc-anchor" href="#l3-drill-support-options">¶</a> Support Positioning Drill</h4><div>

</div><ul>
  <li>Players work in 2v1 or 3v2 situations.</li>
  <li>Support player adjusts position relative to Pressure and puck.</li>
  <li>Move between support behind (for flicks) and support in front (for curls).</li>
  <li>Rotate roles after each repetition.</li>
</ul><div>

</div><p><b>Coaching Focus:</b></p>
<ul>
  <li>Be available when Pressure engages</li>
  <li>Adjust based on attacker movement</li>
  <li>Stay connected</li>
</ul><div>

</div><p><b>Badge Opportunities:</b>
<a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-support" class="is-internal-link is-invalid-page">Support Positioning</a>
</p><div>

</div><hr><div>

</div><h3 id="danger-zone-containment" class="toc-header"><a class="toc-anchor" href="#danger-zone-containment">¶</a> Danger Zone &amp; Containment</h3><div>

</div><h4 id="l3-drill-danger-zone" class="toc-header"><a class="toc-anchor" href="#l3-drill-danger-zone">¶</a> 3v3 Safe Zone Containment</h4><div>

</div><ul>
  <li>3v3 in half court or defined zone.</li>
  <li>Defenders must protect the middle first.</li>
  <li>Steer attackers toward wall and corner.</li>
  <li>Reward successful containment and turnovers in safe zones.</li>
</ul><div>

</div><p><b>Coaching Focus:</b></p>
<ul>
  <li>Protect middle first</li>
  <li>Force wide</li>
  <li>Contain before tackling</li>
</ul><div>

</div><p><b>Badge Opportunities:</b>
<a href="/en/Coaching/Badges/Progressive#curl-mastery" class="is-internal-link is-valid-page">Curl Mastery</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-danger-zone" class="is-internal-link is-invalid-page">Danger Zone Defense</a>
</p><div>

</div><hr><div>

</div><h3 id="back-wall-rotation" class="toc-header"><a class="toc-anchor" href="#back-wall-rotation">¶</a> Back Wall Rotation</h3><div>

</div><h4 id="l3-drill-back-wall-rotation" class="toc-header"><a class="toc-anchor" href="#l3-drill-back-wall-rotation">¶</a> Back Wall Rotation Drill</h4><div>

</div><ul>
  <li>Set up: 4v3 with 4 attackers and 3 defenders.</li>
  <li>Players set up along back wall in defensive shape.</li>
  <li>Rotate pressure along the wall in 2-player or 3-player sequence.</li>
  <li>Maintain tight spacing to prevent attackers splitting through.</li>
  <li>Replace exiting players immediately.</li>
</ul><div>

</div><p><b>Coaching Focus:</b></p>
<ul>
  <li>Small gaps between players</li>
  <li>Continuous rotation</li>
  <li>No overcommitment</li>
</ul><div>

</div><p><b>Rules Focus:</b></p>
<ul>
  <li>No glove advancement of the puck</li>
  <li>Apply 
    <a href="/en/Rules/CMAS#corner-rule" class="is-internal-link is-invalid-page">Corner Rule</a>
  </li>
</ul><div>

</div><p><b>Badge Opportunities:</b> None (team defensive behaviour)</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-back-wall" class="is-internal-link is-invalid-page">Back Wall Rotation</a>
</p><div>

</div><hr><div>

</div><h3 id="conditioned-game" class="toc-header"><a class="toc-anchor" href="#conditioned-game">¶</a> Conditioned Game</h3><div>

</div><h4 id="l3-drill-conditioned-game" class="toc-header"><a class="toc-anchor" href="#l3-drill-conditioned-game">¶</a> 4v4 Conditioned Defense Game</h4><div>

</div><ul>
  <li>4v4 small-sided game.</li>
  <li>Points awarded for forcing play into containment zones.</li>
  <li>Reward teams that maintain pressure-support connection.</li>
  <li>Stop play when structure breaks.</li>
</ul><div>

</div><p><b>Coaching Focus:</b></p>
<ul>
  <li>Closest player goes</li>
  <li>Support moves immediately</li>
  <li>No gaps in structure</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> Observed during play:
<a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a>,
<a href="/en/Coaching/Badges/Progressive#curl-mastery" class="is-internal-link is-valid-page">Curl Mastery</a>
</p><div>

</div><p><b>Video:</b>
<a href="/en/Coaching/Level-3/Video-Library-3#l3-video-defense-game" class="is-internal-link is-invalid-page">Conditioned Defense Game</a>
</p><div>
