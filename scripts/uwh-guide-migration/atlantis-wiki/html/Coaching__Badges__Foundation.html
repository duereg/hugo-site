</div><p>
Foundation badges represent the core competencies required to participate
safely and effectively in underwater hockey.
</p><div>

</div><p>
All players must complete the Foundation badge set before entering the
ranking system. Completion of the full set results in the player achieving
<b>Coral rank</b>.
</p><div>

</div><p>
Foundation badges use a <b>Bronze → Silver → Gold</b> progression.
Bronze represents basic capability, Silver represents controlled execution,
and Gold represents confident performance under normal gameplay conditions.
</p><div>

</div><hr><div>

</div><h2 id="foundation-badge-list" class="toc-header"><a class="toc-anchor" href="#foundation-badge-list">¶</a> Foundation Badge List</h2><div>

</div><ul>
<li>Mask &amp; Snorkel Control</li>
<li>Fin Propulsion Control</li>
<li>Dive Control</li>
<li>Body Position (Cobra)</li>
<li>Puck Control</li>
<li>Passing</li>
<li>Curling</li>
<li>Individual Positioning</li>
<li>Supportive Play</li>
<li>Basic Positions</li>
<li>Basic Formation</li>
</ul><div>

</div><hr>

</div><h2 id="badge-criteria" class="toc-header"><a class="toc-anchor" href="#badge-criteria">¶</a> Badge Criteria</h2><div>

</div><h3 id="mask-snorkel-control" class="toc-header"><a class="toc-anchor" href="#mask-snorkel-control">¶</a> Mask &amp; Snorkel Control</h3><div>

</div><ul>
<li><b>Bronze</b> — 25m surface swim maintaining relaxed breathing without lifting head or removing snorkel.</li>
<li><b>Silver</b> — Demonstrates three clean snorkel clears and equalization during descent without removing snorkel.</li>
<li><b>Gold</b> — Controlled surface-to-bottom transition with equalization and stable breathing on recovery without coach cue.</li>
</ul><div>

</div><hr><div>

</div><h3 id="fin-propulsion-control" class="toc-header"><a class="toc-anchor" href="#fin-propulsion-control">¶</a> Fin Propulsion Control</h3><div>

</div><ul>
<li><b>Bronze</b> — 25m surface swim using straight-leg propulsion without bicycle kick.</li>
<li><b>Silver</b> — 25m swim maintaining consistent body alignment with no knee-dominant propulsion.</li>
<li><b>Gold</b> — Controlled dive followed by 5m bottom travel using efficient flutter or dolphin propulsion.</li>
</ul><div>

</div><hr><div>

</div><h3 id="dive-control" class="toc-header"><a class="toc-anchor" href="#dive-control">¶</a> Dive Control</h3><div>

</div><ul>
<li><b>Bronze</b> — 5 head-first descents and 5 fins-first descents.</li>
<li><b>Silver</b> — 5 controlled descents landing directly below start point with stick arm in front of the body.</li>
<li><b>Gold</b> — 10 controlled descents landing in cobra position ready to play.</li>
</ul><div>

</div><hr><div>

</div><h3 id="body-position-cobra" class="toc-header"><a class="toc-anchor" href="#body-position-cobra">¶</a> Body Position (Cobra)</h3><div>

</div><ul>
<li><b>Bronze</b> — Maintain cobra position for 15 seconds.</li>
<li><b>Silver</b> — Maintain cobra while receiving and passing the puck.</li>
<li><b>Gold</b> — Maintain cobra while swimming with the puck during drills.</li>
</ul><div>

</div><hr><div>

</div><h3 id="puck-control" class="toc-header"><a class="toc-anchor" href="#puck-control">¶</a> Puck Control</h3><div>

</div><ul>
<li><b>Bronze</b> — Move the puck 5m without panic.</li>
<li><b>Silver</b> — Maintain puck control under light pressure.</li>
<li><b>Gold</b> — Maintain puck control while actively challenged and scanning the play.</li>
</ul><div>

</div><hr><div>

</div><h3 id="passing" class="toc-header"><a class="toc-anchor" href="#passing">¶</a> Passing</h3><div>

</div><ul>
<li><b>Bronze</b> — 5 controlled flick or push passes to a teammate.</li>
<li><b>Silver</b> — 5 accurate passes while swimming.</li>
<li><b>Gold</b> — Successful pass under defensive pressure.</li>
</ul><div>

</div><hr><div>

</div><h3 id="curling" class="toc-header"><a class="toc-anchor" href="#curling">¶</a> Curling</h3><div>

</div><ul>
<li><b>Bronze</b> — 5 controlled flat-body curls each direction with a stationary puck.</li>
<li><b>Silver</b> — 8 controlled curls each direction while moving 3m with the puck.</li>
<li><b>Gold</b> — 5 clean curls each direction maintaining puck protection from a passive defender.</li>
</ul><div>

</div><hr><div>

</div><h3 id="individual-positioning" class="toc-header"><a class="toc-anchor" href="#individual-positioning">¶</a> Individual Positioning</h3><div>

</div><ul>
<li><b>Bronze</b> — Demonstrates ability to attack with the puck and defend against it.</li>
<li><b>Silver</b> — Maintains correct defensive-side positioning.</li>
<li><b>Gold</b> — Anticipates transition and recovers defensive shape.</li>
</ul><div>

</div><hr><div>

</div><h3 id="supportive-play" class="toc-header"><a class="toc-anchor" href="#supportive-play">¶</a> Supportive Play</h3><div>

</div><ul>
<li><b>Bronze</b> — Can receive a pass from a teammate.</li>
<li><b>Silver</b> — Remains down and receives a pass from a teammate.</li>
<li><b>Gold</b> — After passing, remains down as a second support option.</li>
</ul><div>

</div><hr><div>

</div><h3 id="basic-positions" class="toc-header"><a class="toc-anchor" href="#basic-positions">¶</a> Basic Positions</h3><div>

</div><ul>
<li><b>Bronze</b> — Understands assigned role and area within the team structure.</li>
</ul><div>

</div><hr><div>

</div><h3 id="basic-formation" class="toc-header"><a class="toc-anchor" href="#basic-formation">¶</a> Basic Formation</h3><div>

</div><ul>
<li><b>Bronze</b> — Plays in the basic formation decided by the coach.</li>
<li><b>Silver</b> — Maintains formation during transition.</li>
<li><b>Gold</b> — Adjusts formation based on puck movement.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-guidance" class="toc-header"><a class="toc-anchor" href="#coach-guidance">¶</a> Coach Guidance</h2><div>

</div><ul>
<li>Foundation badges should be signed off through normal drill observation.</li>
<li>Do not interrupt sessions to run formal tests unless necessary.</li>
<li>Only sign off when performance is consistent and repeatable.</li>
<li>If unsure, reassess in the next session.</li>
</ul><div>

</div><p>
Foundation badges represent the minimum competency required to participate
safely in underwater hockey.
</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
