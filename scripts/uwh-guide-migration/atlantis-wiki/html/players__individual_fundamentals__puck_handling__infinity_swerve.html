<p>The infinity swerve is a maneuver used to redirect the motion of the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> while on the front, or top, of the <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a>. The puck is moved side to side, or diagonally, anywhere from the <a href="/players" class="is-internal-link is-valid-page">player's</a> head to hips by moving the hand around the puck. The motion of the hand resembles a rotated number eight “8” or infinity symbol “∞” thus the name (the maneuver can also be conducted in one continuous motion, without stopping or resetting, swerving around and around, without end, infinitely…).&nbsp;</p>
<p>The puck is allowed to rest against the player's index finger when on the front or top of the stick. However, the player's index finger is not allowed to be extended when contacting the puck, doing so is an <a href="/game/fouls/illegal_advancement" class="is-internal-link is-valid-page">illegal advancement of the puck</a> foul. It is important when conducting portions of the infinity swerve to make sure the stick, and not the glove, is propelling the puck. Using a <a href="/players/individual_fundamentals/puck_handling/fingertip_grip" class="is-internal-link is-valid-page">fingertip grip</a> with the stick moved away from the palm and gripped only by the fingers and thumb can allow for more wrist maneuverability which can help.</p>
<p>Infinity swerves can be done while a player is stationary (<a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">cobra position</a>) or when a player is <a href="/players/individual_fundamentals/moving_in_the_water/kicking_with_the_puck" class="is-internal-link is-valid-page">kicking with the puck</a>.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>The infinity swerve is generally not used in its entirety during a game. Practicing the entier maneuver outside of play is very useful, as it will prepare players to use any portion of the full motion during a game. Segments of the infinity swerve are useful for re-directing the puck and for “faking out” opponents. These movements can be used anywhere, and can aid with other moves. Because the puck maintains contact with the stick throughout the motion it is a dependable maneuver when opponents are nearby.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Over-using this maneuver during a game can result in time being wasted, especially if the full move is used more than once. The maneuver doesn't advance the puck or beat an opponent on its own, so it should be used sparingly during games, or in combination with other moves.&nbsp;</p>
