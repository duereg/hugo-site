</div><h1 id="level-1-learn-to-play-underwater-hockey" class="toc-header"><a class="toc-anchor" href="#level-1-learn-to-play-underwater-hockey">¶</a> Level 1: Learn to Play Underwater Hockey</h1><div>

</div><p><b>Who this is for:</b> New players with little or no Underwater Hockey experience.</p><div>

</div><p><b>Goal of this level:</b> Introduce the game, build confidence in the water, and develop the fundamental skills needed to enjoy playing Underwater Hockey.</p><div>

</div><p><b>Typical delivery:</b> Three introductory coaching blocks completed over the player's first few sessions.</p><div>

</div><p>By the end of Level 1, players should be able to:</p><div>

</div><ul>
<li>Use their equipment confidently and safely</li>
<li>Dive, recover, and move comfortably underwater</li>
<li>Control and protect the puck</li>
<li>Complete simple passes</li>
<li>Understand the basic attacking and defensive principles</li>
<li>Participate confidently in a game of Underwater Hockey</li>
</ul><div>

</div><p><b>Development tracking:</b> Coaches may observe Foundation Badge skills throughout Level 1. These badges help monitor player development without interrupting the learning experience.</p>
<hr><div>

</div><h2 id="before-you-arrive" class="toc-header"><a class="toc-anchor" href="#before-you-arrive">¶</a> Before You Arrive</h2><div>

</div><ul>

<li>
<b><a href="/en/Coaching/Level-1/Before-You-Arrive" class="is-internal-link is-valid-page">Player Questionnaire</a></b><br>
Everything coaches should prepare before a player's first session, including the New Player Questionnaire, welcome information, equipment sizing, and arrival instructions.
</li>

</ul><div>

</div><hr><div>

</div><h2 id="level-1-blocks" class="toc-header"><a class="toc-anchor" href="#level-1-blocks">¶</a> Level 1 Blocks</h2><div>

</div><ul>

<li>
<b><a href="/en/Coaching/Level-1/Block-1" class="is-internal-link is-valid-page">Block 1 – Play Your First Game</a></b><br>
Learn how the game works, become comfortable with your equipment, move underwater confidently, and experience your first game of Underwater Hockey.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-1/Block-2" class="is-internal-link is-valid-page">Block 2 – Control the Puck</a></b><br>
Develop body position, puck control, puck protection, passing, and underwater awareness while building confidence with the puck.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-1/Block-3" class="is-internal-link is-valid-page">Block 3 – Attacking &amp; Defensive Principles</a></b><br>
Learn the basic principles of attacking and defending, supporting teammates, maintaining possession, and protecting the goal during game play.
</li>

</ul><div>

</div><hr><div>

</div><h2 id="coach-resources" class="toc-header"><a class="toc-anchor" href="#coach-resources">¶</a> Coach Resources</h2><div>

</div><ul>

<li>
<b><a href="/en/Coaching/Level-1/Drill-Library" class="is-internal-link is-valid-page">Drill Library</a></b><br>
Drills and activities that support the delivery of all Level 1 coaching blocks.
</li>

<br>

<li>
<b><a href="/en/Coaching/Badges/Foundation" class="is-internal-link is-valid-page">Foundation Badges</a></b><br>
Observable skills that can be assessed throughout Level 1 and continue into Level 2.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-1/Exit-Standards-1" class="is-internal-link is-valid-page">Level 1 Exit Standards</a></b><br>
The minimum knowledge and skills expected before progressing to Level 2.
</li>

</ul><div>

</div><hr><div>

</div><h2 id="level-1-philosophy" class="toc-header"><a class="toc-anchor" href="#level-1-philosophy">¶</a> Level 1 Philosophy</h2><div>

</div><ul>
<li>Get players playing Underwater Hockey as quickly as possible.</li>
<li>Keep coaching simple, practical, and enjoyable.</li>
<li>Build confidence before refining technique.</li>
<li>Encourage learning through playing the game.</li>
<li>Create a safe, welcoming, and positive environment for every player.</li>
</ul><div>

</div><p>
Level 1 is about creating confident new players, not perfect players. By the end of the course, players should understand the basic flow of the game, feel comfortable using their equipment, contribute to their team, and be excited to continue their Underwater Hockey journey.
</p><div>
