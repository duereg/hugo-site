<p>A curl is a maneuver used to change direction and protect the puck from opponents. Players can protect the puck by moving their body and the puck so that their torso and legs are between the puck and the opposing player(s). While protecting the puck in this manner, players are not allowed to actively push into space occupied by an opponent. Doing so would constitute an <a href="/game/fouls/obstruction-barging" class="is-internal-link is-valid-page">obstruction (barging)</a> foul.</p>
<p>To start the maneuver the puck is most often moved to the inside (hook side) of the stick by using a <a href="/players/individual_fundamentals/puck_handling/tic-tac" class="is-internal-link is-valid-page">tic-tac</a> or <a href="/players/individual_fundamentals/puck_handling/front_to_back_roll" class="is-internal-link is-valid-page">front to back roll</a> motion. With the puck on the inside of the stick, the player uses a straight, or slightly bent, arm to move the puck towards the free-arm side (the more the stick-arm is bent the more difficult this maneuver becomes).</p>
<p>Alternatively, the puck could remain on the front of the stick and the player can use a portion of the <a href="/players/individual_fundamentals/puck_handling/infinity_swerve" class="is-internal-link is-valid-page">infinity swerve</a> to maneuver the puck towards their free-arm side. With the puck on the front of the stick, the player uses a more bent arm (the straighter the stick-arm is, the more difficult this maneuver becomes).</p>
<p>As the puck is moved towards the player’s free-hand side, their body rolls onto its side so that their stick-arm is near the <a href="/game/gear-setup/playing_surfaces" class="is-internal-link is-valid-page">playing surface</a> and their other shoulder is turned upwards. The player bends forward at the waist and uses their momentum and/or kicks their fins in a “reverse bicycle pedaling” motion to propel their body thru the curl.</p>
<p>The player’s stick-arm side shoulder, ribs, and hip should be near or touching the playing surface throughout to prevent an opponent from reaching beneath them for the puck. The player’s belly button is the approximate pivot point of the maneuver. The player’s free-arm can be held against their body, or used to assist in the rotating motion (be careful to avoid pushing on any nearby opponent(s) or blocking their access to the puck with the free-arm to avoid a <a href="/game/fouls/free-arm" class="is-internal-link is-valid-page">free-arm</a> foul).</p>
<p>Keep the puck on the stick throughout in order to avoid an <a href="/game/fouls/obstruction-blocking" class="is-internal-link is-valid-page">obstruction (blocking)</a> foul and do not push the puck with the glove or wrist/forearm to avoid an <a href="/game/fouls/illegal_advancement" class="is-internal-link is-valid-page">illegal advancement</a> foul.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>This move should be used when changing direction and protecting the puck from an oncoming opponent are the most urgent tactical considerations.  The standard curl will be most effective against opponents approaching from the front or the stick-hand side.  If the opponent is approaching from the free-arm side, a <a href="/players/evasive_maneuvers/reverse_curl" class="is-internal-link is-valid-page">reverse curl</a> will likely be more effective.  Regardless of the type of curl used, the move should be initiated before the approaching opponent has an opportunity to get their stick on the puck and when the space towards which the puck will be maneuvered is clear of opponents.</p>
<p>When performing a standard curl it is important for a player to keep their head up and look for teammates and opponents before starting, and also during the maneuver. At the end of their curl a player should carefully consider what to do with the puck next. Making a <a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page">pass</a> to a teammate or to a tactically useful location, swimming out of the curl in a useful direction, and simply leaving the puck where it is are all viable options, depending on the situation.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Because all curls are fairly static, generally players should avoid curling when near their own goal, especially if they are directly in front of their own goal within the 3m arc.</p>
<p>Because curls stop forward momentum they should not be used if a player’s team is on an <a href="/teams/teamwork/offensive_push" class="is-internal-link is-valid-page"> offensive push</a> or if a player has just received a pass.</p>
<p>Players should watch out for opponents above, to their free-arm side, and/or behind them before performing a Standard Curl. If an opponent is in those areas there is a chance of being <a href="/players/tackling_maneuvers/back-picks" class="is-internal-link is-valid-page">back-picked</a> when performing a standard curl.</p>

</p><h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<br>
<div class="quickreference green">
  <p><strong><u>STANDARD CURL</u></strong></p>
  <ul>
    <li>STICK-HAND SIDE DOWN</li>
    <li>KEEP BODY CLOSE TO THE BOTTOM</li>
    <li>KEEP EYES UP TO LOOK OUT FOR TEAMMATES AND OPPONENTS</li>
    <li>KICK OUT OF THE MOTION</li>
    <li>GENERALLY CURL IF THERE ARE NO OPPONENT(S) BEHIND YOU OR BESIDE YOU ON YOUR FREE-HAND SIDE</li>
    <li>IN GENERAL, DO NOT CURL NEAR YOUR OWN GOAL, TRY A MOVE THAT IS LESS STATIC.</li>
  </ul>
</div>
