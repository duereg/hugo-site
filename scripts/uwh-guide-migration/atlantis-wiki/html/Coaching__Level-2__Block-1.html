<h2 id="block-goal" class="toc-header"><a class="toc-anchor" href="#block-goal">¶</a> Block Goal</h2>
<p>Develop the movement skills and body position required to consistently arrive on the bottom ready to immediately contribute to play.</p>
<h3 id="key-outcomes" class="toc-header"><a class="toc-anchor" href="#key-outcomes">¶</a> Key Outcomes</h3>
<p>By the end of this block, players should be able to:</p>
<ul>
<li>Arrive on the bottom in a strong playing position.</li>
<li>Select the appropriate dive for different game situations.</li>
<li>Maintain an effective Cobra Position.</li>
<li>Surface and recover efficiently between dives.</li>
<li>Re-enter play quickly while maintaining awareness.</li>
</ul>

<h1 id="activity-1-strong-body-position" class="toc-header"><a class="toc-anchor" href="#activity-1-strong-body-position">¶</a> Activity 1 – Strong Body Position</h1>
<h2 id="objective" class="toc-header"><a class="toc-anchor" href="#objective">¶</a> Objective</h2>
<p>Develop a strong body position that forms the foundation of all other hockey skills.</p>
<h2 id="explain" class="toc-header"><a class="toc-anchor" href="#explain">¶</a> Explain</h2>
<p>Before a player can control the puck, defend effectively, or support teammates, they must first develop efficient <strong><a href="/players/individual_fundamentals/moving_in_the_water" class="is-internal-link is-valid-page">Movement in the Water</a></strong> and consistently arrive on the bottom in a strong, stable position.</p>
<p>Many player errors occur because they:</p>
<ul>
<li>Arrive late to the play.</li>
<li>Reach the bottom in a weak body position.</li>
<li>Choose the wrong diving technique.</li>
<li>Stay underwater longer than necessary.</li>
<li>Move inefficiently.</li>
<li>Lose awareness while moving.</li>
</ul>
<h2 id="what-is-a-strong-position" class="toc-header"><a class="toc-anchor" href="#what-is-a-strong-position">¶</a> What is a Strong Position?</h2>
<p>A strong position is one where:</p>
<ul>
<li>Hips are flat on the bottom.</li>
<li>Chest is lifted.</li>
<li>Eyes are looking forward.</li>
<li>The player is stable and balanced.</li>
<li>The stick is ready to play.</li>
<li>The player can immediately control the puck, defend, support, or make a decision.</li>
</ul>
<h2 id="cobra-position" class="toc-header"><a class="toc-anchor" href="#cobra-position">¶</a> Cobra Position</h2>
<p>The <strong><a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">Cobra Position</a></strong> is the strongest playing position in Underwater Hockey.</p>
<p>Players should demonstrate:</p>
<ul>
<li>Hips flat on the bottom.</li>
<li>Knees bent.</li>
<li>Fins raised.</li>
<li>Chest lifted.</li>
<li>Eyes looking forward.</li>
<li>Free arm sculling for stability.</li>
<li>Stick ready to play.</li>
</ul>
<h3 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h3>
<ul>
<li>Hips low.</li>
<li>Chest up.</li>
<li>Eyes forward.</li>
<li>Stay flat.</li>
<li>Keep sculling.</li>
</ul>
<h3 id="coach-focus" class="toc-header"><a class="toc-anchor" href="#coach-focus">¶</a> Coach Focus</h3>
<p>Players should arrive in the Cobra Position as quickly as possible after every dive. A stable body position improves puck control, vision, and decision-making.</p>
<h1 id="activity-2-diving-techniques" class="toc-header"><a class="toc-anchor" href="#activity-2-diving-techniques">¶</a> Activity 2 – Diving Techniques</h1>
<h2 id="objective-1" class="toc-header"><a class="toc-anchor" href="#objective-1">¶</a> Objective</h2>
<p>Develop the ability to choose and execute the correct dive to arrive in a strong playing position.</p>
<h2 id="diving-while-swimming-duck-dive" class="toc-header"><a class="toc-anchor" href="#diving-while-swimming-duck-dive">¶</a> Diving While Swimming (Duck Dive)</h2>
<h3 id="when-to-use" class="toc-header"><a class="toc-anchor" href="#when-to-use">¶</a> When to Use</h3>
<ul>
<li>Play is moving.</li>
<li>Supporting an attack.</li>
<li>Chasing a moving puck.</li>
</ul>
<h3 id="execution" class="toc-header"><a class="toc-anchor" href="#execution">¶</a> Execution</h3>
<p>Players should:</p>
<ol>
<li>Face down before beginning the dive.</li>
<li>Initiate the dive by bending at the hips.</li>
<li>Dive at an angle toward the bottom.</li>
<li>Use the free arm to accelerate downward.</li>
<li>Lead with the stick arm.</li>
<li>Finish in a Cobra Position.</li>
</ol>
<p>For a detailed explanation of this technique, see <strong><a href="/players/individual_fundamentals/moving_in_the_water/diving_while_swimming" class="is-internal-link is-valid-page">Diving While Swimming (Duck Dive)</a></strong>.</p>
<h3 id="coaching-cues-1" class="toc-header"><a class="toc-anchor" href="#coaching-cues-1">¶</a> Coaching Cues</h3>
<ul>
<li>Dive through the water.</li>
<li>Keep moving forward.</li>
<li>Finish in Cobra.</li>
<li>Arrive ready to play.</li>
</ul>
<h3 id="coach-focus-1" class="toc-header"><a class="toc-anchor" href="#coach-focus-1">¶</a> Coach Focus</h3>
<p>Maintain forward momentum and transition immediately into play.</p>
<h2 id="fins-first-dive-kelp-dive" class="toc-header"><a class="toc-anchor" href="#fins-first-dive-kelp-dive">¶</a> Fins-First Dive (Kelp Dive)</h2>
<h3 id="when-to-use-1" class="toc-header"><a class="toc-anchor" href="#when-to-use-1">¶</a> When to Use</h3>
<ul>
<li>The puck is stationary.</li>
<li>The puck is directly below the player.</li>
<li>Contesting an equal puck.</li>
</ul>
<h3 id="execution-1" class="toc-header"><a class="toc-anchor" href="#execution-1">¶</a> Execution</h3>
<p>Players should:</p>
<ol>
<li>Position their fins as deep as possible.</li>
<li>Keep both arms low by their hips.</li>
<li>Take a full breath to lift the chest.</li>
<li>Drop the knees first.</li>
<li>Use gravity and the free arm to accelerate.</li>
<li>Lead with the stick arm.</li>
<li>Finish in a Cobra Position.</li>
</ol>
<p>For a detailed explanation of this technique, see <strong><a href="/players/individual_fundamentals/moving_in_the_water/fins-first_dive" class="is-internal-link is-valid-page">Fins-First Dive (Kelp Dive)</a></strong>.</p>
<h3 id="coaching-cues-2" class="toc-header"><a class="toc-anchor" href="#coaching-cues-2">¶</a> Coaching Cues</h3>
<ul>
<li>Knees first.</li>
<li>Lead with the stick.</li>
<li>Drop quickly.</li>
<li>Use the free arm.</li>
<li>Finish in Cobra.</li>
</ul>
<h3 id="coach-focus-2" class="toc-header"><a class="toc-anchor" href="#coach-focus-2">¶</a> Coach Focus</h3>
<p>The dive should finish in a strong playing position rather than simply reaching the bottom.</p>
<h1 id="activity-3-surface-recovery" class="toc-header"><a class="toc-anchor" href="#activity-3-surface-recovery">¶</a> Activity 3 – Surface Recovery</h1>
<h2 id="objective-2" class="toc-header"><a class="toc-anchor" href="#objective-2">¶</a> Objective</h2>
<p>Develop efficient recovery habits that maximise time spent contributing to play.</p>
<h2 id="explain-1" class="toc-header"><a class="toc-anchor" href="#explain-1">¶</a> Explain</h2>
<p>Effective players know <strong>when</strong> to surface just as well as they know <strong>how</strong> to dive. Efficient <strong><a href="/players/individual_fundamentals/moving_in_the_water/surface_recovery" class="is-internal-link is-invalid-page">Surface Recovery</a></strong> allows players to maintain awareness, recover effectively, and contribute sooner to the next phase of play.</p>
<p>Players should:</p>
<ul>
<li>Surface before running out of air.</li>
<li>Use shorter underwater efforts.</li>
<li>Surface facing the direction of the next play.</li>
<li>Continue watching the game while recovering.</li>
<li>Clear the snorkel without lifting the head.</li>
<li>Dive again only when physically ready.</li>
<li>Use substitutions when appropriate.</li>
</ul>
<h2 id="when-to-surface" class="toc-header"><a class="toc-anchor" href="#when-to-surface">¶</a> When to Surface</h2>
<p>Look for natural recovery opportunities:</p>
<ul>
<li>The puck moves away from your side.</li>
<li>You become the weak-side player.</li>
<li>After making a successful layoff.</li>
<li>After supporting the next phase of play.</li>
</ul>
<h2 id="preparing-for-the-next-dive" class="toc-header"><a class="toc-anchor" href="#preparing-for-the-next-dive">¶</a> Preparing for the Next Dive</h2>
<p>Players should:</p>
<ul>
<li>Choose a surfacing angle that anticipates where play is moving.</li>
</ul>
<h3 id="key-principle" class="toc-header"><a class="toc-anchor" href="#key-principle">¶</a> Key Principle</h3>
<blockquote>
<p><strong>Surface before becoming ineffective.</strong></p>
<p><strong>Surface facing the direction of play to reduce the distance to the next dive.</strong></p>
</blockquote>
<h3 id="coaching-cues-3" class="toc-header"><a class="toc-anchor" href="#coaching-cues-3">¶</a> Coaching Cues</h3>
<ul>
<li>Surface early.</li>
<li>Recover while watching.</li>
<li>Face the next play.</li>
<li>Stay ready.</li>
</ul>
<h3 id="coach-focus-3" class="toc-header"><a class="toc-anchor" href="#coach-focus-3">¶</a> Coach Focus</h3>
<p>Recovery is part of playing. Efficient players manage their oxygen, maintain awareness, and return to the bottom ready to contribute.</p>
<h1 id="activity-4-drills" class="toc-header"><a class="toc-anchor" href="#activity-4-drills">¶</a> Activity 4 – Drills</h1>
<h2 id="objective-3" class="toc-header"><a class="toc-anchor" href="#objective-3">¶</a> Objective</h2>
<p>Develop strong body position, diving technique, and recovery habits through repetition.</p>
<h3 id="drill-1-diving-while-swimming-duck-dive-into-cobra" class="toc-header"><a class="toc-anchor" href="#drill-1-diving-while-swimming-duck-dive-into-cobra">¶</a> Drill 1 – Diving While Swimming (Duck Dive) into Cobra</h3>
<p>Players complete two lengths using repeated Duck Dives.</p>
<p><strong>Focus</strong></p>
<ul>
<li>Get into a strong position as quickly as possible.</li>
<li>Resurface in the direction of the next dive.</li>
</ul>
<h3 id="drill-2-fins-first-dive-kelp-dive-into-cobra" class="toc-header"><a class="toc-anchor" href="#drill-2-fins-first-dive-kelp-dive-into-cobra">¶</a> Drill 2 – Fins-First Dive (Kelp Dive) into Cobra</h3>
<p>Players complete two lengths using repeated Kelp Dives.</p>
<p><strong>Focus</strong></p>
<ul>
<li>Resurface in the direction of the next dive.</li>
<li>Get as flat as possible in the Cobra Position.</li>
<li>Use the free arm to maintain body position.</li>
</ul>
<h1 id="game" class="toc-header"><a class="toc-anchor" href="#game">¶</a> Game</h1>
<h2 id="objective-4" class="toc-header"><a class="toc-anchor" href="#objective-4">¶</a> Objective</h2>
<p>Apply today's movement skills during game play.</p>
<h3 id="coach-focus-4" class="toc-header"><a class="toc-anchor" href="#coach-focus-4">¶</a> Coach Focus</h3>
<p>Encourage players to:</p>
<ul>
<li>Arrive on the bottom ready to play.</li>
<li>Choose the correct dive for the situation.</li>
<li>Maintain a strong Cobra Position.</li>
<li>Surface before becoming ineffective.</li>
<li>Re-enter play with awareness.</li>
</ul>
<p>Avoid:</p>
<ul>
<li>Over-coaching tactical decisions.</li>
<li>Long stoppages.</li>
<li>Players remaining underwater too long.</li>
</ul>
<p>Allow play to flow while reinforcing efficient movement habits.</p>
<h1 id="wrap-up" class="toc-header"><a class="toc-anchor" href="#wrap-up">¶</a> Wrap-up</h1>
<p>Ask players:</p>
<ul>
<li>Which dive felt more natural?</li>
<li>When did arriving in Cobra help you?</li>
<li>What helped you recover more efficiently?</li>
<li>How did surfacing early improve your next dive?</li>
</ul>
<p>Finish with:</p>
<blockquote>
<p>Every play starts with how you arrive. Strong players consistently reach the bottom ready to contribute, recover efficiently, and prepare for the next phase of play.</p>
</blockquote>
<h1 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h1>
<p>Players can:</p>
<ul>
<li>Consistently achieve a strong Cobra Position.</li>
<li>Comfortably use both the Diving While Swimming (Duck Dive) and Fins-First Dive (Kelp Dive).</li>
<li>Surface and recover efficiently.</li>
<li>Resurface facing the direction of the next phase of play.</li>
<li>Arrive ready to immediately contribute to the game.</li>
</ul>
