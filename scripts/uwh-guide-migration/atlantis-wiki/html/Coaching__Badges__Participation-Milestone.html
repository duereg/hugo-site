</div><p>
Participation and milestone badges recognize long-term involvement,
commitment, and contribution to the sport.
</p><div>

</div><p>
These badges do not influence player rank. They exist to acknowledge
consistency, development, and engagement over time.
</p><div>

</div><hr><div>

</div><h2 id="badge-list" class="toc-header"><a class="toc-anchor" href="#badge-list">¶</a> Badge List</h2><div>

</div><ul>
<li>Consistent Player</li>
<li>Practice Commitment</li>
<li>Tournament Milestones</li>
</ul><div>

</div><hr><div>

</div><h2 id="badge-opportunities" class="toc-header"><a class="toc-anchor" href="#badge-opportunities">¶</a> Badge Opportunities</h2><div>

</div><div class="table-container"><table>
  <thead>
    <tr>
      <th>Coaching Level</th>
      <th>Suggested Participation &amp; Milestone Badges</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Level 1 – Foundation</td>
      <td>Consistent Player</td>
    </tr>
    <tr>
      <td>Level 2 – Game Function</td>
      <td>Consistent Player, Practice Commitment</td>
    </tr>
    <tr>
      <td>Level 3 – Structured Play</td>
      <td>Practice Commitment, Tournament Milestones</td>
    </tr>
    <tr>
      <td>Level 4 – Competitive</td>
      <td>Practice Commitment, Tournament Milestones</td>
    </tr>
  </tbody>
</table></div><div>

</div><hr><div>

</div><h2 id="badge-criteria" class="toc-header"><a class="toc-anchor" href="#badge-criteria">¶</a> Badge Criteria</h2><div>

</div><h3 id="consistent-player" class="toc-header"><a class="toc-anchor" href="#consistent-player">¶</a> Consistent Player</h3><div>

</div><ul>
<li><b>Bronze</b> — 75% attendance over 3 months.</li>
<li><b>Silver</b> — 75% attendance over 6 months.</li>
<li><b>Gold</b> — 75% attendance over 12 months.</li>
</ul><div>

</div><hr><div>

</div><h3 id="practice-commitment" class="toc-header"><a class="toc-anchor" href="#practice-commitment">¶</a> Practice Commitment</h3><div>

</div><ul>
<li><b>Bronze</b> — Active membership for 1 year.</li>
<li><b>Silver</b> — Active membership for 3 years.</li>
<li><b>Gold</b> — Active membership for 5 years.</li>
</ul><div>

</div><hr><div>

</div><h3 id="tournament-milestones" class="toc-header"><a class="toc-anchor" href="#tournament-milestones">¶</a> Tournament Milestones</h3><div>

</div><ul>
<li><b>Level 1</b> — First tournament completed.</li>
<li><b>Level 2</b> — Multiple tournaments completed.</li>
<li><b>Level 3</b> — Consistent tournament participation across a season.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-guidance" class="toc-header"><a class="toc-anchor" href="#coach-guidance">¶</a> Coach Guidance</h2><div>

</div><ul>
<li>Participation badges should be tracked over time.</li>
<li>Use simple attendance or participation records.</li>
<li>Award badges as soon as criteria is met.</li>
<li>These badges support retention and long-term engagement.</li>
</ul><div>

</div><p>
Participation and milestone badges recognize commitment and consistency,
which are essential for long-term player development.
</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
