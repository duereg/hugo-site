<h1 id="formation-overview" class="toc-header"><a class="toc-anchor" href="#formation-overview">¶</a> Formation Overview</h1>
<p>The <strong>3–3</strong> is a wide wall-pressure formation built around structured cycling, layered support, and rapid side switching.</p>
<p><strong>Formation Name:</strong> 3–3<br>
<strong>Player Layout:</strong> 3 Forwards / 3 Backs<br>
<strong>Play Style:</strong> Wide Wall Pressure / Structured Cycling</p>
<p>The formation is designed to:</p>
<ul>
<li>Draw defenders onto the wall</li>
<li>Open the game to the opposite side</li>
<li>Maintain continuous support behind the puck</li>
<li>Create wide attacking opportunities</li>
<li>Pressure through layered cycling</li>
</ul>
<p>The structure places high swimming demands on the backs and wings but creates strong scoring opportunities through constant movement and support.</p>

<h1 id="main-strengths" class="toc-header"><a class="toc-anchor" href="#main-strengths">¶</a> Main Strengths</h1>
<ul>
<li>Strong wall control</li>
<li>Quick side switching</li>
<li>Wide attacking structure</li>
<li>Good scoring opportunities for backs and wings on open side</li>
</ul>
<h1 id="main-weaknesses" class="toc-header"><a class="toc-anchor" href="#main-weaknesses">¶</a> Main Weaknesses</h1>
<ul>
<li>Only two lines of defense</li>
<li>Physically demanding structure</li>
<li>High swimming workload</li>
</ul>
<h1 id="core-principles" class="toc-header"><a class="toc-anchor" href="#core-principles">¶</a> Core Principles</h1>
<ul>
<li>Pull defenders onto the wall</li>
<li>Once defense is sucked onto wall play open space</li>
</ul>
<h1 id="passing-style" class="toc-header"><a class="toc-anchor" href="#passing-style">¶</a> Passing Style</h1>
<p>Passing in the 3-3 is built around possession retention, wall progression, and side switching.</p>
<p>Players should:</p>
<ul>
<li>Drive the puck up the wall before looking to switch play</li>
<li>Draw defenders onto one side before attacking the other</li>
<li>Use swing passes to stretch the opposition structure</li>
<li>Create space through swimming before passing</li>
<li>Attack open space after a successful switch</li>
</ul>
<p>The formation relies heavily on wall drives, support passes, and long swing passes to move defenders and create attacking opportunities.</p>
<h1 id="position-responsibilities" class="toc-header"><a class="toc-anchor" href="#position-responsibilities">¶</a> Position Responsibilities</h1>
<h1 id="forwards" class="toc-header"><a class="toc-anchor" href="#forwards">¶</a> Forwards</h1>
<p>The forwards provide width, support, and layered pressure ahead of the backs.</p>
<ul>
<li>Strong drives on the wall</li>
<li>Maintain width without disconnecting</li>
<li>Strong swims to the open side</li>
</ul>
<h2 id="strong-forward" class="toc-header"><a class="toc-anchor" href="#strong-forward">¶</a> Strong Forward</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Provide a wide wall option</li>
<li>Create outside passing lanes</li>
<li>Create cross-pool opportunities</li>
<li>Act as the primary wide attacking option</li>
<li>Support wall progression</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Back-pick opposition players</li>
<li>Pressure from the opposite side of the backs</li>
<li>Prevent easy exits from the wall</li>
<li>Support current defensive engagements</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Back-pick opposition players</li>
<li>Pressure from the opposite side of the backs</li>
<li>Prevent easy exits from the wall</li>
<li>Support current defensive engagements</li>
</ul>
</details>
<h2 id="center-forward" class="toc-header"><a class="toc-anchor" href="#center-forward">¶</a> Center Forward</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Fill missing forward positions</li>
<li>Support flexibly around the puck</li>
<li>Connect wall play to center support</li>
<li>Stay ahead during attacks</li>
</ul>
</details>
<details><summary>Positioning</summary>
<ul>
<li>Move into whichever forward position is vacant</li>
<li>Stay ahead of the puck when attacking</li>
<li>Support beside or slightly behind the puck carrier when required</li>
<li>Remain connected to both forwards</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Side-pick defensively</li>
<li>Prevent center passes</li>
<li>Drive opponents toward the wall</li>
<li>Support defensive recovery</li>
</ul>
</details>
<h2 id="weak-forward" class="toc-header"><a class="toc-anchor" href="#weak-forward">¶</a> Weak Forward</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Support and seal the weak side</li>
<li>Fill missing forward positions</li>
<li>When puck received attack open space</li>
<li>Act as last-player-back when required</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Stay connected to weak-side support</li>
<li>Protect recovery space during switches</li>
<li>Avoid attacking the same side as the backs</li>
<li>Remain available for cross-pool switches</li>
</ul>
</details><details>
<summary>Defense</summary>
<ul>
<li>Seal weak-side exits</li>
<li>Back-pick recovering players</li>
<li>Protect space near goal</li>
<li>Recover behind the structure when needed</li>
</ul>
</details>
<h1 id="backs" class="toc-header"><a class="toc-anchor" href="#backs">¶</a> Backs</h1>
<p>The backs maintain defensive structure and provide continuous cycling support behind the puck.</p>
<h2 id="strong-swing-back" class="toc-header"><a class="toc-anchor" href="#strong-swing-back">¶</a> Strong + Swing Back</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Strong wall drives</li>
<li>look for opportunities to break off the wall</li>
<li>Open switches across the pool</li>
<li>Re-engage after recover</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Stay tight behind forward support</li>
<li>One back engages while the other recovers</li>
<li>Stay between puck and goal</li>
<li>Maintain the cycling structure</li>
<li>Line up on the wall on attack</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Initiate defensive pressure</li>
<li>Prevent direct middle breakouts</li>
<li>Maintain defensive depth during rotations</li>
<li>Recover quickly after engagements</li>
</ul>
</details>
<h2 id="weak-back" class="toc-header"><a class="toc-anchor" href="#weak-back">¶</a> Weak Back</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Cover and contain</li>
<li>Protect middle space</li>
<li>Receive swing passes</li>
<li>Support cycle breakdowns</li>
<li>Provide emergency defensive cover</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Cover and contain</li>
<li>Protect middle space</li>
<li>Receive swing passes</li>
<li>Support cycle breakdowns</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Cycle the puck toward a wall for safe space</li>
<li>Cover defensive space behind pressure</li>
<li>Delay opposition attacks until support arrives</li>
</ul>
</details>
<h1 id="possession-principles" class="toc-header"><a class="toc-anchor" href="#possession-principles">¶</a> Possession Principles</h1>
<p>The 3-3 prioritizes controlling the wall and forcing the opposition to play in predictable areas.</p>
<p>Players should:</p>
<ul>
<li>Maintain possession on the wall</li>
<li>Drive the puck up the wall before switching play</li>
<li>Only leave the wall when in control of possession</li>
<li>Swing to the open side when pressure builds</li>
</ul>
<p>When possession is lost:</p>
<ul>
<li>Push the puck back toward the wall</li>
<li>Prevent the opposition from accessing open-water space</li>
<li>Deny swings to the open side</li>
</ul>
<h1 id="common-structural-failures" class="toc-header"><a class="toc-anchor" href="#common-structural-failures">¶</a> Common Structural Failures</h1>
<p>The structure commonly breaks down when:</p>
<ul>
<li>Play gets stuck on the wall</li>
<li>Open side players never get involved</li>
<li>Not enough depth in the defensive line if opposition starts swimming angles</li>
</ul>
