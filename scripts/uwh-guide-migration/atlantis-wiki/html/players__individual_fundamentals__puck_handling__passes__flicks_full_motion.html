<p>Flicking the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> is a valuable skill that allows players to pass the puck past opponents more reliably and further.&nbsp;</p>
<p>Body position:</p>
<p>The first step when flicking the puck is to set up in a good body position with the hips low and shoulders raised up slightly in the <a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">cobra position</a>. If a player's hips float up off the bottom, they will not have the range of motion in their arm to properly perform the flick motion.&nbsp;</p>
<p>Once the player has their hips down and their shoulders slightly raised, they should draw back their stick hand with the puck to just in front of their shoulder. As they do that, they should draw their knee on the same side up towards their elbow. When they extend their arm for the flick, they will extend that leg while bringing their other knee up towards the elbow on that side. This full body explosive movement gives maximal power to the flick. For flicks to the side, this full body motion is difficult to use, so these flicks will in general be smaller than straight forward flicks.&nbsp;</p>
<p>The arm:</p>
<p>A lot of power comes from the arm as well as the body when flicking. The puck should start a few inches in front of the playing hand shoulder. Players may lift their elbow when in this position, which can make passes bigger, but will make the release time slower. Leaving the elbow low will allow for a faster release. When players flick the puck, they should explosively extend their arm as if they are punching something. If their elbow was raised, it should drop as they extend their arm.&nbsp;</p>
<p>If players are flicking the puck to the side, they should be aware that the puck will travel straight outward from the shoulder. This means that if a player wishes to flick the puck sideways, they should move their arm at the shoulder to the side until a line drawn from the shoulder to the puck points in the direction they wish to pass the puck.&nbsp;</p>
<p>The wrist:</p>
<p>When the player begins to extend their arm, the puck will lift slightly off the bottom of the pool. The player can then snap the stick forward while rotating their wrist to lift the puck further off the bottom. The wrist rotation brings the stick from pointing straight sideways at the beginning of the motion to pointing up and forward in the direction the puck is traveling. This rotation should lift the puck further up off the bottom, making the puck go higher. The arm extension, wrist snap and wrist rotation all occur as one motion so that the arm reaches full extension and the wrist completes the twist and forward snap of the stick at the same time. &nbsp;</p>
<p>&nbsp;</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>Flicks are used anytime to get the puck to a teammate or into the goal. Often players will flick the puck past an opponent as a way to get past them. While knocking down flicks is not uncommon, it is much harder than blocking <a href="/players/individual_fundamentals/puck_handling/passes/sliders" class="is-internal-link is-valid-page">sliders</a>.&nbsp;</p>
<p>Flicks can also be used in a “flick and chase” which consists of the player flicking the puck past an opponent and chasing the puck. Since the opponent has to turn to get the puck, they will often be slower getting to the puck than the player that shot it.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>It is extremely important that players consider the risk of the puck hitting another player whenever they flick the puck. Not only is it an <a href="/game/fouls/unsportsmanlike_conduct" class="is-internal-link is-valid-page">unsportsmanlike conduct</a> foul to flick the puck into the other player, it can be dangerous and painful.&nbsp;</p>
<p>Hitting another player with the puck often occurs because a player's flick is inconsistent and unpredictable. The best way to avoid this is to practice flicking outside of the game until it becomes reliable.&nbsp;</p>

<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
  <p><strong><u>SKILL NAME</u></strong></p>
  <ul>
    <li>BODY POSITION:<ul>
      <li>HOLD A COBRA POSITION, SHOULDER WILL DROP WHILE FLICKING</li>
      </ul>
    </li>
    <li>ARM MOVEMENT:<ul>
      <li>BRING THE PUCK BACK TO JUST BELOW THE SHOULDER, AND EXTEND THE ARM FULLY AND QUICKLY.</li>
      </ul>
    </li>
    <li>WRIST:<ul>
      <li>TWIST THE WRIST FROM STANDARD POSITION TO HAVING THE STICK POINT UPWARDS</li>
      <li>AT THE SAME TIME, EXTEND THE STICK FORWARD TO FLICK THE PUCK FORWARD.</li>
      </ul>
  </li></ul>
