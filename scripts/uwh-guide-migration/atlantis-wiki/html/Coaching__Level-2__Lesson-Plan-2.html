sson-plan" class="toc-header"><a class="toc-anchor" href="#level-2-lesson-plan">¶</a> Level 2 – Lesson Plan</h1><div>

</div><p>
Level 2 builds on the skills introduced in Level 1 by developing the technical skills, core principles, and decision-making required to play Underwater Hockey effectively.
</p><div>

</div><p>
Players entering Level 2 should already:
</p><div>

</div><ul>
<li>Understand the basic objective of the game.</li>
<li>Use their equipment confidently.</li>
<li>Participate safely in hockey activities.</li>
</ul><div>

</div><p>
The purpose of Level 2 is to develop strong individual habits that form the foundation for future technical, tactical, and competitive development.
</p><div>

</div><hr><div>

</div><h2 id="learning-journey" class="toc-header"><a class="toc-anchor" href="#learning-journey">¶</a> Learning Journey</h2><div>

</div><p>
Each block builds on the previous one, progressing from individual movement skills to understanding the game as a whole.
</p><div>

</div><pre v-pre="true">Strong Position &amp; Movement
          ↓
      Puck Control
          ↓
    Attack &amp; Defence
          ↓
Support &amp; Decision Making
          ↓
    Game Understanding
</pre><div>

</div><hr><div>

</div><h2 id="level-2-blocks" class="toc-header"><a class="toc-anchor" href="#level-2-blocks">¶</a> Level 2 Blocks</h2><div>

</div><ul>

<li>
<b><a href="/en/Coaching/Level-2/Lesson-Plan-2/Level-2-Block-1" class="is-internal-link is-valid-page">Block 1 - Strong Position &amp; Movement</a></b><br>
Develop efficient movement, diving techniques, recovery habits, and the Cobra Position to consistently arrive ready to play.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-2/Lesson-Plan-2/Level-2-Block-2" class="is-internal-link is-valid-page">Block 2 - Puck Control</a></b><br>
Develop stick grips, puck control, passing, receiving, and puck protection while making better decisions under pressure.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-2/Lesson-Plan-2/Level-2-Block-3" class="is-internal-link is-valid-page">Block 3 - Attack &amp; Defence</a></b><br>
Introduce the principles of attacking and defending through possession, positioning, support, and 1 vs 1 play.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-2/Lesson-Plan-2/Level-2-Block-4" class="is-internal-link is-valid-page">Block 4 - Team Support &amp; Decision Making</a></b><br>
Develop support play, communication, timing, and decision-making to improve teamwork and maintain possession.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-2/Lesson-Plan-2/Level-2-Block-5" class="is-internal-link is-valid-page">Block 5 - Game Understanding</a></b><br>
Combine the skills developed throughout Level 2 into structured game play while introducing tactical awareness and game management.
</li>

</ul><div>

</div><hr><div>

</div><h2 id="coaching-philosophy" class="toc-header"><a class="toc-anchor" href="#coaching-philosophy">¶</a> Coaching Philosophy</h2><div>

</div><ul>
<li>Develop strong habits before advanced tactics.</li>
<li>Teach players why skills are used, not only how to perform them.</li>
<li>Encourage players to make decisions rather than simply react.</li>
<li>Build confidence through repetition and game play.</li>
<li>Allow each block to build naturally on the previous one.</li>
</ul><div>

</div><p>
Level 2 is designed to produce players who are technically sound, tactically aware, and confident contributing to their team. Every activity should reinforce the habits and principles that prepare players for the more advanced concepts introduced in Level 3.
</p></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
