<p><a href="../MuffinTop" class="is-asset-link">← Return to Muffin Top</a></p>
<h2 id="overview" class="toc-header"><a class="toc-anchor" href="#overview">¶</a> Overview</h2>
<p>The Backs hold the center of the formation and support both the Forwards and Wings.</p>
<p>Their primary role is to:</p>
<ul>
<li>Maintain structure</li>
<li>Support offensive progression</li>
<li>Direct attacks through the middle</li>
<li>Control possession and resets</li>
</ul>
<p>The Backs have the most freedom within the formation to:</p>
<ul>
<li>Swim with the puck</li>
<li>Reposition dynamically</li>
<li>Redistribute possession safely</li>
</ul>
<hr>
<h1 id="positioning-and-movement" class="toc-header"><a class="toc-anchor" href="#positioning-and-movement">¶</a> Positioning and Movement</h1>
<p>The displayed Back position represents their real-time location.</p>
<p>If a Back moves from position “A” to “B”:</p>
<ul>
<li>Their movement and passing responsibilities remain the same throughout the swim</li>
</ul>
<p>This allows:</p>
<ul>
<li>Flexible decision making</li>
<li>Dynamic positioning</li>
<li>Predictable support for teammates</li>
</ul>
<p><img src="/underwater_hockey_breakout_diagram.jpg" alt="underwater_hockey_breakout_diagram.jpg"></p>
<hr>
<h1 id="offensive-cycling" class="toc-header"><a class="toc-anchor" href="#offensive-cycling">¶</a> Offensive Cycling</h1>
<p>Backs should generally keep swimming while in possession.</p>
<p>However:</p>
<ul>
<li>They are NOT intended to be the primary offensive attackers</li>
<li>Their role is to support progression and maintain structure</li>
</ul>
<h3 id="if-space-is-available" class="toc-header"><a class="toc-anchor" href="#if-space-is-available">¶</a> If space is available:</h3>
<ul>
<li>Swim forward</li>
<li>Improve passing angles</li>
<li>Pass around defenders to a Wing or Forward</li>
</ul>
<hr>
<h1 id="zig-zag-cycling" class="toc-header"><a class="toc-anchor" href="#zig-zag-cycling">¶</a> Zig-Zag Cycling</h1>
<p>When strong resistance develops in front of the play, the Back with the puck (“Back 1”) should avoid forcing forward progression.</p>
<p>Instead, Back 1 should:</p>
<ul>
<li>Move laterally or sideways</li>
<li>Draw defenders toward one side of the pool</li>
<li>Either:
<ul>
<li>Pass to a Wing, or</li>
<li>Recycle possession to the other Back (“Back 2”)</li>
</ul>
</li>
</ul>
<hr>
<h3 id="back-2-responsibilities" class="toc-header"><a class="toc-anchor" href="#back-2-responsibilities">¶</a> Back 2 Responsibilities</h3>
<p>Back 2 should:</p>
<ul>
<li>Stay slightly behind the play</li>
<li>Remain closer to the centerline</li>
<li>Swim into open space at an angle after receiving the puck</li>
<li>Create separation from defenders covering Back 1</li>
</ul>
<p>If support from the Wing or Forward on that side is unavailable:</p>
<ul>
<li>Cut back toward or across the centerline</li>
<li>Draw defenders again</li>
<li>Recycle possession back to Back 1</li>
</ul>
<hr>
<h3 id="purpose-of-the-zig-zag-cycle" class="toc-header"><a class="toc-anchor" href="#purpose-of-the-zig-zag-cycle">¶</a> Purpose of the Zig-Zag Cycle</h3>
<p>The Zig-Zag pattern is designed to:</p>
<ul>
<li>Shift defensive pressure laterally</li>
<li>Keep the opposing team off balance</li>
<li>Create open passing lanes</li>
<li>Generate attacking opportunities for Wings and Forwards</li>
</ul>
<p>Once space opens or pressure decreases:</p>
<ul>
<li>The attack can progress forward</li>
<li>Possession may later recycle back to the Backs</li>
<li>The Zig-Zag cycle can restart if needed<br>
<img src="/zingzag_.png" alt="zingzag_.png"></li>
</ul>
<hr>
<h1 id="things-to-avoid-as-a-back" class="toc-header"><a class="toc-anchor" href="#things-to-avoid-as-a-back">¶</a> Things to Avoid as a Back</h1>
<h3 id="avoid-getting-trapped-with-the-puck" class="toc-header"><a class="toc-anchor" href="#avoid-getting-trapped-with-the-puck">¶</a> Avoid Getting Trapped with the Puck</h3>
<ul>
<li>Keep moving</li>
<li>Recycle possession early</li>
<li>Avoid holding possession too long under pressure</li>
</ul>
<hr>
<h3 id="avoid-double-diving" class="toc-header"><a class="toc-anchor" href="#avoid-double-diving">¶</a> Avoid Double-Diving</h3>
<p>Both Backs should NOT:</p>
<ul>
<li>Be underwater simultaneously</li>
<li>Leave the center unsupported</li>
</ul>
<p>Maintaining staggered support is critical.</p>
<hr>
<h3 id="avoid-surfacing-together" class="toc-header"><a class="toc-anchor" href="#avoid-surfacing-together">¶</a> Avoid Surfacing Together</h3>
<p>If both Backs surface simultaneously:</p>
<ul>
<li>Central support disappears</li>
<li>Passing lanes collapse</li>
<li>Counterattacks become more dangerous</li>
</ul>
<hr>
<h3 id="avoid-forcing-risky-forward-passes" class="toc-header"><a class="toc-anchor" href="#avoid-forcing-risky-forward-passes">¶</a> Avoid Forcing Risky Forward Passes</h3>
<p>Avoid:</p>
<ul>
<li>Passing into heavy coverage</li>
<li>Forcing progression under pressure</li>
<li>Attempting low-percentage plays</li>
</ul>
<p>Prefer:</p>
<ul>
<li>Safe resets</li>
<li>Lateral movement</li>
<li>Recycling possession</li>
</ul>
