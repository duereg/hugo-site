<h2 id="block-goal" class="toc-header"><a class="toc-anchor" href="#block-goal">¶</a> Block Goal</h2>
<p>Develop the puck control skills required to maintain possession, move the puck efficiently, and make effective decisions under pressure.</p>
<h3 id="key-outcomes" class="toc-header"><a class="toc-anchor" href="#key-outcomes">¶</a> Key Outcomes</h3>
<p>By the end of this block, players should be able to:</p>
<ul>
<li>Select the appropriate stick grip.</li>
<li>Swim confidently with the puck.</li>
<li>Pass accurately using multiple passing techniques.</li>
<li>Receive the puck under control.</li>
<li>Protect possession under pressure.</li>
</ul>

<h1 id="activity-1-stick-grips-swimming-with-the-puck" class="toc-header"><a class="toc-anchor" href="#activity-1-stick-grips-swimming-with-the-puck">¶</a> Activity 1 – Stick Grips &amp; Swimming with the Puck</h1>
<h2 id="objective" class="toc-header"><a class="toc-anchor" href="#objective">¶</a> Objective</h2>
<p>Develop effective puck control while swimming by selecting the appropriate grip and maintaining awareness.</p>
<h2 id="explain" class="toc-header"><a class="toc-anchor" href="#explain">¶</a> Explain</h2>
<p>Strong puck-handling skills are essential for maintaining possession and form the foundation for more advanced stick skills. Selecting the correct grip allows players to move the puck efficiently while maintaining awareness of teammates, opponents, and available space.</p>
<h2 id="types-of-stick-grips" class="toc-header"><a class="toc-anchor" href="#types-of-stick-grips">¶</a> Types of Stick Grips</h2>
<h3 id="standard-grip" class="toc-header"><a class="toc-anchor" href="#standard-grip">¶</a> <a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page">Standard Grip</a></h3>
<h4 id="when-to-use" class="toc-header"><a class="toc-anchor" href="#when-to-use">¶</a> When to Use</h4>
<ul>
<li>Pushing the puck.</li>
<li>Passing.</li>
<li>Defending.</li>
</ul>
<p>The strongest and most commonly used grip.</p>
<h3 id="monkey-grip" class="toc-header"><a class="toc-anchor" href="#monkey-grip">¶</a> <a href="/players/individual_fundamentals/puck_handling/monkey_grip" class="is-internal-link is-valid-page">Monkey Grip</a></h3>
<h4 id="when-to-use-1" class="toc-header"><a class="toc-anchor" href="#when-to-use-1">¶</a> When to Use</h4>
<ul>
<li>Situations requiring a stronger hook.</li>
</ul>
<p>The thumb rests alongside the index finger, rocking the stick back to create a more pronounced hook.</p>
<h3 id="fingertip-grip" class="toc-header"><a class="toc-anchor" href="#fingertip-grip">¶</a> <a href="/players/individual_fundamentals/puck_handling/fingertip_grip" class="is-internal-link is-valid-page">Fingertip Grip</a></h3>
<h4 id="when-to-use-2" class="toc-header"><a class="toc-anchor" href="#when-to-use-2">¶</a> When to Use</h4>
<ul>
<li>Situations requiring increased wrist flexibility.</li>
</ul>
<p>The stick is held away from the palm using only the fingers and thumb, providing a greater range of motion.</p>
<h2 id="swimming-with-the-puck" class="toc-header"><a class="toc-anchor" href="#swimming-with-the-puck">¶</a> Swimming with the Puck</h2>
<p>Use the <strong>Standard Grip</strong> while swimming with the puck.</p>
<p>Players should:</p>
<ul>
<li>Rest the puck near the index finger.</li>
<li>Avoid using the glove to control the puck.</li>
<li>Keep the head up.</li>
<li>Use peripheral vision to monitor the puck.</li>
<li>Experiment with freestyle and dolphin kick.</li>
<li>Use a string or elastic if required to prevent the stick from slipping.</li>
</ul>
<h3 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h3>
<ul>
<li>Head up.</li>
<li>Eyes forward.</li>
<li>Keep kicking.</li>
<li>Maintain stick contact.</li>
</ul>
<h3 id="coach-focus" class="toc-header"><a class="toc-anchor" href="#coach-focus">¶</a> Coach Focus</h3>
<p>Players should control the puck without constantly looking at it.</p>
<h1 id="activity-2-passing" class="toc-header"><a class="toc-anchor" href="#activity-2-passing">¶</a> Activity 2 – Passing</h1>
<h2 id="objective-1" class="toc-header"><a class="toc-anchor" href="#objective-1">¶</a> Objective</h2>
<p>Develop accurate passing using the correct technique for different game situations.</p>
<h2 id="slide-pass" class="toc-header"><a class="toc-anchor" href="#slide-pass">¶</a> Slide Pass</h2>
<p>For a detailed explanation see <strong><a href="/players/individual_fundamentals/puck_handling/passes/sliders" class="is-internal-link is-valid-page">Slide Pass (Sliders)</a></strong>.</p>
<h3 id="when-to-use-3" class="toc-header"><a class="toc-anchor" href="#when-to-use-3">¶</a> When to Use</h3>
<ul>
<li>Short passes.</li>
<li>Quick connections.</li>
</ul>
<h3 id="coaching-cue" class="toc-header"><a class="toc-anchor" href="#coaching-cue">¶</a> Coaching Cue</h3>
<p>Keep the pass flat and accurate.</p>
<h3 id="risk" class="toc-header"><a class="toc-anchor" href="#risk">¶</a> Risk</h3>
<p>Long passes are easily intercepted.</p>
<h2 id="front-flick" class="toc-header"><a class="toc-anchor" href="#front-flick">¶</a> Front Flick</h2>
<p>For a detailed explanation see <strong><a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">Full Motion Flick (Front Flick)</a></strong>.</p>
<h3 id="when-to-use-4" class="toc-header"><a class="toc-anchor" href="#when-to-use-4">¶</a> When to Use</h3>
<ul>
<li>Longer passes.</li>
<li>Passing over sticks.</li>
<li>Into open space.</li>
</ul>
<h3 id="coaching-cue-1" class="toc-header"><a class="toc-anchor" href="#coaching-cue-1">¶</a> Coaching Cue</h3>
<p>Follow through and be ready for the next touch.</p>
<h3 id="risk-1" class="toc-header"><a class="toc-anchor" href="#risk-1">¶</a> Risk</h3>
<p>High or inaccurate flicks delay possession.</p>
<h2 id="back-flick" class="toc-header"><a class="toc-anchor" href="#back-flick">¶</a> Back Flick</h2>
<p>For a detailed explanation see <strong><a href="/players/individual_fundamentals/puck_handling/passes/inside_flicks" class="is-internal-link is-valid-page">Inside Flick (Back Flick)</a></strong>.</p>
<h3 id="when-to-use-5" class="toc-header"><a class="toc-anchor" href="#when-to-use-5">¶</a> When to Use</h3>
<ul>
<li>Pinned situations.</li>
<li>Unable to reposition.</li>
</ul>
<h3 id="coaching-cue-2" class="toc-header"><a class="toc-anchor" href="#coaching-cue-2">¶</a> Coaching Cue</h3>
<p>Develop wrist strength.</p>
<h3 id="risk-2" class="toc-header"><a class="toc-anchor" href="#risk-2">¶</a> Risk</h3>
<p>Mechanically challenging.</p>
<h3 id="coach-focus-1" class="toc-header"><a class="toc-anchor" href="#coach-focus-1">¶</a> Coach Focus</h3>
<p>Players should learn to select the appropriate pass rather than relying on one technique.</p>
<h1 id="activity-3-receiving" class="toc-header"><a class="toc-anchor" href="#activity-3-receiving">¶</a> Activity 3 – Receiving</h1>
<h2 id="objective-2" class="toc-header"><a class="toc-anchor" href="#objective-2">¶</a> Objective</h2>
<p>Develop the ability to receive the puck cleanly while preparing for the next phase of play.</p>
<h2 id="knock-downs" class="toc-header"><a class="toc-anchor" href="#knock-downs">¶</a> Knock Downs</h2>
<p>For a detailed explanation see <strong><a href="/players/tackling_maneuvers/knock-downs" class="is-internal-link is-valid-page">Knock Downs</a></strong>.</p>
<p>A knock down is used to intercept or redirect a moving puck while preventing it from travelling past the player.</p>
<h3 id="when-to-use-6" class="toc-header"><a class="toc-anchor" href="#when-to-use-6">¶</a> When to Use</h3>
<ul>
<li>Intercepting a pass.</li>
<li>Preventing the puck from travelling behind you.</li>
<li>Redirecting the puck into space.</li>
<li>Slowing the puck before gaining possession.</li>
</ul>
<h3 id="coaching-cues-1" class="toc-header"><a class="toc-anchor" href="#coaching-cues-1">¶</a> Coaching Cues</h3>
<ul>
<li>Reach with the stick, not the body.</li>
<li>Cushion the puck.</li>
<li>Keep the stick low.</li>
<li>Prepare for the next touch.</li>
</ul>
<h2 id="settling-the-puck" class="toc-header"><a class="toc-anchor" href="#settling-the-puck">¶</a> Settling the Puck</h2>
<p>For a detailed explanation see <strong><a href="/players/individual_fundamentals/puck_handling/settling_the_puck" class="is-internal-link is-valid-page">Settling the Puck</a></strong>.</p>
<p>Control the puck before attempting the next action.</p>
<p>Players should:</p>
<ul>
<li>Allow the puck to settle naturally when appropriate.</li>
<li>Keep the puck close to the stick.</li>
<li>Scan before making the next decision.</li>
</ul>
<h3 id="coaching-cues-2" class="toc-header"><a class="toc-anchor" href="#coaching-cues-2">¶</a> Coaching Cues</h3>
<ul>
<li>Stick only.</li>
<li>Settle first.</li>
<li>Scan early.</li>
</ul>
<h3 id="coach-focus-2" class="toc-header"><a class="toc-anchor" href="#coach-focus-2">¶</a> Coach Focus</h3>
<p>Receiving is more than stopping the puck. Players should learn to intercept, control, and prepare for the next phase of play with minimal delay.</p>
<h1 id="activity-4-protecting-the-puck" class="toc-header"><a class="toc-anchor" href="#activity-4-protecting-the-puck">¶</a> Activity 4 – Protecting the Puck</h1>
<h2 id="objective-3" class="toc-header"><a class="toc-anchor" href="#objective-3">¶</a> Objective</h2>
<p>Maintain possession under pressure.</p>
<h2 id="standard-curl" class="toc-header"><a class="toc-anchor" href="#standard-curl">¶</a> Standard Curl</h2>
<p>For a detailed explanation see <strong><a href="/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page">Standard Curl</a></strong>.</p>
<h3 id="when-to-use-7" class="toc-header"><a class="toc-anchor" href="#when-to-use-7">¶</a> When to Use</h3>
<ul>
<li>Protect possession.</li>
<li>Change direction.</li>
<li>Lay off to teammates.</li>
</ul>
<h2 id="reverse-curl" class="toc-header"><a class="toc-anchor" href="#reverse-curl">¶</a> Reverse Curl</h2>
<p>For a detailed explanation see <strong><a href="/players/evasive_maneuvers/reverse_curl" class="is-internal-link is-valid-page">Reverse Curl</a></strong>.</p>
<h3 id="when-to-use-8" class="toc-header"><a class="toc-anchor" href="#when-to-use-8">¶</a> When to Use</h3>
<ul>
<li>Pressure from the free-arm side.</li>
</ul>
<h2 id="direction-change" class="toc-header"><a class="toc-anchor" href="#direction-change">¶</a> Direction Change</h2>
<p>For a detailed explanation see <strong><a href="/players/evasive_maneuvers/deep_v_1" class="is-internal-link is-valid-page">Deep V (Direction Change)</a></strong>.</p>
<h3 id="when-to-use-9" class="toc-header"><a class="toc-anchor" href="#when-to-use-9">¶</a> When to Use</h3>
<ul>
<li>Create separation by changing angle and speed.</li>
</ul>
<h2 id="swimming-towards-your-own-goal" class="toc-header"><a class="toc-anchor" href="#swimming-towards-your-own-goal">¶</a> Swimming Towards Your Own Goal</h2>
<h3 id="when-to-use-10" class="toc-header"><a class="toc-anchor" href="#when-to-use-10">¶</a> When to Use</h3>
<ul>
<li>Maintain possession while teammates recover.</li>
</ul>
<h3 id="coaching-cues-3" class="toc-header"><a class="toc-anchor" href="#coaching-cues-3">¶</a> Coaching Cues</h3>
<ul>
<li>Stay low.</li>
<li>Eyes up.</li>
<li>Protect first.</li>
<li>Exit with purpose.</li>
</ul>
<h3 id="coach-focus-3" class="toc-header"><a class="toc-anchor" href="#coach-focus-3">¶</a> Coach Focus</h3>
<p>Players should create space before attempting the next play.</p>
<h1 id="activity-5-drills" class="toc-header"><a class="toc-anchor" href="#activity-5-drills">¶</a> Activity 5 – Drills</h1>
<h2 id="objective-4" class="toc-header"><a class="toc-anchor" href="#objective-4">¶</a> Objective</h2>
<p>Combine today's puck control skills through repetition.</p>
<h3 id="drill-1-swimming-with-the-puck" class="toc-header"><a class="toc-anchor" href="#drill-1-swimming-with-the-puck">¶</a> Drill 1 – Swimming with the Puck</h3>
<p>Players complete:</p>
<ul>
<li>2 lengths pushing the puck.</li>
<li>2 lengths weaving through markers.</li>
</ul>
<p><strong>Focus</strong></p>
<ul>
<li>Constant stick contact.</li>
<li>Head up.</li>
<li>Peripheral vision.</li>
</ul>
<h3 id="drill-2-static-passing" class="toc-header"><a class="toc-anchor" href="#drill-2-static-passing">¶</a> Drill 2 – Static Passing</h3>
<p>Develop consistent mechanics for:</p>
<ul>
<li>Slide Pass.</li>
<li>Front Flick.</li>
<li>Back Flick.</li>
</ul>
<h3 id="drill-3-dynamic-passing" class="toc-header"><a class="toc-anchor" href="#drill-3-dynamic-passing">¶</a> Drill 3 – Dynamic Passing</h3>
<p>Swim two lengths continuously passing with a partner.</p>
<p><strong>Focus</strong></p>
<ul>
<li>Timing.</li>
<li>Accuracy.</li>
<li>Follow through.</li>
</ul>
<h3 id="drill-4-target-practice" class="toc-header"><a class="toc-anchor" href="#drill-4-target-practice">¶</a> Drill 4 – Target Practice</h3>
<p>Pass at stationary targets.</p>
<p><strong>Focus</strong></p>
<ul>
<li>Accuracy before distance.</li>
</ul>
<h3 id="drill-5-batting-practice" class="toc-header"><a class="toc-anchor" href="#drill-5-batting-practice">¶</a> Drill 5 – Batting Practice</h3>
<h4 id="two-players" class="toc-header"><a class="toc-anchor" href="#two-players">¶</a> Two Players</h4>
<p>One player flicks while the other bats the puck down and settles possession.</p>
<h4 id="three-players" class="toc-header"><a class="toc-anchor" href="#three-players">¶</a> Three Players</h4>
<p>Outside players flick while the middle player intercepts and settles the puck.</p>
<h3 id="drill-6-puck-protection-circuit" class="toc-header"><a class="toc-anchor" href="#drill-6-puck-protection-circuit">¶</a> Drill 6 – Puck Protection Circuit</h3>
<p>Players weave through defenders or markers using:</p>
<ul>
<li>Standard Curl.</li>
<li>Reverse Curl.</li>
<li>Direction Changes.</li>
<li>Retreating towards their own goal.</li>
</ul>
<p>Finish by passing or accelerating into space.</p>
<h1 id="game" class="toc-header"><a class="toc-anchor" href="#game">¶</a> Game</h1>
<h2 id="objective-5" class="toc-header"><a class="toc-anchor" href="#objective-5">¶</a> Objective</h2>
<p>Apply today's puck control skills during game play.</p>
<h3 id="coach-focus-4" class="toc-header"><a class="toc-anchor" href="#coach-focus-4">¶</a> Coach Focus</h3>
<p>Encourage players to:</p>
<ul>
<li>Choose the correct grip.</li>
<li>Pass with purpose.</li>
<li>Receive under control.</li>
<li>Protect possession before forcing play.</li>
</ul>
<p>Allow players to discover which technique is most effective for each situation rather than directing every decision.</p>
<h1 id="wrap-up" class="toc-header"><a class="toc-anchor" href="#wrap-up">¶</a> Wrap-up</h1>
<p>Ask players:</p>
<ul>
<li>Which grip felt most comfortable?</li>
<li>Which passing technique felt most natural?</li>
<li>When did protecting the puck help maintain possession?</li>
<li>How did looking up improve your decisions?</li>
</ul>
<p>Finish with:</p>
<blockquote>
<p>Good puck control is more than moving the puck. Great players protect possession, look up, make good decisions, and always prepare for the next phase of play.</p>
</blockquote>
<h1 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h1>
<p>Players can:</p>
<ul>
<li>Move the puck under control.</li>
<li>Select the correct grip.</li>
<li>Pass accurately using multiple techniques.</li>
<li>Receive the puck cleanly.</li>
<li>Protect possession under pressure.</li>
<li>Select the appropriate technique for the situation.</li>
</ul>
