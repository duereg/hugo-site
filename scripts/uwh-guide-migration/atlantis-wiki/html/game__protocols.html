<p>This section contains descriptions of the protocols that are followed during tournament games. Players should understand these protocols before attending a tournament because it is important for players to quickly realize what is going on and go where they need to go quickly and efficiently.&nbsp;</p>
<h1 id="pages" class="toc-header"><a class="toc-anchor" href="#pages">¶</a> Pages</h1>
<ol>
  <li><a href="/game/protocols/advantage_puck" class="is-internal-link is-valid-page">Advantage Puck</a> → What happens when the referees call a foul against the opposing team.</li>
  <li><a href="/game/protocols/disadvantage_puck" class="is-internal-link is-valid-page">Disadvantage Puck</a> → What happens when the referees call a foul against your team.</li>
  <li><a href="/game/protocols/equal_puck" class="is-internal-link is-valid-page">Equal Puck</a> → What happens when the referees call a foul against both teams at the same time.&nbsp;</li>
  <li><a href="/game/protocols/half-time" class="is-internal-link is-valid-page">Half-Time</a> → What happens during the half-time break</li>
  <li><a href="/game/protocols/overtime" class="is-internal-link is-valid-page">Overtime</a> → What happens if teams are tied at the end of the normal playing period.</li>
  <li><a href="/game/protocols/penalty_shot" class="is-internal-link is-valid-page">Penalty Shot</a> → What happens when a foul could have prevented a team from scoring.</li>
  <li><a href="/game/protocols/ref_timeouts" class="is-internal-link is-valid-page">Referee Timeouts</a> → Referees can call timeouts to discuss fouls.</li>
  <li><a href="/game/protocols/substitutions" class="is-internal-link is-valid-page">Substitutions</a> → Teams each have substitution players in the water during the game.</li>
  <li><a href="/game/protocols/team_timeouts" class="is-internal-link is-valid-page">Team Timeouts</a> → Teams can call timeouts during games.</li>
  <li><a href="/game/protocols/time-penalties" class="is-internal-link is-valid-page">Time Penalties</a> → Extreme or repeated fouls result in time penalties.</li>
  <li><a href="/game/protocols/warnings" class="is-internal-link is-valid-page">Warnings</a> → Referees can warn players and teams that they are committing a foul too often.</li>
</ol>
