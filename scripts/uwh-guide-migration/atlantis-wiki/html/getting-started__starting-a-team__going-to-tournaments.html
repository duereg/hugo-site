tarting-a-team/going-to-tournaments.html"><template slot="contents"><div><h1 id="description" class="toc-header"><a class="toc-anchor" href="#description">¶</a> Description</h1>
<p>Going to a tournament is a great way to build up team spirit and skill for any club, but especially new clubs. Playing at a tournament is a great way to meet lots of other underwater hockey players, see how the sport is played in an official setting (with refs, timers, etc.) and learns lots of new skills.&nbsp;</p>
<p>Upcoming tournaments can be found UWHPortal.com.</p>
<p>Please note: To compete in a tournament, clubs and/or players often have to register with their local federation. For example, in the US, the club has to be registered with USOA and each player must register and pay dues. Before signing up for a tournament, make sure to double check what the policies of the local federation are.&nbsp;</p>
