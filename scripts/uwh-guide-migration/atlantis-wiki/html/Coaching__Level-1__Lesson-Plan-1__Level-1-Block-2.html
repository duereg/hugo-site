</div><p>
This block builds on water comfort by introducing controlled puck movement, basic passing, and simple rules.
</p><div>

</div><hr><div>

</div><h2 id="session-run-order" class="toc-header"><a class="toc-anchor" href="#session-run-order">¶</a> Session Run Order</h2><div>

</div><!-- 1. MOVEMENT --><div>

</div><p><b>Movement Review</b></p>
<ul>
  <li>Reinforce efficient body position.</li>
  <li>Focus on long, controlled movement.</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-2#streamline-kicking" class="is-internal-link is-valid-page">Streamline Kicking</a>
</p><div>



</div><!-- 2. STICK --><div>

</div><p><b>Stick Introduction</b></p>
<ul>
  <li>Confirm correct grip.</li>
  <li>Introduce one-hand rule.</li>
  <li>Maintain relaxed movement.</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-2#stick-familiarization" class="is-internal-link is-valid-page">Stick Familiarization</a>
</p><div>



</div><!-- 3. PUCK CONTROL --><div>

</div><p><b>Puck Control</b></p>
<ul>
  <li>Introduce controlled puck movement.</li>
  <li>Keep puck close and controlled.</li>
  <li>Stop and reset frequently.</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-2#short-push-drill" class="is-internal-link is-valid-page">Short Push Drill</a>
</p><div>



</div><!-- 4. PASSING --><div>

</div><p><b>Passing Basics</b></p>
<ul>
  <li>Introduce short push passes.</li>
  <li>Focus on accuracy and control.</li>
  <li>Encourage simple cooperation.</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-2#basic-passing" class="is-internal-link is-valid-page">Basic Push Passing</a>
</p><div>



</div><!-- 5. COOPERATION --><div>

</div><p><b>Direction Change &amp; Protection</b></p>
<ul>
  <li>Introduce simple turning with the puck.</li>
  <li>Introduce basic puck protection.</li>
  <li>Maintain control under light pressure.</li>
</ul><div>

</div><p><b>Linked Drills:</b> 
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-2#bottom-curls" class="is-internal-link is-valid-page">Bottom Curls</a>,
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-2#protect-the-puck" class="is-internal-link is-valid-page">Protect the Puck</a>
</p><div>



</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><ul>
<li>
Swims with puck under control  
<br><b>Linked Drill:</b> Short Push Drill
</li>

<li>
Executes short push passes  
<br><b>Linked Drill:</b> Basic Push Passing
</li>

<li>
Applies basic stick rules  
<br><b>Linked Drill:</b> Stick Familiarization
</li>

<li>
Maintains control without rushing  
<br><b>Linked Drills:</b> Bottom Curls, Protect the Puck
</li>
</ul><div>



</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
<li>Control first</li>
<li>Keep it close</li>
<li>Soft touches</li>
<li>Pass early</li>
<li>One hand on the stick</li>
</ul><div>



</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
<li>Keep activities simple</li>
<li>Do not progress until control is consistent</li>
<li>Reinforce calm, repeatable actions</li>
<li>Encourage cooperation, not competition</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
