or" href="#level-2-foundation-of-hockey">¶</a> Level 2 - Foundation of Hockey</h1><div>

</div><p>
Level 2 develops the technical skills, core principles, and game understanding introduced after Level 1.
</p><div>

</div><p>
Players learn to move efficiently, control and protect the puck, support teammates, and make better decisions during game play.
</p><div>

</div><hr><div>

</div><hr><div>

</div><h2 id="level-2-coaching-philosophy" class="toc-header"><a class="toc-anchor" href="#level-2-coaching-philosophy">¶</a> Level 2 Coaching Philosophy</h2><div>

</div><ul>
  <li>Build strong habits before advanced tactics.</li>
  <li>Encourage decision-making through game play.</li>
  <li>Develop confidence through repetition.</li>
  <li>Teach players why skills are used, not only how to perform them.</li>
  <li>Develop confident, adaptable, and dependable teammates.</li>
</ul><div>

</div><p>
Level 2 builds the foundation for future technical, tactical, and competitive development.
</p>
