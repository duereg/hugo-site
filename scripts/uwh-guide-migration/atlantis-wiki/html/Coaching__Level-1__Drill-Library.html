</div><h1 id="drill-library" class="toc-header"><a class="toc-anchor" href="#drill-library">¶</a> Drill Library</h1><div>

</div><p>
This library contains drills and activities that support Level 1 coaching.
Drills are grouped by session and aligned with the skills introduced during a player's first three sessions of Underwater Hockey.
</p><div>

</div><hr><div>

</div><h2 id="session-drill-libraries" class="toc-header"><a class="toc-anchor" href="#session-drill-libraries">¶</a> Session Drill Libraries</h2><div>

</div><ul>

<li>
<b><a href="/en/Coaching/Level-1/Drill-Library/Session-1" class="is-internal-link is-invalid-page">Session 1 – Play Your First Game</a></b><br>
Equipment confidence, first puck contact, basic puck movement, passing, and mini games.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-1/Drill-Library/Session-2" class="is-internal-link is-invalid-page">Session 2 – Control the Puck</a></b><br>
Puck control, turning, passing while moving, support play, and possession games.
</li>

<br>

<li>
<b><a href="/en/Coaching/Level-1/Drill-Library/Session-3" class="is-internal-link is-invalid-page">Session 3 – Attack &amp; Defend</a></b><br>
Attacking play, defending play, transition, team roles, and game understanding.
</li>

</ul><div>
