</div><p><b>Progressive Badges Supported (Observed Where Applicable):</b>
<a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a>
</p><div>

</div><hr><div>

</div><h3 id="pass-and-move" class="toc-header"><a class="toc-anchor" href="#pass-and-move">¶</a> Pass and Move</h3><div>

</div><ul>
  <li>Player passes and immediately moves to a new support position.</li>
  <li>Receiver controls before returning pass.</li>
  <li>No standing still after passing.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="braid" class="toc-header"><a class="toc-anchor" href="#braid">¶</a> Braid</h3><div>

</div><p>
This drill develops curling and back passing between teammates. The focus is on executing quick, controlled curls and recognizing when a teammate is about to curl to deliver an effective back pass.
</p><div>

</div><h4 id="drill-setup" class="toc-header"><a class="toc-anchor" href="#drill-setup">¶</a> Drill Setup</h4>
<ul>
  <li>Three players work together in a channel across the pool.</li>
  <li>Use two lane-line markers to define the channel.</li>
  <li>Movement is diagonal across the channel.</li>
</ul><div>

</div><h4 id="how-it-works" class="toc-header"><a class="toc-anchor" href="#how-it-works">¶</a> How It Works</h4>
<ul>
  <li>Player 1 starts with the puck and swims diagonally to the opposite side.</li>
  <li>On reaching the line, they curl to the outside (away from the middle) and pass back to Player 2.</li>
  <li>Player 2 repeats the pattern in the opposite direction and passes back to Player 3.</li>
  <li>Player 3 repeats and passes back to Player 1.</li>
  <li>After passing, players may surface briefly, reset, and prepare to receive again.</li>
</ul>
<p> <a href="/teams/teamwork_drills/braid" class="is-internal-link is-valid-page">Braid drill full description</a> </p>
<p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="support-timing-breath" class="toc-header"><a class="toc-anchor" href="#support-timing-breath">¶</a> Support Timing with Breath</h3><div>

</div><ul>
  <li>Players time movement with breathing cycle.</li>
  <li>Arrive as a support option, not too early or late.</li>
  <li>Stay available without crowding.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> None (timing awareness)</p><div>

</div><hr><div>

</div><h3 id="support-distance-control" class="toc-header"><a class="toc-anchor" href="#support-distance-control">¶</a> Support Distance Control</h3><div>

</div><ul>
  <li>Maintain effective support distance (not too close or far).</li>
  <li>Adjust position as play moves.</li>
  <li>Keep clear passing lane.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> None (development drill)</p><div>

</div><hr><div>

</div><h3 id="width-and-depth-movement" class="toc-header"><a class="toc-anchor" href="#width-and-depth-movement">¶</a> Width and Depth Movement</h3><div>

</div><ul>
  <li>Support moves laterally (width) and forward/back (depth).</li>
  <li>Create simple passing angles.</li>
  <li>Avoid clustering around the puck.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> None (movement awareness)</p><div>

</div><hr><div>

</div><h3 id="continuous-support-play" class="toc-header"><a class="toc-anchor" href="#continuous-support-play">¶</a> Continuous Support Play</h3><div>

</div><ul>
  <li>Ongoing passing between players with constant repositioning.</li>
  <li>Players must always remain a passing option.</li>
  <li>Focus on flow and connection, not structure.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b></p>
<ul>
  <li><a href="/en/Coaching/Badges/Progressive#pass-accuracy" class="is-internal-link is-valid-page">Pass Accuracy</a></li>
</ul><div>

</div><hr><div>

</div><h3 id="short-game-support-play" class="toc-header"><a class="toc-anchor" href="#short-game-support-play">¶</a> Short Game Support Play</h3><div>

</div><ul>
  <li>Small-sided game emphasizing support and connection.</li>
  <li>Players encouraged to stay available and move after passing.</li>
  <li>Reinforce spacing and timing naturally.</li>
</ul><div>

</div><p><b>Badge Opportunities:</b> Observed where applicable during play</p><div>

</div><hr>
