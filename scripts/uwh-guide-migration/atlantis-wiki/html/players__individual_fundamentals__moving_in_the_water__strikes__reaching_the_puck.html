<p>Once a player reaches the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> on the strike there are countless things that player can then do. The player must decide what to do based on the setup of the opposing team and the formation, strategy and setup of their own team. Following are a few options.</p>
<p>When the first one to the puck:</p>
<ol>
  <li>One of the simplest options is to slide the puck directly under the player’s body to a teammate who is directly behind them. This moves the puck out of the reach of the opponent that is also going for the puck and therefore gives the teammate some space to maneuver or pass the puck.</li>
  <li>Players can also curl when they get the puck, either a <a href="/players/evasive_maneuvers/reverse_curl" class="is-internal-link is-valid-page">reverse curl </a>or a <a href="/players/evasive_maneuvers/standard_curl" class="is-internal-link is-valid-page">standard curl</a>. From there the player can pass the puck to any teammate behind them, most commonly diagonally backwards or straight backwards.</li>
  <li>Players can also take the puck, quickly turn and <a href="/players/individual_fundamentals/puck_handling/passes/flicks_full_motion" class="is-internal-link is-valid-page">flick</a> the puck diagonally backwards to a teammate, allowing them to go outward an around the opposing team.</li>
  <li>Players can also pass the puck to their fellow forward who sprinted on the strike with them. For this play, both players should be level with the puck, side by side. Once the first player passes the puck to their teammate beside them, the should stay and swim with their teammate to support the play, there are most likely no teammates ahead, so those two players must support each other.</li>
</ol>
<p>When not the first one to the puck:</p>
<ol>
  <li>In this position the player should do their best to get the puck from the opponent, while also not letting the opponent swim straight up the middle of the pool. To achieve this the player should keep their body firmly against the playing surface (such as in the <a href="/players/individual_fundamentals/moving_in_the_water/cobra_position" class="is-internal-link is-valid-page">cobra position</a>) and block the opponents path towards the goal, then engage the player by trying the steal the puck.</li>
</ol>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>It is ultimately the decision of the player as to what they will do when they get the puck on the strike, but any of the methods above can be used on any strike. Players should be aware of where opponents and teammates are when deciding what to do. It is best to chose to go in the direction with the most space, but also in a direction in which teammates can support the play.</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>The only time one of the above moves should not be used is if they unnecessarily move the puck right to, or close to, and opponent. Much like in regular play, players want to move the puck to where there is space away from opponents.</p>
<h1 id="real-life-example-video-clip" class="toc-header"><a class="toc-anchor" href="#real-life-example-video-clip">¶</a> Real-life Example Video Clip</h1>
<br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/oh4yo2anixA?clip=UgkxDT61h6j6w2Yn1iUheXiup8i8UqpfXwXp&amp;clipt=EJaZJBjVuSU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
<p>The player who wins the strike is in good body position when he reaches the puck and quickly takes the puck and flicks it sideways to a teammate. </p>
<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference green">
  <p><u>REACHING THE PUCK</u></p>
  <ul>
    <li>IF THE PLAYER IS THE FIRST ONE TO THE PUCK, THEY SHOULD PASS IT TO A TEAMMATE BESIDE OR BEHIND THEM OR PICK A DIRECTION TO DRIVE THE PUCK WITH ANOTHER FORWARD</li>
    <li>IF THE PLAYER IS NOT THE FIRST TO THE PUCK, THEY SHOULD STOP THE OPPONENT FROM DRIVING THE PUCK UP THE MIDDLE OF THE POOL AND ATTEMT TO GET THE PUCK</li>
  </ul>
