</div><p><b>Objective.</b> Apply Level 2 structure in full conditioned scrimmage, with clean substitutions, clear side signaling, and disciplined timing.</p>
<p><b>Delivery.</b> Run this block for 1 to 3 sessions. Start with an out of water discussion and signal agreement, then run full conditioned scrimmage blocks with substitution standards.</p><div>

</div><p><b>Session skeleton.</b> 8 to 10 min out of water discussion, 35 to 45 min conditioned scrimmage blocks, 3 min review.</p><div>

</div><p>By the end of Block 8, players should be able to demonstrate the following in short game play:</p>
<ul>
  <li>Executes clean substitutions without disrupting team shape.</li>
  <li>Chooses good moments to substitute based on puck position and team stability.</li>
  <li>Signals substitution side clearly and early.</li>
  <li>Uses different substitution types, 2 for 1 position and 3 for 2 positions, without confusion.</li>
</ul><div>

</div><h2 id="out-of-water-discussion-8-to-10-minutes" class="toc-header"><a class="toc-anchor" href="#out-of-water-discussion-8-to-10-minutes">¶</a> Out of water discussion, 8 to 10 minutes</h2>
<ul>
 <li><b>Best time to substitute.</b> When the puck is near the substitution box. Use quick subs on one-breath efforts, then rest in the sub box.</li>
<li><b>Bad time to substitute.</b> As a defender, when the opposition has possession and is putting your defense under pressure. As an attacker, when your team is applying pressure and the defense is under stress.</li>
<li><b>Early decision.</b> Decide the substitution side before submerging for the next cycle.</li>
<li><b>Side signals.</b> These meanings must be agreed on before the session starts.</li>
</ul><div>

</div><h3 id="substitution-side-signals" class="toc-header"><a class="toc-anchor" href="#substitution-side-signals">¶</a> <b>Substitution side signals</b></h3>
<ul>
  <li><b>Close side.</b> Fist signal.</li>
  <li><b>Open side.</b> Open hand signal.</li>
</ul><div>

</div><h3 id="substitution-types" class="toc-header"><a class="toc-anchor" href="#substitution-types">¶</a> <b>Substitution types</b></h3>
<ul>
  <li><b>2 for 1 position.</b> Two players rotate through one role in sequence, one exits while the other enters, maintaining the same position responsibility.</li>
  <li><b>3 for 2 positions.</b> Three players rotate through two roles, allowing one player to recover while two positions remain covered.</li>
  <li><b>Key rule.</b> The team must keep coverage of critical roles during the rotation, especially middle and last defender responsibilities.</li>
</ul><div>

</div><h2 id="setup" class="toc-header"><a class="toc-anchor" href="#setup">¶</a> Setup</h2>
<ul>
  <li><b>Space.</b> Full court scrimmage if possible.</li>
  <li><b>Substitution side.</b> Clearly defined bench side and entry lane.</li>
  <li><b>Blocks.</b> Timed scrimmage blocks, 3 to 5 minutes.</li>
</ul><div>

</div><h2 id="full-conditioned-scrimmage-blocks" class="toc-header"><a class="toc-anchor" href="#full-conditioned-scrimmage-blocks">¶</a> Full conditioned scrimmage blocks</h2>
<p>Run 4 to 6 blocks. Each block has one substitution focus. Keep the same standards every block.</p><div>

</div><h3 id="h-1-block-focus-timing-the-sub" class="toc-header"><a class="toc-anchor" href="#h-1-block-focus-timing-the-sub">¶</a> <b>1) Block focus, timing the sub</b></h3>
<ul>
  <li><b>Condition.</b> Subs only when puck is on wall or in corner. If a sub happens with the puck central, stop and reset.</li>
  <li><b>Success.</b> Clean rotations with no shape collapse and no immediate danger zone exposure.</li>
</ul><div>

</div><h3 id="h-2-block-focus-signaling-side-early" class="toc-header"><a class="toc-anchor" href="#h-2-block-focus-signaling-side-early">¶</a> <b>2) Block focus, signaling side early</b></h3>
<ul>
  <li><b>Condition.</b> Puck carrier or nearest leader must signal close side or open side before players submerge for the next cycle.</li>
  <li><b>Success.</b> Players rotate to the correct side with no hesitation.</li>
</ul><div>

</div><h3 id="h-3-block-focus-2-for-1-substitutions" class="toc-header"><a class="toc-anchor" href="#h-3-block-focus-2-for-1-substitutions">¶</a> <b>3) Block focus, 2 for 1 substitutions</b></h3>
<ul>
  <li><b>Condition.</b> Team must complete at least two clean 2 for 1 cycles without losing the role shape.</li>
  <li><b>Success.</b> The position stays covered throughout, and the incoming player enters with a clear job.</li>
</ul><div>

</div><h3 id="h-4-block-focus-3-for-2-substitutions" class="toc-header"><a class="toc-anchor" href="#h-4-block-focus-3-for-2-substitutions">¶</a> <b>4) Block focus, 3 for 2 substitutions</b></h3>
<ul>
  <li><b>Condition.</b> Team must complete at least two clean 3 for 2 cycles while maintaining middle and depth coverage.</li>
  <li><b>Success.</b> No open middle, no last defender overcommit caused by rotation confusion.</li>
</ul><div>

</div><h3 id="h-5-block-focus-game-realism" class="toc-header"><a class="toc-anchor" href="#h-5-block-focus-game-realism">¶</a> <b>5) Block focus, game realism</b></h3>
<ul>
  <li><b>Condition.</b> Combine timing, side signal, and both substitution types in one block.</li>
  <li><b>Success.</b> Substitutions become automatic, and structure holds under fatigue.</li>
</ul><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching cues</h2>
<ul>
  <li>Sub on the wall</li>
  <li>Signal side early</li>
  <li>Close side fist</li>
  <li>Open side hand</li>
  <li>Keep middle covered</li>
  <li>No sub in the middle</li>
</ul><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common faults</h2>
<ul>
  <li>Subbing with puck central. Cue, “No sub in the middle.”</li>
  <li>Late side signal. Cue, “Signal before you go under.”</li>
  <li>Overlapping subs. Cue, “One rotation only.”</li>
  <li>Middle left open during rotation. Cue, “Keep middle covered.”</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
