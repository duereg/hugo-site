lass="toc-anchor" href="#description">¶</a> Description</h1>
<p>At practices it is important to divide everyone into teams that are equally matched. Oftentimes the easiest way to do this is have a player that knows all the player's levels simply assign teams once they see who has come to practice. This may not be the most accurate way of making even teams, but it can be quite efficient.&nbsp;</p>
<p>Another method is to write out the teams on a white board, possibly using magnets with player's names to allow for easy rearrangement. This allows the person making the teams to look more closely at the lineups of each team to get very even teams.&nbsp;</p>
<p>Clubs can also have all their players sign up for a service that allows them to RSVP for all practices. If all players are signed up ahead of time, then teams can be made before everyone arrives at the pool and sent out to everyone. This method is very efficient and allows players to immediately get into the water when they arrive, avoiding any discussion about team-making that can cause practice to start late.&nbsp;</p>
<p>If teams turn out to be very uneven, teams should trade two or more players to even them out. Practices are much more enjoyable and productive for everyone if the teams are even.&nbsp;</p>
