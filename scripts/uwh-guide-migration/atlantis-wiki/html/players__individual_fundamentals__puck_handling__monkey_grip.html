bHNlfSwiaGlzdG9yeSI6eyJyZWFkIjpmYWxzZX0sInNvdXJjZSI6eyJyZWFkIjpmYWxzZX0sInBhZ2VzIjp7InJlYWQiOnRydWUsIndyaXRlIjpmYWxzZSwibWFuYWdlIjpmYWxzZSwiZGVsZXRlIjpmYWxzZSwic2NyaXB0IjpmYWxzZSwic3R5bGUiOmZhbHNlfSwic3lzdGVtIjp7Im1hbmFnZSI6ZmFsc2V9fQ==" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="players/individual_fundamentals/puck_handling/monkey_grip.html"><template slot="contents"><div><p>The monkey grip for holding an UWH <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a> is a modified version of the <a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page">standard grip</a> and is used during certain specific maneuvers where a more pronounced hook is desirable. Instead of the <a href="/players" class="is-internal-link is-valid-page">player's</a> thumb being pressed to the back-side of the stick, the thumb is pressed to the top of the stick's handle along side the index finger (the stick's back-side should still face the player). This causes the stick to “rock back” in the hand so that the tip of the stick moves closer to the player's forearm and the heel of the stick moves further away.&nbsp;</p>
<p>Having a tie looped around the handle and the middle finger near the first knuckle as described in the Standard Grip makes this grip much easier to move in and out of.</p>

<h1 id="when-to-use" class="toc-header"><a class="toc-anchor" href="#when-to-use">¶</a> When to Use</h1>
<p>The Monkey Grip has far fewer uses than the <a href="/players/individual_fundamentals/puck_handling/standard_grip" class="is-internal-link is-valid-page">standard grip</a>&nbsp;but it is very helpful in conducting <a href="/players/tackling_maneuvers/tackle_1" class="is-internal-link is-valid-page">tackles (opponent's stick-hand side)</a> if the player is holding their stick in the same hand (righty vs righty, or lefty vs lefty) or when conducting <a href="/players/tackling_maneuvers/tackel_2" class="is-internal-link is-valid-page">tackles (opponent's free-hand side)</a> if the player is holding their stick in the opposite hand (righty vs lefty).</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>Aside from the two tackling maneuvers described above, the monkey grip isn't usually appropriate. The overall grip strength is much weaker when trying to perform any <a href="/players/individual_fundamentals/puck_handling" class="is-internal-link is-valid-page">puck handling</a> or <a href="/players/individual_fundamentals/puck_handling/passes" class="is-internal-link is-valid-page">passing</a> maneuvers. Trying to stick battle for the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> when using the monkey grip is not recommended.&nbsp;</p>
