wic3lzdGVtIjp7Im1hbmFnZSI6ZmFsc2V9fQ==" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjpmYWxzZSwiZWRpdE1lbnVFeHRlcm5hbEJ0biI6ZmFsc2UsImVkaXRNZW51RXh0ZXJuYWxOYW1lIjoiR2l0SHViIiwiZWRpdE1lbnVFeHRlcm5hbEljb24iOiJtZGktZ2l0aHViIiwiZWRpdE1lbnVFeHRlcm5hbFVybCI6Imh0dHBzOi8vZ2l0aHViLmNvbS9vcmcvcmVwby9ibG9iL21haW4ve2ZpbGVuYW1lfSJ9" filename="getting-started/new-player/movement-fundamentals.html"><template slot="contents"><div><h2 id="movement-fundamentals" class="toc-header"><a class="toc-anchor" href="#movement-fundamentals">¶</a> Movement Fundamentals</h2><div>

</div><p>
Movement is the engine of Underwater Hockey. Strong movement skills let you arrive earlier, stay longer,
and use less energy doing it. This block focuses on efficient, controlled movement and not frantic speed.
</p><div>

</div><p>
<b>Core principle:</b> Efficiency beats power. Players who move smoothly always outlast players who move aggressively.
</p><div>

</div><hr><div>

</div><h3 id="finning-basics" class="toc-header"><a class="toc-anchor" href="#finning-basics">¶</a> <b>Finning Basics</b></h3><div>

</div><p>
Your fins are your primary source of propulsion. Good finning should feel powerful but relaxed.
Most beginners kick too hard and waste oxygen.
</p><div>

</div><p><b>Correct finning technique:</b></p>
<ul>
  <li>Kick from the <b>hips</b>, not the knees.</li>
  <li>Keep legs long with a slight bend - avoid bicycle kicking.</li>
  <li>Use smooth, rhythmic kicks instead of explosive bursts.</li>
  <li>Think <b>long and controlled</b>, not fast and splashy.</li>
</ul><div>

</div><p><b>When to increase power:</b></p>
<ul>
  <li>Closing distance to the puck.</li>
  <li>Recovering defensively.</li>
  <li>Accelerating into open space.</li>
</ul><div>

</div><p><b>Common mistakes:</b></p>
<ul>
  <li>Rapid short kicks that burn oxygen.</li>
  <li>Huge kicks near teammates.</li>
  <li>Kicking only from the knees.</li>
</ul><div>

</div><p><b>Rule:</b> Big engine, low noise.</p><div>

</div><hr><div>

</div><h3 id="streamlining-your-body" class="toc-header"><a class="toc-anchor" href="#streamlining-your-body">¶</a> <b>Streamlining Your Body</b></h3><div>

</div><p>
Water rewards the most streamlined shape. The less drag you create, the further every kick takes you.
</p><div>

</div><p><b>Streamlined position checklist:</b></p>
<ul>
  <li>Head neutral, eyes slightly forward, not craned upward.</li>
  <li>Chest angled slightly down.</li>
  <li>Hips high (avoid letting them sink).</li>
  <li>Legs long behind you.</li>
  <li>Stick out infrint when swimming.</li>
</ul><div>

</div><p>
Imagine your body as an arrow cutting through the water.
</p><div>

</div><p><b>Quick self-test:</b></p>
<ul>
  <li>If you stop kicking, you should glide forward briefly.</li>
  <li>If you stop and immediately stall, adjust your body line.</li>
</ul><div>

</div><hr><div>

</div><h3 id="diving-fundamentals" class="toc-header"><a class="toc-anchor" href="#diving-fundamentals">¶</a> <b>Diving Fundamentals</b></h3><div>

</div><p>
A good dive is controlled, direct, and efficient. The goal is to reach the bottom exactly where you intend,
without excessive movement.
</p><div>

</div><p><b>Key elements of a strong dive:</b></p>
<ul>
  <li>Take one calm preparatory breath.</li>
  <li>Bend at the waist and angle your upper body downward.</li>
  <li>Let your legs follow your torso.</li>
  <li>Equalize early if needed.</li>
  <li>Arrive balanced, not rushed.</li>
</ul><div>

</div><p><b>Think:</b> Tip → descend → settle.</p><div>

</div><p><b>Common mistakes:</b></p>
<ul>
  <li>Over-kicking during descent.</li>
</ul><div>

</div><hr><div>

</div><h3 id="fins-first-dives" class="toc-header"><a class="toc-anchor" href="#fins-first-dives">¶</a> <b>Fins-First Dives</b></h3><div>

</div><p>
The fins-first dive is a foundational skill for controlled descents directly beneath you.
It is efficient, predictable, and ideal for tight play areas.
</p><div>

</div><p><b>Execution:</b></p>
<ul>
  <li>Angle your fin tips toward the bottom.</li>
  <li>Use your free arm to guide your body downward.</li>
  <li>Rotate the shoulders to help direct the descent.</li>
  <li>Your playing hand should reach the bottom first.</li>
  <li>Allow the hips to follow so you land stable and ready.</li>
</ul><div>

</div><p><b>When to use it:</b></p>
<ul>
  <li>Dropping onto the puck.</li>
  <li>Entering play beneath you.</li>
  <li>Maintaining positional control.</li>
</ul><div>

</div><p><b>Why it matters:</b> Direct descents waste less oxygen and reduce collisions.</p><div>

</div><hr><div>

</div><h3 id="cobra-position" class="toc-header"><a class="toc-anchor" href="#cobra-position">¶</a> <b>Cobra Position</b></h3><div>

</div><p>
The cobra is the primary ready position on the bottom. It allows you to see the play,
protect space, and react quickly.
</p><div>

</div><p><b>Body shape:</b></p>
<ul>
  <li>Chest lifted.</li>
  <li>Hips low.</li>
  <li>Head up with a wide field of view.</li>
  <li>Stick prepared in front of you.</li>
</ul><div>

</div><p><b>Benefits:</b></p>
<ul>
  <li>Better awareness of teammates and opponents.</li>
  <li>Faster reactions.</li>
  <li>Stronger defensive presence.</li>
</ul><div>

</div><p><b>Avoid:</b></p>
<ul>
  <li>Lying flat on the bottom.</li>
  <li>Tucking your chin excessively.</li>
  <li>Letting your hips float upward.</li>
</ul><div>

</div><p><b>Simple cue:</b> Chest proud, eyes up.</p><div>

</div><hr><div>

</div><h3 id="turning-at-the-bottom" class="toc-header"><a class="toc-anchor" href="#turning-at-the-bottom">¶</a> <b>Turning at the Bottom</b></h3><div>

</div><p>
Efficient turns keep you involved in the play without needing to surface.
Wide, slow turns cost valuable seconds.
</p><div>

</div><p><b>How to turn efficiently:</b></p>
<ul>
  <li>Plant your playing hand lightly for stability if needed.</li>
  <li>Rotate your shoulders first pivot around your hips.</li>
  <li>Use a small scissor kick to redirect momentum.</li>
  <li>Keep the puck protected if you have possession.</li>
</ul><div>

</div><p><b>Goal:</b> Turn inside your own body length.</p><div>

</div><p><b>Common mistake:</b> </p>
<ul>
  <li>Hips float of the bottom.</li>
  <li>Turn too wide adding unnecessary kicking. </li>
  <li>Turn too tight no space for body to go. </li>
</ul>
<hr><div>

</div><h3 id="recovering-to-the-surface" class="toc-header"><a class="toc-anchor" href="#recovering-to-the-surface">¶</a> <b>Recovering to the Surface</b></h3><div>

</div><p>
Good recovery prepares you for your next dive. Panic recoveries drain energy quickly.
</p><div>

</div><p><b>Controlled ascent:</b></p>
<ul>
  <li>Look up before rising.</li>
  <li>Angle slightly into open water.</li>
  <li>Avoid coming up into another player on the surface.</li>
</ul><div>

</div><p><b>Surface recovery pattern:</b></p>
<ul>
  <li>Clear your snorkel immediately.</li>
  <li>One calm inhale.</li>
  <li>Longer relaxed exhale.</li>
  <li>Reset your breathing rhythm before the next dive.</li>
</ul><div>

</div><p><b>Elite habit:</b> Think about your next move while recovering</p><div>

</div><hr><div>

</div><p>
<b>Movement mastery takes time.</b> Early progress comes from control and efficiency,
not aggression. Build smooth habits now and speed will follow naturally.
</p><div>
