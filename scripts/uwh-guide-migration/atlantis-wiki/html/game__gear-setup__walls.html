d="description"><a href="#description" class="toc-anchor">¶</a> Description</h1>
<p>The playing area boundaries will in most cases be marked by a solid barrier. These are often not very tall so the puck may still go over the walls during the play, but it is not frequent. Players are allowed to push off the walls, but may not grab the the wall in any way. If a solid barrier can not be installed, there may be only a demarcation line.</p>
