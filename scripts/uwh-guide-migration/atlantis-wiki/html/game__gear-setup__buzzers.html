s="toc-anchor" href="#description">¶</a> Description</h1>
<p>The buzzer is a set of underwater and above water speakers that are controlled by the chief ref.&nbsp; The chief ref will sound the speakers to start the play, either at an advantage puck or at the start of point. The chief ref will also sound the speakers if a foul has been called by any of the refs, including the chief ref. This will signal to the players that the play has been stopped.</p>
<p>In tournaments with more than one playing area, each playing area will have a different sound produced by the speakers and players will have to be aware of which sound is being used in their playing court. If the players are unsure of what sound is being used in their playing area they may ask the chief ref for a sound check before the game.</p>
<h1 id="example" class="toc-header"><a class="toc-anchor" href="#example">¶</a> Example</h1>
<p>Sound on!</p><p>
<iframe width="560" height="315" src="https://www.youtube.com/embed/AAMjm8qzW4Y?si=0V4iV4xMMv3wKUu2&amp;clip=Ugkxb6_KDSqdFmKg1vs-3joTBQbecYBeGKZ7&amp;clipt=EO25NxjH6zk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
</p><p>The buzzer (or a ringing in this case) signals to the players when the play stops and starts.</p><p>
