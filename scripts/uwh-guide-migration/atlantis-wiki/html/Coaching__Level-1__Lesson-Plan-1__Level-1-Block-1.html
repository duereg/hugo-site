</div><p>
This block introduces players to safe, confident movement in the water while building comfort with equipment, breathing, diving, and first puck contact.
</p><div>

</div><p>
<b>Linked Individual Fundamental:</b> 
<a href="/players/individual_fundamentals/moving_in_the_water" target="_blank" class="is-internal-link is-valid-page">
Moving in the Water
</a> – Surface movement, depth progression, diving, and body position form the foundation of this block.
</p><div>

</div><hr><div>

</div><h2 id="session-run-order" class="toc-header"><a class="toc-anchor" href="#session-run-order">¶</a> Session Run Order</h2><div>

</div><!-- 1. EQUIPMENT + SAFETY --><div>

</div><p><b>Equipment + Safety</b></p>
<ul>
  <li>Fit gear correctly.</li>
  <li>Introduce mask clearing early.</li>
  <li>Grant explicit permission to surface anytime.</li>
  <li>Set expectation: stay calm, reset often.</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#mask-flood-and-clear" class="is-internal-link is-valid-page">Mask Flood and Clear</a>
</p><div>

</div><!-- 2. SURFACE COMFORT --><div>

</div><p><b>Surface Comfort &amp; Breathing</b></p>
<ul>
  <li>Develop calm snorkel breathing.</li>
  <li>Build confidence clearing the snorkel.</li>
  <li>Establish slow breathing rhythm.</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#snorkel-comfort-swim" class="is-internal-link is-valid-page">Snorkel Comfort Swim</a>
</p><div>

</div><!-- 3. DIVING --><div>

</div><p><b>Diving + Recovery</b></p>
<ul>
  <li>Introduce short, controlled descents.</li>
  <li>Touch bottom and return immediately.</li>
  <li>Reinforce early surfacing and reset.</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#sink-down-drill" class="is-internal-link is-valid-page">Sink-Down Drill</a>
</p><div>

</div><!-- 4. MOVEMENT --><div>

</div><p><b>Bottom Movement</b></p>
<ul>
  <li>Introduce short movement along the bottom.</li>
  <li>Maintain balance and control.</li>
  <li>Keep distances short and repeat often.</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#bottom-movement" class="is-internal-link is-valid-page">Bottom Movement</a>
</p><div>

</div><!-- 5. PUCK --><div>

</div><p><b>First Puck Contact</b></p>
<ul>
  <li>Introduce controlled puck interaction.</li>
  <li>Use short, soft pushes.</li>
  <li>Maintain body position while handling.</li>
</ul><div>

</div><p><b>Linked Drill:</b> 
  <a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#short-push-drill" class="is-internal-link is-valid-page">Short Push Drill</a>
</p><div>

</div><hr><div>

</div><h2 id="exit-standard" class="toc-header"><a class="toc-anchor" href="#exit-standard">¶</a> Exit Standard</h2><div>

</div><p>By the end of this block players should demonstrate the following during simple movement and puck activities:</p><div>

</div><ul>
<li>
Moves comfortably on the surface and bottom  
<br><b>Linked Drills:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#snorkel-comfort-swim" class="is-internal-link is-valid-page">Snorkel Comfort Swim</a>,
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#bottom-movement" class="is-internal-link is-valid-page">Bottom Movement</a>
</li>

<li>
Dives and surfaces calmly  
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#sink-down-drill" class="is-internal-link is-valid-page">Sink-Down Drill</a>
</li>

<li>
Clears snorkel without removing it  
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#snorkel-comfort-swim" class="is-internal-link is-valid-page">Snorkel Comfort Swim</a>
</li>

<li>
Maintains balance at depth  
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#bottom-movement" class="is-internal-link is-valid-page">Bottom Movement</a>
</li>

<li>
Touches and moves the puck with control  
<br><b>Linked Drill:</b>
<a href="/en/Coaching/Level-1/Drill-Library/Level1-Block-1#short-push-drill" class="is-internal-link is-valid-page">Short Push Drill</a>
</li>
</ul><div>

</div><hr><div>

</div><h2 id="key-learning-principles" class="toc-header"><a class="toc-anchor" href="#key-learning-principles">¶</a> Key Learning Principles</h2><div>

</div><h3 id="water-comfort" class="toc-header"><a class="toc-anchor" href="#water-comfort">¶</a> Water Comfort</h3><div>

</div><p>
Players must feel calm and safe before progressing. Breathing control and relaxed movement are the foundation of all learning in this block.
</p><div>

</div><ul>
<li>Stay calm and breathe steadily</li>
<li>Surface early and often</li>
<li>Reset fully between efforts</li>
<li>Progress gradually to depth</li>
</ul><div>

</div><p><b>Rule:</b> Calm breathing, smooth movement, controlled recovery.</p><div>

</div><h3 id="diving-and-recovery" class="toc-header"><a class="toc-anchor" href="#diving-and-recovery">¶</a> Diving and Recovery</h3><div>

</div><p>
Dives are short, controlled, and repeatable. The focus is confidence, not depth or duration.
</p><div>

</div><ul>
<li>Short dives only</li>
<li>Surface before discomfort</li>
<li>Recover calmly at the surface</li>
<li>Avoid rushing</li>
</ul><div>

</div><h3 id="first-puck-contact" class="toc-header"><a class="toc-anchor" href="#first-puck-contact">¶</a> First Puck Contact</h3><div>

</div><p>
Puck interaction is introduced only after players are comfortable at depth.
</p><div>

</div><ul>
<li>Use soft, controlled pushes</li>
<li>Keep the puck close</li>
<li>Maintain balance while handling</li>
<li>Control before speed</li>
</ul><div>

</div><hr><div>

</div><h2 id="coaching-cues" class="toc-header"><a class="toc-anchor" href="#coaching-cues">¶</a> Coaching Cues</h2><div>

</div><ul>
<li>Breathe and relax</li>
<li>Surface anytime</li>
<li>Reset and repeat</li>
<li>Short dives</li>
<li>Move smoothly</li>
<li>Keep it close</li>
<li>Soft touches</li>
</ul><div>

</div><hr><div>

</div><h2 id="what-good-performance-looks-like" class="toc-header"><a class="toc-anchor" href="#what-good-performance-looks-like">¶</a> What Good Performance Looks Like</h2><div>

</div><ul>
<li>Player remains calm throughout session</li>
<li>Breathing is steady and controlled</li>
<li>Dives are short and repeatable</li>
<li>Movement is smooth and balanced</li>
<li>Snorkel is cleared without panic</li>
<li>Puck is moved with simple control</li>
</ul><div>

</div><hr><div>

</div><h2 id="common-faults" class="toc-header"><a class="toc-anchor" href="#common-faults">¶</a> Common Faults</h2><div>

</div><ul>
<li><b>Player looks anxious or rushed</b><br>Cue: Breathe and relax.</li>

<li><b>Player removes snorkel</b><br>Cue: Keep it in, clear it.</li>

<li><b>Player stays down too long</b><br>Cue: Surface early.</li>

<li><b>Player rushes movement</b><br>Cue: Slow down, reset.</li>

<li><b>Puck pushed too far</b><br>Cue: Keep it close.</li>
</ul><div>

</div><hr><div>

</div><h2 id="coach-control" class="toc-header"><a class="toc-anchor" href="#coach-control">¶</a> Coach Control</h2><div>

</div><ul>
<li>Keep session calm, safe, and structured</li>
<li>Do not progress until players are comfortable</li>
<li>Prioritise breathing over skill</li>
<li>Surface players early and often</li>
<li>Reinforce simple, repeatable actions</li>
</ul></div></template><template slot="comments"><div><comments></comments></div></template></page></div></body></html>
