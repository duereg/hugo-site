<p>A penalty shot is called if a referee calls a foul that they believe prevented a team from scoring a goal. If they are quite certain that the goal would have been scored if the foul had not be committed they may call a penalty goal. If they are not certain that it would have gone into the goal they will call a penalty shot.</p>
<p>The signal referees will show for a penalty shot is the upward and downward pumping of a closed fist. For a penalty goal the same motion will be done along with the signal for a goal (two arms extended straight upwards).</p>
<p>When a penalty shot is called, one defender and two attackers stay at the goal. All other players must go into their sub box. The <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> will be placed on the penalty spot, which is three meters straight out from the center of the goal. The two attacking players will begin on the surface behind the puck. Once the <a href="/game/gear-setup/buzzers" class="is-internal-link is-valid-page">buzzer</a> sounds, they can dive down and must touch the puck within five seconds. If they fail to touch the puck within five seconds the penalty shot will be considered successfully defended. The defending player must have one hand touching the end wall until the attackers have touched the puck. They may dive whenever they would like to.</p>
<p>If the attackers get the puck into the goal, they are awarded the goal. If the puck gets outside of the six meter circle around the goal, the penalty shot has been successfully defended. If the attacking players commit any fouls, they penalty shot will also be counted as successfully defended. If the defender commits a foul, then a goal is awarded to the attacking players.</p>

<h1 id="when-and-where" class="toc-header"><a class="toc-anchor" href="#when-and-where">¶</a> When and Where</h1>
<p>Penalty shots can only be called if the foul occurred within the three meter circle around the goal. It is up to the referees to determine if the foul could have prevented the goal from being scored.</p>

<div class="quickreference green">
  <p><u>PENALTY SHOT</u></p>
  <ul>
    <li>ALL PLAYERS EXCEPT FOR ONE DEFENDER AND TWO ATTACKERS GO TO THEIR TEAM SUB BOXES</li>
    <li>A GOAL WILL BE CALLED IF:<ul>
      <li>THE ATTACKERS SCORE</li>
      <li>THE DEFENDER FOULS</li>
      </ul>
    </li>
    <li>THE PENALTY SHOT IS SUCCESSFULLY DEFENDED IF:<ul>
      <li>THE DEFENDER GETS THE PUCK OUTSIDE THE SIX METER CIRCLE AROUND THE GOAL</li>
      <li>THE ATTACKERS FOUL</li>
      </ul>
    </li>
  </ul>
