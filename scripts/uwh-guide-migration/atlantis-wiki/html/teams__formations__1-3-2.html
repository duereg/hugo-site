ation-overview" class="toc-header"><a class="toc-anchor" href="#formation-overview">¶</a> Formation Overview</h1>
<p>The <strong>1-3-2</strong> uses one forward positioned ahead of play, three midfielders with different responsibilities, and two backs focused on defensive security.</p>
<p><strong>Formation Name:</strong> 1-3-2<br>
<strong>Player Layout:</strong> 1 Forward, 3 Mids, 2 Backs<br>
<strong>Play Style:</strong> Containment / Opportunistic Scoring</p>
<p>The formation focuses on:</p>
<ul>
<li>Strong midline containment</li>
<li>Creating opportunities through the Forward</li>
<li>Midfielders supporting attack almost creating a 3-1-2 formation</li>
<li>Stable defensive rotations between 2 backs</li>
</ul>
<p>The structure is built around containing play and diverting it to the middle of the formation, taking available space, and waiting for the Forward to exploit weaknesses in the opposition structure.</p>

<h1 id="main-strengths" class="toc-header"><a class="toc-anchor" href="#main-strengths">¶</a> Main Strengths</h1>
<ul>
<li>Can score from anywhere with a strong Forward</li>
<li>Strong midfield work rate</li>
<li>Stable defensive pair</li>
<li>Creates scoring chances from opposition mistakes</li>
<li>Opens swimming space through the midline</li>
</ul>
<h1 id="main-weaknesses" class="toc-header"><a class="toc-anchor" href="#main-weaknesses">¶</a> Main Weaknesses</h1>
<ul>
<li>Fewer forward passing options</li>
<li>Heavy reliance on play reading</li>
<li>Requires disciplined midfield support</li>
<li>Weak Mid and Forward require strong decision-making</li>
<li>Harder to cut swings because there is only one true forward</li>
</ul>
<h1 id="core-principles" class="toc-header"><a class="toc-anchor" href="#core-principles">¶</a> Core Principles</h1>
<ul>
<li>The forward creates opportunities through pressure, disruption, and calculated risk</li>
<li>The midfield supports both attack and defense</li>
<li>Mids push forward on attack and recover like backs on defense</li>
<li>The backs must cycle with discipline</li>
<li>Never allow both backs to become involved in the same contest</li>
<li>Swim to create space rather than forcing passes forward</li>
<li>Create attacking angles through movement</li>
<li>Use possession to expose mistakes in the opposition structure</li>
</ul>
<h1 id="passing-style" class="toc-header"><a class="toc-anchor" href="#passing-style">¶</a> Passing Style</h1>
<p>Because there is only one true forward, the 1-3-2 does not naturally create as many forward passing options as formations with multiple forwards.</p>
<p>Instead, progression is often created through:</p>
<ul>
<li>Back passes</li>
<li>Side passes</li>
<li>Support passes</li>
<li>Controlled swimming when no pass is available</li>
</ul>
<p>The formation works best when players remain patient, connected, and avoid forcing forward progression.</p>
<h1 id="position-responsibilities" class="toc-header"><a class="toc-anchor" href="#position-responsibilities">¶</a> Position Responsibilities</h1>
<h1 id="the-forward" class="toc-header"><a class="toc-anchor" href="#the-forward">¶</a> The Forward</h1>
<p>The forward is the primary scoring threat and advanced attacking player.</p>
<ul>
<li>Stay available for scoring opportunities</li>
<li>Read opponent mistakes and weak points</li>
<li>Conserve energy for offensive chances</li>
<li>Avoid becoming isolated too early</li>
</ul>
<h2 id="forward-role" class="toc-header"><a class="toc-anchor" href="#forward-role">¶</a> Forward Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Create scoring opportunities</li>
<li>Make attacking runs when space appears</li>
<li>Finish breakaways and close-range chances</li>
<li>Stay reachable for support passes</li>
<li>Stretch the opposition structure</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<p>The Forward should stay advanced but still reachable.</p>
<p>When possession is unstable:</p>
<ul>
<li>Avoid swimming too far ahead</li>
<li>Stay connected enough to re-engage</li>
<li>Attack space opportunistically</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Back-pick when needed</li>
<li>Disrupt opposition exits</li>
<li>Support defense without losing attacking availability</li>
</ul>
</details>
<h1 id="strong-mid" class="toc-header"><a class="toc-anchor" href="#strong-mid">¶</a> Strong Mid</h1>
<p>The Strong Mid is the puck-side workhorse and primary pressure player.</p>
<ul>
<li>If the puck is on the right the right mid is the strong mid</li>
<li>Supports both offense and defense</li>
<li>Rotates with the backs on walls</li>
</ul>
<h2 id="strong-mid-role" class="toc-header"><a class="toc-anchor" href="#strong-mid-role">¶</a> Strong Mid Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Choose strong swimming angles</li>
<li>Support behind, beside, or ahead when needed</li>
<li>Act as a second forward on attack</li>
<li>Form part of a 3-way rotation with the backs on the back wall</li>
<li>Form a 2-way rotation with the back on the side wall</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Stay as the puck-side mid</li>
<li>Avoid occupying the same space as the Forward</li>
<li>Support slightly behind when beside the puck carrier</li>
<li>Rotate with the back on side wall and back wall</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<p>The Strong Mid pressures aggressively on the puck side and helps contain wall progression.</p>
<p>Responsibilities include:</p>
<ul>
<li>Winning current engagements</li>
<li>Pressuring transitions</li>
<li>Supporting wall containment</li>
<li>Recovering quickly into structure</li>
</ul>
</details>
<h1 id="mid-mid" class="toc-header"><a class="toc-anchor" href="#mid-mid">¶</a> Mid-Mid</h1>
<p>The Mid-Mid stays connected to the puck and provides central support.</p>
<ul>
<li>Stay close to active play</li>
<li>Support both attack and defense</li>
<li>Protect central support space</li>
</ul>
<h2 id="mid-mid-role" class="toc-header"><a class="toc-anchor" href="#mid-mid-role">¶</a> Mid-Mid Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Support current engagements</li>
<li>Drive forward when in possession</li>
<li>Stay close beside or slightly behind teammates</li>
<li>Bias support toward the center of the pool</li>
<li>Pressure opponents directly when defending</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Position near the puck</li>
<li>Maintain close support distance</li>
<li>Protect central support space</li>
<li>Stay available for recycle passes</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<ul>
<li>Holding the center line</li>
<li>Preventing direct attacks through the middle</li>
<li>Pressuring the puck toward the side walls</li>
<li>Supporting current defensive engagements</li>
<li>Recycle back to the center after pressure</li>
</ul>
</details>
<h1 id="weak-mid" class="toc-header"><a class="toc-anchor" href="#weak-mid">¶</a> Weak Mid</h1>
<p>The Weak Mid is an opportunistic support player and emergency defensive backup.</p>
<ul>
<li>Protect weak-side recovery space</li>
<li>Stay outside heavy congestion</li>
<li>Support defensive breakdowns</li>
</ul>
<h2 id="weak-mid-role" class="toc-header"><a class="toc-anchor" href="#weak-mid-role">¶</a> Weak Mid Role</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Lurk outside scrums for loose pucks</li>
<li>Attack open space after winning possession</li>
<li>Support backs when they are under pressure</li>
<li>Stall opponents when emergency cover is needed</li>
<li>Support the Forward when the opposition swings the puck around the back</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>Stay outside heavy congestion</li>
<li>Drop behind backs only when necessary</li>
<li>Avoid overcommitting ahead of the puck</li>
<li>When winning the puck, attack toward your own side and continue into space</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<p>The Weak Mid often acts as emergency defensive cover when the structure breaks down.</p>
<p>Responsibilities include:</p>
<ul>
<li>Protecting open weak-side space</li>
<li>Slowing counterattacks</li>
<li>Supporting recovering backs</li>
<li>Covering defensive gaps temporarily</li>
</ul>
</details>
<h1 id="backs" class="toc-header"><a class="toc-anchor" href="#backs">¶</a> Backs</h1>
<p>The backs protect against breakouts and prevent the puck from getting behind the structure.</p>
<ul>
<li>Work as a connected pair</li>
<li>Maintain defensive depth</li>
<li>Rotate with mids on walls</li>
</ul>
<h2 id="back-pair" class="toc-header"><a class="toc-anchor" href="#back-pair">¶</a> Back Pair</h2>
<details>
<summary>Responsibilities</summary>
<ul>
<li>Cover each other constantly</li>
<li>Rotate with mids on the side wall</li>
<li>Protect defensive depth</li>
<li>Take available pool when safe</li>
<li>Form a 3-way rotation on the back wall with the onside mid</li>
<li>Avoid risky lateral passes to each other</li>
</ul>
</details>
<details>
<summary>Positioning</summary>
<ul>
<li>One back engages while the other covers</li>
<li>Stay connected as a pair</li>
<li>Avoid leaving defensive gaps</li>
<li>Maintain coverage behind pressure</li>
</ul>
</details>
<details>
<summary>Defense</summary>
<p>The backs are responsible for preventing direct breakouts and keeping the puck in front of the structure.</p>
<p>The pair should avoid:</p>
<ul>
<li>Double engaging</li>
<li>Drifting too far apart</li>
<li>Overcommitting into pressure</li>
<li>Passing laterally to each other under risk of interception</li>
</ul>
</details>
<h1 id="possession-principles" class="toc-header"><a class="toc-anchor" href="#possession-principles">¶</a> Possession Principles</h1>
<p>The 1-3-2 prioritizes patience, support, and controlled movement over forced forward passing.</p>
<p>Players should:</p>
<ul>
<li>Use back, side, and support passes</li>
<li>Create gaps by swimming</li>
<li>Stay connected through the midfield</li>
<li>Use the Forward for opportunistic attacks</li>
</ul>
<h1 id="common-structural-failures" class="toc-header"><a class="toc-anchor" href="#common-structural-failures">¶</a> Common Structural Failures</h1>
<p>The structure commonly breaks down when:</p>
<ul>
<li>The Forward becomes isolated</li>
<li>Mids collapse into the same space</li>
<li>Weak Mid overcommits too early</li>
<li>Backs lose pairing connection</li>
<li>Players force forward passes</li>
<li>Swings are not pressured quickly enough</li>
<li>Midfield support disappears during transitions</li>
</ul>

<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<h2 id="h-1-3-2" class="toc-header"><a class="toc-anchor" href="#h-1-3-2">¶</a> 1-3-2</h2>
<ul>
<li>CONTAINMENT FORMATION</li>
<li>MIDS CONTROL THE GAME</li>
<li>BACKS STAY CONNECTED</li>
<li>USE BACK AND SIDE PASSES</li>
<li>DO NOT FORCE PASSES TO THE FORWARD</li>
<li>PROTECT THE MIDDLE FIRST</li>
