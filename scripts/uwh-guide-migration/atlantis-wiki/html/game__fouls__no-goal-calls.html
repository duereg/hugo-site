<p>“No goal” is called if there was a foul committed before or as a team scored a goal. This signal is used to make it clear to all the players and the chief referee that, despite the puck going into the goal, no score will be counted and an advantage puck will be set up.&nbsp;</p>

<h1 id="when-and-how-to-call" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-call">¶</a> When and How to Call</h1>
<p>This should be called if a referee is calling a foul and the puck went into the goal. The “no goal” signal is used to make it clear to the players and other referees that the goal will not be counted, and foul is being called. After signaling “no goal," the referee should then signal which foul was committed and the direction of the advantage.&nbsp;</p>
<h1 id="when-not-to-call-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-call-and-what-to-watch-out-for">¶</a> When not to Call and What to Watch Out For</h1>
<p>Referees should be aware of the <a href="/game/fouls/advantage-rule" class="is-internal-link is-valid-page">advantage rule</a> when calling fouls by a goal. If the team defending fouls, but the attackers still score, then the goal should be counted. The defenders did not get an advantage by fouling at that point.&nbsp;</p>

<h1 id="quick-reference" class="toc-header"><a class="toc-anchor" href="#quick-reference">¶</a> Quick Reference</h1>
<p>&nbsp;</p>
<div class="quickreference orange">
  <p><strong><u>NO GOAL CALLS</u></strong></p>
  <ul>
    <li>THIS IS CALLED IF A FOUL OCCURS AS A TEAM SCORES OR BEFORE A TEAM SCORES</li>
    <li>THE SIGNAL IS THE REPEATED CROSSING AND UNCROSSING OF THE ARMS, PALMS FACING DOWNWARD.</li>
  </ul>
