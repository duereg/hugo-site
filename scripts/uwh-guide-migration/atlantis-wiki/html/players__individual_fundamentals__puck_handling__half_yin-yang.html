<p>A Half Yin-Yang maneuver starts with the <a href="/game/gear-setup/pucks" class="is-internal-link is-valid-page">puck</a> held with the hook (on the back-side of the <a href="/game/gear-setup/sticks" class="is-internal-link is-valid-page">stick</a>) near the <a href="/players" class="is-internal-link is-valid-page">player's</a> stick-hand side hip with the stick pointed towards away from their body. Using a straight arm, the puck is pushed in an arc from the player's hip and up until the puck is in front of the player's free-hand shoulder. Then the player bends their stick-arm elbow as the puck is moved down below their free-hand shoulder; then the puck is brought across to the stick-hand side shoulder, and then finally back down to the stick-hand side hip. This motion of the puck closely follows the shape of ½ of the Yin-Yang symbol.</p>
<p>The puck is allowed to rest against the tip of the player's thumb. However, the thumb must be pressed to the stick, it cannot be used to help capture or propel the puck, doing so is an <a href="/game/fouls/illegal_advancement" class="is-internal-link is-valid-page">illegal advancement of the puck</a> foul.</p>

<h1 id="when-and-how-to-use" class="toc-header"><a class="toc-anchor" href="#when-and-how-to-use">¶</a> When and How to Use</h1>
<p>The half Yin-Yang is a useful method of moving the puck around, and the entire motion will not always be used at once. Portions of the half- Yin-Yang can be used to hold the puck further from an opponent that is on the free hand side of the player, or can be used to quickly change direction.&nbsp;</p>
<h1 id="when-not-to-use-and-what-to-watch-out-for" class="toc-header"><a class="toc-anchor" href="#when-not-to-use-and-what-to-watch-out-for">¶</a> When not to Use and What to Watch Out For</h1>
<p>If opponents are on the stick-hand side of the player then this maneuver is much harder to use because it leaves the puck exposed to those opponents.</p>
