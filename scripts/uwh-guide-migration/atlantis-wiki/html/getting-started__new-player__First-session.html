irst-session">¶</a>  Your First Session</h2><div>

</div><p>
Your first session is about comfort, safety, and learning the basic “rhythm” of the sport. You do <b>not</b> need to be super fit
or an elite swimmer. You just need to be calm in the water and willing to learn.
</p><div>

</div><p><b>Typical flow:</b></p>
<ul>
  <li><b>Welcome + safety briefing:</b> pool rules, signals, and how the session will run.</li>
  <li><b>Gear fitting:</b> mask fit, snorkel position, fins comfort, cap/ear protection, mouthguard check.</li>
  <li><b>Water comfort warm-up:</b> relaxed surface swimming and controlled breathing with snorkel.</li>
  <li><b>Basic skills:</b> short dives, getting to the bottom, and returning to the surface calmly.</li>
  <li><b>First puck contact:</b> simple puck pushes and stopping the puck on the bottom.</li>
  <li><b>Beginner game or drill:</b> small-area play focused on rules and safety.</li>
</ul><div>

</div><p><b>What “success” looks like on day one:</b></p>
<ul>
  <li>You feel safe, included, and understand the basic rules.</li>
  <li>You can do repeated short dives without panic.</li>
  <li>You can hold a position on the bottom briefly and resurface calmly.</li>
  <li>You touch the puck and learn how to move it safely with a stick.</li>
</ul><div>

</div><p><b>Tip:</b> If you feel out of breath, surface early. The goal is to build calm consistency, not push limits.</p><div>

</div><hr><div>

</div><h2 id="what-to-bring" class="toc-header"><a class="toc-anchor" href="#what-to-bring">¶</a> What to Bring</h2><div>

</div><p><b>Essential:</b></p>
<ul>
  <li><b>Mask</b> (comfortable fit, no major leaks, clear view)</li>
  <li><b>Snorkel</b> (simple snorkel is best for beginners)</li>
  <li><b>Fins</b> (snug fit, not painful)</li>
  <li><b>Mouthguard</b> (required for play in most clubs)</li>
  <li><b>Cap with ear protection</b> (often provided by the club)</li>
  <li><b>Glove</b> for stick hand (often provided or recommended)</li>
  <li><b>Stick</b> (often provided for your first sessions)</li>
</ul><div>

</div><p><b>Strongly recommended:</b></p>
<ul>
  <li><b>Water bottle</b> (you’ll be surprised how thirsty you get)</li>
  <li><b>Towel + warm top</b> for after training</li>
  <li><b>Anti-fog</b> (or baby shampoo / defog solution)</li>
  <li><b>Neoprene socks</b> (if fins rub your feet)</li>
</ul><div>

</div><p><b>Optional but helpful:</b></p>
<ul>
  <li><b>Swim briefs / tight-fitting swimwear</b> (less drag, fewer snags)</li>
  <li><b>Small mesh bag</b> to carry wet gear</li>
</ul><div>

</div><hr><div>

</div><h2 id="minimum-comfort-requirements" class="toc-header"><a class="toc-anchor" href="#minimum-comfort-requirements">¶</a> Minimum Comfort Requirements</h2><div>

</div><p>
You don’t need to be an advanced swimmer, but you should meet these minimum comfort requirements to train safely and enjoyably.
If you’re not there yet, that’s okay, use this list as goals to work towards.
</p><div>

</div><p><b>You should be able to:</b></p>
<ul>
  <li>Swim <b>25 meters</b> continuously (any stroke) without stopping.</li>
  <li>Float and rest calmly at the surface for <b>1 minute</b>.</li>
  <li>Wear a mask and snorkel without feeling panicked.</li>
  <li>Do repeated short breath-holds (a few seconds underwater) while staying relaxed.</li>
  <li>Surface and recover with calm breathing (no gasping or frantic movements).</li>
</ul><div>

</div><p><b>Comfort check (more important than “numbers”):</b></p>
<ul>
  <li>You can control your breathing when you feel tired.</li>
  <li>You can stop and reset if something feels wrong (mask leak, water in snorkel, fin discomfort).</li>
  <li>You feel comfortable being near others in the lane/pool without feeling crowded.</li>
</ul><div>

</div><p><b>If you struggle with any of these:</b> tell a coach. We can adjust drills, slow the pace, or isolate skills until you feel steady.</p><div>
